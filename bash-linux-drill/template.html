<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bash &amp; Linux Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky top bar; left day rail (drawer on phones); the day page is a column of sections with a
   flashcard deck beside it on wide screens. Look: plain Apple style. Neutral greys, white surfaces,
   one system-blue accent, the system font, soft shadows and no gradients. Code stays in a dark block. */
:root {
  --bg: #f5f5f7; --panel: #ffffff; --panel-2: #f5f5f7; --ink: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7;
  --accent: #0071e3; --accent-ink: #ffffff; --accent-soft: #e8f1fc;
  --hot: #0071e3; --hot-soft: #e8f1fc; --hot-ink: #ffffff;
  --code-bg: #1d1d1f; --code-ink: #f5f5f7; --code-dim: #a1a1a6; --out-bg: #2c2c2e;
  --ok: #248a3d; --ok-soft: #e9f6ec; --warn: #b25000; --warn-soft: #fdf1e5; --bad: #d70015; --bad-soft: #fdecee;
  --w1: #6e6e73; --w2: #6e6e73; --w3: #6e6e73; --w4: #6e6e73;
  --dot-1: #a1a1a6; --dot-2: #a1a1a6; --dot-3: #a1a1a6;
  --shadow: 0 1px 3px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .04);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Ubuntu, Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Ubuntu, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, "Cascadia Mono", Consolas, "Ubuntu Mono", "DejaVu Sans Mono", monospace;
  --top: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --panel: #1c1c1e; --panel-2: #2c2c2e; --ink: #f5f5f7; --muted: #98989d; --line: #38383a;
    --accent: #0a84ff; --accent-ink: #ffffff; --accent-soft: #0b2a4a;
    --hot: #0a84ff; --hot-soft: #0b2a4a; --hot-ink: #ffffff;
    --code-bg: #111113; --code-ink: #f5f5f7; --code-dim: #98989d; --out-bg: #1a1a1c;
    --ok: #30d158; --ok-soft: #0f2e18; --warn: #ff9f0a; --warn-soft: #3a2608; --bad: #ff453a; --bad-soft: #3a1210;
    --w1: #98989d; --w2: #98989d; --w3: #98989d; --w4: #98989d;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --panel: #1c1c1e; --panel-2: #2c2c2e; --ink: #f5f5f7; --muted: #98989d; --line: #38383a;
  --accent: #0a84ff; --accent-ink: #ffffff; --accent-soft: #0b2a4a;
  --hot: #0a84ff; --hot-soft: #0b2a4a; --hot-ink: #ffffff;
  --code-bg: #111113; --code-ink: #f5f5f7; --code-dim: #98989d; --out-bg: #1a1a1c;
  --ok: #30d158; --ok-soft: #0f2e18; --warn: #ff9f0a; --warn-soft: #3a2608; --bad: #ff453a; --bad-soft: #3a1210;
  --w1: #98989d; --w2: #98989d; --w3: #98989d; --w4: #98989d;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--accent); }
code, pre, kbd, .mono { font-family: var(--font-mono); }
:not(pre) > code { font-size: .92em; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { letter-spacing: -.015em; line-height: 1.2; text-wrap: balance; margin: 0; font-family: var(--font-display); }
h2 { letter-spacing: -.01em; }
h1 { font-size: 1.7rem; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .8rem; font-weight: 600; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sr-copy { position: fixed; left: -9999px; top: 0; }

/* ---------- top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--top);
  display: flex; align-items: center; gap: 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; white-space: nowrap; min-width: 0; }
.brand .logo { font-family: var(--font-mono); font-size: .85rem; background: var(--code-bg); color: var(--code-ink); padding: 3px 7px; border-radius: 6px; }
.brand .logo b { color: var(--code-ink); font-weight: 700; }
.topbar .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel-2); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: .875rem; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.icon-btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: .875rem; white-space: nowrap; }
.menu-btn { display: none; }

/* ---------- layout */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; max-width: 1520px; margin: 0 auto; }
.sidebar { position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px)); overflow-y: auto; padding-block: 16px 32px; }
main { min-width: 0; padding-block: 20px 80px; }
.backdrop { display: none; }

@media (max-width: 880px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .sidebar {
    position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; height: auto; width: min(320px, 88vw);
    background: var(--panel); border-right: 1px solid var(--line); transform: translateX(-105%); transition: transform .2s ease;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  body.drawer-open .sidebar { transform: none; }
  body.drawer-open .backdrop { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, .4); }
  .brand .full { display: none; }
}
@media (max-width: 560px) {
  .seg button { padding: 6px 8px; font-size: .8rem; }
  .seg .long, .theme-word { display: none; }
  h1 { font-size: 1.4rem; }
}
@media (max-width: 440px) { .brand { display: none; } .topbar { gap: 8px; } }
@media (min-width: 561px) { .seg .short { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- sidebar */
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 12px 0 18px; }
.tabs button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: .875rem; display: flex; justify-content: space-between; gap: 6px; }
.tabs button[aria-current="page"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.tabs .count { background: var(--warn); color: var(--panel); border-radius: 99px; padding: 0 7px; font-size: .75rem; font-weight: 700; }
.week { margin-top: 16px; }
.week h2 { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.daylist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.daylink { width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 10px; border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.daylink:hover { background: var(--panel-2); }
.daylink[aria-current="page"] { background: var(--accent-soft); }
.daylink .t { min-width: 0; font-size: .9rem; line-height: 1.3; }
.daylink .t b { display: block; font-size: .75rem; color: var(--muted); font-weight: 600; }
.daylink .t span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ring { display: block; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); }
.ring.full .fg { stroke: var(--ok); }
.tick { color: var(--ok); font-weight: 700; font-size: .85rem; }

/* ---------- main blocks */
.stack { display: grid; gap: 22px; }
.stack, .section, .dayhead, .card-body, .answer, .qa, .qa-item, .hints, .timer { grid-template-columns: minmax(0, 1fr); }
details.box { min-width: 0; }
.section { display: grid; gap: 12px; }
.section > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.dayhead { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; border: 1px solid var(--line); background: var(--panel-2); border-radius: 99px; padding: 2px 10px; max-width: 100%; }
.chip.core { border-color: var(--accent); color: var(--accent); }
.chip.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.chip.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.chip.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 980px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: .9rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ok[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn.warn[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; }
.note.warn { border-color: var(--warn); background: var(--warn-soft); }
.note.bad { border-color: var(--bad); background: var(--bad-soft); }
.note.ok { border-color: var(--ok); background: var(--ok-soft); }

/* timer */
.timer { display: grid; gap: 8px; }
.timer .nums { display: flex; flex-wrap: wrap; gap: 4px 18px; font-variant-numeric: tabular-nums; }
.timer .nums b { font-size: 1.35rem; font-family: var(--font-mono); }
.bar { height: 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
.bar.over > i { background: var(--warn); }

/* code */
.code { position: relative; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; min-width: 0; }
.code .code-label { font-family: var(--font-mono); font-size: .78rem; color: var(--code-dim); padding: 8px 90px 0 16px; overflow-wrap: anywhere; }
.code pre { margin: 0; padding: 10px 16px 14px; overflow-x: auto; font-size: 15px; line-height: 1.5; tab-size: 8; white-space: pre; }
.code .copy { position: absolute; top: 6px; right: 6px; border: 1px solid #3a4856; background: #22303c; color: #e5ecf1; border-radius: 6px; padding: 3px 10px; font-size: .78rem; cursor: pointer; }
.code .copy:hover { background: #2c3c4a; }
.code.out { background: var(--out-bg); }
.code.small pre { font-size: 14px; }
.outlabel { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; }

/* problem card */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); min-width: 0; }
.card.is-done { border-color: var(--ok); }
.card-head { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: 12px; }
.card-head .num { font-family: var(--font-mono); font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 4px 8px; font-size: .85rem; }
.card-head .ttl { min-width: 0; display: grid; gap: 4px; }
.card-head .ttl strong { font-size: 1.02rem; }
.card-head .side { display: grid; justify-items: end; gap: 4px; font-variant-numeric: tabular-nums; }
.card-head .ptime { font-family: var(--font-mono); font-size: .85rem; color: var(--muted); }
.card-head .chev { transition: transform .15s; color: var(--muted); }
.card-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.card-body { padding: 0 16px 18px; display: grid; gap: 14px; }
.story { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.story .eyebrow { margin-bottom: 2px; }
.task { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; }
.hints { display: grid; gap: 8px; }
.hint { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; background: var(--panel-2); }
.answer { display: grid; gap: 14px; border-top: 2px solid var(--accent-soft); padding-top: 14px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
th { background: var(--panel-2); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.cmd { font-family: var(--font-mono); font-size: .88rem; white-space: nowrap; }
.say { border-left: 4px solid var(--ok); background: var(--ok-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; }
ul.mist { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); font-family: var(--font-mono); font-size: .9rem; }
.diff { font-family: var(--font-mono); font-size: .85rem; white-space: pre; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel-2); }
.diff .del { color: var(--bad); }
.diff .add { color: var(--ok); }
.qa { display: grid; gap: 8px; }
/* lessons and step-by-step answers */
.lesson { border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--panel-2); display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.lesson-sec { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.lesson-sec h4 { margin: 0; font-size: 1.02rem; }
.lesson-sec p { max-width: 70ch; }
.art { margin: 0; font-family: var(--font-mono); font-size: 14px; line-height: 1.45; white-space: pre; overflow-x: auto; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; color: var(--ink); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
.step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .85rem; display: grid; place-items: center; }
.step-body { display: grid; gap: 8px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.step-body p { max-width: 70ch; }
.quiet { font-size: .85rem; color: var(--muted); font-style: italic; }
.box-list { margin: 4px 0 0; padding-left: 1.3em; display: grid; gap: 4px; }
.modal { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .5); display: grid; place-items: center; padding: 16px; }
.modal-box { background: var(--panel); color: var(--ink); width: min(460px, 100%); border-radius: 14px; border-top: 6px solid var(--warn); padding: 20px; display: grid; gap: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
.modal-box.bad { border-top-color: var(--bad); }
.toast { position: fixed; right: 16px; bottom: 16px; left: auto; z-index: 90; max-width: min(380px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-left: 6px solid var(--warn); border-radius: 10px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); display: grid; gap: 6px; }
.toast p { margin: 0; }
.modal-box .big { font-size: 2rem; line-height: 1; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checklist li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }
.checklist input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.qa-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--panel); display: grid; gap: 8px; }
.qa-item .q { font-weight: 600; }
.qa-item .a { border-top: 1px dashed var(--line); padding-top: 8px; }
.reveal { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: .9rem; }
details.box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
details.box > summary { cursor: pointer; font-weight: 600; }
details.box[open] > summary { margin-bottom: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tile b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.hbar { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 3px 10px; align-items: center; font-variant-numeric: tabular-nums; font-size: .85rem; }
.hbar .track { position: relative; height: 18px; }
.hbar .track i { position: absolute; left: 0; top: 2px; height: 6px; border-radius: 3px; }
.hbar .track i.plan { background: var(--line); }
.hbar .track i.real { top: 10px; background: var(--accent); }
.hbar .track i.real.over { background: var(--warn); }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 6px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
.result { display: grid; gap: 4px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.result:hover { border-color: var(--accent); }
.countdown { font-family: var(--font-mono); font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.banner { position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px) + 8px); z-index: 5; }
.cheat-group { break-inside: avoid; }
.print-only { display: none; }

/* ---------- XP pill */
.xp { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600; border-radius: 99px; padding: 4px 10px; background: var(--panel-2); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.xp-pop { position: fixed; z-index: 120; pointer-events: none; font-weight: 800; color: var(--hot); font-family: var(--font-display); animation: xp-up 1s ease-out forwards; }
@keyframes xp-up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-36px); } }
@media (max-width: 560px) { .xp .xp-word { display: none; } }

/* ---------- day page: hero terminal + main column + flashcard deck */
.dayview { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
.deck-aside { display: none; min-width: 0; }
@media (min-width: 1240px) {
  .dayview { grid-template-columns: minmax(0, 1fr) 350px; }
  .deck-aside { display: block; position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - var(--top) - 32px); overflow-y: auto; padding-bottom: 8px; }
}
.hero { --wk: var(--muted); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; display: grid; gap: 12px; box-shadow: var(--shadow); }

<script>

// ------------------------------------------------------------ storage (never trust it)
var KEY = 'bash-linux-drill-v1';
function freshState() {
  return { v: 1, plan: 'month', theme: 'system', done: {}, forgot: {}, notes: {}, complete: {}, review: {}, ratings: [],
    timers: {}, ptime: {}, activity: {}, check: {}, alerted: {}, sound: true, last: null,
    cards: {}, xp: 0, xpGiven: {}, warm: {}, typeMode: false };

var storageOK = true;

var S = loadState();
try { localStorage.setItem(KEY + '-test', '1'); localStorage.removeItem(KEY + '-test'); } catch (e) { storageOK = false; }
var saveTimer = null;
function save(now) {

  var write = function () { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOK = false; } };

// ------------------------------------------------------------ helpers

// ------------------------------------------------------------ timers

// ------------------------------------------------------------ state of the page
var route = null, current = null, openCards = {}, pendingOpen = null, searchQuery = '', session = null, qaState = { topic: 'All', q: '', random: null };

// ------------------------------------------------------------ chrome: theme, plan, tabs, sidebar
function applyTheme() {

// "Check my output": ignore extra spaces and empty lines at the end
function normOut(s) {
  return String(s).replace(/\r\n?/g, '\n').split('\n').map(function (l) { return l.replace(/\s+/g, ' ').trim(); })
    .join('\n').replace(/^\n+|\n+$/g, '');

function lineDiff(a, b) {

  for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  var out = []; i = 0; j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push([' ', a[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push(['-', a[i]]); i++; }
    else { out.push(['+', b[j]]); j++; }
  }
  while (i < n) out.push(['-', a[i++]]);
  while (j < m) out.push(['+', b[j++]]);
  return out;
}

      var o = JSON.parse(t);
      if (!o || typeof o !== 'object' || !o.done) throw new Error('not a progress file');
      S = Object.assign(freshState(), o); save(true); applyTheme(); render();
      document.getElementById('main').prepend(h('div', { class: 'note ok', style: 'margin-bottom:16px' }, 'Progress imported.'));
    } catch (e) { msg.textContent = ''; msg.appendChild(h('div', { class: 'note bad' }, 'This is not a valid progress file. Choose the .json file that Export made.')); }
  }
  file.addEventListener('change', function () {
    var f = file.files && file.files[0]; if (!f) return;
    var rd = new FileReader(); rd.onload = function () { importText(String(rd.result)); }; rd.readAsText(f);
  });
  var paste = h('textarea', { id: 'import-text', placeholder: 'Or paste the exported JSON here', 'aria-label': 'Paste exported progress' });
  var pasteBtn = h('button', { type: 'button', class: 'btn' }, 'Import pasted text');
  pasteBtn.addEventListener('click', function () { importText(paste.value); });
  var resetArea = h('div', { class: 'row' });
  function resetStep1() {
    resetArea.textContent = '';
    resetArea.appendChild(h('button', { type: 'button', class: 'btn', onclick: function () {
      resetArea.textContent = '';
      append(resetArea, [h('span', { class: 'note bad' }, 'Delete all progress, notes and timers?'),
        h('button', { type: 'button', class: 'btn', onclick: function () { S = freshState(); save(true); applyTheme(); render(); } }, 'Yes, delete everything'),
        h('button', { type: 'button', class: 'btn', onclick: resetStep1 }, 'Cancel')]);
    } }, 'Reset all progress'));
  }
  resetStep1();
  wrap.appendChild(h('section', { class: 'section panel' }, h('h2', null, 'Keep a backup'),
    h('p', { class: 'muted' }, 'Progress lives only in this browser. Clearing browser data deletes it. Export once a week.'),
    h('div', { class: 'row' }, exp, fileLabel, file), exportBox, paste, h('div', { class: 'row' }, pasteBtn), msg,
    h('hr', { style: 'border:0;border-top:1px solid var(--line);width:100%' }), resetArea));
  return wrap;
}

// ------------------------------------------------------------ search
function renderSearch(q) {
  var ql = q.toLowerCase(), wrap = h('div', { class: 'stack' });
  var found = [];
  Object.keys(PROBS).forEach(function (id) {
    var e = PROBS[id], p = e.p;
    var hay = [p.title, p.situation, p.task.join(' '), p.solutionText, p.topic, id].join(' ').toLowerCase();
    if (hay.indexOf(ql) >= 0) found.push(e);
  });
  var qs = allQuestions().filter(function (x) { return (x.q + ' ' + x.a).toLowerCase().indexOf(ql) >= 0; });
  var cmds = allRecap().filter(function (r) { return (r.cmd + ' ' + r.meaning + ' ' + r.example).toLowerCase().indexOf(ql) >= 0; });
  wrap.appendChild(h('header', { class: 'dayhead' }, h('div', { class: 'eyebrow' }, 'Search'), h('h1', null, '"' + q + '"'),
    h('p', { class: 'muted' }, found.length + ' problems · ' + cmds.length + ' commands · ' + qs.length + ' interview questions'),
    h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', onclick: function () { searchInput.value = ''; searchQuery = ''; renderMain(); } }, 'Clear search'))));
  if (found.length) {
    var list = h('div', { class: 'stack', style: 'gap:8px' });
    found.slice(0, 40).forEach(function (e) {
      list.appendChild(h('button', { type: 'button', class: 'result', onclick: function () {
        searchInput.value = ''; searchQuery = ''; pendingOpen = e.p.id; openCards[e.p.id] = true;
        if (S.plan !== 'month') S.plan = 'month';
        go('day-' + pad(e.day.day));
      } }, h('span', { class: 'chips' }, h('span', { class: 'chip' }, 'Day ' + e.day.day), h('span', { class: 'chip' }, TYPES[e.p.type] || e.p.type),
        e.p.optional ? h('span', { class: 'chip' }, 'extra') : null), h('strong', null, inline(e.p.title)),
        h('span', { class: 'small muted' }, inline(e.p.situation.slice(0, 140) + (e.p.situation.length > 140 ? '…' : '')))));
    });
    wrap.appendChild(h('section', { class: 'section' }, h('h2', null, 'Problems'), list));
  }
  if (cmds.length) wrap.appendChild(h('section', { class: 'section' }, h('h2', null, 'Commands'),
    table(['Command', 'Meaning', 'Example', 'Day'], cmds.slice(0, 40).map(function (r) { return [r.cmd, r.meaning, r.example, String(r.day)]; }), [0, 2])));
  if (qs.length) {
    var box = h('div', { class: 'qa' });
    qs.slice(0, 30).forEach(function (x) {
      box.appendChild(h('div', { class: 'qa-item' }, h('div', { class: 'q' }, inline(x.q)), h('div', { class: 'small muted' }, 'Day ' + x.day + ' · ' + x.topic),
        revealer('Show answer', function () { return h('p', null, inline(x.a)); })));
    });
    wrap.appendChild(h('section', { class: 'section' }, h('h2', null, 'Interview questions'), box));
  }
  if (!found.length && !qs.length && !cmds.length) wrap.appendChild(h('p', { class: 'muted' }, 'Nothing found. Try a command name, like grep or chmod.'));
  return wrap;
}

// ------------------------------------------------------------ popups (time alerts)
var popupOpen = false;
function beep() {
  if (S.sound === false) return;
  try {
    var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    var ctx = beep.ctx || (beep.ctx = new C());
    [0, 0.25].forEach(function (d) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.2);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.22);
    });
  } catch (e) { }
}
function popup(opts) {
  if (popupOpen) return;
  popupOpen = true;
  var overlay, okBtn;
  function close() { if (!overlay) return; overlay.remove(); overlay = null; popupOpen = false; document.title = baseTitle; }
  okBtn = h('button', { type: 'button', class: 'btn primary', onclick: close }, opts.ok || 'OK, continue');
  var extra = (opts.actions || []).map(function (a) { return h('button', { type: 'button', class: 'btn', onclick: function () { close(); a.run(); } }, a.label); });
  overlay = h('div', { class: 'modal', role: 'alertdialog', 'aria-modal': 'true', 'aria-labelledby': 'modal-title' },
    h('div', { class: 'modal-box' + (opts.bad ? ' bad' : '') }, h('div', { class: 'big', 'aria-hidden': 'true' }, opts.icon || '⏰'),
      h('h2', { id: 'modal-title' }, opts.title), paras(opts.text), h('div', { class: 'row' }, extra, okBtn)));
  overlay.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  document.body.appendChild(overlay);
  okBtn.focus();
  document.title = '⏰ ' + opts.title;
  beep();
}
var baseTitle = document.title, toastEl = null;
function toast(title, text) {
  if (toastEl) toastEl.remove();
  var close = function () { if (toastEl) { toastEl.remove(); toastEl = null; } };
  toastEl = h('div', { class: 'toast', role: 'status' }, h('strong', null, '⏳ ' + title), paras(text),
    h('div', null, h('button', { type: 'button', class: 'btn small', onclick: close }, 'OK')));
  document.body.appendChild(toastEl);
  beep();
  setTimeout(close, 20000);
}
function problemAlert(p, stage) {
  var card = document.getElementById('card-' + p.id);
  var click = function (act) { return function () { var b = card && card.querySelector('[data-act="' + act + '"]'); if (b && !b.disabled) { b.click(); b.scrollIntoView({ block: 'center' }); } }; };
  if (stage === 1) popup({ title: 'Time for this problem is finished', text: [
      '"' + p.title.replace(/`/g, '') + '" was planned for ' + p.minutes + ' minutes, and the time is now used.',
      'If you are stuck, open the next hint or read the lesson and the answer. Then try the commands yourself.'],
    actions: [{ label: 'Show next hint', run: click('hint') }, { label: 'Show the answer', run: click('answer') }] });
  else popup({ bad: true, title: 'This is taking too long', text: [
      'You have spent 1.5 times the planned time on "' + p.title.replace(/`/g, '') + '".',
      'Read the answer now, run it, and press "I forgot this" so the problem comes back in the Review queue. Then move on.'],
    actions: [{ label: 'Show the answer', run: click('answer') }] });
}

// ------------------------------------------------------------ the 1-second clock
var beatCount = 0;
setInterval(function () {
  var visible = document.visibilityState !== 'hidden';
  var dt = document.getElementById('daytimer');
  if (dt && dt._sync) {
    var key = dt.getAttribute('data-key'), t = S.timers[key];
    if (t && t.since) {
      t.beat = Date.now();
      if (elapsed(key) >= (LIMIT - 10) * 60 && !t.warned && elapsed(key) < LIMIT * 60) {
        t.warned = true; save();
        popup({ title: '10 minutes left today', text: ['You have used 80 of your 90 minutes. Finish the problem you are on, then do the interview round and the recap.'] });
      }
      if (elapsed(key) >= LIMIT * 60 && !t.upShown) {
        t.upShown = true;
        popup({ bad: true, icon: '⏹', title: 'Time is up for today', text: ['90 minutes are finished. Stop here. Unfinished problems are added to the Review queue.', 'Rest is part of learning: come back tomorrow.'] });
        var v = VIEWS.month.concat(VIEWS.crash).filter(function (x) { return x.key === key; })[0];
        if (v) v.timed.forEach(function (p) { if (!S.done[p.id] && !S.forgot[p.id]) S.forgot[p.id] = { date: today(), why: 'time' }; });
        save(); renderTabs();
      }
    }
    dt._sync();
  }
  if (visible) {
    var opened = document.querySelectorAll('.card-head[aria-expanded="true"]');
    for (var i = 0; i < opened.length; i++) {
      var card = opened[i].parentNode, id = card.getAttribute('data-pid'), p = PROBS[id] && PROBS[id].p;
      if (!p) continue;
      S.ptime[id] = (S.ptime[id] || 0) + 1;
      var lab = card.querySelector('[data-ptime]');
      if (lab) lab.textContent = mmss(S.ptime[id]) + ' / ' + p.minutes + ':00';
      var slow = card.querySelector('[data-slow]');
      if (slow) slow.hidden = !(S.ptime[id] > p.minutes * 60 * 1.5 && !S.done[id]);
      var stage = S.alerted[id] || 0;
      if (!S.done[id] && !popupOpen) {
        // stage 1: 2 minutes left (small message), 2: time is up (popup), 3: 1.5 times the time (popup)
        if (stage < 3 && S.ptime[id] >= p.minutes * 90) { S.alerted[id] = 3; save(); problemAlert(p, 2); }
        else if (stage < 2 && S.ptime[id] >= p.minutes * 60) { S.alerted[id] = 2; save(); problemAlert(p, 1); }
        else if (stage < 1 && S.ptime[id] >= (p.minutes - 2) * 60) {
          S.alerted[id] = 1; save();
          toast('2 minutes left', ['"' + p.title.replace(/`/g, '') + '": 2 of ' + p.minutes + ' minutes are left. If you are stuck, open the next hint now.']);
        }
      }
    }
  }
  if (++beatCount % 10 === 0) save();
}, 1000);
window.addEventListener('pagehide', function () { save(true); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') save(true); });

applyTheme();
render();
renderXP();
})();
</script>
