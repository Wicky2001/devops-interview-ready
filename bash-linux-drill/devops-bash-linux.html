 `.tmp` files older than 3 days?","a":"`find /path -name '*.tmp' -mtime +3 -print` to check, then the same with `-delete`.","topic":"Files"},{"q":"Rapid 9: Top 5 IPs in an access log?","a":"`awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -n 5`","topic":"Text"},{"q":"Rapid 10: File name from a path, and a date for a backup name?","a":"`${path##*/}` and `date +%Y%m%d-%H%M%S`.","topic":"Variables"}],"recap":[{"cmd":"grep -v pattern | sed -E 's#a#b#'","meaning":"Remove noise, then normalise","example":"grep -v kube-probe access.log | sed -E 's#/[0-9]+ #/:id #'","topic":"Text"},{"cmd":"substr(s, start, len)","meaning":"awk substring","example":"awk '{print substr($9,1,1)}' access.log","topic":"Text"},{"cmd":"awk 'cond {print $1}' | sort | uniq -c | sort -rn","meaning":"Filter, then count and rank","example":"awk '$9>=500 {print $1}' access.log | sort | uniq -c | sort -rn","topic":"Text"},{"cmd":"awk -v f=\"$n\" '{print $f}'","meaning":"Field number from a shell variable","example":"awk -v f=7 '{print $f}' access.log","topic":"Text"},{"cmd":"grep -m 1","meaning":"Stop after the first match","example":"grep -m 1 ERROR app.log","topic":"Text"}],"coverage":[{"item":"grep (Day 10)","problems":["d14p01","d14p03"]},{"item":"sed (Day 11)","problems":["d14p01"]},{"item":"awk (Day 11)","problems":["d14p02","d14p03","d14p06"]},{"item":"sort, uniq pipelines (Day 12)","problems":["d14p03","d14p05"]},{"item":"Functions and arguments (Day 9)","problems":["d14p04","d14p05"]},{"item":"Parameter expansion (Day 13)","problems":["d14p04"]},{"item":"10 rapid interview questions","problems":[]}],"reset":"rm -rf ~/bash-practice/day14"},{"day":15,"week":3,"title":"Processes and signals","goal":"Find, inspect and stop processes the right way, run jobs in the background, and let scripts shut down cleanly on signals.","minutes":90,"setup":["mkdir -p ~/bash-practice/day15 && cd ~/bash-practice/day15","# P1: a CPU hog and a process that ignores SIGTERM","printf '%s\\n' '#!/bin/bash' '# a runaway loop that uses 100% of one CPU' 'while :; do :; done' > runaway.sh","printf '%s\\n' '#!/bin/bash' 'trap '\"'\"'echo \"stubborn: I ignore TERM\"'\"'\"' TERM' 'while :; do sleep 0.2; done' > stubborn.sh","# P2: a ps aux snapshot sent by the on-call engineer","printf '%s\\n' \\","'USER         PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND' \\","'root           1  0.0  0.1 167520 11864 ?        Ss   08:00   0:02 /sbin/init' \\","'root         612  0.1  0.3 1462324 28100 ?       Ssl  08:00   0:40 /usr/bin/containerd' \\","'root         890  0.0  0.0  55224  1580 ?        Ss   08:00   0:00 nginx: master process /usr/sbin/nginx' \\","'www-data     891  0.2  0.1  55900  6020 ?        S    08:00   0:15 nginx: worker process' \\","'jenkins     1204 97.5 21.4 5123456 3500120 ?     Sl   08:01 312:44 java -jar /usr/share/java/jenkins.war' \\","'wicky       2210  1.2 35.8 9876543 5862000 ?     Rl   09:15  40:02 python3 train.py --epochs 50' \\","'wicky       2299  0.0  0.0      0     0 ?        Z    09:20   0:00 [python3] <defunct>' \\","'postgres    1501  3.4  4.2 225000 690000 ?       Ss   08:00  10:11 postgres: main' \\","'wicky       3001  0.0  0.0  10072  3400 pts/0    Ss   10:00   0:00 -bash' \\","'wicky       3050  0.0  0.0  11200  3600 pts/0    R+   10:05   0:00 ps aux' > ps-snapshot.txt","# P4: a worker that shuts down cleanly on TERM or INT","printf '%s\\n' '#!/bin/bash' 'touch worker.lock' 'cleanup() { echo \"worker: got a stop signal, saving state\"; rm -f worker.lock; exit 0; }' 'trap cleanup TERM INT' 'while :; do sleep 0.2; done' > worker.sh","# P5: a background service and a broken stop script","printf '%s\\n' '#!/bin/bash' 'trap '\"'\"'echo \"todo-worker: cleaning up\"; exit 0'\"'\"' TERM' 'echo $$ > todo-worker.pid' 'while :; do sleep 0.2; done' > todo-worker.sh","printf '%s\\n' '#!/bin/bash' '# Stop todo-worker gracefully: send TERM, wait up to 5 seconds,' '# and use KILL only if it is still running. Then remove the pid file.' 'PID=$(ps aux | grep todo-worker | awk '\"'\"'{print $2}'\"'\"')' 'kill -9 $PID' 'rm todo-worker.pid' 'echo \"worker stopped\"' > stop-worker.sh","cd ~/bash-practice/day15"],"warmup":[{"q":"Which command shows the 10 biggest numbers of a column, biggest first?","a":"`sort -rn | head -n 10` (for example after `uniq -c`).","from_day":14},{"q":"How do you get the file name from a path in bash?","a":"`${path##*/}` (or `basename \"$path\"`).","from_day":13},{"q":"What does `trap 'cmd' EXIT` do?","a":"It runs `cmd` when the script ends, also after an error. Good for cleanup.","from_day":13},{"q":"What does exit code 130 mean?","a":"The program was stopped with Ctrl+C (signal 2, SIGINT). 128 + 2 = 130.","from_day":6}],"problems":[{"id":"d15p01","title":"Stop a runaway process: kill vs kill -9","type":"command","topic":"Processes","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The model training server is slow. A forgotten loop uses 100% of a CPU. Another process ignores the normal stop signal. The user must find each one by name and stop it, first politely (SIGTERM), then by force (SIGKILL) only if needed.","task":["Start the problem: `bash runaway.sh &`. Check it runs with `pgrep -f runaway.sh`.","Look at it with `ps -o pid,stat,%cpu,cmd -p <PID>`.","Stop it with `kill <PID>` (SIGTERM). Check it is gone.","Start `bash stubborn.sh &`. Try `pkill -f stubborn.sh`. Is it still running?","Stop it with `pkill -9 -f stubborn.sh` (SIGKILL)."],"hints":["`pgrep -f NAME` prints the PIDs of processes whose command line contains NAME.","`kill PID` sends SIGTERM (15): the program can clean up. `kill -9 PID` sends SIGKILL: no cleanup, cannot be blocked.","`pkill -f NAME` = pgrep + kill in one command."],"solution":["bash runaway.sh &                       # in your terminal it runs until you stop it","sleep 1","PID=$(pgrep -f runaway.sh)","[ -n \"$PID\" ] && echo \"runaway.sh is running\"","ps -o stat=,cmd= -p \"$PID\"","kill \"$PID\"                             # SIGTERM (15): please stop","sleep 0.5","pgrep -f runaway.sh > /dev/null || echo \"runaway.sh stopped by SIGTERM\"","bash stubborn.sh &","sleep 0.5","pkill -f stubborn.sh                    # SIGTERM: this one catches it","sleep 0.5","pgrep -f stubborn.sh > /dev/null && echo \"stubborn.sh is still running\"","pkill -9 -f stubborn.sh                 # SIGKILL (9): cannot be caught","sleep 0.5","pgrep -f stubborn.sh > /dev/null || echo \"stubborn.sh stopped by SIGKILL\""],"explanation":[{"part":"cmd &","meaning":"Run in the background; the terminal is free again."},{"part":"pgrep -f","meaning":"Find PIDs by the full command line (`-f`)."},{"part":"ps -o stat=,cmd= -p PID","meaning":"Show chosen columns for one process. `R` = running on the CPU."},{"part":"kill PID","meaning":"Send SIGTERM. Well-behaved programs save data and exit."},{"part":"trap ... TERM","meaning":"`stubborn.sh` catches SIGTERM and keeps running."},{"part":"kill -9 / pkill -9","meaning":"SIGKILL: the kernel stops the process at once. No cleanup, so use it last."}],"expected_output":"runaway.sh is running\nR    bash runaway.sh\nrunaway.sh stopped by SIGTERM\nstubborn: I ignore TERM\nstubborn.sh is still running\nbash: 27715 Killed                  bash stubborn.sh\nstubborn.sh stopped by SIGKILL","expect_exit":0,"output_check":false,"output_note":"The `Killed` line contains a process ID, which is different every run. In an interactive terminal, bash prints job lines like `[1]+  Terminated  bash runaway.sh` instead.","verified":true,"mistakes":["Using `kill -9` first: the database or app gets no chance to save, and files can be broken.","`kill runaway.sh` with a name: `bash: kill: runaway.sh: arguments must be process or job IDs`. Use a PID or `pkill`.","`pkill python` without `-f` and an exact pattern can stop the wrong Python program."],"checks":[{"run":"kill runaway.sh","expect":"kill: runaway.sh: arguments must be process or job IDs"}],"interview_say":"I find the process with `pgrep -f` or `ps`, send SIGTERM with `kill PID` so it can clean up, wait a few seconds, and only use `kill -9` if it is still running.","try_yourself":"Run `kill -l` to see all signal names and numbers. Which number is SIGHUP? What do daemons often do on SIGHUP?","table":{"head":["","`kill PID` (SIGTERM, 15)","`kill -9 PID` (SIGKILL, 9)"],"rows":[["Can the program react?","yes: save, close, clean up","no"],["Can it be ignored?","yes","never"],["Use","always first","only if TERM did not work"],["Risk","low","half-written files, stale lock files"]]}},{"id":"d15p02","title":"Read a ps aux snapshot","type":"concept","topic":"Processes","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The on-call engineer sends `ps-snapshot.txt` from a slow server and asks: \"Who uses the CPU and memory? Is anything broken?\" The user reads the columns and answers with awk and sort.","task":["Show the header line of the snapshot. Learn the columns.","Show the 3 processes with the highest %CPU (column 3).","Show the 2 processes with the highest %MEM (column 4).","Find zombie processes: STAT (column 8) starts with `Z`.","Count the processes per user."],"hints":["`ps aux`: a = processes of all users, u = user-oriented columns, x = also processes without a terminal.","`sort -k3 -rn` sorts by column 3 as numbers, biggest first. Skip the header with `tail -n +2`.","`awk '$8 ~ /^Z/'` prints lines whose 8th field starts with Z."],"solution":["head -n 1 ps-snapshot.txt","echo \"=== top 3 CPU ===\"","tail -n +2 ps-snapshot.txt | sort -k3 -rn | head -n 3 | awk '{print $3 \"%\", $1, $11, $12}'","echo \"=== top 2 memory ===\"","tail -n +2 ps-snapshot.txt | sort -k4 -rn | head -n 2 | awk '{print $4 \"%\", $1, $11, $12}'","echo \"=== zombies ===\"","awk 'NR > 1 && $8 ~ /^Z/ {print $2, $11, $12}' ps-snapshot.txt","echo \"=== processes per user ===\"","awk 'NR > 1 {print $1}' ps-snapshot.txt | sort | uniq -c | sort -rn"],"explanation":[{"part":"a u x","meaning":"a = all users, u = user format (USER, %CPU, %MEM ...), x = include processes without a terminal (daemons). No dash: BSD style."},{"part":"%CPU / %MEM","meaning":"Share of one CPU (can be over 100 on many cores in `top`) / share of RAM."},{"part":"VSZ / RSS","meaning":"Virtual memory size / Resident Set Size: real RAM used, in KB."},{"part":"STAT","meaning":"R running, S sleeping, D waiting for disk (cannot be killed), Z zombie, T stopped. `s` session leader, `l` threads, `+` foreground."},{"part":"TTY ?","meaning":"No terminal: a daemon or service."},{"part":"$8 ~ /^Z/","meaning":"awk regex match on field 8."}],"expected_output":"USER         PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND\n=== top 3 CPU ===\n97.5% jenkins java -jar\n3.4% postgres postgres: main\n1.2% wicky python3 train.py\n=== top 2 memory ===\n35.8% wicky python3 train.py\n21.4% jenkins java -jar\n=== zombies ===\n2299 [python3] <defunct>\n=== processes per user ===\n      4 wicky\n      3 root\n      1 www-data\n      1 postgres\n      1 jenkins","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Thinking `ps` and `ps aux` are the same: `ps` alone shows only the current terminal's processes.","Trying to `kill -9` a zombie. It is already dead; its parent must collect it (or the parent must be restarted).","Reading `x` in `ps aux` as \"exclude\". It means: also show processes without a terminal."],"interview_say":"In `ps aux`, `a` is all users, `u` is the user-oriented format, and `x` adds processes without a terminal. I sort by %CPU or %MEM to find the heavy process, and STAT `Z` shows zombies.","try_yourself":"Run real `ps aux --sort=-%mem | head -n 5` on your WSL. Which process uses the most memory?","table":{"head":["Command","Shows"],"rows":[["`ps`","only processes of this terminal"],["`ps aux`","all processes, BSD format"],["`ps -ef`","all processes, full format with PPID (parent)"],["`ps -eo pid,ppid,%cpu,cmd --sort=-%cpu`","chosen columns, sorted"],["`top` / `htop`","live view; press `P` (CPU), `M` (memory), `q` quit"]]}},{"id":"d15p03","title":"Background jobs: &, jobs, wait, nohup","type":"command","topic":"Processes","minutes":13,"optional":false,"core":false,"workdir":".","situation":"A data export takes a long time. The user wants to start two exports at once, wait for both, and start a report that keeps running even if the SSH connection closes.","task":["Start `sleep 3 &` and `sleep 2 &`. List them with `jobs`.","Wait for both with `wait`, then print `all jobs finished`.","Start a report with `nohup` and send all output to `report.log`. Wait for it with `wait $!`.","Show `report.log`.","In your terminal only: run `sleep 60`, press `Ctrl+Z`, then `bg`, `jobs`, `fg`, and `Ctrl+C`."],"hints":["`&` = background. `jobs` lists background jobs of this shell. `$!` = PID of the last background job.","`wait` with no argument waits for all background jobs.","`nohup cmd > file 2>&1 &` keeps running after logout. `Ctrl+Z` pauses a job; `bg` continues it in the background; `fg` brings it to the front."],"solution":["sleep 3 &","sleep 2 &","jobs","wait","echo \"all jobs finished\"","nohup bash -c 'echo \"report started\"; sleep 1; echo \"report done\"' > report.log 2>&1 &","wait $!","echo \"exit code of the report: $?\"","cat report.log"],"explanation":[{"part":"jobs","meaning":"Background jobs of this shell: `[1]-` and `[2]+` (`+` = current job, `-` = previous)."},{"part":"wait / wait $!","meaning":"Block until all jobs / one job ends. `$?` is then its exit code."},{"part":"nohup","meaning":"No hang-up: ignore SIGHUP, so the job survives when the terminal or SSH closes."},{"part":"nohup: ignoring input","meaning":"In the user's own terminal, `report.log` starts with this line: nohup closed the keyboard input. It is a note, not an error. (In a script, background jobs get no keyboard input, so the line is missing here.)"},{"part":"Ctrl+Z, bg, fg","meaning":"Pause (SIGTSTP), continue in background, bring to foreground. Interactive terminals only."}],"expected_output":"[1]-  Running                 sleep 3 &\n[2]+  Running                 sleep 2 &\nall jobs finished\nexit code of the report: 0\nreport started\nreport done","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Starting a long job over SSH without `nohup`, `tmux` or `screen`: when Wi-Fi drops, the job dies.","`nohup cmd &` without a redirect writes to `nohup.out` in the current folder, which can grow very large.","`fg` in a script: `fg: no job control`. Job control works in an interactive terminal."],"checks":[{"run":"fg","expect":"fg: no job control"}],"interview_say":"I start long jobs with `nohup cmd > log 2>&1 &` or inside `tmux`, so they survive a lost SSH connection. In scripts I start parallel work with `&` and collect it with `wait`.","try_yourself":"Start `sleep 100 &` and then close the terminal. Open a new one and run `pgrep -a sleep`. Is it still there? Now try the same with `nohup`."},{"id":"d15p04","title":"trap: let a worker shut down cleanly","type":"script","topic":"Processes","minutes":13,"optional":false,"core":false,"workdir":".","situation":"Kubernetes stops a pod by sending SIGTERM, then SIGKILL after 30 seconds. The worker in the backend pod must catch SIGTERM, remove its lock file and exit. The user tests what happens with TERM and with KILL.","task":["Read `worker.sh`. Find the `trap` line.","Start it in the background. After half a second, check that `worker.lock` exists.","Send SIGTERM with `kill -TERM $!`, then `wait`. Print the exit code. Is the lock file gone?","Start it again and stop it with `kill -9`. Is the lock file gone this time?"],"hints":["`trap cleanup TERM INT` runs the function `cleanup` when SIGTERM or SIGINT arrives.","SIGKILL cannot be trapped, so no cleanup runs.","After SIGKILL, `wait` gives 137 (128 + 9)."],"solution":["bash worker.sh &","sleep 0.5","ls worker.lock","kill -TERM $!","wait $!","echo \"exit code after TERM: $?\"","ls worker.lock 2>/dev/null || echo \"lock file removed\"","bash worker.sh &","sleep 0.5","kill -9 $!","wait $! 2>/dev/null","echo \"exit code after KILL: $?\"","ls worker.lock && echo \"lock file left behind: no cleanup after SIGKILL\"","rm -f worker.lock"],"explanation":[{"part":"trap cleanup TERM INT","meaning":"Call `cleanup` on SIGTERM (kill, Kubernetes, systemd stop) and SIGINT (Ctrl+C)."},{"part":"cleanup() { ...; exit 0; }","meaning":"Save state, remove the lock, and exit on purpose."},{"part":"wait $!; echo $?","meaning":"Exit code of the worker: 0 after a clean stop."},{"part":"137","meaning":"128 + 9: killed by signal 9. Kubernetes shows this as `OOMKilled` or `Error 137`."},{"part":"2>/dev/null after wait","meaning":"Hide the shell's `Killed` job message."}],"expected_output":"worker.lock\nworker: got a stop signal, saving state\nexit code after TERM: 0\nlock file removed\nexit code after KILL: 137\nworker.lock\nlock file left behind: no cleanup after SIGKILL","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`trap cleanup KILL`: bash accepts it silently, but SIGKILL can never be caught.","A long `sleep 300` in the loop: bash runs the trap only after `sleep` ends, so shutdown is slow. Use short sleeps or `sleep 300 & wait $!`."],"interview_say":"Kubernetes and systemd stop a process with SIGTERM first. My scripts use `trap cleanup TERM INT` to finish cleanly. SIGKILL cannot be caught, so cleanup must not depend on it.","try_yourself":"Run `bash worker.sh` in the foreground and press Ctrl+C. Which message do you see? Check `echo $?`."},{"id":"d15p05","title":"Find the bug: the stop script","type":"fix-bug","topic":"Processes","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`stop-worker.sh` should stop `todo-worker` gracefully. It prints an error about a missing process, the worker never prints its cleanup message, and the second run fails on the pid file.","task":["Start the worker: `bash todo-worker.sh &`. Then run `bash stop-worker.sh`. Read the output.","Run `ps aux | grep todo-worker` yourself. Why are there extra lines?","Find 3 bugs: how the PID is found, `kill -9` first, and the `rm`.","Fix the script: read the PID from `todo-worker.pid`, send TERM, wait up to 5 seconds, KILL only if needed, `rm -f`.","Start the worker again and run the fixed script."],"hints":["`ps aux | grep todo-worker` also finds the grep command itself, and the stop script's own command line.","Loop: `for i in 1 2 3 4 5; do kill -0 \"$PID\" 2>/dev/null || break; sleep 1; done`.","`kill -0 PID` sends no signal; it only checks that the process exists."],"solution":["bash todo-worker.sh &","sleep 0.5","bash stop-worker.sh","cat > stop-worker.sh <<'EOF'","#!/bin/bash","# Stop todo-worker gracefully: send TERM, wait up to 5 seconds,","# and use KILL only if it is still running. Then remove the pid file.","PIDFILE=todo-worker.pid","[ -f \"$PIDFILE\" ] || { echo \"no pid file, worker not running?\" >&2; exit 1; }","PID=$(cat \"$PIDFILE\")","kill -TERM \"$PID\" 2>/dev/null","for i in 1 2 3 4 5; do","  kill -0 \"$PID\" 2>/dev/null || break   # gone? stop waiting","  sleep 1","done","if kill -0 \"$PID\" 2>/dev/null; then","  echo \"still running after 5 s, sending KILL\"","  kill -KILL \"$PID\"","fi","rm -f \"$PIDFILE\"","echo \"worker stopped\"","EOF","echo \"--- fixed ---\"","bash todo-worker.sh &","sleep 0.5","bash stop-worker.sh","bash stop-worker.sh; echo \"second run exit code: $?\""],"explanation":[{"part":"ps aux | grep","meaning":"Bug 1: grep finds its own process too, so PID had several numbers; one was already gone: `No such process`."},{"part":"kill -9 first","meaning":"Bug 2: no TERM, so the worker had no chance to clean up."},{"part":"rm → rm -f","meaning":"Bug 3: `rm` failed when the pid file was missing. `-f` is quiet if it is gone."},{"part":"kill -0 PID","meaning":"Check if the process still exists, without sending a signal."},{"part":"pid file","meaning":"A file with the PID, written by the service at start. Reliable, no grep needed."}],"expected_output":"stop-worker.sh: line 5: kill: (27792) - No such process\nworker stopped\nbash: 27783 Killed                  bash todo-worker.sh\n--- fixed ---\ntodo-worker: cleaning up\nworker stopped\nno pid file, worker not running?\nsecond run exit code: 1","expect_exit":0,"output_check":false,"output_note":"The process IDs in the broken run are different every time.","verified":true,"mistakes":["Using `ps aux | grep todo-worker | grep -v grep`: it still matches other commands, like `nano todo-worker.sh`. A pid file or `pgrep -f` is better.","Using `sleep 5` once instead of a loop: the script always waits 5 seconds, even when the worker stopped after 0.2 seconds."],"interview_say":"A good stop script reads the PID from a pid file, sends SIGTERM, waits with a `kill -0` loop, and uses SIGKILL only as the last step. `ps | grep` is unreliable because grep matches itself.","try_yourself":"Use `pgrep -f '^bash todo-worker.sh'` instead of the pid file. What does the `^` change?"},{"id":"d15p06","title":"nice: run a heavy job with low priority","type":"command","topic":"Processes","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A nightly backup compresses big files and slows down the API. The user runs it with a lower CPU priority so the API keeps its speed. Niceness goes from -20 (highest priority) to 19 (lowest).","task":["Print the normal niceness of your shell: `nice`.","Start `sleep 30` with `nice -n 10` in the background and show its NI column with `ps -o ni=,cmd= -p $!`.","Make it even lower with `renice -n 15 -p $!`.","Try to raise it back to 0 with `renice -n 0 -p $!`. Read the error. Stop the sleep."],"hints":["Higher nice number = nicer to others = lower priority.","A normal user can only make a process nicer (higher number). Lowering it needs sudo.","`kill $!` stops the background sleep at the end."],"solution":["nice","nice -n 10 sleep 30 &","ps -o ni=,cmd= -p $!","renice -n 15 -p $! > /dev/null","ps -o ni=,cmd= -p $!","renice -n 0 -p $! || echo \"exit code: $?\"","kill $!"],"explanation":[{"part":"nice","meaning":"Without a command: print the current niceness (usually 0)."},{"part":"nice -n 10 cmd","meaning":"Start a command with niceness 10."},{"part":"renice -n 15 -p PID","meaning":"Change the niceness of a running process."},{"part":"Permission denied","meaning":"Normal users cannot raise priority (lower the number). Root can: `sudo renice -n -5 -p PID`."}],"expected_output":"0\n 10 sleep 30\n 15 sleep 30\nrenice: failed to set priority for 27810 (process ID): Permission denied\nexit code: 1","expect_exit":0,"output_check":false,"output_note":"The error line contains the process ID, which is different every run.","verified":true,"mistakes":["Thinking nice limits memory or disk. It only changes CPU priority. For disk use `ionice -c3`."],"interview_say":"I run heavy batch jobs with `nice -n 10` (and `ionice -c3` for disk), so production services keep CPU priority. Only root can give a process a higher priority.","try_yourself":"Run `top`, press `r` and change the nice value of a process from inside top."},{"id":"d15p07","title":"/proc/PID: what is this process doing?","type":"command","topic":"Processes","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A Python process on the training server writes to an unknown file and uses a strange setting. `/proc/<pid>/` shows the command line, the environment, the open files and the working folder of any process the user owns.","task":["Start `cd /tmp && FOO=bar sleep 30 &` in a subshell so it runs in `/tmp` with a variable.","Read its command line from `/proc/PID/cmdline` (words are separated by null bytes).","Find `FOO` in `/proc/PID/environ`.","Show its working folder with `readlink /proc/PID/cwd`, and its state from `/proc/PID/status`."],"hints":["Convert null bytes to spaces or new lines: `tr '\\0' ' ' < /proc/PID/cmdline`.","`environ` is also null-separated: `tr '\\0' '\\n' < /proc/PID/environ | grep FOO`.","`cwd` and `exe` are symlinks; `fd/` has one link per open file."],"solution":["(cd /tmp && FOO=bar exec sleep 30) &","PID=$!","sleep 0.3","echo \"cmdline: $(tr '\\0' ' ' < /proc/$PID/cmdline)\"","tr '\\0' '\\n' < /proc/$PID/environ | grep '^FOO='","echo \"cwd: $(readlink /proc/$PID/cwd)\"","grep -E '^(Name|State):' /proc/$PID/status","kill $PID"],"explanation":[{"part":"/proc/PID/cmdline","meaning":"The full command line, with null bytes between words."},{"part":"/proc/PID/environ","meaning":"The environment variables the process started with."},{"part":"/proc/PID/cwd","meaning":"Symlink to the current working folder of the process."},{"part":"/proc/PID/status","meaning":"Name, State (S sleeping, R running ...), memory, threads."},{"part":"exec sleep","meaning":"Replace the subshell with `sleep`, so `$!` is the PID of sleep itself."}],"expected_output":"cmdline: sleep 30\nFOO=bar\ncwd: /tmp\nName:\tsleep\nState:\tS (sleeping)","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Reading `/proc/1/environ` as a normal user: `Permission denied`. A user can only read the environ of their own processes.","Secrets passed as environment variables can be read here by the same user or root. Prefer files with 600 permissions or a secret manager."],"checks":[{"run":"cat /proc/1/environ","expect":"Permission denied"}],"interview_say":"`/proc/PID` shows live details of a process: `cmdline`, `environ`, `cwd`, `fd` for open files and `status`. It helps when I need to know exactly how a process was started.","try_yourself":"Run `ls -l /proc/$$/fd` for your own shell. What are 0, 1 and 2?"},{"id":"d15p08","title":"Zombie vs orphan","type":"concept","topic":"Processes","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The ps snapshot showed `[python3] <defunct>` with STAT `Z`. The user creates a zombie on purpose to see it, and learns the difference from an orphan process.","task":["Run the small Python program in the solution: the child exits at once, the parent sleeps and does not collect it.","While the parent sleeps, show the child with `ps -o stat=,cmd= --ppid <parent PID>`.","After the parent ends, check again: the zombie is gone.","Read the table: zombie vs orphan."],"hints":["A zombie has finished, but its parent has not read its exit code yet (no `wait()`).","An orphan is still running, but its parent has died. PID 1 (or a subreaper) adopts it.","Zombies use no CPU or memory, only a slot in the process table."],"solution":["python3 -c '","import os, time","pid = os.fork()","if pid == 0:","    os._exit(0)      # the child ends at once","time.sleep(1.5)      # the parent never calls wait()","' &","PARENT=$!","sleep 0.7","ps -o stat=,cmd= --ppid \"$PARENT\"","wait \"$PARENT\"","ps -o stat=,cmd= --ppid \"$PARENT\" || echo \"parent ended: the zombie was cleaned up\""],"explanation":[{"part":"os.fork()","meaning":"Create a child process."},{"part":"os._exit(0) in the child","meaning":"The child ends at once."},{"part":"no wait() in the parent","meaning":"The exit code is never collected, so the child stays a zombie (`Z`, `<defunct>`)."},{"part":"parent ends","meaning":"PID 1 adopts the zombie and collects it, so it disappears."}],"expected_output":"Z    [python3] <defunct>\nparent ended: the zombie was cleaned up","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Trying `kill -9` on a zombie: nothing changes. Kill or restart the parent instead.","Many zombies in a container: the main process (PID 1) does not reap children. Use `docker run --init` or a tiny init like tini."],"interview_say":"A zombie is a finished process whose parent has not read its exit status; you fix the parent. An orphan is a running process whose parent died; init adopts it.","try_yourself":"Run `ps -eo stat | grep -c '^Z'` on your WSL to count zombies (probably 0).","table":{"head":["","Zombie","Orphan"],"rows":[["Is it running?","no, it finished","yes"],["Parent","alive, but did not call wait()","dead; adopted by PID 1"],["Uses CPU/RAM?","no, only a process table slot","yes, like any process"],["Fix","fix or restart the parent","usually nothing; it is a normal process"]]}}],"interview":[{"q":"What is the difference between `kill` and `kill -9`?","a":"`kill` sends SIGTERM: the program can clean up and exit. `kill -9` sends SIGKILL: the kernel stops it at once, with no cleanup. Use -9 only if TERM does not work.","topic":"Processes"},{"q":"What do the letters in `ps aux` mean?","a":"a = processes of all users, u = user-oriented columns (USER, %CPU, %MEM), x = also processes without a terminal, like daemons.","topic":"Processes"},{"q":"How do you keep a long command running after you log out of SSH?","a":"`nohup cmd > out.log 2>&1 &`, or run it inside `tmux` or `screen`, or make it a systemd service.","topic":"Processes"},{"q":"What is a zombie process?","a":"A process that has finished, but its parent has not collected its exit status. It uses no CPU; fix or restart the parent.","topic":"Processes"},{"q":"How does a script clean up when it is stopped?","a":"With `trap cleanup TERM INT` (and `EXIT`). The function removes temp and lock files. SIGKILL cannot be trapped.","topic":"Processes"}],"recap":[{"cmd":"ps aux / ps -ef","meaning":"All processes (BSD / full format with PPID)","example":"ps aux --sort=-%cpu | head","topic":"Processes"},{"cmd":"ps -o pid,stat,cmd -p PID","meaning":"Chosen columns for one process","example":"ps -o pid,ni,cmd -p 1234","topic":"Processes"},{"cmd":"pgrep -f / pkill -f","meaning":"Find / signal processes by command line","example":"pkill -f stubborn.sh","topic":"Processes"},{"cmd":"kill PID / kill -9 PID","meaning":"SIGTERM (clean) / SIGKILL (force)","example":"kill 1234","topic":"Processes"},{"cmd":"kill -0 PID","meaning":"Check that a process exists","example":"kill -0 \"$PID\" 2>/dev/null && echo up","topic":"Processes"},{"cmd":"kill -l","meaning":"List signal names and numbers","example":"kill -l","topic":"Processes"},{"cmd":"cmd & / jobs / wait","meaning":"Background job / list / wait for it","example":"sleep 5 & wait $!","topic":"Processes"},{"cmd":"Ctrl+Z, bg, fg","meaning":"Pause, continue in background, bring to front","example":"bg %1","topic":"Processes"},{"cmd":"nohup cmd > log 2>&1 &","meaning":"Keep running after logout","example":"nohup ./export.sh > export.log 2>&1 &","topic":"Processes"},{"cmd":"nice -n / renice","meaning":"Start with / change CPU priority","example":"nice -n 10 tar czf backup.tgz data","topic":"Processes"},{"cmd":"/proc/PID/","meaning":"cmdline, environ, cwd, fd, status","example":"readlink /proc/1234/cwd","topic":"Processes"},{"cmd":"trap cmd TERM INT","meaning":"React to stop signals","example":"trap cleanup TERM INT","topic":"Processes"},{"cmd":"top / htop","meaning":"Live view (P = sort CPU, M = memory, q = quit)","example":"top","topic":"Processes"}],"coverage":[{"item":"ps","problems":["d15p01","d15p02","d15p05"]},{"item":"top/htop reading","problems":["d15p02"]},{"item":"pgrep, pkill","problems":["d15p01","d15p05"]},{"item":"kill signals","problems":["d15p01","d15p04","d15p05"]},{"item":"jobs, bg, fg","problems":["d15p03"]},{"item":"nohup, &, wait","problems":["d15p03","d15p04"]},{"item":"nice","problems":["d15p06"]},{"item":"/proc/<pid>","problems":["d15p07"]},{"item":"zombie vs orphan","problems":["d15p02","d15p08"]},{"item":"trap on signals","problems":["d15p04","d15p05"]}],"reset":"rm -rf ~/bash-practice/day15"},{"day":16,"week":3,"title":"Cron, systemd and logs","goal":"Schedule jobs with cron, write and check a systemd service file, read service logs, and understand log rotation.","minutes":90,"setup":["mkdir -p ~/bash-practice/day16/bin ~/bash-practice/day16/www ~/bash-practice/day16/logs && cd ~/bash-practice/day16","# small jobs for the crontab problem","for j in health backup report cleanup; do printf '#!/bin/bash\\necho \"%s ran at $(date +%%F_%%T)\"\\n' \"$j\" > \"$j.sh\"; chmod +x \"$j.sh\"; done","# P2: a nightly job that uses a tool from ~/bash-practice/day16/bin","printf '#!/bin/bash\\necho \"report-tool: 42 todos open\"\\n' > bin/report-tool","chmod +x bin/report-tool","printf '%s\\n' '#!/bin/bash' 'report-tool >> nightly.log' 'echo \"nightly done\"' > nightly.sh","chmod +x nightly.sh","# P3: a page for the service to serve","echo '{\"status\":\"UP\"}' > www/health.json","# P5: a broken unit file","printf '%s\\n' '[Unit]' 'Description=Todo API (practice)' 'After=network.target' '' '[service]' 'ExecStart=/usr/local/bin/todo-api --port 8080' 'Restart=sometimes' '' '[Install]' 'WantedBy=multi-user.target' > broken-todo.service","# P6: a log for logrotate","printf 'line %s\\n' 1 2 3 > logs/todo-api.log","cd ~/bash-practice/day16"],"warmup":[{"q":"What is the difference between SIGTERM and SIGKILL?","a":"SIGTERM (15) asks the process to stop; it can clean up. SIGKILL (9) stops it at once; it cannot be caught.","from_day":15},{"q":"How do you keep a job running after SSH logout?","a":"`nohup cmd > log 2>&1 &`, or run it in `tmux`/`screen`, or as a systemd service.","from_day":15},{"q":"How do you make a timestamp for a file name?","a":"`date +%Y%m%d-%H%M%S`","from_day":13},{"q":"How do you list `.log` files older than 7 days?","a":"`find /path -name '*.log' -mtime +7`","from_day":12}],"problems":[{"id":"d16p01","title":"Write and install crontab lines","type":"command","topic":"Services","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The team needs four scheduled jobs on the to-do server: a health check every 5 minutes, a backup at 02:30 every night, a report at 09:00 on working days, and a cleanup on the first day of each month.","task":["**Warning:** this changes your real user crontab. The last step removes the practice lines again. If you already use cron, run `crontab -l > ~/crontab-backup.txt` first.","Write the four lines into `my-cron.txt`. Use absolute paths and send output to a log file with `>> file 2>&1`.","Check that each line has at least 6 fields (5 time fields + the command).","Install them without deleting other lines: `(crontab -l 2>/dev/null; cat my-cron.txt) | crontab -`. List with `crontab -l`.","Remove the practice lines: `crontab -l | grep -v bash-practice | crontab -`."],"hints":["The 5 fields: minute, hour, day of month, month, day of week. `*` = every.","`*/5` = every 5. `1-5` = Monday to Friday. `0 0 1 * *` = midnight on day 1 of each month.","`crontab file` REPLACES the whole crontab. The `(crontab -l; cat file) | crontab -` pattern keeps old lines."],"solution":["cat > my-cron.txt <<EOF","# m   h  dom mon dow  command","*/5   *  *   *   *    $HOME/bash-practice/day16/health.sh >> $HOME/bash-practice/day16/logs/cron.log 2>&1","30    2  *   *   *    $HOME/bash-practice/day16/backup.sh >> $HOME/bash-practice/day16/logs/cron.log 2>&1","0     9  *   *   1-5  $HOME/bash-practice/day16/report.sh >> $HOME/bash-practice/day16/logs/cron.log 2>&1","0     0  1   *   *    $HOME/bash-practice/day16/cleanup.sh >> $HOME/bash-practice/day16/logs/cron.log 2>&1","EOF","grep -v '^#' my-cron.txt | awk '{ if (NF >= 6) print \"ok  \", $1, $2, $3, $4, $5; else print \"BAD \", $0 }'","(crontab -l 2>/dev/null; cat my-cron.txt) | crontab -","echo \"practice lines installed: $(crontab -l | grep -c bash-practice)\"","crontab -l | grep -v bash-practice | crontab -","echo \"practice lines left: $(crontab -l 2>/dev/null | grep -c bash-practice)\""],"explanation":[{"part":"*/5 * * * *","meaning":"Every 5 minutes."},{"part":"30 2 * * *","meaning":"Every day at 02:30."},{"part":"0 9 * * 1-5","meaning":"09:00, Monday (1) to Friday (5). Sunday is 0 (or 7)."},{"part":"0 0 1 * *","meaning":"00:00 on the 1st day of every month."},{"part":">> log 2>&1","meaning":"Cron has no screen. Without a redirect, output is mailed or lost."},{"part":"(crontab -l; cat file) | crontab -","meaning":"Install old lines plus new lines. `crontab -` reads the new crontab from stdin."}],"expected_output":"ok   */5 * * * *\nok   30 2 * * *\nok   0 9 * * 1-5\nok   0 0 1 * *\npractice lines installed: 4\npractice lines left: 0","expect_exit":0,"output_check":false,"output_note":"The count is 4 if the user had no crontab before. On WSL without systemd, cron does not run by itself: start it with `sudo service cron start`.","verified":true,"mistakes":["`crontab my-cron.txt` replaces all existing jobs of the user. Other jobs are lost without a warning.","Using relative paths like `./backup.sh`: cron starts in the home folder, so the script is not found.","Using `crontab -r` to remove one line: it deletes the whole crontab (r is next to e on the keyboard)."],"interview_say":"A crontab line has five time fields, minute, hour, day of month, month and day of week, then the command. I use absolute paths, redirect output to a log, and test the script by hand first.","try_yourself":"Write the cron line for \"every Sunday at 03:15\". Check it on a site like crontab.guru in your browser.","table":{"head":["Field","Range","Example"],"rows":[["minute","0-59","`*/15` every 15 min"],["hour","0-23","`2` = 02:00"],["day of month","1-31","`1` = first day"],["month","1-12","`*` every month"],["day of week","0-7 (0 and 7 = Sunday)","`1-5` working days"],["shortcut","`@reboot`, `@daily`, `@hourly`","`@reboot /path/start.sh`"]]}},{"id":"d16p02","title":"Explain the error: it works in my terminal, not in cron","type":"explain-error","topic":"Services","minutes":12,"optional":false,"core":false,"workdir":".","situation":"`nightly.sh` works when the user runs it by hand, but in cron it writes nothing. Cron runs jobs with a tiny environment: `PATH=/usr/bin:/bin`, no `.bashrc`, and the home folder as the working folder. The user simulates that with `env -i`.","task":["Add the tool folder to PATH like in an interactive shell: `export PATH=\"$HOME/bash-practice/day16/bin:$PATH\"`. Run `./nightly.sh`. It works.","Simulate cron: `env -i HOME=\"$HOME\" PATH=/usr/bin:/bin /bin/sh -c 'cd ~/bash-practice/day16 && ./nightly.sh'`. Read the error.","Fix `nightly.sh`: set PATH at the top, and use an absolute path for the log.","Run the cron simulation again."],"hints":["`env -i` starts a command with an empty environment, like cron does.","The error is `report-tool: command not found`, because `~/bash-practice/day16/bin` is not in cron's PATH.","Put `PATH=$HOME/bash-practice/day16/bin:/usr/local/bin:/usr/bin:/bin` at the top of the script."],"solution":["export PATH=\"$HOME/bash-practice/day16/bin:$PATH\"","./nightly.sh","echo \"--- like cron ---\"","env -i HOME=\"$HOME\" PATH=/usr/bin:/bin /bin/sh -c 'cd ~/bash-practice/day16 && ./nightly.sh'","cat > nightly.sh <<'EOF'","#!/bin/bash","PATH=$HOME/bash-practice/day16/bin:/usr/local/bin:/usr/bin:/bin   # cron gives only /usr/bin:/bin","LOG=$HOME/bash-practice/day16/logs/nightly.log                    # absolute path, not ./","report-tool >> \"$LOG\"","echo \"nightly done\"","EOF","echo \"--- like cron, after the fix ---\"","env -i HOME=\"$HOME\" PATH=/usr/bin:/bin /bin/sh -c 'cd ~/bash-practice/day16 && ./nightly.sh'","cat logs/nightly.log"],"explanation":[{"part":"env -i","meaning":"Run with an empty environment. Then add only HOME and the small cron PATH."},{"part":"command not found","meaning":"The interactive PATH (from `.bashrc` or `export`) does not exist in cron."},{"part":"PATH=... at the top","meaning":"The script brings its own PATH, so it works in cron, systemd and CI."},{"part":"absolute LOG path","meaning":"Cron's working folder is the home folder, not the script's folder."}],"expected_output":"nightly done\n--- like cron ---\n./nightly.sh: line 2: report-tool: command not found\nnightly done\n--- like cron, after the fix ---\nnightly done\nreport-tool: 42 todos open","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`date +%F` directly in a crontab line: cron cuts the command at `%`. Write `date +\\%F` or put it in a script.","Testing a cron job only in the terminal. Always test with a cron-like environment or check the cron log (`grep CRON /var/log/syslog`)."],"interview_say":"Cron runs with a minimal environment: a small PATH, no profile files, and the home folder as working folder. So my cron scripts use absolute paths, set PATH, and log their output to a file.","try_yourself":"Run `env -i /bin/sh -c 'echo $PATH; pwd'`. What PATH and folder do you see?","table":{"head":["Cron problem","Fix"],"rows":[["small PATH","absolute paths or set PATH in the script/crontab"],["no `.bashrc` variables","set them in the script or source a file"],["`%` in a crontab line means new line","write `\\%`, for example `date +\\%F`"],["output is lost","`>> /path/job.log 2>&1`"],["wrong working folder","`cd /path || exit 1` first"]]}},{"id":"d16p03","title":"Write a systemd service file and check it","type":"script","topic":"Services","minutes":14,"optional":false,"core":true,"workdir":".","situation":"The to-do API must start automatically after a reboot and restart when it crashes. On Linux servers this is a systemd service. The user writes the unit file and checks it with `systemd-analyze verify`, which works even without a running systemd.","task":["Write `todo-api.service` with three sections: `[Unit]`, `[Service]`, `[Install]`.","In `[Service]`: run `/usr/bin/python3 -m http.server 8080` in the folder `www`, as your user, restart on failure after 3 seconds, and set `APP_ENV=prod`.","In `[Install]`: `WantedBy=multi-user.target`.","Check it with `systemd-analyze verify ./todo-api.service`. No output means no problems.","Make a copy with a typo (`Restart=allways`) and check that copy too."],"hints":["`ExecStart` needs the full path of the program: `/usr/bin/python3`.","`WorkingDirectory=`, `User=`, `Restart=on-failure`, `RestartSec=3`, `Environment=APP_ENV=prod`.","Use `sed 's/on-failure/allways/' todo-api.service > typo.service` for the copy."],"solution":["cat > todo-api.service <<EOF","[Unit]","Description=Todo API (practice)","After=network.target","","[Service]","WorkingDirectory=$HOME/bash-practice/day16/www","ExecStart=/usr/bin/python3 -m http.server 8080","User=$USER","Restart=on-failure","RestartSec=3","Environment=APP_ENV=prod","","[Install]","WantedBy=multi-user.target","EOF","systemd-analyze verify ./todo-api.service && echo \"todo-api.service: no problems found\"","sed 's/on-failure/allways/' todo-api.service > typo.service","systemd-analyze verify ./typo.service"],"explanation":[{"part":"[Unit] Description, After","meaning":"A name for humans, and start after the network is up."},{"part":"ExecStart=/usr/bin/python3 ...","meaning":"The command to run. Use the full path."},{"part":"WorkingDirectory, User","meaning":"Run in this folder, as this user (never root if not needed)."},{"part":"Restart=on-failure, RestartSec=3","meaning":"Restart after a crash (non-zero exit), wait 3 seconds first."},{"part":"Environment=","meaning":"Set environment variables for the service. For secrets, prefer `EnvironmentFile=` with a 600 file."},{"part":"WantedBy=multi-user.target","meaning":"`systemctl enable` makes it start at normal boot."},{"part":"systemd-analyze verify","meaning":"Check the syntax and the program path without starting anything."}],"expected_output":"todo-api.service: no problems found\n/home/wicky/bash-practice/day16/typo.service:9: Failed to parse service restart specifier, ignoring: allways","expect_exit":0,"output_check":true,"output_note":"On Ubuntu 22.04 (systemd 249) the warning text can be a little different.","verified":true,"mistakes":["Using `ExecStart=python3 app.py`: older systemd versions need an absolute path, and the right Python is not guaranteed.","Forgetting `[Install]`: then `systemctl enable` says the unit has no installation config and it never starts at boot.","Running the service as root by default. Add `User=` with a service user."],"interview_say":"A systemd unit has `[Unit]` for description and order, `[Service]` with `ExecStart`, `User`, `Restart`, and `[Install]` with `WantedBy=multi-user.target`. I check it with `systemd-analyze verify` before I install it.","try_yourself":"Add `StandardOutput=append:/home/wicky/bash-practice/day16/logs/todo-api.log` and verify again."},{"id":"d16p04","title":"systemctl and journalctl (WSL with systemd only)","type":"concept","topic":"Services","minutes":12,"optional":false,"core":false,"workdir":".","situation":"With the unit file ready, the user installs it, starts it, enables it at boot, checks its status and reads its logs. These commands need a running systemd and sudo, so they are not run in the sandbox.","task":["Check if systemd runs in your WSL: `ps -p 1 -o comm=`. If it prints `systemd`, continue. If it prints `init`, systemd is off: **read only** (see the note).","Install: `sudo cp todo-api.service /etc/systemd/system/` and `sudo systemctl daemon-reload`.","Start and enable: `sudo systemctl enable --now todo-api`.","Check: `systemctl status todo-api` and `curl -s localhost:8080/health.json`.","Logs: `journalctl -u todo-api --since \"10 min ago\"`, and live with `-f`. Clean up: `sudo systemctl disable --now todo-api` and `sudo rm /etc/systemd/system/todo-api.service`."],"hints":["`daemon-reload` makes systemd read changed unit files.","`enable` = start at boot; `--now` = also start now.","`journalctl -u NAME` shows logs of one unit; `-f` follows; `-n 50` last 50 lines; `--since` filters by time."],"solution":["ps -p 1 -o comm=","sudo cp todo-api.service /etc/systemd/system/","sudo systemctl daemon-reload","sudo systemctl enable --now todo-api","systemctl status todo-api --no-pager","curl -s localhost:8080/health.json","journalctl -u todo-api --since \"10 min ago\" --no-pager","# clean up","sudo systemctl disable --now todo-api","sudo rm /etc/systemd/system/todo-api.service","sudo systemctl daemon-reload"],"explanation":[{"part":"ps -p 1 -o comm=","meaning":"Name of process 1. `systemd` = systemd is running."},{"part":"systemctl daemon-reload","meaning":"Reload unit files after a change."},{"part":"enable --now","meaning":"Start at boot and start right now."},{"part":"status","meaning":"Loaded? Enabled? Active (running)? Main PID, memory, and the last log lines."},{"part":"journalctl -u NAME","meaning":"Logs of the unit. `-f` follow, `--since`, `-n`, `-p err` (only errors)."},{"part":"If systemd is off (WSL)","meaning":"Read only. To turn it on: add `[boot]` and `systemd=true` to `/etc/wsl.conf` (system file, sudo), then run `wsl --shutdown` in Windows PowerShell."}],"expected_output":"","expect_exit":0,"output_check":false,"output_note":"Typical output on Ubuntu 24.04 with systemd. PIDs, times, memory and the host name will be different. On a failed start, `Active:` shows `failed` and the log lines show why.","verified":false,"typical_output":"systemd\nCreated symlink /etc/systemd/system/multi-user.target.wants/todo-api.service → /etc/systemd/system/todo-api.service.\n● todo-api.service - Todo API (practice)\n     Loaded: loaded (/etc/systemd/system/todo-api.service; enabled; preset: enabled)\n     Active: active (running) since Tue 2026-10-20 10:15:02 +0530; 2s ago\n   Main PID: 2481 (python3)\n      Tasks: 1 (limit: 9389)\n     Memory: 9.8M\n        CPU: 61ms\n     CGroup: /system.slice/todo-api.service\n             └─2481 /usr/bin/python3 -m http.server 8080\n\nOct 20 10:15:02 laptop systemd[1]: Started todo-api.service - Todo API (practice).\n{\"status\":\"UP\"}\nOct 20 10:15:02 laptop systemd[1]: Started todo-api.service - Todo API (practice).\nOct 20 10:15:05 laptop python3[2481]: 127.0.0.1 - - [20/Oct/2026 10:15:05] \"GET /health.json HTTP/1.1\" 200 -\nRemoved \"/etc/systemd/system/multi-user.target.wants/todo-api.service\".","mistakes":["Changing the unit file and forgetting `daemon-reload`: systemd warns `The unit file ... changed on disk. Run 'systemctl daemon-reload'`.","`systemctl start` without `enable`: the service does not come back after a reboot.","On WSL without systemd: `System has not been booted with systemd as init system (PID 1). Can't operate.`"],"interview_say":"I install a unit into `/etc/systemd/system`, run `daemon-reload`, then `systemctl enable --now`. For problems I check `systemctl status` and `journalctl -u name -f`.","try_yourself":"On a system with systemd, run `systemctl list-units --type=service --state=running` to see all running services."},{"id":"d16p05","title":"Find the bug: the broken unit file","type":"fix-bug","topic":"Services","minutes":13,"optional":false,"core":false,"workdir":".","situation":"A teammate wrote `broken-todo.service`. On the server, `systemctl start` fails and the logs are full of warnings. The user checks it offline with `systemd-analyze verify` and fixes every problem.","task":["Run `systemd-analyze verify ./broken-todo.service` and read every line.","Find 3 bugs: a section name, a missing program, and a wrong `Restart=` value.","Write the fixed file as `todo-fixed.service` (use python3 http.server like P3). Verify it."],"hints":["Section names are case-sensitive: `[Service]`.","`/usr/local/bin/todo-api` does not exist. Check with `ls` or `command -v`.","Valid Restart values: `no`, `on-failure`, `always`, `on-abnormal` ..."],"solution":["systemd-analyze verify ./broken-todo.service || echo \"exit code: $?\"","ls /usr/local/bin/todo-api || true","cat > todo-fixed.service <<'EOF'","[Unit]","Description=Todo API (practice)","After=network.target","","[Service]","ExecStart=/usr/bin/python3 -m http.server 8080","Restart=on-failure","","[Install]","WantedBy=multi-user.target","EOF","systemd-analyze verify ./todo-fixed.service && echo \"todo-fixed.service: no problems found\""],"explanation":[{"part":"Unknown section 'service'","meaning":"Bug 1: `[service]` must be `[Service]`. Because of it, systemd also saw no ExecStart and refused the unit."},{"part":"is not executable: No such file","meaning":"Bug 2: the program path does not exist."},{"part":"Failed to parse service restart specifier","meaning":"Bug 3: `sometimes` is not a valid value; systemd ignores the line."}],"expected_output":"/home/wicky/bash-practice/day16/broken-todo.service:5: Unknown section 'service'. Ignoring.\nbroken-todo.service: Service has no ExecStart=, ExecStop=, or SuccessAction=. Refusing.\nUnit broken-todo.service has a bad unit file setting.\nexit code: 1\nls: cannot access '/usr/local/bin/todo-api': No such file or directory\ntodo-fixed.service: no problems found","expect_exit":0,"output_check":true,"output_note":"Ubuntu 22.04 (systemd 249) prints similar warnings with small text differences.","verified":true,"mistakes":["Reading only the last line (`bad unit file setting`). The first lines show the real cause.","Thinking a warning like `ignoring` is harmless. An ignored `Restart=` line means the service will NOT restart after a crash."],"checks":[{"run":"systemd-analyze verify ./broken-todo.service","expect":"Unknown section 'service'"},{"run":"sed 's/^\\[service\\]/[Service]/' broken-todo.service > b2.service; systemd-analyze verify ./b2.service","expect":"Command /usr/local/bin/todo-api is not executable"},{"run":"sed 's/^\\[service\\]/[Service]/' broken-todo.service > b3.service; systemd-analyze verify ./b3.service","expect":"Failed to parse service restart specifier"}],"interview_say":"Before installing a unit file, I run `systemd-analyze verify`. It finds wrong section names, invalid values and missing programs without touching the running system.","try_yourself":"Add `Type=simpel` (a typo) to the fixed file and verify again. What does systemd say?"},{"id":"d16p06","title":"logrotate: dry-run a rotation config","type":"command","topic":"Services","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The API log grows every day and will fill the disk. logrotate renames old logs (`app.log.1`, `app.log.2.gz`) and deletes the oldest. The user writes a config for the practice log and tests it in debug mode, which changes nothing.","task":["Write `todo-logrotate.conf` for `logs/todo-api.log`: daily, keep 7, compress, missingok, notifempty.","Dry run: `logrotate -d -s ./logrotate.state todo-logrotate.conf`.","Force a real rotation once in the practice folder: `logrotate -f -s ./logrotate.state todo-logrotate.conf`, then `ls logs`."],"hints":["`-d` = debug: only prints what it would do.","`-s FILE` = own state file, so no root is needed for practice.","On a server, configs live in `/etc/logrotate.d/` and run daily from cron or a systemd timer."],"solution":["cat > todo-logrotate.conf <<EOF","$HOME/bash-practice/day16/logs/todo-api.log {","    daily","    rotate 7","    compress","    missingok","    notifempty","}","EOF","logrotate -d -s ./logrotate.state todo-logrotate.conf 2>&1 | grep -E 'rotating pattern|considering|needs rotating|does not need'","logrotate -f -s ./logrotate.state todo-logrotate.conf","ls logs"],"explanation":[{"part":"daily / rotate 7","meaning":"Rotate once a day, keep 7 old files."},{"part":"compress","meaning":"gzip the old files (`.1.gz`). Add `delaycompress` to keep the newest old file plain."},{"part":"missingok / notifempty","meaning":"No error if the log is missing; do not rotate an empty log."},{"part":"-d / -f / -s","meaning":"Debug (dry run) / force now / state file path."},{"part":"copytruncate","meaning":"Option for apps that keep the file open and cannot reopen logs (copy, then empty the original)."},{"part":"only .1.gz left","meaning":"After the forced rotation, the old log was renamed and compressed. Add `create 0640 wicky wicky` to make a new empty log at once."}],"expected_output":"rotating pattern: /home/wicky/bash-practice/day16/logs/todo-api.log  after 1 days (7 rotations)\nconsidering log /home/wicky/bash-practice/day16/logs/todo-api.log\n  log does not need rotating (log has already been rotated)\ntodo-api.log.1.gz","expect_exit":0,"output_check":false,"output_note":"The debug output contains the current time, so some lines differ on every run.","verified":true,"mistakes":["Deleting a log that an app still writes to: the disk space is not freed (Day 17). Use logrotate with `copytruncate` or a reload signal.","Testing a config with `-f` on a real server: it rotates for real. Use `-d` first."],"interview_say":"logrotate rotates, compresses and deletes old logs based on a config in `/etc/logrotate.d/`. I test a config with `logrotate -d` first, and use `copytruncate` or a postrotate reload for apps that keep the file open.","try_yourself":"Look at a real config: `cat /etc/logrotate.d/apt` (read only)."},{"id":"d16p07","title":"at: run a job once, later (read only)","type":"concept","topic":"Services","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The team wants to restart the API once tonight at 23:00, not every night. Cron is for repeating jobs; `at` is for one-time jobs. It needs the `atd` service, so it is not run in the sandbox.","task":["Install if needed: `sudo apt install -y at`. Start the service on WSL without systemd: `sudo service atd start`.","Schedule: `echo \"$HOME/bash-practice/day16/report.sh >> $HOME/bash-practice/day16/logs/at.log 2>&1\" | at now + 2 minutes`.","List jobs with `atq`. Remove a job with `atrm <number>`.","After 2 minutes, check `logs/at.log`."],"hints":["`at TIME` reads commands from stdin.","Time examples: `now + 10 minutes`, `23:00`, `tomorrow 06:30`.","`atq` = list, `atrm N` = remove job N."],"solution":["echo \"$HOME/bash-practice/day16/report.sh >> $HOME/bash-practice/day16/logs/at.log 2>&1\" | at now + 2 minutes","atq","sleep 130","cat ~/bash-practice/day16/logs/at.log"],"explanation":[{"part":"at now + 2 minutes","meaning":"Run the commands from stdin once, in 2 minutes."},{"part":"atq / atrm","meaning":"List / remove pending jobs."},{"part":"cron vs at","meaning":"cron = repeat on a schedule. at = run once at a time."}],"expected_output":"","expect_exit":0,"output_check":false,"output_note":"Job numbers and times will be different.","verified":false,"typical_output":"warning: commands will be executed using /bin/sh\njob 1 at Tue Oct 20 10:32:00 2026\n1\tTue Oct 20 10:32:00 2026 a wicky\nreport ran at 2026-10-20_10:32:00","mistakes":["The atd service is not running: the job stays in `atq` and never runs. Check with `sudo service atd status`."],"interview_say":"For a one-time job I use `at`, for example `echo 'systemctl restart app' | at 23:00`, and I check pending jobs with `atq`. For repeating jobs I use cron or systemd timers.","try_yourself":"Find out what a systemd timer is (`systemctl list-timers` on a system with systemd). How is it different from cron?"}],"interview":[{"q":"Explain the five fields of a crontab line.","a":"Minute, hour, day of month, month, day of week, then the command. `30 2 * * *` runs every day at 02:30.","topic":"Services"},{"q":"A script works by hand but not in cron. Why?","a":"Cron has a minimal environment: a small PATH, no `.bashrc`, a different working folder, and no terminal. Use absolute paths, set PATH, and log the output.","topic":"Services"},{"q":"What are the main parts of a systemd unit file?","a":"`[Unit]` (Description, After), `[Service]` (ExecStart, User, Restart, Environment), and `[Install]` (WantedBy=multi-user.target).","topic":"Services"},{"q":"How do you see the logs of a systemd service?","a":"`journalctl -u service-name`. Add `-f` to follow, `--since \"1 hour ago\"` to filter, `-n 100` for the last lines.","topic":"Services"},{"q":"What is logrotate for?","a":"It rotates logs: renames old files, compresses them, and deletes the oldest, so logs do not fill the disk.","topic":"Services"}],"recap":[{"cmd":"crontab -l / -e","meaning":"List / edit your cron jobs","example":"crontab -l","topic":"Services"},{"cmd":"(crontab -l; cat f) | crontab -","meaning":"Add lines without losing old ones","example":"(crontab -l; echo \"@reboot ~/start.sh\") | crontab -","topic":"Services"},{"cmd":"m h dom mon dow cmd","meaning":"Crontab line format","example":"*/5 * * * * /opt/check.sh >> /var/log/check.log 2>&1","topic":"Services"},{"cmd":"env -i","meaning":"Run with an empty environment (test cron-like runs)","example":"env -i PATH=/usr/bin:/bin ./job.sh","topic":"Services"},{"cmd":"systemd-analyze verify","meaning":"Check a unit file offline","example":"systemd-analyze verify ./app.service","topic":"Services"},{"cmd":"systemctl daemon-reload","meaning":"Reload unit files after a change","example":"sudo systemctl daemon-reload","topic":"Services"},{"cmd":"systemctl enable --now","meaning":"Start now and at boot","example":"sudo systemctl enable --now todo-api","topic":"Services"},{"cmd":"systemctl status / restart / stop","meaning":"Check and control a service","example":"systemctl status nginx","topic":"Services"},{"cmd":"journalctl -u NAME -f --since","meaning":"Logs of a unit","example":"journalctl -u nginx --since \"1 hour ago\"","topic":"Services"},{"cmd":"logrotate -d","meaning":"Dry-run a logrotate config","example":"logrotate -d /etc/logrotate.d/nginx","topic":"Services"},{"cmd":"at / atq / atrm","meaning":"One-time jobs","example":"echo ./report.sh | at 23:00","topic":"Services"},{"cmd":"ps -p 1 -o comm=","meaning":"Is systemd PID 1?","example":"ps -p 1 -o comm=","topic":"Services"}],"coverage":[{"item":"crontab syntax","problems":["d16p01","d16p02"]},{"item":"at","problems":["d16p07"]},{"item":"systemd unit file","problems":["d16p03","d16p05"]},{"item":"systemctl status/start/enable","problems":["d16p04"]},{"item":"journalctl -u -f --since","problems":["d16p04"]},{"item":"logrotate idea","problems":["d16p06"]}],"reset":"rm -rf ~/bash-practice/day16"},{"day":17,"week":3,"title":"Disk, memory and performance","goal":"Find what fills the disk, tell space problems from inode problems, read memory and load numbers, and fix the classic \"deleted but still open\" file.","minutes":90,"setup":["mkdir -p ~/bash-practice/day17 && cd ~/bash-practice/day17","# P1: a training server folder (about 47 MB of real data)","mkdir -p server/model-checkpoints server/logs server/cache/pip server/datasets","for e in 1 2 3; do head -c 10485760 /dev/zero > server/model-checkpoints/epoch-$e.pt; done","head -c 4194304 /dev/zero > server/logs/train.log","head -c 1048576 /dev/zero > server/logs/worker.log","head -c 12582912 /dev/zero > server/cache/pip/torch.whl","echo 'id,label' > server/datasets/small.csv","# P2/P5: df snapshots from a production server","printf '%s\\n' 'Filesystem     1024-blocks      Used Available Capacity Mounted on' '/dev/nvme0n1p1    51474912  47105112   4353416      92% /' '/dev/nvme1n1     103081248  41232499  56589645      43% /var' '/dev/nvme2n1      20511312  18665294   1846018      91% /var/lib/docker' 'tmpfs              8124648         0   8124648       0% /dev/shm' > df-snapshot.txt","printf '%s\\n' 'Filesystem       Inodes   IUsed    IFree IUse% Mounted on' '/dev/nvme0n1p1  3276800  412339  2864461   13% /' '/dev/nvme1n1    6553600 6553600        0  100% /var' > df-inodes-snapshot.txt","printf '%s\\n' '               total        used        free      shared  buff/cache   available' 'Mem:           15890       11020         310         120        4560        4450' 'Swap:           2047        1800         247' > free-snapshot.txt","# P3: incident folder","mkdir -p incident","# P5: broken alert script (reads df -P output on stdin)","printf '%s\\n' '#!/bin/bash' '# Usage: df -P | disk-alert.sh [threshold]    (default threshold: 80)' '# Print ALERT for every filesystem with Use% >= threshold. Exit 1 if there was an alert, else exit 0.' 'LIMIT=$1' 'ALERTS=0' 'while read -r fs size used avail pct mount; do' '  if [ $pct -ge $LIMIT ]; then' '    echo \"ALERT $mount is at $pct\"' '    ALERTS=$((ALERTS + 1))' '  fi' 'done' '[ $ALERTS -gt 0 ] && exit 1' > disk-alert.sh","# P6: a practice copy of an fstab file (NOT your real /etc/fstab)","printf '%s\\n' '# <device>                                 <mount>   <type> <options>          <dump> <pass>' 'UUID=1f2e3d4c-aaaa-bbbb-cccc-123456789abc  /         ext4   defaults           0      1' 'UUID=9a8b7c6d-dddd-eeee-ffff-abcdefabcdef  /data     ext4   defaults,nofail    0      2' '/swapfile                                  none      swap   sw                 0      0' 'tmpfs                                      /tmp      tmpfs  defaults,size=2G   0      0' > fstab.copy","cd ~/bash-practice/day17"],"warmup":[{"q":"Write a crontab line that runs `/opt/backup.sh` every day at 02:30.","a":"`30 2 * * * /opt/backup.sh >> /var/log/backup.log 2>&1`","from_day":16},{"q":"How do you see the logs of the systemd service `nginx` from the last hour?","a":"`journalctl -u nginx --since \"1 hour ago\"`","from_day":16},{"q":"Which command finds the 10 biggest numbers, biggest first?","a":"`sort -rn | head -n 10`","from_day":12},{"q":"What does `kill -0 PID` do?","a":"It sends no signal; it only checks that the process exists (exit code 0).","from_day":15}],"problems":[{"id":"d17p01","title":"What is eating the disk? du and sort -h","type":"command","topic":"Disk","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The PyTorch training server's disk is 98% full and training has stopped. The user must find, in a few commands, which folders and files are the biggest, before deleting anything.","task":["Show the total size of `server` with `du -sh`.","Show the size of each folder directly inside `server`, smallest to biggest (`sort -h`).","Show the biggest folders two levels deep (`--max-depth=2`), only the last 4.","List files bigger than 5 MB with their sizes."],"hints":["`-s` = summary (one total), `-h` = human sizes (K, M, G).","`du -sh server/* | sort -h` puts the biggest at the bottom.","`find server -type f -size +5M -exec du -h {} + | sort -h`."],"solution":["du -sh server","echo \"=== per folder ===\"","du -sh server/* | sort -h","echo \"=== two levels, biggest 4 ===\"","du -h --max-depth=2 server | sort -h | tail -n 4","echo \"=== files over 5 MB ===\"","find server -type f -size +5M -exec du -h {} + | sort -h"],"explanation":[{"part":"du -sh DIR","meaning":"Disk usage, summary, human units."},{"part":"du -sh server/* | sort -h","meaning":"One line per folder, sorted by human size (K < M < G)."},{"part":"--max-depth=2","meaning":"Show folders down to 2 levels (on a real server: `du -xh --max-depth=1 / | sort -h`)."},{"part":"-x","meaning":"Stay on one filesystem: do not count `/proc` or other disks."},{"part":"find -size +5M -exec du -h {} +","meaning":"Find big files and show their size (Day 12)."}],"expected_output":"48M\tserver\n=== per folder ===\n8.0K\tserver/datasets\n5.1M\tserver/logs\n13M\tserver/cache\n31M\tserver/model-checkpoints\n=== two levels, biggest 4 ===\n13M\tserver/cache\n13M\tserver/cache/pip\n31M\tserver/model-checkpoints\n48M\tserver\n=== files over 5 MB ===\n10M\tserver/model-checkpoints/epoch-1.pt\n10M\tserver/model-checkpoints/epoch-2.pt\n10M\tserver/model-checkpoints/epoch-3.pt\n12M\tserver/cache/pip/torch.whl","expect_exit":0,"output_check":true,"output_note":"The setup created about 47 MB of real files. Run `rm -rf ~/bash-practice/day17` (Reset) when the day is done.","verified":true,"mistakes":["Running `du -sh /` as a normal user: hundreds of `Permission denied` lines. Use `sudo du -xh --max-depth=1 / 2>/dev/null | sort -h`.","Using `sort -n` on `du -h` output: `12M` and `4.0K` are sorted wrong. Use `sort -h`.","Deleting files under `/var/lib/docker` by hand. Use `docker system df` and `docker system prune` (Day 26)."],"interview_say":"When a disk is full I run `df -h` to see which filesystem, then `du -xh --max-depth=1 /path | sort -h` again and again to walk down to the biggest folder, and `find -size +1G` for big files.","try_yourself":"Run `du -sh ~/.cache 2>/dev/null` and `du -sh ~/bash-practice` on your WSL. Which is bigger?"},{"id":"d17p02","title":"df -h vs df -i: no space, or no inodes?","type":"command","topic":"Disk","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The app on `/var` fails with `No space left on device`, but `df -h` says `/var` is only 43% full. Every file also needs an inode (a small record with its owner, size and place). If millions of tiny files use all inodes, no new file can be created.","task":["Run `df -h /` and `df -i /` on your machine and read the columns.","From `df-snapshot.txt`, print every filesystem at 90% or more.","From `df-inodes-snapshot.txt`, print every filesystem with inode use at 90% or more.","Write down: which mount has a space problem, and which has an inode problem?"],"hints":["`df -h` = space in human units. `df -i` = inodes.","`$5+0` in awk turns `92%` into the number 92.","To find the folder with many files: `find /var -xdev -type f | cut -d/ -f2-3 | sort | uniq -c | sort -rn | head`."],"solution":["df -h / | tail -n 1 | awk '{print \"this machine: / is\", $5, \"full\"}'","df -i / | tail -n 1 | awk '{print \"this machine: / uses\", $5, \"of its inodes\"}'","echo \"=== space >= 90% (snapshot) ===\"","awk 'NR > 1 && $5+0 >= 90 {print $6, $5}' df-snapshot.txt","echo \"=== inodes >= 90% (snapshot) ===\"","awk 'NR > 1 && $5+0 >= 90 {print $6, $5}' df-inodes-snapshot.txt"],"explanation":[{"part":"df -h","meaning":"Size, Used, Avail, Use% per filesystem, in human units."},{"part":"df -i","meaning":"Inodes, IUsed, IFree, IUse% per filesystem."},{"part":"$5+0 >= 90","meaning":"Make awk read `92%` as the number 92."},{"part":"inode","meaning":"A record for one file. A filesystem has a fixed number. Full inodes = `No space left on device` even with free GB."}],"expected_output":"this machine: / is 24% full\nthis machine: / uses 2% of its inodes\n=== space >= 90% (snapshot) ===\n/ 92%\n/var/lib/docker 91%\n=== inodes >= 90% (snapshot) ===\n/var 100%","expect_exit":0,"output_check":false,"output_note":"The first two lines show the user's own machine, so the numbers are different. The snapshot lines are fixed.","verified":true,"mistakes":["Checking only `df -h`. Always check `df -i` too after `No space left on device`.","Deleting one big file to fix an inode problem. The fix is to delete many small files (old sessions, cache files, mail queue)."],"interview_say":"`No space left on device` can mean no free blocks or no free inodes. I check both `df -h` and `df -i`; for inodes I look for folders with millions of small files.","try_yourself":"Create 1000 empty files with `mkdir many && touch many/f{1..1000}` and compare `df -i .` before and after."},{"id":"d17p03","title":"Incident: disk full, but du finds nothing","type":"incident","topic":"Disk","minutes":14,"optional":false,"core":true,"workdir":"incident","situation":"The backend log grew to many GB. Someone ran `rm app.log` to free space. `df` still shows the disk as full, and `du` shows a tiny folder. The reason: the running app still has the deleted file open, so Linux cannot free the space yet.","task":["In `incident`, start a fake app that keeps `app.log` open and writes to it (see the solution, first lines).","Make the log big (20 MB) and check `du -sh .`.","Delete the file with `rm app.log`. Check `du -sh .` again.","Prove the file is still open: look at `/proc/<PID>/fd` and use `lsof`.","Free the space for real: stop (or restart) the app."],"hints":["A file's space is freed only when no name points to it AND no process has it open.","`ls -l /proc/PID/fd` shows `(deleted)` next to such files. `lsof +L1` lists open files with no name left.","Fix: restart the app, or empty the file through the open handle: `: > /proc/PID/fd/3`."],"solution":["bash -c 'exec 3>> app.log; while :; do echo \"log line\" >&3; sleep 0.1; done' &","APP=$!","sleep 0.3","head -c 20000000 /dev/zero >> app.log        # pretend the log is huge","du -sh .","rm app.log                                   # \"free\" the space","du -sh .                                     # du sees no file...","ls -l /proc/$APP/fd | grep -c '(deleted)'    # ...but the app still has it open","readlink /proc/$APP/fd/3","lsof -p $APP 2>/dev/null | grep -c '(deleted)'","kill $APP                                    # restart / stop the app","wait $APP 2>/dev/null","kill -0 $APP 2>/dev/null || echo \"app stopped: the kernel can free the space now\""],"explanation":[{"part":"exec 3>> app.log","meaning":"The fake app opens the file as file descriptor 3 and keeps it open."},{"part":"rm app.log","meaning":"Removes only the name. The data stays while a process has it open."},{"part":"du vs df","meaning":"`du` adds up files it can see by name. `df` asks the filesystem. A deleted-but-open file is counted by df only."},{"part":"/proc/PID/fd + (deleted)","meaning":"Each open file is a link here. Deleted ones are marked `(deleted)`."},{"part":"lsof","meaning":"List open files. `lsof +L1` = open files with 0 links (deleted). Often needs sudo for other users' processes."},{"part":"kill / restart","meaning":"When the process closes the file, the space is freed."}],"expected_output":"20M\t.\n4.0K\t.\n1\n/home/wicky/bash-practice/day17/incident/app.log (deleted)\n1\napp stopped: the kernel can free the space now","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Deleting a live log with `rm` to free space. Empty it instead: `: > app.log` (or `truncate -s 0 app.log`). The app keeps writing, and the space is freed.","Rebooting the server for this. Restarting only the app that holds the file is enough."],"interview_say":"If `df` says full but `du` cannot find the files, a process is probably holding a deleted file open. I find it with `lsof +L1`, then restart that service or truncate the file through `/proc/PID/fd`.","try_yourself":"Repeat the steps, but instead of `kill`, run `: > /proc/$APP/fd/3`. Is the app still running? Is the space freed?"},{"id":"d17p04","title":"Memory and load: free, uptime, nproc, vmstat","type":"command","topic":"Disk","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The API feels slow. The user checks the numbers an interviewer asks about: how much memory is really available, how busy the CPUs are (load average), and whether the server is swapping.","task":["Run `free -m`. Then read `free-snapshot.txt`: is that server short of memory?","Print the available memory in MB from `/proc/meminfo`.","Print the load average and the number of CPUs (`uptime`, `nproc`).","Run `vmstat 1 3` and look at the `si`/`so` (swap) and `wa` (I/O wait) columns."],"hints":["Look at `available`, not `free`. Linux uses free RAM as disk cache (`buff/cache`) and gives it back when needed.","Load average = 3 numbers: last 1, 5 and 15 minutes. Compare them with `nproc`.","Swap used + `si`/`so` not zero = the server is swapping, which is very slow."],"solution":["free -m","echo \"=== snapshot from the slow server ===\"","awk '/^Mem:/ {printf \"available: %d MB of %d MB (%.0f%%)\\n\", $7, $2, $7 * 100 / $2}","     /^Swap:/ {printf \"swap used: %d MB of %d MB\\n\", $3, $2}' free-snapshot.txt","echo \"=== this machine ===\"","awk '/MemAvailable/ {printf \"MemAvailable: %d MB\\n\", $2 / 1024}' /proc/meminfo","echo \"load average: $(cut -d' ' -f1-3 /proc/loadavg), CPUs: $(nproc)\"","vmstat 1 3"],"explanation":[{"part":"free -m","meaning":"Memory in MB: total, used, free, shared, buff/cache, available."},{"part":"available","meaning":"How much RAM new programs can get without swapping. The number that matters."},{"part":"buff/cache","meaning":"Disk cache. Not wasted: it is released when programs need RAM."},{"part":"load average","meaning":"Average number of processes running or waiting. Load 4 on 4 CPUs = full; 8 on 4 CPUs = overloaded."},{"part":"vmstat 1 3","meaning":"3 samples, 1 second apart. `r` waiting to run, `si/so` swap in/out, `wa` waiting for disk."}],"expected_output":"               total        used        free      shared  buff/cache   available\nMem:           16093         526       15193          14         598       15566\nSwap:              0           0           0\n=== snapshot from the slow server ===\navailable: 4450 MB of 15890 MB (28%)\nswap used: 1800 MB of 2047 MB\n=== this machine ===\nMemAvailable: 15566 MB\nload average: 0.13 0.06 0.01, CPUs: 4\nprocs -----------memory---------- ---swap-- -----io---- -system-- -------cpu-------\n r  b   swpd   free   buff  cache   si   so    bi    bo   in   cs us sy id wa st gu\n 0  0      0 15558396   3316 609264    0    0   267    37  340    0  1  0 98  0  0  0\n 0  0      0 15558244   3316 609704    0    0     0     0  277  253  0  0 99  0  0  0\n 0  0      0 15558244   3316 609704    0    0     0     0  186  174  0  0 100  0  0  0","expect_exit":0,"output_check":false,"output_note":"The memory, load and vmstat numbers on the user's machine are different. Only the snapshot lines are fixed.","verified":true,"mistakes":["Panicking because `free` is small. With 4.5 GB `available`, the server is fine; the cache used the rest.","Comparing load average with 1 on a multi-core server. Always divide by `nproc`."],"interview_say":"I look at `available` in `free -m`, not `free`. The load average means something only compared with the CPU count from `nproc`. If swap is used and `vmstat` shows `si`/`so`, the server is short of memory.","try_yourself":"Run `top`, press `1` to see each CPU, and `M` to sort by memory. Quit with `q`."},{"id":"d17p05","title":"Find the bug: the disk alert script","type":"fix-bug","topic":"Disk","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`disk-alert.sh` reads `df -P` output and should alert for full filesystems. It is tested with the saved snapshot. It prints errors, and it exits with 1 even when nothing is full, so the monitoring always shows red.","task":["Run `bash disk-alert.sh 90 < df-snapshot.txt` and `bash disk-alert.sh < df-snapshot.txt`. Read the errors.","Run `bash disk-alert.sh 99 < df-snapshot.txt; echo $?`. Nothing is at 99%, but what is the exit code?","Find 4 bugs: the header line, the `%` sign, the missing default, and the last line.","Fix them and test with 90 and 99 again."],"hints":["The header has `Capacity` in the pct column: skip lines where pct is not a number.","Remove the `%`: `pct=${pct%\\%}`. Default: `LIMIT=${1:-80}`.","`[ 0 -gt 0 ] && exit 1` is false, so the script ends with that false test: exit code 1. Add `exit 0` at the end, or use `if`."],"solution":["bash disk-alert.sh 90 < df-snapshot.txt","bash disk-alert.sh 99 < df-snapshot.txt; echo \"exit code with 99: $?\"","cat > disk-alert.sh <<'EOF'","#!/bin/bash","# Usage: df -P | disk-alert.sh [threshold]    (default threshold: 80)","# Print ALERT for every filesystem with Use% >= threshold. Exit 1 if there was an alert, else exit 0.","LIMIT=${1:-80}","ALERTS=0","while read -r fs size used avail pct mount; do","  pct=${pct%\\%}                              # 92% -> 92","  [[ $pct =~ ^[0-9]+$ ]] || continue         # skip the header line","  if [ \"$pct\" -ge \"$LIMIT\" ]; then","    echo \"ALERT $mount is at $pct%\"","    ALERTS=$((ALERTS + 1))","  fi","done","if [ \"$ALERTS\" -gt 0 ]; then exit 1; fi","exit 0","EOF","echo \"--- fixed ---\"","bash disk-alert.sh 90 < df-snapshot.txt; echo \"exit code with 90: $?\"","bash disk-alert.sh 99 < df-snapshot.txt; echo \"exit code with 99: $?\""],"explanation":[{"part":"header line","meaning":"Bug 1: `pct` was `Capacity`: `integer expression expected`. Skip non-numbers."},{"part":"${pct%\\%}","meaning":"Bug 2: remove the `%` at the end so the test gets a number."},{"part":"${1:-80}","meaning":"Bug 3: without a threshold, `[ 92 -ge ]` failed."},{"part":"exit 0 at the end","meaning":"Bug 4: a script's exit code is the last command's. The false `[ ... ] && exit 1` made it 1."},{"part":"< df-snapshot.txt","meaning":"Reading from stdin makes the script easy to test with saved data. Live use: `df -P | ./disk-alert.sh 90`."}],"expected_output":"disk-alert.sh: line 7: [: Capacity: integer expression expected\ndisk-alert.sh: line 7: [: 92%: integer expression expected\ndisk-alert.sh: line 7: [: 43%: integer expression expected\ndisk-alert.sh: line 7: [: 91%: integer expression expected\ndisk-alert.sh: line 7: [: 0%: integer expression expected\ndisk-alert.sh: line 7: [: Capacity: integer expression expected\ndisk-alert.sh: line 7: [: 92%: integer expression expected\ndisk-alert.sh: line 7: [: 43%: integer expression expected\ndisk-alert.sh: line 7: [: 91%: integer expression expected\ndisk-alert.sh: line 7: [: 0%: integer expression expected\nexit code with 99: 1\n--- fixed ---\nALERT / is at 92%\nALERT /var/lib/docker is at 91%\nexit code with 90: 1\nexit code with 99: 0","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`cmd && exit 1` as the last line of a script: when `cmd` is false, the script exits 1. Use `if ...; then exit 1; fi`.","Using `df -h` in scripts: units change (G, T) and long device names can wrap lines. Use `df -P` (POSIX format)."],"checks":[{"run":"bash disk-alert.sh 90 < df-snapshot.txt","expect":"integer expression expected"}],"interview_say":"In monitoring scripts I parse `df -P`, skip the header, strip the percent sign, give thresholds defaults, and make sure the exit code is 0 when everything is fine. I test with saved output on stdin.","try_yourself":"Run the fixed script on your real machine: `df -P | bash disk-alert.sh 1`. Every filesystem should alert."},{"id":"d17p06","title":"lsblk, findmnt and /etc/fstab (read only)","type":"concept","topic":"Disk","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A new EBS data disk was attached to the server and must be mounted at `/data` after every reboot. The user reads the disks with `lsblk`, the mounts with `findmnt`, and the fstab format with a practice copy. The real `/etc/fstab` is NOT changed: a wrong line can stop the server from booting.","task":["Run `lsblk` and `findmnt -n -o SOURCE,FSTYPE /` on your machine (read only).","Read `fstab.copy`. Print each line without comments as `mount point -> type (options)`.","Find the line that will not stop the boot if the disk is missing (`nofail`)."],"hints":["fstab columns: device, mount point, type, options, dump, pass.","`grep -v '^#' fstab.copy | awk '{print $2, \"->\", $3, \"(\" $4 \")\"}'`","On a real server, test a new fstab line with `sudo mount -a` before rebooting."],"solution":["lsblk -d -o NAME,SIZE,TYPE | head -n 3","findmnt -n -o FSTYPE /","echo \"=== fstab.copy ===\"","g
