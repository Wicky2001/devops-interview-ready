es through).","Count requests per day using the date in field 4."],"hints":["`zcat -f` = like `cat` for normal files and `zcat` for `.gz` files.","The day is `substr($4, 2, 11)`: `20/Oct/2026`.","`zgrep` searches compressed files directly."],"solution":["echo \"today: $(wc -l < access.log) lines, yesterday: $(zcat access.log.1.gz | wc -l) lines\"","zcat -f access.log access.log.1.gz | awk '{ print substr($4, 2, 11) }' | sort | uniq -c","echo \"5xx yesterday: $(zgrep -cE '\" 5[0-9]{2} ' access.log.1.gz)\""],"explanation":[{"part":"zcat -f","meaning":"Read compressed and plain files as one stream."},{"part":"substr($4, 2, 11)","meaning":"Skip the `[` and take the date part."},{"part":"zgrep -c","meaning":"Count matching lines inside a `.gz` file."}],"expected_output":"today: 122 lines, yesterday: 30 lines\n     30 19/Oct/2026\n    122 20/Oct/2026\n5xx yesterday: 4","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Unpacking big rotated logs on a nearly full disk with `gunzip`: it needs space for the full file. Stream with `zcat` instead."],"interview_say":"For reports over rotated logs I stream all files with `zcat -f access.log*` into the same pipeline, so I never unpack them on disk.","try_yourself":"Run your `analyze.sh` from P3 on both days: `bash analyze.sh <(zcat -f access.log access.log.1.gz)`."}],"interview":[{"q":"How would you find the 10 IPs with the most requests in an Nginx log?","a":"`awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -n 10`.","topic":"Text"},{"q":"How do you compute the 5xx error rate from an access log?","a":"Count lines with status 500-599 and divide by all lines, in awk: `awk -F'\"' '{split($3,a,\" \"); if (a[1]>=500) e++} END {printf \"%.2f%%\\n\", e*100/NR}' access.log`.","topic":"Text"},{"q":"Why can `awk '{print $9}'` give wrong status codes?","a":"Fields are split at spaces. A broken request like `\"-\"` changes the number of fields, so `$9` is not the status any more. Splitting at quotes is more robust.","topic":"Text"},{"q":"How do you analyze yesterday's rotated `.gz` logs too?","a":"Stream them: `zcat -f access.log access.log.1.gz | ...`, or `zgrep` for searches. No unpacking needed.","topic":"Text"},{"q":"How can a report script trigger an alert?","a":"It exits with a non-zero code when a threshold is passed (and prints the alert to stderr). Cron, CI or a monitoring agent reacts to the exit code.","topic":"Scripting"}],"recap":[{"cmd":"awk -F'\"'","meaning":"Split combined logs at quotes","example":"awk -F'\"' '{print $2}' access.log","topic":"Text"},{"cmd":"split($3, a, \" \")","meaning":"awk: split a field into an array","example":"awk -F'\"' '{split($3,a,\" \"); print a[1]}' access.log","topic":"Text"},{"cmd":"substr($4, 14, 8)","meaning":"Time HH:MM:SS from the log time field","example":"awk '{print substr($4,14,8)}' access.log","topic":"Text"},{"cmd":"awk 'BEGIN { exit !(a > b) }'","meaning":"Compare decimals in a script","example":"awk -v r=8.2 -v t=5 'BEGIN{exit !(r>t)}'","topic":"Text"},{"cmd":"zcat -f / zgrep","meaning":"Read or search plain and gz logs","example":"zcat -f access.log* | wc -l","topic":"Text"},{"cmd":"shift $((OPTIND - 1))","meaning":"Remove parsed options","example":"while getopts ...; done; shift $((OPTIND-1))","topic":"Scripting"}],"coverage":[{"item":"Parse a sample Nginx access log","problems":["d23p01","d23p03"]},{"item":"Status code counts","problems":["d23p01","d23p03"]},{"item":"Top IPs","problems":["d23p02","d23p05"]},{"item":"Top URLs","problems":["d23p02","d23p05"]},{"item":"5xx error rate","problems":["d23p01","d23p05"]},{"item":"Clean text report","problems":["d23p05"]},{"item":"Time window, user agents, rotated logs","problems":["d23p04","d23p06","d23p07"]}],"reset":"rm -rf ~/bash-practice/day23"},{"day":24,"week":4,"title":"Project: backup and rotation","goal":"Build a backup tool that makes timestamped archives with checksums, keeps only the last N, proves that restore works, and fails loudly.","minutes":90,"setup":["mkdir -p ~/bash-practice/day24 && cd ~/bash-practice/day24","# the data to back up: a database dump and uploaded files","mkdir -p data/uploads","printf '%s\\n' '-- todo database dump' 'INSERT INTO todos VALUES (1, '\"'\"'buy milk'\"'\"', false);' 'INSERT INTO todos VALUES (2, '\"'\"'deploy v2'\"'\"', true);' > data/todo-db.sql","head -c 4096 /dev/zero > data/uploads/avatar.png","# P2: nine old backups (11 to 19 October)","mkdir -p rotation/backups","for d in 11 12 13 14 15 16 17 18 19; do","  f=rotation/backups/todo-db-202610$d-0230.tar.gz","  tar -czf \"$f\" -C data .","  (cd rotation/backups && sha256sum \"${f##*/}\" > \"${f##*/}.sha256\")","done","# P3: the latest backup and its checksum","mkdir -p latest","tar -czf latest/todo-db-20261019-0230.tar.gz -C data .","(cd latest && sha256sum todo-db-20261019-0230.tar.gz > todo-db-20261019-0230.tar.gz.sha256)","# P4: backups restored from S3 (file times are in the WRONG order) and a broken rotate script","printf '%s\\n' '#!/bin/bash' '# (re)build rotation2/: 6 backups; the OLDEST name gets the NEWEST file time' 'rm -rf rotation2 && mkdir -p rotation2' 'for d in 11 12 13 14 15 16; do' '  f=rotation2/todo-db-202610$d-0230.tar.gz' '  tar -czf \"$f\" -C data .' '  (cd rotation2 && sha256sum \"${f##*/}\" > \"${f##*/}.sha256\")' '  touch -d \"2026-10-20 12:$((30 - d))\" \"$f\"' 'done' > make-rotation2.sh","bash make-rotation2.sh","printf '%s\\n' '#!/bin/bash' '# Keep the 3 NEWEST backups (newest = latest date in the file name).' '# Delete the older backups AND their .sha256 files. Safe to run again.' 'cd rotation2 || exit 1' 'KEEP=3' 'ls -t todo-db-*.tar.gz | tail -n +$KEEP | xargs rm -v' > rotate.sh","# P6: a mock aws CLI (prints what it would do, does not upload)","mkdir -p mockbin","printf '%s\\n' '#!/bin/bash' 'echo \"[mock aws] aws $*\"' > mockbin/aws","chmod +x mockbin/aws","cd ~/bash-practice/day24"],"warmup":[{"q":"How do you split an Nginx combined log line safely in awk?","a":"At the double quotes: `awk -F'\"'`. The request is field 2, status and bytes are in field 3.","from_day":23},{"q":"How do you check a file against a saved checksum?","a":"`sha256sum -c file.sha256`","from_day":20},{"q":"How do you stop two cron runs of a script from overlapping?","a":"`flock`: `exec 9>/tmp/job.lock; flock -n 9 || exit 1`.","from_day":22},{"q":"Why use `mktemp -d` for a restore test?","a":"It gives a new, private, empty folder every run, so old files cannot hide a broken backup.","from_day":13}],"problems":[{"id":"d24p01","title":"A timestamped backup with a checksum","type":"command","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"Every night at 02:30 the to-do database dump and uploads must be packed into one archive with the date in the name, plus a checksum file to detect damage later. For this exercise the time is fixed, so everyone gets the same names.","task":["Set `STAMP=20261020-0230` (in real use: `STAMP=$(date +%Y%m%d-%H%M)`).","Pack the contents of `data` into `backups/todo-db-$STAMP.tar.gz` (use `-C data .`).","Write the checksum file next to it, from inside the `backups` folder.","Check the archive with `sha256sum -c` and list its contents."],"hints":["`tar -czf ARCHIVE -C data .` stores the files without the `data/` prefix.","`(cd backups && sha256sum NAME > NAME.sha256)`: the checksum file then has only the file name, not a path.","Sortable names: `todo-db-YYYYmmdd-HHMM.tar.gz`."],"solution":["STAMP=20261020-0230                     # real use: STAMP=$(date +%Y%m%d-%H%M)","NAME=todo-db-$STAMP.tar.gz","mkdir -p backups","tar -czf \"backups/$NAME\" -C data .","(cd backups && sha256sum \"$NAME\" > \"$NAME.sha256\")","ls backups","(cd backups && sha256sum -c \"$NAME.sha256\")","tar -tzf \"backups/$NAME\" | sort"],"explanation":[{"part":"STAMP","meaning":"Date and time in the name, largest unit first, so names sort by time."},{"part":"-C data .","meaning":"Go into `data` and pack `.`: paths inside start with `./`."},{"part":"(cd backups && ...)","meaning":"Subshell: the checksum file stores only the file name, so `sha256sum -c` works wherever the folder is copied."},{"part":"sha256sum -c","meaning":"Recompute and compare: `OK` means the archive is not damaged."}],"expected_output":"todo-db-20261020-0230.tar.gz  todo-db-20261020-0230.tar.gz.sha256\ntodo-db-20261020-0230.tar.gz: OK\n./\n./todo-db.sql\n./uploads/\n./uploads/avatar.png","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `$(date)` in a file name: `Tue Oct 20 02:30:00 +0530 2026` has spaces and colons.","Creating the checksum with a path (`sha256sum backups/x.tar.gz`): after the files are moved, `sha256sum -c` cannot find them."],"interview_say":"My backups use sortable timestamped names like `app-20261020-0230.tar.gz` and a `.sha256` next to each archive, so I can verify them before a restore.","try_yourself":"Use `tar -czf - -C data . | tee backups/x.tar.gz | sha256sum` to pack and hash in one pass. Compare the hash with `sha256sum backups/x.tar.gz`."},{"id":"d24p02","title":"Keep only the last N backups","type":"command","topic":"Scripting","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The backup disk is filling up: there are 9 nightly backups and the policy is to keep the last 3. Because the names contain sortable dates, the user sorts by name (not by file time) and deletes everything except the newest 3, with their checksum files.","task":["In `rotation/backups`, list the archives sorted by name.","Dry run: show which ones would be deleted with `head -n -3`.","Delete them and their `.sha256` files, printing each removed file.","List the folder again. Run the delete step once more: nothing must happen."],"hints":["`ls -1 todo-db-*.tar.gz | sort` = oldest first, because the date is in the name.","`head -n -3` (GNU) prints all lines except the last 3.","Loop with `while IFS= read -r f; do rm -v -- \"$f\" \"$f.sha256\"; done`."],"solution":["cd rotation/backups","KEEP=3","echo \"=== all backups (oldest first) ===\"","ls -1 todo-db-*.tar.gz | sort","echo \"=== would delete ===\"","ls -1 todo-db-*.tar.gz | sort | head -n -\"$KEEP\"","ls -1 todo-db-*.tar.gz | sort | head -n -\"$KEEP\" | while IFS= read -r f; do","  rm -v -- \"$f\" \"$f.sha256\"","done","echo \"=== left ===\"","ls -1","echo \"=== second run ===\"","ls -1 todo-db-*.tar.gz | sort | head -n -\"$KEEP\" | wc -l"],"explanation":[{"part":"sort by name","meaning":"Dates in the name make the order reliable, even after files are copied (copies change the file times)."},{"part":"head -n -3","meaning":"Everything except the last 3 lines = everything except the 3 newest."},{"part":"rm -v -- \"$f\" \"$f.sha256\"","meaning":"Remove the archive and its checksum; `--` ends options, so names starting with `-` are safe."},{"part":"second run: 0","meaning":"Idempotent: when only 3 are left, nothing more is deleted (Day 22)."},{"part":"alternative","meaning":"`find backups -name '*.tar.gz' -mtime +7 -delete` keeps by age instead of by count."}],"expected_output":"=== all backups (oldest first) ===\ntodo-db-20261011-0230.tar.gz\ntodo-db-20261012-0230.tar.gz\ntodo-db-20261013-0230.tar.gz\ntodo-db-20261014-0230.tar.gz\ntodo-db-20261015-0230.tar.gz\ntodo-db-20261016-0230.tar.gz\ntodo-db-20261017-0230.tar.gz\ntodo-db-20261018-0230.tar.gz\ntodo-db-20261019-0230.tar.gz\n=== would delete ===\ntodo-db-20261011-0230.tar.gz\ntodo-db-20261012-0230.tar.gz\ntodo-db-20261013-0230.tar.gz\ntodo-db-20261014-0230.tar.gz\ntodo-db-20261015-0230.tar.gz\ntodo-db-20261016-0230.tar.gz\nremoved 'todo-db-20261011-0230.tar.gz'\nremoved 'todo-db-20261011-0230.tar.gz.sha256'\nremoved 'todo-db-20261012-0230.tar.gz'\nremoved 'todo-db-20261012-0230.tar.gz.sha256'\nremoved 'todo-db-20261013-0230.tar.gz'\nremoved 'todo-db-20261013-0230.tar.gz.sha256'\nremoved 'todo-db-20261014-0230.tar.gz'\nremoved 'todo-db-20261014-0230.tar.gz.sha256'\nremoved 'todo-db-20261015-0230.tar.gz'\nremoved 'todo-db-20261015-0230.tar.gz.sha256'\nremoved 'todo-db-20261016-0230.tar.gz'\nremoved 'todo-db-20261016-0230.tar.gz.sha256'\n=== left ===\ntodo-db-20261017-0230.tar.gz\ntodo-db-20261017-0230.tar.gz.sha256\ntodo-db-20261018-0230.tar.gz\ntodo-db-20261018-0230.tar.gz.sha256\ntodo-db-20261019-0230.tar.gz\ntodo-db-20261019-0230.tar.gz.sha256\n=== second run ===\n0","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`ls -t` (by file time) after a restore from S3 or a copy: all files may have new times, so the wrong files are deleted (P4).","`tail -n +3` to keep 3 files: it starts at line 3, so it keeps only 2. Off-by-one.","Forgetting the `.sha256` files: they pile up forever."],"interview_say":"I keep the last N backups by sorting the timestamped names and deleting all but the newest N with `head -n -N`. I do a dry run first, delete the checksum files too, and make sure a second run deletes nothing.","try_yourself":"Change KEEP to 5 (run Reset and setup first). Which dates are deleted now?"},{"id":"d24p03","title":"Prove that restore works","type":"script","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A backup that cannot be restored is worthless. Every week the team restores the latest backup into a temp folder, verifies the checksum, and compares the files with the live data. The test must clean up after itself, and must fail if the archive is damaged.","task":["Write `restore-test.sh ARCHIVE DATA_DIR` with `set -euo pipefail`.","Check the checksum first, then extract into `$(mktemp -d)` with `trap` cleanup.","Compare with `diff -r` and print `restore test PASSED` or fail.","Run it on `latest/todo-db-20261019-0230.tar.gz`. Then damage a copy of the archive and run it again."],"hints":["`(cd \"$(dirname \"$ARCHIVE\")\" && sha256sum -c --quiet \"$(basename \"$ARCHIVE\").sha256\")`","`trap 'rm -rf \"$WORK\"' EXIT` right after `WORK=$(mktemp -d)`.","Damage a copy: `cp` archive and checksum, then `printf 'x' >> copy.tar.gz`."],"solution":["cat > restore-test.sh <<'EOF'","#!/bin/bash","# Usage: restore-test.sh ARCHIVE DATA_DIR","set -euo pipefail","ARCHIVE=${1:?archive}; DATA=${2:?data dir}","DIR=$(dirname \"$ARCHIVE\"); FILE=$(basename \"$ARCHIVE\")","if ! (cd \"$DIR\" && sha256sum -c --quiet \"$FILE.sha256\"); then","  echo \"restore test FAILED: checksum does not match\" >&2; exit 1","fi","WORK=$(mktemp -d)","trap 'rm -rf \"$WORK\"' EXIT","tar -xzf \"$ARCHIVE\" -C \"$WORK\"","diff -r \"$DATA\" \"$WORK\" && echo \"restore test PASSED: $FILE matches $DATA\"","EOF","bash restore-test.sh latest/todo-db-20261019-0230.tar.gz data; echo \"exit code: $?\"","mkdir -p broken","cp latest/todo-db-20261019-0230.tar.gz* broken/","printf 'x' >> broken/todo-db-20261019-0230.tar.gz        # damage the copy","bash restore-test.sh broken/todo-db-20261019-0230.tar.gz data; echo \"exit code: $?\""],"explanation":[{"part":"checksum first","meaning":"Do not even extract a damaged archive."},{"part":"sha256sum -c --quiet","meaning":"Print only failures."},{"part":"mktemp -d + trap EXIT","meaning":"A clean folder every time, always removed (Day 22)."},{"part":"diff -r","meaning":"Compare every file and folder; exit 1 on any difference."},{"part":"FAILED + exit 1","meaning":"The weekly job goes red, so someone looks at it."}],"expected_output":"restore test PASSED: todo-db-20261019-0230.tar.gz matches data\nexit code: 0\ntodo-db-20261019-0230.tar.gz: FAILED\nsha256sum: WARNING: 1 computed checksum did NOT match\nrestore test FAILED: checksum does not match\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Restoring into the live data folder to \"test\". A broken backup then also breaks production. Always restore into a temp folder.","Testing only that `tar -tzf` works. The files can be complete but old or wrong; compare with `diff -r` (or check row counts for databases)."],"interview_say":"I test restores regularly: verify the checksum, extract into a temp folder from mktemp, compare with diff, and fail the job if anything is different.","try_yourself":"Change one line in `data/todo-db.sql` and run the restore test again. What does diff show?"},{"id":"d24p04","title":"Find the bug: the rotation deleted the wrong backups","type":"fix-bug","topic":"Scripting","minutes":14,"optional":false,"core":false,"workdir":".","situation":"After restoring the backup folder from S3, the team ran `rotate.sh`. It deleted the NEWEST backups and kept old ones, it left the checksum files behind, and the second run printed an error. Policy: keep the 3 newest by date in the name.","task":["Look at the file times: `ls -lt --time-style=+%H:%M rotation2/*.tar.gz`. Compare with the dates in the names.","Run `bash rotate.sh`, then `ls rotation2`. Which backups survived? Run it a second time.","Find 4 bugs: sorting by time, the off-by-one, the checksum files, and `xargs` with no input.","Rebuild the test backups with `bash make-rotation2.sh`. Fix the script, run it twice, and check the result."],"hints":["`ls -t` sorts by file time, which changed during the restore. Sort the names instead.","To keep 3 with `tail`, the command must be `tail -n +4`. Easier: `head -n -3` on the oldest-first list.","`xargs -r` (no run if empty) or a `while read` loop."],"solution":["ls -lt --time-style=+%H:%M rotation2/*.tar.gz | awk '{print $6, $7}'","bash rotate.sh","echo \"--- left after the broken run ---\"","ls rotation2 | grep -c sha256; ls rotation2/*.tar.gz","echo \"--- second broken run ---\"","bash rotate.sh","bash make-rotation2.sh                 # rebuild the 6 test backups","cat > rotate.sh <<'EOF'","#!/bin/bash","# Keep the 3 NEWEST backups (newest = latest date in the file name).","# Delete the older backups AND their .sha256 files. Safe to run again.","set -euo pipefail","cd rotation2 || exit 1","KEEP=3","ls -1 todo-db-*.tar.gz | sort | head -n -\"$KEEP\" | while IFS= read -r f; do","  rm -v -- \"$f\" \"$f.sha256\"","done","EOF","echo \"--- fixed, first run ---\"","bash rotate.sh","echo \"--- fixed, second run ---\"","bash rotate.sh; echo \"exit code: $?\"","ls rotation2"],"explanation":[{"part":"ls -t","meaning":"Bug 1: after the S3 restore, the oldest backup had the newest file time, so `ls -t` put it first."},{"part":"tail -n +$KEEP","meaning":"Bug 2: `tail -n +3` starts at line 3, so only 2 were kept."},{"part":".sha256 left","meaning":"Bug 3: the checksum files of deleted backups stayed."},{"part":"rm: missing operand","meaning":"Bug 4: with nothing to delete, `xargs rm` ran `rm` with no file. Use `xargs -r` or `while read`."},{"part":"bash make-rotation2.sh","meaning":"Rebuild the 6 test backups between the broken and the fixed run (the setup made this helper)."}],"expected_output":"12:19 rotation2/todo-db-20261011-0230.tar.gz\n12:18 rotation2/todo-db-20261012-0230.tar.gz\n12:17 rotation2/todo-db-20261013-0230.tar.gz\n12:16 rotation2/todo-db-20261014-0230.tar.gz\n12:15 rotation2/todo-db-20261015-0230.tar.gz\n12:14 rotation2/todo-db-20261016-0230.tar.gz\nremoved 'todo-db-20261013-0230.tar.gz'\nremoved 'todo-db-20261014-0230.tar.gz'\nremoved 'todo-db-20261015-0230.tar.gz'\nremoved 'todo-db-20261016-0230.tar.gz'\n--- left after the broken run ---\n6\nrotation2/todo-db-20261011-0230.tar.gz\trotation2/todo-db-20261012-0230.tar.gz\n--- second broken run ---\nrm: missing operand\nTry 'rm --help' for more information.\n--- fixed, first run ---\nremoved 'todo-db-20261011-0230.tar.gz'\nremoved 'todo-db-20261011-0230.tar.gz.sha256'\nremoved 'todo-db-20261012-0230.tar.gz'\nremoved 'todo-db-20261012-0230.tar.gz.sha256'\nremoved 'todo-db-20261013-0230.tar.gz'\nremoved 'todo-db-20261013-0230.tar.gz.sha256'\n--- fixed, second run ---\nexit code: 0\ntodo-db-20261014-0230.tar.gz\t     todo-db-20261015-0230.tar.gz.sha256\ntodo-db-20261014-0230.tar.gz.sha256  todo-db-20261016-0230.tar.gz\ntodo-db-20261015-0230.tar.gz\t     todo-db-20261016-0230.tar.gz.sha256","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Testing rotation only on a fresh folder, where file times match the names. Test with copied or restored files too.","Running a new rotation script on the real backup folder first. Test on a copy, with a dry run."],"checks":[{"run":"bash rotate.sh > /dev/null; bash rotate.sh","expect":"rm: missing operand"}],"interview_say":"For rotation I sort by the timestamp in the file name, not by file time, keep N with `head -n -N`, delete checksums too, and use `xargs -r` or a while loop so an empty list is not an error.","try_yourself":"Add a `--dry-run` option to the fixed script that prints `would delete FILE` instead of deleting."},{"id":"d24p05","title":"Production-ready backup.sh","type":"script","topic":"Scripting","minutes":14,"optional":false,"core":false,"workdir":".","situation":"Put it all together in one tool for cron: `backup.sh -s SRC -d DEST [-k KEEP]`. It must stop on any error with a clear message, never run twice at once, keep the last KEEP backups, and print the crontab line to install it.","task":["Options with getopts; `set -euo pipefail`; a `usage` function (exit 2).","Check that SRC is a folder; create DEST if needed; take a lock with `flock -n`.","Backup + checksum + rotation (from P1 and P2). Log each step with a time.","`trap` on ERR: print `BACKUP FAILED` with the line number.","Run 4 times with different `STAMP` values and `-k 2`, then once with a missing source."],"hints":["`STAMP=${STAMP:-$(date +%Y%m%d-%H%M)}` lets tests set the time.","`trap 'echo \"BACKUP FAILED at line $LINENO\" >&2' ERR`","Crontab line: `30 2 * * * /path/backup.sh -s /srv/data -d /backups -k 7 >> /var/log/backup.log 2>&1`."],"solution":["cat > backup.sh <<'EOF'","#!/bin/bash","# Usage: backup.sh -s SRC -d DEST [-k KEEP]","set -euo pipefail","trap 'echo \"BACKUP FAILED at line $LINENO\" >&2' ERR","usage() { echo \"usage: backup.sh -s SRC -d DEST [-k KEEP]\" >&2; exit 2; }","log() { echo \"[backup] $*\"; }","SRC=\"\"; DEST=\"\"; KEEP=7","while getopts \"s:d:k:\" opt; do","  case $opt in s) SRC=$OPTARG ;; d) DEST=$OPTARG ;; k) KEEP=$OPTARG ;; *) usage ;; esac","done","[ -n \"$SRC\" ] && [ -n \"$DEST\" ] || usage","[ -d \"$SRC\" ] || { echo \"error: source $SRC is not a folder\" >&2; exit 1; }","mkdir -p \"$DEST\"","exec 9> \"$DEST/.backup.lock\"","flock -n 9 || { echo \"error: another backup is running\" >&2; exit 1; }","STAMP=${STAMP:-$(date +%Y%m%d-%H%M)}","NAME=$(basename \"$SRC\")-$STAMP.tar.gz","tar -czf \"$DEST/$NAME\" -C \"$SRC\" .","(cd \"$DEST\" && sha256sum \"$NAME\" > \"$NAME.sha256\")","log \"created $NAME\"","ls -1 \"$DEST\"/*.tar.gz | sort | head -n -\"$KEEP\" | while IFS= read -r f; do","  rm -f -- \"$f\" \"$f.sha256\"; log \"removed old $(basename \"$f\")\"","done","log \"done, $(ls -1 \"$DEST\"/*.tar.gz | wc -l) backups kept\"","EOF","for s in 20261017-0230 20261018-0230 20261019-0230 20261020-0230; do","  STAMP=$s bash backup.sh -s data -d nightly -k 2","done","ls nightly","bash backup.sh -s nosuchdir -d nightly; echo \"exit code: $?\"","bash backup.sh -s data; echo \"exit code: $?\"","echo \"crontab: 30 2 * * * $HOME/bash-practice/day24/backup.sh -s /srv/todo/data -d /backups/todo -k 7 >> /var/log/todo-backup.log 2>&1\""],"explanation":[{"part":"trap ... ERR","meaning":"Runs when a command fails under `set -e`; `$LINENO` shows where."},{"part":"usage → exit 2","meaning":"Wrong options are a usage error, different from a backup failure (exit 1)."},{"part":"exec 9> ...; flock -n 9","meaning":"Lock file inside DEST: two backups of the same target never overlap (Day 22)."},{"part":"STAMP=${STAMP:-$(date ...)}","meaning":"Real time in production, fixed time in tests."},{"part":"rotation with head -n -KEEP","meaning":"Same safe rotation as P2."},{"part":">> log 2>&1 in cron","meaning":"Keep stdout and errors in a log file (Day 16)."}],"expected_output":"[backup] created data-20261017-0230.tar.gz\n[backup] done, 1 backups kept\n[backup] created data-20261018-0230.tar.gz\n[backup] done, 2 backups kept\n[backup] created data-20261019-0230.tar.gz\n[backup] removed old data-20261017-0230.tar.gz\n[backup] done, 2 backups kept\n[backup] created data-20261020-0230.tar.gz\n[backup] removed old data-20261018-0230.tar.gz\n[backup] done, 2 backups kept\ndata-20261019-0230.tar.gz\t  data-20261020-0230.tar.gz\ndata-20261019-0230.tar.gz.sha256  data-20261020-0230.tar.gz.sha256\nerror: source nosuchdir is not a folder\nexit code: 1\nusage: backup.sh -s SRC -d DEST [-k KEEP]\nexit code: 2\ncrontab: 30 2 * * * /home/wicky/bash-practice/day24/backup.sh -s /srv/todo/data -d /backups/todo -k 7 >> /var/log/todo-backup.log 2>&1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Keeping backups only on the same disk as the data: a disk failure loses both. Copy them to another place (S3, another server) — see E1.","No alert on failure: a cron job that fails silently for a month is common. Send the exit code to monitoring."],"interview_say":"A production backup script validates its options, stops on any error with a clear message, uses a lock against overlapping runs, makes timestamped archives with checksums, rotates old ones, and runs from cron with its output logged.","try_yourself":"Add `-n` for a dry run that only prints what would be created and removed."},{"id":"d24p06","title":"Copy backups off the server (S3, with a mock aws)","type":"command","topic":"DevOps tools","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The backups must also go to an S3 bucket. The real `aws` CLI needs credentials and network, so here a mock `aws` prints the commands instead of running them. The user builds the upload loop and checks that only new files would be sent.","task":["Put the mock first in PATH: `export PATH=\"$PWD/mockbin:$PATH\"`. Check with `command -v aws`.","Upload every archive and checksum in `latest/` with `aws s3 cp ... --sse AES256`.","Show the `aws s3 sync` command that uploads only new files."],"hints":["`--sse AES256` asks S3 to encrypt the file at rest.","Use a bucket prefix by year and month: `s3://todo-backups/2026/10/`.","`aws s3 sync latest/ s3://... --exclude '*' --include '*.tar.gz*'`."],"solution":["export PATH=\"$PWD/mockbin:$PATH\"","echo \"aws used here: $(command -v aws | sed \"s|$HOME|~|\")\"","for f in latest/*.tar.gz latest/*.sha256; do","  aws s3 cp \"$f\" \"s3://todo-backups/2026/10/$(basename \"$f\")\" --sse AES256","done","aws s3 sync latest/ s3://todo-backups/2026/10/ --exclude '*' --include '*.tar.gz*'"],"explanation":[{"part":"mock in PATH","meaning":"A fake `aws` script found before the real one. Good for testing scripts without cloud access."},{"part":"aws s3 cp FILE s3://bucket/key","meaning":"Upload one file."},{"part":"--sse AES256","meaning":"Server-side encryption."},{"part":"aws s3 sync","meaning":"Upload only new or changed files."},{"part":"lifecycle rule","meaning":"In S3 itself, a lifecycle rule can delete or archive old backups (for example after 30 days)."}],"expected_output":"aws used here: ~/bash-practice/day24/mockbin/aws\n[mock aws] aws s3 cp latest/todo-db-20261019-0230.tar.gz s3://todo-backups/2026/10/todo-db-20261019-0230.tar.gz --sse AES256\n[mock aws] aws s3 cp latest/todo-db-20261019-0230.tar.gz.sha256 s3://todo-backups/2026/10/todo-db-20261019-0230.tar.gz.sha256 --sse AES256\n[mock aws] aws s3 sync latest/ s3://todo-backups/2026/10/ --exclude * --include *.tar.gz*","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Putting AWS access keys in the script. Use an IAM role (EC2 instance profile) or `aws configure` with a profile, never hard-coded keys."],"interview_say":"Backups must leave the server: I upload them to S3 with encryption, using an IAM role instead of keys, and let an S3 lifecycle rule handle long-term retention.","try_yourself":"Add `--storage-class STANDARD_IA` to the cp command. What does it change in S3 (cost vs access)?"},{"id":"d24p07","title":"Rotation by age with find -mtime","type":"command","topic":"Scripting","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Another team's policy is by age, not by count: \"delete backups older than 7 days\". The user practises it safely on a copy with real file dates.","task":["Make a folder `aged` with 5 files dated 2, 5, 8, 12 and 30 days ago (`touch -d`).","List files older than 7 days with `find -mtime +7` (dry run).","Delete them with `-delete` and list what is left."],"hints":["`touch -d '8 days ago' file` sets the date.","`-mtime +7` = more than 7 full days.","Always the same find command, first `-print`, then `-delete`."],"solution":["mkdir -p aged","for n in 2 5 8 12 30; do","  touch -d \"$n days ago\" \"aged/backup-${n}d-old.tar.gz\"","done","echo \"=== older than 7 days ===\"","find aged -name '*.tar.gz' -mtime +7 -print | sort","find aged -name '*.tar.gz' -mtime +7 -delete","echo \"=== left ===\"","ls aged"],"explanation":[{"part":"touch -d 'N days ago'","meaning":"Create test files with old dates."},{"part":"-mtime +7","meaning":"Modified more than 7 days ago (Day 12)."},{"part":"count vs age","meaning":"By age: simple, but if backups stop, all old ones still get deleted after 7 days. By count: always keeps N, even if they are old."}],"expected_output":"=== older than 7 days ===\naged/backup-12d-old.tar.gz\naged/backup-30d-old.tar.gz\naged/backup-8d-old.tar.gz\n=== left ===\nbackup-2d-old.tar.gz  backup-5d-old.tar.gz","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Rotation by age when backups have been failing silently for 8 days: the job deletes the last good backups. Keep a minimum count too."],"interview_say":"Rotation by age uses `find -mtime +N -delete`. Rotation by count is safer when backups might stop, because it always keeps the last N. Many teams combine both.","try_yourself":"Combine both rules: delete files older than 7 days, but never leave fewer than 3 files."}],"interview":[{"q":"What should a good backup script do?","a":"Timestamped archive, checksum, rotation (keep last N), off-server copy (for example S3), a lock against overlapping runs, stop on errors with an alert, and regular restore tests.","topic":"Scripting"},{"q":"How do you keep only the 7 newest backups?","a":"Sort the timestamped names and delete all but the last 7: `ls -1 backup-*.tgz | sort | head -n -7 | xargs -r rm --`. Or use `find -mtime` for age-based rotation.","topic":"Scripting"},{"q":"How do you know a backup can be restored?","a":"Test it: verify the checksum, extract into a temp folder, and compare with the source (`diff -r`), or restore a database dump into a test database. Do it regularly.","topic":"Scripting"},{"q":"Why is `ls -t` risky for rotation?","a":"It sorts by file modification time, which changes when files are copied or restored. Dates in the file names are more reliable.","topic":"Scripting"},{"q":"Where should backups be stored?","a":"Not only on the same server or disk. Also in another place, like S3 with encryption and a lifecycle rule (the 3-2-1 idea: 3 copies, 2 media, 1 off-site).","topic":"Scripting"}],"recap":[{"cmd":"tar -czf NAME-$(date +%Y%m%d-%H%M).tar.gz -C dir .","meaning":"Timestamped backup","example":"tar -czf db-20261020-0230.tar.gz -C data .","topic":"Scripting"},{"cmd":"(cd dir && sha256sum f > f.sha256)","meaning":"Checksum with a relative name","example":"(cd backups && sha256sum x.tgz > x.tgz.sha256)","topic":"Scripting"},{"cmd":"ls -1 *.tgz | sort | head -n -N","meaning":"All but the newest N (by name)","example":"ls -1 db-*.tgz | sort | head -n -7","topic":"Scripting"},{"cmd":"xargs -r","meaning":"Do not run if there is no input","example":"... | xargs -r rm -v --","topic":"Scripting"},{"cmd":"diff -r a b","meaning":"Compare two folder trees","example":"diff -r data /tmp/restore","topic":"Scripting"},{"cmd":"trap '...' ERR","meaning":"React to a failed command","example":"trap 'echo FAILED at $LINENO >&2' ERR","topic":"Scripting"},{"cmd":"VAR=${VAR:-$(date ...)}","meaning":"Allow tests to set the time","example":"STAMP=${STAMP:-$(date +%Y%m%d-%H%M)}","topic":"Scripting"},{"cmd":"aws s3 cp / sync","meaning":"Copy backups to S3","example":"aws s3 cp x.tgz s3://bucket/2026/10/ --sse AES256","topic":"DevOps tools"},{"cmd":"find -mtime +N -delete","meaning":"Rotation by age","example":"find /backups -name '*.tgz' -mtime +7 -delete","topic":"Scripting"}],"coverage":[{"item":"tar backup with timestamp","problems":["d24p01","d24p05"]},{"item":"Checksum","problems":["d24p01","d24p03"]},{"item":"Keep last N","problems":["d24p02","d24p04","d24p05"]},{"item":"Restore test","problems":["d24p03"]},{"item":"Cron entry","problems":["d24p05"]},{"item":"Safe failure handling","problems":["d24p03","d24p05"]},{"item":"Off-site copy, rotation by age","problems":["d24p06","d24p07"]}],"reset":"rm -rf ~/bash-practice/day24"},{"day":25,"week":4,"title":"Project: health checks and alerts","goal":"Build a health-check tool: HTTP checks with timeouts and retries, disk and memory thresholds, clear exit codes, a log file, and alerts that do not spam.","minutes":90,"setup":["mkdir -p ~/bash-practice/day25 && cd ~/bash-practice/day25","# a fake API for the checks (python3, only on 127.0.0.1)","cat > fake-api.py <<'EOF'","import http.server, json, os, sys, time","PORT = int(sys.argv[1])","STATE = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"flaky-%d.count\" % PORT)","class Handler(http.server.BaseHTTPRequestHandler):","    def log_message(self, *args):","        pass","    def reply(self, code, body):","        data = json.dumps(body).encode()","        self.send_response(code)","        self.send_header(\"Content-Type\", \"application/json\")","        self.send_header(\"Content-Length\", str(len(data)))","        self.end_headers()","        self.wfile.write(data)","    def do_GET(self):","        if self.path == \"/health\":","            self.reply(200, {\"status\": \"UP\"})","        elif self.path == \"/health-db-down\":","            self.reply(503, {\"status\": \"DOWN\", \"db\": \"unreachable\"})","        elif self.path == \"/slow\":","            time.sleep(5)","            self.reply(200, {\"status\": \"UP\"})","        elif self.path == \"/flaky\":","            n = int(open(STATE).read()) if os.path.exists(STATE) else 0","            open(STATE, \"w\").write(str(n + 1))","            self.reply(200 if n >= 2 else 500, {\"try\": n + 1})","        else:","            self.reply(404, {\"error\": \"not found\"})","http.server.ThreadingHTTPServer((\"127.0.0.1\", PORT), Handler).serve_forever()","EOF","# snapshots for the disk and memory checks","printf '%s\\n' 'MemTotal:       16000000 kB' 'MemFree:          310000 kB' 'MemAvailable:     900000 kB' > meminfo-low.txt","printf '%s\\n' 'MemTotal:       16000000 kB' 'MemFree:         2000000 kB' 'MemAvailable:    9800000 kB' > meminfo-ok.txt","printf '%s\\n' 'Filesystem     1024-blocks      Used Available Capacity Mounted on' '/dev/nvme0n1p1    51474912  47105112   4353416      92% /' '/dev/nvme1n1     103081248  41232499  56589645      43% /var' > df-p.txt","# P4: a broken health-check script","printf '%s\\n' '#!/bin/bash' '# Runs every 5 minutes from cron. Appends ONE line per run to health.log.' '# Exit 0 if healthy, exit 2 if not (Nagios style). Must never wait longer than 3 seconds.' 'URL=${1:-http://127.0.0.1:8124/health}' 'if curl -s $URL > /dev/null; then' '  echo \"$(date +%T) OK $URL\" > health.log' 'else' '  echo \"$(date +%T) DOWN $URL\" > health.log' 'fi' > check-api.sh","cd ~/bash-practice/day25"],"warmup":[{"q":"Which curl options make a check fail on HTTP 500 and not hang?","a":"`curl -fsS --max-time 5 URL` (`-f` fail on HTTP errors, `--max-time` limit).","from_day":18},{"q":"How do you keep only the last 7 backups by name?","a":"`ls -1 backup-*.tgz | sort | head -n -7 | xargs -r rm --`","from_day":24},{"q":"How do you read `df` output in a script reliably?","a":"Use `df -P` (POSIX format), skip the header, and strip the `%`.","from_day":17},{"q":"Which column of `/proc/meminfo` matters for free memory?","a":"`MemAvailable` (like `available` in `free -m`).","from_day":17}],"problems":[{"id":"d25p01","title":"An HTTP check with timeout and retries","type":"script","topic":"Scripting","minutes":14,"optional":false,"core":true,"workdir":".","situation":"The monitoring script calls the to-do API's `/health` endpoint. One slow or failed answer should not wake up the on-call engineer at night: the check retries a few times with a pause, and each try has a timeout.","task":["Start the fake API: `python3 fake-api.py 8121 &`.","Write `check_url URL [tries] [delay]`: curl with `--max-time 2`, get the status code, accept only 2xx.","Print `OK` with the try number, or a `WARN` line per failed try (stderr), then `FAIL` and return 1.","Test `/health`, `/flaky` (fails twice, then works), `/health-db-down` (503), and `/slow` (too slow)."],"hints":["`code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \"$url\") || code=000`","`[[ $code == 2* ]]` = any 2xx code.","A C-style loop: `for ((i = 1; i <= tries; i++))`."],"solution":["python3 fake-api.py 8121 &","SRV=$!","sleep 1","check_url() {      # usage: check_url URL [tries] [delay-seconds]","  local url=$1 tries=${2:-3} delay=${3:-1} i code","  for ((i = 1; i <= tries; i++)); do","    code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \"$url\") || code=000","    if [[ $code == 2* ]]; then echo \"OK   $url ($code, try $i)\"; return 0; fi","    echo \"WARN $url answered $code (try $i/$tries)\" >&2","    sleep \"$delay\"","  done","  echo \"FAIL $url after $tries tries\" >&2","  return 1","}","check_url http://127.0.0.1:8121/health","check_url http://127.0.0.1:8121/flaky 5 0.2","check_url http://127.0.0.1:8121/health-db-down 2 0.2; echo \"exit code: $?\"","check_url http://127.0.0.1:8121/slow 1; echo \"exit code: $?\"","kill $SRV"],"explanation":[{"part":"-w '%{http_code}'","meaning":"Print only the status code (Day 18)."},{"part":"--max-time 2","meaning":"Give up after 2 seconds. A slow API counts as a failure."},{"part":"|| code=000","meaning":"When curl itself fails (timeout, refused), use `000`."},{"part":"[[ $code == 2* ]]","meaning":"Pattern: any code that starts with 2 (Day 6)."},{"part":"retries + sleep","meaning":"Avoid false alarms from one short glitch."},{"part":"return 0 / 1","meaning":"The function answers yes/no; the caller decides what to do (Day 9)."}],"expected_output":"OK   http://127.0.0.1:8121/health (200, try 1)\nWARN http://127.0.0.1:8121/flaky answered 500 (try 1/5)\nWARN http://127.0.0.1:8121/flaky answered 500 (try 2/5)\nOK   http://127.0.0.1:8121/flaky (200, try 3)\nWARN http://127.0.0.1:8121/health-db-down answered 503 (try 1/2)\nWARN http://127.0.0.1:8121/health-db-down answered 503 (try 2/2)\nFAIL http://127.0.0.1:8121/health-db-down after 2 tries\nexit code: 1\nWARN http://127.0.0.1:8121/slow answered 000 (try 1/1)\nFAIL http://127.0.0.1:8121/slow after 1 tries\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Retrying without a pause: 3 tries in 10 ms are the same as 1 try.","Too many retries with long pauses: the check takes minutes and overlaps the next cron run. Keep total time below the schedule interval."],"interview_say":"My HTTP check uses `curl` with a timeout and the status code, accepts only 2xx, retries a few times with a short pause, and returns 1 only after all tries fail, so one glitch does not page anyone.","try_yourself":"Also check the JSON body: `curl -s URL | grep -q '\"status\": \"UP\"'`. Why can a 200 answer still mean \"not healthy\"?"},{"id":"d25p02","title":"Disk and memory thresholds you can test","type":"script","topic":"Scripting","minutes":13,"optional":false,"core":false,"workdir":".","situation":"The same tool must warn when a disk is above 90% or available memory is below 10%. To test the alert without filling a real disk, the functions read from files: `df -P` output on stdin, and a meminfo path in a variable that defaults to `/proc/meminfo`.","task":["Write `check_disk LIMIT` that reads `df -P` lines from stdin and prints `ALERT disk MOUNT at N%` (return 1 if any).","Write `check_mem MIN_PCT` that reads `${MEMINFO:-/proc/meminfo}` and computes MemAvailable / MemTotal.","Test with `df-p.txt`, `meminfo-low.txt` and `meminfo-ok.txt`.","Run `check_mem 10` once on your real machine too."],"hints":["Reuse the df parsing from Day 17: skip the header, strip `%`.","`awk '/^MemTotal/ {t=$2} /^MemAvailable/ {a=$2} END {printf \"%d\", a * 100 / t}' \"$file\"`","`MEMINFO=meminfo-low.txt check_mem 10` sets the variable for one call only (Day 5)."],"solution":["check_disk() {          # usage: df -P | check_disk LIMIT","  local limit=${1:-90} bad=0 fs size used avail pct mount","  while read -r fs size used avail pct mount; do","    pct=${pct%\\%}","    [[ $pct =~ ^[0-9]+$ ]] || continue","    if (( pct >= limit )); then echo \"ALERT disk $mount at $pct% (limit $limit%)\"; bad=1; fi","  done","  return $bad","}","check_mem() {           # usage: check_mem MIN_AVAILABLE_PCT","  local min=${1:-10} file=${MEMINFO:-/proc/meminfo} pct","  pct=$(awk '/^MemTotal:/ {t = $2} /^MemAvailable:/ {a = $2} END {printf \"%d\", a * 100 / t}' \"$file\")","  if (( pct < min )); then echo \"ALERT memory available ${pct}% (minimum $min%)\"; return 1; fi","  echo \"OK   memory available ${pct}%\"","}","check_disk 90 < df-p.txt; echo \"disk check exit code: $?\"","MEMINFO=meminfo-low.txt check_mem 10; echo \"low memory exit code: $?\"","MEMINFO=meminfo-ok.txt check_mem 10; echo \"ok memory exit code: $?\"","check_mem 10 > /dev/null && echo \"this machine: memory OK\" || echo \"this machine: memory LOW\""],"explanation":[{"part":"reads stdin","meaning":"`df -P | check_disk 90` in production, `< df-p.txt` in tests. Same code."},{"part":"${MEMINFO:-/proc/meminfo}","meaning":"A default path that tests can change: easy testing without fake hardware."},{"part":"MemAvailable * 100 / MemTotal","meaning":"Percent of RAM that new programs can still get."},{"part":"return $bad","meaning":"0 = fine, 1 = at least one alert."},{"part":"(( pct >= limit ))","meaning":"Integer comparison with normal operators (Day 6)."}],"expected_output":"ALERT disk / at 92% (limit 90%)\ndisk check exit code: 1\nALERT memory available 5% (minimum 10%)\nlow memory exit code: 1\nOK   memory available 61%\nok memory exit code: 0\nthis machine: memory OK","expect_exit":0,"output_check":false,"output_note":"The last line depends on the user's machine (it is almost always OK on a laptop). The other lines are fixed.","verified":true,"mistakes":["Alerting on `MemFree`: Linux keeps little memory free on purpose (cache), so the alert fires falsely every hour.","Testing alerts only in production. A threshold bug is found when the disk is already full."],"interview_say":"My disk and memory checks read `df -P` and `/proc/meminfo`, compare with thresholds and return non-zero on alert. I make them read from stdin or a configurable path, so I can test the alert logic with saved files.","try_yourself":"Add an inode check: `df -Pi | check_disk 90`. Does the same function work?"},{"id":"d25p03","title":"Log every run, alert only on change","type":"script","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The first version sent a Slack message every 5 minutes while the API was down: 100 messages in one night, so people muted the channel. Better: log every run, but alert only when the state changes (OK → DOWN, DOWN → OK). The last state is kept in a small state file.","task":["Write `record STATE` that appends `time STATE` to `health.log`.","Keep the last state in `health.state`. If the new state is different, print `ALERT: STATE (was OLD)`.","Simulate 5 runs with states OK, DOWN, DOWN, DOWN, OK.","Show `health.log` and count the alerts."],"hints":["`OLD=$(cat health.state 2>/dev/null || echo OK)`","Compare, then save: `echo \"$NEW\" > health.state`.","For tests, the time comes from `FAKE_NOW`: `date -d \"${FAKE_NOW:-now}\" '+%F %T'`."],"solution":["record() {","  local new=$1 old now","  now=$(date -d \"${FAKE_NOW:-now}\" '+%F %T')","  old=$(cat health.state 2>/dev/null || echo OK)","  echo \"$now $new\" >> health.log","  if [ \"$new\" != \"$old\" ]; then echo \"$now ALERT: $new (was $old)\"; fi","  echo \"$new\" > health.state","}","minute=0","for state in OK DOWN DOWN DOWN OK; do","  FAKE_NOW=\"2026-10-20 02:$(printf '%02d' $minute)\" record \"$state\"","  minute=$((minute + 5))","done | tee alerts.txt","echo \"=== health.log ===\"","cat health.log","echo \"alerts sent: $(wc -l < alerts.txt) (instead of 3 DOWN messages + 1 OK)\""],"explanation":[{"part":">> health.log","meaning":"Append: one line per run, the full history."},{"part":"health.state","meaning":"Remember the last state between cron runs."},{"part":"alert on change only","meaning":"One message when it breaks, one when it recovers. No spam."},{"part":"FAKE_NOW","meaning":"Tests can set the time; in production it is empty and `date -d now` is used."},{"part":"done | tee alerts.txt","meaning":"Show the alerts and save them (Day 4)."}],"expected_output":"2026-10-20 02:05:00 ALERT: DOWN (was OK)\n2026-10-20 02:20:00 ALERT: OK (was DOWN)\n=== health.log ===\n2026-10-20 02:00:00 OK\n2026-10-20 02:05:00 DOWN\n2026-10-20 02:10:00 DOWN\n2026-10-20 02:15:00 DOWN\n2026-10-20 02:20:00 OK\nalerts sent: 2 (instead of 3 DOWN messages + 1 OK)","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Storing the state file in `/tmp`: after a reboot it is gone, and the first run may send a wrong \"recovered\" alert. Use `/var/lib/yourtool/`.","Alerting on the first failure only, with no recovery message: the team never knows when it is fixed."],"interview_say":"To avoid alert fatigue I log every check, but send an alert only when the state changes, keeping the last state in a file. Real monitoring tools like Prometheus Alertmanager do the same with grouping and silences.","try_yourself":"Add a reminder: if the state is still DOWN after 6 runs (30 minutes), send one more alert."},{"id":"d25p04","title":"Find the bug: the cron health check","type":"fix-bug","topic":"Scripting","minutes":13,"optional":false,"core":false,"workdir":".","situation":"`check-api.sh` runs every 5 minutes. Last night the API returned 503 for an hour, but the script logged `OK`. The log file only ever has one line, and the monitoring server never saw a failure.","task":["Start the fake API on 8124. Run `bash check-api.sh http://127.0.0.1:8124/health-db-down; echo $?` and read `health.log`.","Run it twice. How many lines are in `health.log`?","Find 4 bugs: no `-f`, no timeout, `>` instead of `>>`, and no exit code 2.","Fix it. Test `/health`, `/health-db-down` and `/slow`, and show the log without the time column."],"hints":["Without `-f`, curl's exit code is 0 for a 503 answer.","`--max-time 3` (the comment says 3 seconds).","Add `exit 2` in the DOWN branch."],"solution":["python3 fake-api.py 8124 &","SRV=$!","sleep 1","bash check-api.sh http://127.0.0.1:8124/health-db-down; echo \"exit code: $?\"","bash check-api.sh http://127.0.0.1:8124/health-db-down","echo \"lines in health.log: $(wc -l < health.log)\"; cut -d' ' -f2- health.log","rm -f health.log","cat > check-api.sh <<'EOF'","#!/bin/bash","# Runs every 5 minutes from cron. Appends ONE line per run to health.log.","# Exit 0 if healthy, exit 2 if not (Nagios style). Must never wait longer than 3 seconds.","URL=${1:-http://127.0.0.1:8124/health}","if curl -fs --max-time 3 \"$URL\" > /dev/null; then","  echo \"$(date +%T) OK $URL\" >> health.log","  exit 0","else","  echo \"$(date +%T) DOWN $URL\" >> health.log","  exit 2","fi","EOF","echo \"--- fixed ---\"","for path in health health-db-down slow; do","  bash check-api.sh \"http://127.0.0.1:8124/$path\"; echo \"$path: exit code $?\"","done","cut -d' ' -f2- health.log","kill $SRV"],"explanation":[{"part":"-f","meaning":"Bug 1: the 503 page was a \"successful\" download, so the check said OK."},{"part":"--max-time 3","meaning":"Bug 2: `/slow` would block the cron job for 5 seconds or more."},{"part":">> health.log","meaning":"Bug 3: `>` replaced the log on every run, so the history was lost."},{"part":"exit 2","meaning":"Bug 4: the script always ended with 0, so the monitoring server saw success."},{"part":"cut -d' ' -f2-","meaning":"Here only to hide the time column, which changes every run."}],"expected_output":"exit code: 0\nlines in health.log: 1\nOK http://127.0.0.1:8124/health-db-down\n--- fixed ---\nhealth: exit code 0\nhealth-db-down: exit code 2\nslow: exit code 2\nOK http://127.0.0.1:8124/health\nDOWN http://127.0.0.1:8124/health-db-down\nDOWN http://127.0.0.1:8124/slow","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Unquoted `$URL`: a URL with `&` in the query string breaks the command.","Running a health check from the same server as the app only. If the server is down, nothing alerts. Run checks from outside too."],"interview_say":"A cron health check needs `curl -f` and a timeout, must append to its log, and must return a non-zero exit code on failure, so the scheduler or monitoring agent can react.","try_yourself":"Add a 1 (WARNING) exit code for answers slower than 1 second: use `-w '%{time_total}'`."},{"id":"d25p05","title":"Put it together: healthcheck.sh for cron","type":"script","topic":"Scripting","minutes":15,"optional":false,"core":false,"workdir":".","situation":"The final tool checks the API, the disks and the memory in one run, prints one summary line per check, writes everything to a log, returns Nagios-style exit codes (0 OK, 1 WARNING, 2 CRITICAL), and never overlaps itself.","task":["Write `healthcheck.sh` with `set -uo pipefail` (not `-e`: a failed check must not stop the other checks).","Run 3 checks: API (critical if down), disk (warning above 90%), memory (warning below 10%).","Use `flock` so two runs never overlap. Append the summary to `healthcheck.log`.","Exit with the worst result. Test with good and bad inputs. Print the crontab line."],"hints":["Keep a variable `WORST=0`; after each check: `(( rc > WORST )) && WORST=$rc`.","Use env variables for testing: `URL`, `DF_FILE`, `MEMINFO`.","`DF_FILE` empty → use real `df -P`: `{ [ -n \"${DF_FILE:-}\" ] && cat \"$DF_FILE\" || df -P; }`."],"solution":["cat > healthcheck.sh <<'EOF'","#!/bin/bash","# healthcheck.sh - exit 0 OK, 1 WARNING, 2 CRITICAL","set -uo pipefail","URL=${URL:-http://127.0.0.1:8125/health}","LOG=${LOG:-healthcheck.log}","exec 9> .healthcheck.lock","flock -n 9 || { echo \"UNKNOWN: previous run still active\"; exit 3; }","WORST=0","result() { echo \"$1 $2\"; echo \"$(date '+%F %T') $1 $2\" >> \"$LOG\"; (( $3 > WORST )) && WORST=$3; return 0; }","if curl -fs --max-time 3 \"$URL\" > /dev/null; then result OK \"api $URL\" 0","else result CRITICAL \"api $URL is down\" 2; fi","DISK=$({ [ -n \"${DF_FILE:-}\" ] && cat \"$DF_FILE\" || df -P; } | awk 'NR > 1 {gsub(\"%\", \"\", $5); if ($5 >= 90) print $6 \"=\" $5 \"%\"}' | xargs)","if [ -z \"$DISK\" ]; then result OK \"disk below 90%\" 0; else result WARNING \"disk $DISK\" 1; fi","MEM=$(awk '/^MemTotal:/ {t = $2} /^MemAvailable:/ {a = $2} END {printf \"%d\", a * 100 / t}' \"${MEMINFO:-/proc/meminfo}\")","if (( MEM >= 10 )); then result OK \"memory available $MEM%\" 0; else result WARNING \"memory available $MEM%\" 1; fi","exit \"$WORST\"","EOF","python3 fake-api.py 8125 &","SRV=$!","sleep 1","echo \"=== all good ===\"","DF_FILE=/dev/null MEMINFO=meminfo-ok.txt bash healthcheck.sh; echo \"exit code: $?\"","echo \"=== full disk and low memory ===\"","DF_FILE=df-p.txt MEMINFO=meminfo-low.txt bash healthcheck.sh; echo \"exit code: $?\"","echo \"=== API down too ===\"","URL=http://127.0.0.1:8125/health-db-down DF_FILE=df-p.txt MEMINFO=meminfo-ok.txt bash healthcheck.sh; echo \"exit code: $?\"","kill $SRV","echo \"log lines: $(wc -l < healthcheck.log)\"","echo \"crontab: */5 * * * * cd $HOME/bash-practice/day25 && ./healthcheck.sh >> cron.out 2>&1\""],"explanation":[{"part":"set -uo pipefail (no -e)","meaning":"A failing check is expected; the script must continue and report all checks."},{"part":"flock -n 9 ... exit 3","meaning":"No overlapping runs; 3 = UNKNOWN in Nagios style."},{"part":"result()","meaning":"One place to print, log, and keep the worst code."},{"part":"env variables for inputs","meaning":"`URL`, `DF_FILE`, `MEMINFO`: real values by default, test files when set."},{"part":"awk gsub + xargs","meaning":"List all full mounts on one line, like `/=92%`."},{"part":"exit \"$WORST\"","meaning":"0 OK, 1 WARNING, 2 CRITICAL: what Nagios, Icinga and many cron monitors expect."},{"part":"./healthcheck.sh in cron","meaning":"Make it executable first: `chmod +x healthcheck.sh`."}],"expected_output":"=== all good ===\nOK api http://127.0.0.1:8125/health\nOK disk below 90%\nOK memory available 61%\nexit code: 0\n=== full disk and low memory ===\nOK api http://127.0.0.1:8125/health\nWARNING disk /=92%\nWARNING memory available 5%\nexit code: 1\n=== API down too ===\nCRITICAL api http://127.0.0.1:8125/health-db-down is down\nWARNING disk /=92%\nOK memory available 61%\nexit code: 2\nlog lines: 9\ncrontab: */5 * * * * cd /home/wicky/bash-practice/day25 && ./healthcheck.sh >> cron.out 2>&1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `set -e` in a multi-check script: the first failed check stops everything, and the other results are never shown.","Mixing up exit codes: if both WARNING and CRITICAL happen, report CRITICAL (the worst)."],"interview_say":"My health check runs all checks even if one fails, logs each result, uses a lock to avoid overlapping runs, and exits with the worst status: 0 OK, 1 warning, 2 critical. Inputs come from environment variables so I can test the alert paths.","try_yourself":"Add a fourth check: the TLS certificate expiry of a site, with `openssl s_client` (needs internet). Warning when less than 14 days are left."},{"id":"d25p06","title":"Send the alert to a chat webhook (local test receiver)","type":"command","topic":"DevOps tools","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Alerts go to the team's Slack or Teams channel through an incoming webhook: an HTTP POST with a small JSON body. Here a tiny local receiver plays Slack and saves what it gets, so nothing leaves the laptop.","task":["Start the test receiver (see the solution, first lines). It saves each POST body into `received.json`.","Build the JSON safely with `printf` and proper quotes (or `jq -n` if installed).","POST it with `curl -fsS -X POST -H 'Content-Type: application/json' --data \"$PAYLOAD\" URL`.","Show what the receiver got."],"hints":["A Slack message body: `{\"text\": \"...\"}`.","The webhook URL is a secret: read it from a variable or file, never write it in the script.","`--data @file.json` sends a file as the body."],"solution":["python3 -c '","import http.server","class H(http.server.BaseHTTPRequestHandler):","    def log_message(self, *a): pass","    def do_POST(self):","        body = self.rfile.read(int(self.headers[\"Content-Length\"]))","        open(\"received.json\", \"wb\").write(body)","        self.send_response(200); self.end_headers(); self.wfile.write(b\"ok\")","http.server.HTTPServer((\"127.0.0.1\", 8126), H).serve_forever()","' &","RCV=$!","sleep 1","WEBHOOK_URL=${WEBHOOK_URL:-http://127.0.0.1:8126/services/T000/B000/XXXX}","HOST=todo-prod-1","PAYLOAD=$(printf '{\"text\": \":red_circle: CRITICAL on %s: api /health is down\"}' \"$HOST\")","curl -fsS -X POST -H 'Content-Type: application/json' --data \"$PAYLOAD\" \"$WEBHOOK_URL\"; echo","echo \"receiver got: $(cat received.json)\"","kill $RCV"],"explanation":[{"part":"incoming webhook","meaning":"A secret URL; anything POSTed there appears in the channel."},{"part":"-X POST -H 'Content-Type: application/json'","meaning":"Send JSON in the request body."},{"part":"--data \"$PAYLOAD\"","meaning":"The body. Quote it, it contains spaces."},{"part":"${WEBHOOK_URL:-...}","meaning":"Real URL from the environment (a secret), test URL by default."},{"part":"-fsS","meaning":"Fail on HTTP errors, quiet, but show errors (Day 18)."}],"expected_output":"ok\nreceiver got: {\"text\": \":red_circle: CRITICAL on todo-prod-1: api /health is down\"}","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Putting user text into JSON without escaping: a `\"` in the message breaks the JSON. Use `jq -n --arg t \"$msg\" '{text: $t}'`.","Committing the webhook URL to git: anyone can then post into the team channel. Keep it in a secret store or env file with 600 permissions (Day 26)."],"interview_say":"For chat alerts I POST a small JSON body to an incoming webhook with `curl -fsS`, build the JSON with jq to escape text safely, and keep the webhook URL as a secret, not in the code.","try_yourself":"If `jq` is installed: `jq -n --arg t 'He said \"hi\"' '{text: $t}'`. See how jq escapes the quotes."}],"interview":[{"q":"How would you write a simple health check for a web API?","a":"`curl -fsS --max-time 5 https://api/health`, check the status code (and maybe the JSON body), retry a few times with a pause, log the result, and exit non-zero on failure.","topic":"Scripting"},{"q":"What exit codes do monitoring tools like Nagios expect?","a":"0 = OK, 1 = WARNING, 2 = CRITICAL, 3 = UNKNOWN. A check script should exit with the worst result.","topic":"Scripting"},{"q":"How do you avoid alert spam?","a":"Alert only when the state changes (keep the last state in a file), use retries for short glitches, and send a recovery message. Monitoring tools add grouping and silences.","topic":"Scripting"},{"q":"How do you test alert logic without breaking a real server?","a":"Make inputs configurable: read `df -P` from stdin, take the meminfo path and the URL from variables, and test with saved files and a fake API.","topic":"Scripting"},{"q":"Why should a health check have a timeout?","a":"A hanging service would make the check hang too. The check would then never report, and cron runs would pile up. A timeout turns \"hanging\" into a clear failure.","topic":"Scripting"}],"recap":[{"cmd":"curl -s -o /dev/null -w '%{http_code}' --max-time N","meaning":"Status code with a timeout","example":"code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \"$url\")","topic":"Scripting"},{"cmd":"[[ $code == 2* ]]","meaning":"Any 2xx status","example":"[[ $code == 2* ]] && echo OK","topic":"Scripting"},{"cmd":"for ((i=1; i<=n; i++)); do ...; sleep d; done","meaning":"Retry loop","example":"check_url \"$URL\" 3 2","topic":"Scripting"},{"cmd":"${MEMINFO:-/proc/meminfo}","meaning":"Real input by default, test file when set","example":"MEMINFO=low.txt ./check.sh","topic":"Scripting"},{"cmd":"health.state","meaning":"Remember the last state; alert on change","example":"[ \"$new\" != \"$old\" ] && alert","topic":"Scripting"},{"cmd":"exit 0/1/2/3","meaning":"OK / WARNING / CRITICAL / UNKNOWN","example":"exit \"$WORST\"","topic":"Scripting"},{"cmd":"curl -X POST -H 'Content-Type: application/json' --data","meaning":"Send a webhook alert","example":"curl -fsS -X POST -H 'Content-Type: application/json' --data '{\"text\":\"down\"}' \"$WEBHOOK_URL\"","topic":"DevOps tools"},{"cmd":"*/5 * * * * cd dir && ./check.sh","meaning":"Run a check every 5 minutes","example":"*/5 * * * * /opt/hc/healthcheck.sh >> /var/log/hc.log 2>&1","topic":"Services"}],"coverage":[{"item":"curl health endpoint with timeout and retries","problems":["d25p01","d25p04"]},{"item":"Disk and memory threshold alerts","problems":["d25p02","d25p05"]},{"item":"Exit codes","problems":["d25p04","d25p05"]},{"item":"Cron schedule","problems":["d25p04","d25p05"]},{"item":"Write to a log file","problems":["d25p03","d25p05"]},{"item":"Alert without spam, webhook","problems":["d25p03","d25p06"]}],"reset":"rm -rf ~/bash-practice/day25"},{"day":26,"week":4,"title":"Bash with DevOps tools","goal":"Use jq on JSON APIs, wrap kubectl, docker, nginx and terraform in safe scripts (with mocks when the tool is not installed), and handle secrets without printing them.","minutes":90,"needs":["jq"],"setup":["mkdir -p ~/bash-practice/day26/api ~/bash-practice/day26/mockbin && cd ~/bash-practice/day26","# P1: a GitHub-style releases API (served by a local test server)","cat > api/releases.json <<'EOF'","[","  {\"tag_name\": \"v2.5.0-rc1\", \"prerelease\": true,  \"published_at\": \"2026-10-18\", \"assets\": [{\"name\": \"todo-cli-linux-amd64.tar.gz\", \"size\": 5242880}]},","  {\"tag_name\": \"v2.4.1\",     \"prerelease\": false, \"published_at\": \"2026-10-10\", \"assets\": [{\"name\": \"todo-cli-linux-amd64.tar.gz\", \"size\": 5100000}, {\"name\": \"todo-cli-darwin-arm64.tar.gz\", \"size\": 4900000}]},","  {\"tag_name\": \"v2.4.0\",     \"prerelease\": false, \"published_at\": \"2026-09-28\", \"assets\": [{\"name\": \"todo-cli-linux-amd64.tar.gz\", \"size\": 5050000}]}","]","EOF","# P2: what \"kubectl get pods -o json\" returns for the to-do app","cat > pods.json <<'EOF'","{\"items\": [","  {\"metadata\": {\"name\": \"todo-frontend-7d9f8-abcde\"}, \"status\": {\"phase\": \"Running\", \"containerStatuses\": [{\"ready\": true, \"restartCount\": 0, \"state\": {\"running\": {}}}]}},","  {\"metadata\": {\"name\": \"todo-backend-5c6b4-fghij\"}, \"status\": {\"phase\": \"Running\", \"containerStatuses\": [{\"ready\": false, \"restartCount\": 7, \"state\": {\"waiting\": {\"reason\": \"CrashLoopBackOff\"}}}]}},","  {\"metadata\": {\"name\": \"todo-backend-5c6b4-klmno\"}, \"status\": {\"phase\": \"Running\", \"containerStatuses\": [{\"ready\": true, \"restartCount\": 1, \"state\": {\"running\": {}}}]}},","  {\"metadata\": {\"name\": \"todo-worker-6f7c9-pqrst\"}, \"status\": {\"phase\": \"Pending\", \"containerStatuses\": [{\"ready\": false, \"restartCount\": 0, \"state\": {\"waiting\": {\"reason\": \"ImagePullBackOff\"}}}]}}","]}","EOF","# mock tools: they print or read files, they never touch a real cluster","printf '%s\\n' '#!/bin/bash' '# MOCK kubectl for practice' 'if [ \"$1 $2\" = \"get pods\" ] && [[ \"$*\" == *\"-o json\"* ]]; then cat ~/bash-practice/day26/pods.json; exit 0; fi' 'echo \"[mock kubectl] kubectl $*\"' > mockbin/kubectl","printf '%s\\n' '#!/bin/bash' '# MOCK docker for practice' 'if [ \"$1\" = images ]; then cat ~/bash-practice/day26/images.txt; exit 0; fi' 'echo \"[mock docker] docker $*\"' > mockbin/docker","printf '%s\\n' '#!/bin/bash' '# MOCK systemctl for practice' 'echo \"[mock systemctl] systemctl $*\"' > mockbin/systemctl","printf '%s\\n' '#!/bin/bash' '# MOCK nginx: \"nginx -t -c FILE\" checks that braces match and that lines end with ; { or }' 'FILE=$3' 'n=0; depth=0' 'while IFS= read -r line; do' '  n=$((n + 1)); l=${line%%#*}; l=${l//[[:space:]]/}' '  [ -z \"$l\" ] && continue' '  case $l in *\"{\") depth=$((depth + 1)) ;; *\"}\") depth=$((depth - 1)) ;; *\";\") ;; *) echo \"nginx: [emerg] directive \\\"$(set -- $line; echo $1)\\\" is not terminated by \\\";\\\" in $FILE:$n\" >&2; echo \"nginx: configuration file $FILE test failed\" >&2; exit 1 ;; esac' 'done < \"$FILE\"' 'if [ \"$depth\" -ne 0 ]; then echo \"nginx: [emerg] unexpected end of file, expecting \\\"}\\\" in $FILE:$n\" >&2; echo \"nginx: configuration file $FILE test failed\" >&2; exit 1; fi' 'echo \"nginx: the configuration file $FILE syntax is ok\" >&2' 'echo \"nginx: configuration file $FILE test is successful\" >&2' > mockbin/nginx","printf '%s\\n' '#!/bin/bash' '# MOCK terraform for practice' 'case \"$1\" in' '  fmt) [ -f .unformatted ] && { echo \"main.tf\"; exit 3; }; exit 0 ;;' '  validate) echo \"Success! The configuration is valid.\"; exit 0 ;;' '  plan) echo \"Plan: 1 to add, 0 to change, 0 to destroy.\"; [[ \"$*\" == *-detailed-exitcode* ]] && exit 2; exit 0 ;;' '  *) echo \"[mock terraform] terraform $*\" ;;' 'esac' > mockbin/terraform","chmod +x mockbin/*","# P3: an env file with secrets (fake values)","printf '%s\\n' 'DB_HOST=db.todo.internal' 'DB_PASSWORD=Sup3rS3cret!' 'API_TOKEN=ghp_1234567890abcdefXYZ' > .env","chmod 644 .env","# P4: an nginx folder (practice copy) and a broken deploy script","mkdir -p etc-nginx/sites-enabled new-config","printf '%s\\n' 'server {' '    listen 80;' '    server_name todo.local;' '    location / {' '        proxy_pass http://127.0.0.1:3000;' '    }' '}' > etc-nginx/sites-enabled/todo.conf","printf '%s\\n' 'server {' '    listen 80;' '    server_name todo.local;' '    location /api/ {' '        proxy_pass http://127.0.0.1:8080' '    }' '}' > new-config/todo.conf","printf '%s\\n' 'server {' '    listen 80;' '    server_name todo.local;' '    location /api/ {' '        proxy_pass http://127.0.0.1:8080;' '    }' '}' > new-config/todo-good.conf","printf '%s\\n' '#!/bin/bash' '# Install a new nginx site config. Test it BEFORE reloading.' '# If the test fails: keep (or put back) the old config, do not reload, exit 1.' 'NEW=$1' 'cp \"$NEW\" etc-nginx/sites-enabled/todo.conf' 'systemctl reload nginx' 'nginx -t -c etc-nginx/sites-enabled/todo.conf' 'echo \"deployed $NEW\"' > deploy-nginx.sh","# P5: \"docker images\" output on the build server","printf '%s\\n' 'todo-frontend 1.4.0 a1b2c3d4e5f6 2026-10-18' 'todo-frontend 1.3.2 b2c3d4e5f6a1 2026-10-02' 'todo-frontend 1.3.1 c3d4e5f6a1b2 2026-09-20' 'todo-backend 2.4.1 d4e5f6a1b2c3 2026-10-10' 'todo-backend 2.4.0 e5f6a1b2c3d4 2026-09-28' 'todo-backend 2.3.9 f6a1b2c3d4e5 2026-09-01' 'todo-backend 2.3.8 0a1b2c3d4e5f 2026-08-15' '<none> <none> 1b2c3d4e5f6a 2026-10-19' 'postgres 16 2c3d4e5f6a1b 2026-07-01' > images.txt","cd ~/bash-practice/day26"],"warmup":[{"q":"Which exit codes does a Nagios-style check use?","a":"0 OK, 1 WARNING, 2 CRITICAL, 3 UNKNOWN.","from_day":25},{"q":"How do you send a JSON body with curl?","a":"`curl -fsS -X POST -H 'Content-Type: application/json' --data \"$JSON\" URL`","from_day":25},{"q":"What does `set -x` print, and why can it be dangerous?","a":"Each command with its values before it runs. It can print secrets (tokens, passwords) into CI logs.","from_day":22},{"q":"What permission must an env file with passwords have?","a":"600 (only the owner).","from_day":3}],"problems":[{"id":"d26p01","title":"jq: read a JSON API","type":"command","topic":"DevOps tools","minutes":13,"optional":false,"core":true,"workdir":".","situation":"An install script must download the newest STABLE release of `todo-cli` from a GitHub-style releases API. The API returns JSON, so the user reads it with `jq` instead of grep. A local test server plays the API.","task":["Start the test API: `python3 -m http.server 8131 --bind 127.0.0.1 --directory api &`.","Get the JSON with `curl -fsS` and print the number of releases (`length`).","Print all tags with `-r` (raw text, no quotes).","Print only stable releases (`select(.prerelease == false)`) with their date.","Get the newest stable tag into a variable and build the download URL for the linux-amd64 asset."],"hints":["`jq '.[0]'` = first item; `.[]` = each item; `.tag_name` = a field.","`jq -r '.[] | select(.prerelease == false) | \"\\(.tag_name) \\(.published_at)\"'`","`TAG=$(curl -fsS URL | jq -r 'map(select(.prerelease == false)) | .[0].tag_name')`"],"solution":["python3 -m http.server 8131 --bind 127.0.0.1 --directory api > /dev/null 2>&1 &","SRV=$!","sleep 1","API=http://127.0.0.1:8131/releases.json","curl -fsS \"$API\" | jq 'length'","curl -fsS \"$API\" | jq -r '.[].tag_name'","echo \"=== stable releases ===\"","curl -fsS \"$API\" | jq -r '.[] | select(.prerelease == false) | \"\\(.tag_name)  \\(.published_at)\"'","TAG=$(curl -fsS \"$API\" | jq -r 'map(select(.prerelease == false)) | .[0].tag_name')","ASSET=$(curl -fsS \"$API\" | jq -r --arg t \"$TAG\" '.[] | select(.tag_name == $t) | .assets[] | select(.name | contains(\"linux-amd64\")) | .name')","echo \"download: https://github.com/wicky/todo-cli/releases/download/$TAG/$ASSET\"","kill $SRV"],"explanation":[{"part":"jq 'length'","meaning":"Number of items in the array."},{"part":"-r","meaning":"Raw output: strings without quotes, ready for bash variables."},{"part":".[].tag_name","meaning":"For each item, the field `tag_name`."},{"part":"select(cond)","meaning":"Keep only items where the condition is true."},{"part":"\"\\(.a) \\(.b)\"","meaning":"String with fields inside (jq string interpolation)."},{"part":"--arg t \"$TAG\"","meaning":"Pass a bash value into jq safely as `$t`."},{"part":"map(select(...)) | .[0]","meaning":"Filter the array, then take the first (newest) one."}],"expected_output":"3\nv2.5.0-rc1\nv2.4.1\nv2.4.0\n=== stable releases ===\nv2.4.1  2026-10-10\nv2.4.0  2026-09-28\ndownload: https://github.com/wicky/todo-cli/releases/download/v2.4.1/todo-cli-linux-amd64.tar.gz","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Parsing JSON with grep and cut: it breaks when the API changes spacing or field order. Use jq.","Forgetting `-r`: the variable contains quotes, like `\"v2.4.1\"`, and the URL is wrong.","Putting a bash variable inside the jq program in double quotes. Use `--arg` instead."],"interview_say":"I read JSON from APIs with `curl -fsS URL | jq -r '...'`: `select` to filter, `.field` to pick values, `-r` for raw strings, and `--arg` to pass bash variables in safely.","try_yourself":"Print the total size of all assets of v2.4.1 in MB: `jq '[.[] | select(.tag_name == \"v2.4.1\") | .assets[].size] | add / 1048576'`."},{"id":"d26p02","title":"kubectl + jq: find unhealthy pods (mock)","type":"script","topic":"DevOps tools","minutes":13,"optional":false,"core":false,"workdir":".","situation":"The to-do app on Kubernetes is partly down. A script must list every pod with its phase, restarts and waiting reason, and suggest commands for the bad ones. kubectl is replaced by a mock that returns saved JSON, so no cluster is needed.","task":["Put the mocks first in PATH: `export PATH=\"$PWD/mockbin:$PATH\"`. Check `command -v kubectl`.","Print a table: name, phase, ready, restarts, waiting reason (`@tsv`, then `awk printf` for columns).","List pods that are not ready or have more than 5 restarts.","For each bad pod, print the next debug commands (`kubectl describe`, `kubectl logs --previous`)."],"hints":["`kubectl get pods -o json | jq -r '.items[] | [ .metadata.name, .status.phase, ... ] | @tsv'`","`//` gives a default: `.state.waiting.reason // \"-\"`.","Select: `select(.status.containerStatuses[0].ready == false or .status.containerStatuses[0].restartCount > 5)`."],"solution":["export PATH=\"$PWD/mockbin:$PATH\"","echo \"kubectl here is: $(command -v kubectl | sed \"s|$HOME|~|\")\"","kubectl get pods -o json | jq -r '","  [\"NAME\", \"PHASE\", \"READY\", \"RESTARTS\", \"REASON\"],","  (.items[] | .status.containerStatuses[0] as $c |","    [.metadata.name, .status.phase, ($c.ready | tostring), ($c.restartCount | tostring), ($c.state.waiting.reason // \"-\")])","  | @tsv' | awk -F'\\t' '{ printf \"%-26s %-8s %-6s %-9s %s\\n\", $1, $2, $3, $4, $5 }'","echo \"=== needs attention ===\"","kubectl get pods -o json \\","  | jq -r '.items[] | select(.status.containerStatuses[0].ready == false or .status.containerStatuses[0].restartCount > 5) | .metadata.name' \\","  | while IFS= read -r pod; do","      echo \"$pod -> kubectl describe pod $pod | tail -n 20; kubectl logs $pod --previous\"","    done"],"explanation":[{"part":"mockbin first in PATH","meaning":"Our fake `kubectl` runs instead of a real one (Day 5 PATH)."},{"part":"as $c","meaning":"Save the first container status in a jq variable to keep the line short."},{"part":"// \"-\"","meaning":"Alternative operator: use `-` when the value is missing (running pods have no waiting reason)."},{"part":"@tsv | awk -F'\\t' printf","meaning":"Tab-separated values, then aligned columns. (`column -t` does the same, if the package `bsdextrautils` is installed.)"},{"part":"CrashLoopBackOff","meaning":"The container starts and crashes again and again: check `kubectl logs --previous`."},{"part":"ImagePullBackOff","meaning":"The image cannot be pulled: wrong tag, or no access to the registry."}],"expected_output":"kubectl here is: ~/bash-practice/day26/mockbin/kubectl\nNAME                       PHASE    READY  RESTARTS  REASON\ntodo-frontend-7d9f8-abcde  Running  true   0         -\ntodo-backend-5c6b4-fghij   Running  false  7         CrashLoopBackOff\ntodo-backend-5c6b4-klmno   Running  true   1         -\ntodo-worker-6f7c9-pqrst    Pending  false  0         ImagePullBackOff\n=== needs attention ===\ntodo-backend-5c6b4-fghij -> kubectl describe pod todo-backend-5c6b4-fghij | tail -n 20; kubectl logs todo-backend-5c6b4-fghij --previous\ntodo-worker-6f7c9-pqrst -> kubectl describe pod todo-worker-6f7c9-pqrst | tail -n 20; kubectl logs todo-worker-6f7c9-pqrst --previous","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `kubectl get pods | grep -v Running` to find problems: a pod can be `Running` but not ready, or restarting all the time.","Testing cluster scripts directly on production. Use `--dry-run=client`, a test namespace, or mocks like here."],"interview_say":"For Kubernetes scripts I use `kubectl get -o json | jq` instead of parsing the table. A pod can be Running but not ready, so I check readiness, restarts and the waiting reason, then look at `describe` and `logs --previous`.","try_yourself":"Count pods per phase: `kubectl get pods -o json | jq -r '.items[].status.phase' | sort | uniq -c`."},{"id":"d26p03","title":"Secrets: env files, masking, and set -x leaks","type":"command","topic":"DevOps tools","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A deploy script needs `DB_PASSWORD` and `API_TOKEN` from `.env`. In the last incident, the token appeared in the Jenkins log because of `set -x`. The user loads secrets safely, never prints them, and shows the leak and the fix.","task":["Check `.env` permissions. If not 600, fix them before loading.","Load it with `set -a; source .env; set +a`. Print the DB host and a masked token (first 4 characters + `****`).","Show the leak: run a tiny `bash -x` command that uses the token. Then the safe version with `set +x` around the secret.","Make sure `.env` is in `.gitignore`."],"hints":["`[ \"$(stat -c %a .env)\" = 600 ] || chmod 600 .env`","`set -a` exports every variable that is set while it is on.","Mask: `${API_TOKEN:0:4}****`. Never `echo \"$API_TOKEN\"`."],"solution":["echo \".env permission: $(stat -c %a .env)\"","[ \"$(stat -c %a .env)\" = 600 ] || { chmod 600 .env; echo \"fixed to $(stat -c %a .env)\"; }","set -a; source .env; set +a","echo \"DB host: $DB_HOST\"","echo \"API token: ${API_TOKEN:0:4}****  (length ${#API_TOKEN})\"","echo \"=== the leak: set -x prints the value ===\"","bash -xc 'curl_args=\"-H Authorization: token $API_TOKEN\"; : \"$curl_args\"' 2>&1 | grep -c \"$API_TOKEN\" | sed 's/^/lines with the token in the trace: /'","echo \"=== the fix: no trace around secrets ===\"","bash -c 'set -x; echo deploy start; { set +x; } 2>/dev/null; curl_args=\"-H Authorization: token $API_TOKEN\"; set -x; echo deploy done' 2>&1 | grep -c \"$API_TOKEN\" | sed 's/^/lines with the token in the trace: /'","grep -qxF '.env' .gitignore 2>/dev/null || echo '.env' >> .gitignore","cat .gitignore"],"explanation":[{"part":"chmod 600 .env","meaning":"Only the owner may read secrets (Day 3)."},{"part":"set -a; source .env; set +a","meaning":"Load `KEY=value` lines and export them for child processes, then stop auto-export."},{"part":"${API_TOKEN:0:4}****","meaning":"Show a short prefix only, to confirm which token is loaded."},{"part":"bash -x leak","meaning":"The trace prints the expanded command, so the token is in the log."},{"part":"{ set +x; } 2>/dev/null","meaning":"Turn tracing off without printing the `set +x` line itself."},{"part":".gitignore","meaning":"Never commit `.env`. Use CI secrets (Jenkins credentials, GitHub Actions secrets) or a secret manager."}],"expected_output":".env permission: 644\nfixed to 600\nDB host: db.todo.internal\nAPI token: ghp_****  (length 23)\n=== the leak: set -x prints the value ===\nlines with the token in the trace: 2\n=== the fix: no trace around secrets ===\nlines with the token in the trace: 0\n.env","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Passing a secret as a command argument (`mysql -pSecret`): other users can see it in `ps aux`. Use env variables or files.","`echo \"token=$API_TOKEN\"` in a debug line \"just for now\". It ends up in CI logs forever.","Storing secrets in the Docker image: anyone who pulls the image can read them."],"interview_say":"I keep secrets out of code and logs: they come from CI secrets or a 600 env file, I never echo them, I mask them if I must show them, and I turn off `set -x` around commands that use them.","try_yourself":"Run `ps aux | grep -i token` while a command with a token argument runs (`sleep 30 --token=abc &` fails, try `bash -c 'sleep 30' token=abc &`). What can other users see?"},{"id":"d26p04","title":"Find the bug: reload nginx only after a good test","type":"fix-bug","topic":"DevOps tools","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`deploy-nginx.sh` installed a config with a missing `;` and reloaded nginx before testing it. In production, a bad reload can take the site down. nginx and systemctl are mocks here; the practice folder `etc-nginx` stands in for `/etc/nginx`.","task":["Use the mocks: `export PATH=\"$PWD/mockbin:$PATH\"`. Run `bash deploy-nginx.sh new-config/todo.conf; echo $?`.","Find 3 bugs: reload before the test, the test result is ignored, and no way back to the old config.","Fix it: back up the current config, copy the new one, `nginx -t`, reload only if OK, else restore and exit 1.","Test with the bad `new-config/todo.conf` and the good `new-config/todo-good.conf`."],"hints":["The real pattern is `nginx -t && systemctl reload nginx`.","Backup: `cp todo.conf todo.conf.bak` before copying the new file.","On failure: `mv todo.conf.bak todo.conf`, print an error, `exit 1`."],"solution":["export PATH=\"$PWD/mockbin:$PATH\"","cp etc-nginx/sites-enabled/todo.conf original.conf          # keep a copy for the second test","bash deploy-nginx.sh new-config/todo.conf; echo \"exit code: $?\"","cp original.conf etc-nginx/sites-enabled/todo.conf          # undo the broken deploy","cat > deploy-nginx.sh <<'EOF'","#!/bin/bash","# Install a new nginx site config. Test it BEFORE reloading.","# If the test fails: keep (or put back) the old config, do not reload, exit 1.","set -euo pipefail","NEW=${1:?usage: deploy-nginx.sh NEW_CONFIG}","CONF=etc-nginx/sites-enabled/todo.conf","cp \"$CONF\" \"$CONF.bak\"","cp \"$NEW\" \"$CONF\"","if nginx -t -c \"$CONF\"; then","  systemctl reload nginx","  rm -f \"$CONF.bak\"","  echo \"deployed $NEW\"","else","  mv \"$CONF.bak\" \"$CONF\"","  echo \"ERROR: $NEW failed the nginx test; old config restored, nginx NOT reloaded\" >&2","  exit 1","fi","EOF","echo \"--- fixed, bad config ---\"","bash deploy-nginx.sh new-config/todo.conf; echo \"exit code: $?\"","cmp -s original.conf etc-nginx/sites-enabled/todo.conf && echo \"the live config is still the old one\"","echo \"--- fixed, good config ---\"","bash deploy-nginx.sh new-config/todo-good.conf; echo \"exit code: $?\""],"explanation":[{"part":"reload first","meaning":"Bug 1: nginx was reloaded with an untested config."},{"part":"test result ignored","meaning":"Bug 2: the script printed `deployed` and exited 0 after a failed test."},{"part":"no backup","meaning":"Bug 3: the old, working config was overwritten with no way back."},{"part":"nginx -t","meaning":"Test the configuration syntax. Real nginx: `sudo nginx -t` tests all of `/etc/nginx`."},{"part":"if test; then reload; else restore","meaning":"Validate, then apply, with a rollback path. The same idea as `terraform plan` before `apply`."},{"part":"mocks","meaning":"`mockbin/nginx` imitates nginx's messages; the real one is `sudo apt install nginx`."}],"expected_output":"[mock systemctl] systemctl reload nginx\nnginx: [emerg] directive \"proxy_pass\" is not terminated by \";\" in etc-nginx/sites-enabled/todo.conf:5\nnginx: configuration file etc-nginx/sites-enabled/todo.conf test failed\ndeployed new-config/todo.conf\nexit code: 0\n--- fixed, bad config ---\nnginx: [emerg] directive \"pro
