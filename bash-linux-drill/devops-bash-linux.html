e-Again shell script`.","example":"file old-logs","links":["d01p07"]},{"id":"d01c16","topic":"Files","q":"How do you print only chosen details of a file (size, owner, link count)?","a":"stat -c","accept":["stat --format","stat"],"what":"`stat` shows file details; `-c` takes a format.","does":"Prints only the fields in the format.","flags":[["%n","name"],["%s","size in bytes"],["%U","owner"],["%h","number of hard links"],["%F","file type"],["%A","permissions as letters"]],"example":"stat -c '%n %s %U' app.log","links":["d01p02","d01p04","d01p07"]},{"id":"d01c17","topic":"Files","q":"How do you read a `.gz` log without unpacking it?","a":"zcat","what":"`cat` for gzip files.","does":"Unpacks in memory and prints the text. The file on disk stays compressed.","flags":[["zgrep","search inside a .gz file"],["zless","read it page by page"]],"example":"zcat syslog.2.gz | tail","links":["d01p07"]},{"id":"d01c18","topic":"Files","q":"Which wildcard matches exactly one character?","a":"?","what":"A wildcard (glob) is a pattern for file names. Bash expands it before the command runs.","does":"`api-?.log` matches `api-1.log` but not `api-10.log`.","flags":[["*","any text"],["?","one character"],["[1-5]","one character from 1 to 5"],["{a,b}","braces: make words, not a wildcard"]],"example":"echo api-?.log","links":["d01p05","d01p06"]},{"id":"d01c19","topic":"Scripting","q":"What is the first line of a bash script called, and what is it?","a":"#!/bin/bash","accept":["shebang"],"what":"The **shebang**.","does":"Tells Linux which program runs the file when it is started with `./script.sh`.","example":["#!/bin/bash","echo \"hello\""],"links":["d01p03"]},{"id":"d01c20","topic":"Scripting","q":"Which line makes a script stop at the first error?","a":"set -euo pipefail","accept":["set -e"],"what":"Safety options for bash scripts. Put it right after the shebang.","does":"Stops the script instead of going on with broken data.","flags":[["-e","exit when a command fails"],["-u","error on a variable that is not set"],["-o pipefail","a pipe fails if any part fails"]],"example":["#!/bin/bash","set -euo pipefail"],"links":["d01p03","d01p05"]},{"id":"d01c21","topic":"Scripting","q":"How do you make a script executable and run it from the current folder?","a":"chmod +x script.sh && ./script.sh","accept":["chmod +x"],"what":"`chmod +x` adds the execute permission. `./` means \"this folder\".","does":"Without `+x` the user gets `Permission denied`. `bash script.sh` works without it.","flags":[["bash -n file.sh","check the syntax only"],["shellcheck file.sh","find common bugs"]],"example":["chmod +x prepare-release.sh","./prepare-release.sh"],"links":["d01p03"]}],"interview":[{"q":"What is the difference between an absolute path and a relative path?","a":"An absolute path starts at the root directory `/`, for example `/var/log/nginx`. It works from any folder. A relative path starts from the current folder, for example `logs/app.log`.","topic":"Files"},{"q":"What is the difference between a hard link and a symbolic link?","a":"A hard link is a second name for the same data, so it still works if the original is deleted. A symlink stores a path. It breaks when the target is deleted, but it can point to folders and to other disks.","topic":"Files"},{"q":"Where are config files and log files kept in Linux?","a":"Config files are in `/etc`, for example `/etc/nginx/nginx.conf`. Logs are in `/var/log`, for example `/var/log/syslog`.","topic":"Files"},{"q":"How do you see hidden files? What makes a file hidden?","a":"A file is hidden when its name starts with a dot, like `.env`. `ls -a` or `ls -la` shows hidden files.","topic":"Files"},{"q":"Why is `rm -rf` dangerous?","a":"`-r` deletes folders with everything inside and `-f` never asks and hides errors. There is no recycle bin. With a wrong or empty variable it can delete the wrong folder.","topic":"Files"}],"recap":[{"cmd":"pwd","meaning":"Print the current folder (full path)","example":"pwd","topic":"Files"},{"cmd":"cd -","meaning":"Go back to the previous folder","example":"cd -","topic":"Files"},{"cmd":"ls -la","meaning":"List all files (also hidden) with details","example":"ls -la ~/bash-practice","topic":"Files"},{"cmd":"mkdir -p","meaning":"Create folder and missing parents","example":"mkdir -p app/{logs,config}","topic":"Files"},{"cmd":"touch","meaning":"Create an empty file or update its time","example":"touch app.log","topic":"Files"},{"cmd":"cp -r","meaning":"Copy a folder with all content","example":"cp -r config/ backup/","topic":"Files"},{"cmd":"mv","meaning":"Move or rename","example":"mv app.yml app-prod.yml","topic":"Files"},{"cmd":"rm -r","meaning":"Delete a folder and its content (no undo)","example":"rm -r releases/v1.0","topic":"Files"},{"cmd":"tree","meaning":"Show folders as a tree","example":"tree releases","topic":"Files"},{"cmd":"ln -s","meaning":"Create a symlink (TARGET then NAME)","example":"ln -s releases/v1.2 current","topic":"Files"},{"cmd":"ln -sfn","meaning":"Replace an existing symlink","example":"ln -sfn releases/v1.1 current","topic":"Files"},{"cmd":"ln","meaning":"Create a hard link","example":"ln db.conf db-hard.conf","topic":"Files"},{"cmd":"readlink","meaning":"Show where a symlink points","example":"readlink current","topic":"Files"},{"cmd":"stat -c","meaning":"Show chosen file details","example":"stat -c '%n %s %U' file","topic":"Files"},{"cmd":"file","meaning":"Show the real type of a file","example":"file old-logs","topic":"Files"},{"cmd":"command -v","meaning":"Show where a command lives","example":"command -v ls","topic":"Files"},{"cmd":"* ? [ ]","meaning":"Wildcards: any text, one char, one of a list","example":"ls app-0[1-5].log","topic":"Files"},{"cmd":"{a,b}","meaning":"Brace expansion: make several words","example":"echo v{1..3}","topic":"Files"},{"cmd":"#!/bin/bash","meaning":"Shebang: run this file with bash","example":"#!/bin/bash","topic":"Scripting"},{"cmd":"set -euo pipefail","meaning":"Stop a script at the first error","example":"set -euo pipefail","topic":"Scripting"},{"cmd":"NAME=\"value\"","meaning":"Make a variable (no spaces around =); use it as \"$NAME\"","example":"NEW=\"releases/v1.2\"","topic":"Scripting"},{"cmd":"bash -n","meaning":"Check a script's syntax without running it","example":"bash -n deploy.sh","topic":"Scripting"},{"cmd":"shellcheck","meaning":"Find common bugs in a script","example":"shellcheck deploy.sh","topic":"Scripting"},{"cmd":"chmod +x; ./","meaning":"Make a script executable, run it from this folder","example":"chmod +x deploy.sh && ./deploy.sh","topic":"Scripting"}],"coverage":[{"item":"Directory layout (/etc /var /home /tmp /usr /opt /proc)","problems":["d01p02"]},{"item":"ls -la, hidden files","problems":["d01p01","d01p07"]},{"item":"cd, pwd","problems":["d01p01"]},{"item":"mkdir -p, touch","problems":["d01p03","d01p05"]},{"item":"cp -r, mv, rm","problems":["d01p03","d01p05"]},{"item":"tree","problems":["d01p03"]},{"item":"First script: shebang, comments, set -euo pipefail, quoted variables","problems":["d01p03"]},{"item":"Check a script: bash -n, shellcheck; run with chmod +x and ./","problems":["d01p03"]},{"item":"stat, file","problems":["d01p02","d01p07"]},{"item":"Hard link vs symlink (ln, ln -s)","problems":["d01p04"]},{"item":"Wildcards * ? [ ]","problems":["d01p05","d01p06"]},{"item":"Brace expansion {}","problems":["d01p03","d01p06"]}],"reset":"rm -rf ~/bash-practice/day01"},{"day":2,"week":1,"title":"Reading and searching files","goal":"Read big log and config files quickly, find the important lines, and compare two versions of a file.","minutes":90,"setup":["mkdir -p ~/bash-practice/day02/var/log/nginx && cd ~/bash-practice/day02","# Nginx-style access log of the to-do app (40 lines)","for i in $(seq 1 40); do","  case $((i % 10)) in","    0) code=500; url=/api/todos ;;","    3) code=404; url=/favicon.ico ;;","    7) code=201; url=/api/todos ;;","    *) code=200; url=/api/todos ;;","  esac","  ip=\"10.0.0.$(( (i % 4) + 1 ))\"","  printf '%s - - [20/Oct/2026:10:%02d:00 +0530] \"GET %s HTTP/1.1\" %s 512\\n' \"$ip\" \"$i\" \"$url\" \"$code\"","done > var/log/nginx/access.log","# backend log with a few errors","printf '%s\\n' '2026-10-20 10:00:01 INFO  backend started on port 8080' '2026-10-20 10:00:05 INFO  connected to database' '2026-10-20 10:05:12 WARN  slow query: 1200 ms' '2026-10-20 10:07:40 ERROR database connection lost' '2026-10-20 10:07:41 INFO  retrying connection' '2026-10-20 10:07:46 ERROR database connection lost' '2026-10-20 10:07:51 INFO  connected to database' '2026-10-20 10:12:03 WARN  slow query: 950 ms' > var/log/backend.log","# frontend log for the live-watch problem","printf '%s\\n' '2026-10-20 10:00:02 INFO  frontend started' '2026-10-20 10:03:10 INFO  GET /' '2026-10-20 10:04:55 WARN  api slow (2.1 s)' > var/log/frontend.log","# two versions of an app config","printf '%s\\n' 'port=8080' 'db_host=db.internal' 'db_pool=10' 'log_level=info' 'cache=on' > app-v1.conf","printf '%s\\n' 'port=8080' 'db_host=db-new.internal' 'db_pool=20' 'log_level=info' 'cache=on' > app-v2.conf","# list of servers with repeats (from 3 inventories)","printf '%s\\n' web-02 db-01 web-01 web-02 cache-01 web-01 db-01 web-03 > servers.txt","# a broken report script","printf '%s\\n' '#!/bin/bash' '# Print the last 5 lines of the backend log and count ERROR lines' 'LOG=var/log/backend.log' 'tail -5 $log' 'echo \"Errors:\"' 'grep ERROR var/log/backend.log | wc -l var/log/backend.log' > report.sh","cd ~/bash-practice/day02"],"warmup":[{"q":"What is the difference between `/` and `/root`?","a":"`/` is the root directory, the top of all folders. `/root` is the home folder of the root user.","from_day":1},{"q":"Which command creates `a/b/c` when `a` does not exist yet?","a":"`mkdir -p a/b/c`","from_day":1},{"q":"A symlink points to a file. The file is deleted. What happens to the symlink?","a":"It becomes a broken link. `cat` gives `No such file or directory`. A hard link would still work.","from_day":1},{"q":"What does `2>/dev/null` do?","a":"It sends error messages (stderr) to `/dev/null`, so they disappear.","from_day":0}],"problems":[{"id":"d02p01","title":"First look at a big log: head, tail, wc","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The to-do app is slow. The team lead asks: \"How many requests did Nginx get, and what were the first and the last ones?\" The access log is too big to read with `cat`.","task":["Count the lines of `var/log/nginx/access.log` with `wc -l`.","Show the first 3 lines with `head`.","Show the last 2 lines with `tail`.","Show only lines 10 to 12 (use `head` and `tail` together with a pipe).","Show the same file with line numbers using `nl`, but only the first 3 lines."],"hints":["`head -n N` shows the first N lines. `tail -n N` shows the last N lines.","For lines 10-12: take the first 12 lines, then the last 3 of those.","`head -n 12 file | tail -n 3` and `nl file | head -n 3`."],"solution":["wc -l var/log/nginx/access.log","head -n 3 var/log/nginx/access.log","tail -n 2 var/log/nginx/access.log","head -n 12 var/log/nginx/access.log | tail -n 3     # lines 10, 11, 12","nl var/log/nginx/access.log | head -n 3"],"explanation":[{"part":"wc -l file","meaning":"Counts lines. Prints the number and the file name."},{"part":"head -n 3","meaning":"First 3 lines. Without `-n`, head shows 10 lines."},{"part":"tail -n 2","meaning":"Last 2 lines. Without `-n`, tail shows 10 lines."},{"part":"head -n 12 | tail -n 3","meaning":"The pipe `|` sends the first 12 lines into `tail`, which keeps the last 3."},{"part":"nl","meaning":"Number lines. Like `cat -n`, but skips empty lines by default."}],"expected_output":"40 var/log/nginx/access.log\n10.0.0.2 - - [20/Oct/2026:10:01:00 +0530] \"GET /api/todos HTTP/1.1\" 200 512\n10.0.0.3 - - [20/Oct/2026:10:02:00 +0530] \"GET /api/todos HTTP/1.1\" 200 512\n10.0.0.4 - - [20/Oct/2026:10:03:00 +0530] \"GET /favicon.ico HTTP/1.1\" 404 512\n10.0.0.4 - - [20/Oct/2026:10:39:00 +0530] \"GET /api/todos HTTP/1.1\" 200 512\n10.0.0.1 - - [20/Oct/2026:10:40:00 +0530] \"GET /api/todos HTTP/1.1\" 500 512\n10.0.0.3 - - [20/Oct/2026:10:10:00 +0530] \"GET /api/todos HTTP/1.1\" 500 512\n10.0.0.4 - - [20/Oct/2026:10:11:00 +0530] \"GET /api/todos HTTP/1.1\" 200 512\n10.0.0.1 - - [20/Oct/2026:10:12:00 +0530] \"GET /api/todos HTTP/1.1\" 200 512\n     1\t10.0.0.2 - - [20/Oct/2026:10:01:00 +0530] \"GET /api/todos HTTP/1.1\" 200 512\n     2\t10.0.0.3 - - [20/Oct/2026:10:02:00 +0530] \"GET /api/todos HTTP/1.1\" 200 512\n     3\t10.0.0.4 - - [20/Oct/2026:10:03:00 +0530] \"GET /favicon.ico HTTP/1.1\" 404 512","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Running `cat` on a huge log. The terminal fills with text and the user cannot read it. Use `head`, `tail` or `less`.","Writing `head -3n file`. The correct form is `head -n 3 file` (or the short `head -3 file`).","Expecting `wc -l < file` to print the file name. With `<` it prints only the number (useful in scripts)."],"interview_say":"For a big log I never use `cat`. I use `wc -l` to see the size, `head` and `tail` to see the start and the end, and `less` to scroll and search.","try_yourself":"Run `wc -l < var/log/nginx/access.log` and `wc -c var/log/nginx/access.log`. What is different?"},{"id":"d02p02","title":"Watch a log live with tail -f","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The frontend pod restarts again and again. The user wants to see new log lines the moment they are written, while a teammate tests the app.","task":["Open a **second** terminal window. In it, run `tail -f ~/bash-practice/day02/var/log/frontend.log`.","In the first terminal, add a line: `echo \"2026-10-20 10:15:00 ERROR cannot reach api\" >> var/log/frontend.log`.","Watch the new line appear in the second terminal. Stop `tail -f` with `Ctrl+C`.","Now show only the last 3 lines once: `tail -n 3 var/log/frontend.log`.","Open the log in `less`. Press `G` (end), `g` (start), `/ERROR` (search), `n` (next match), `q` (quit)."],"hints":["`-f` means follow: tail keeps the file open and prints new lines.","`>>` adds to the end of a file. `>` would delete the old content first.","Stop a running command with `Ctrl+C`. In `less`, `q` quits."],"solution":["# Terminal 2 (keeps running until Ctrl+C):","#   tail -f ~/bash-practice/day02/var/log/frontend.log","# Here we start it in the background for 2 seconds to show the effect:","tail -n 0 -f var/log/frontend.log &","TAIL_PID=$!","sleep 1","echo \"2026-10-20 10:15:00 ERROR cannot reach api\" >> var/log/frontend.log","sleep 1","kill \"$TAIL_PID\"                      # same as pressing Ctrl+C in terminal 2","echo \"--- last 3 lines ---\"","tail -n 3 var/log/frontend.log"],"explanation":[{"part":"tail -f file","meaning":"Follow the file. New lines are printed as soon as they are written."},{"part":"-n 0","meaning":"Start with 0 old lines, only show new ones."},{"part":"&","meaning":"Run in the background, so the script can continue. The user does not need this in a second terminal."},{"part":"$!","meaning":"Process ID of the last background command."},{"part":">> file","meaning":"Append: add the line at the end of the file."},{"part":"less","meaning":"Scroll a file page by page. `G` end, `g` start, `/word` search, `n` next, `q` quit."}],"expected_output":"2026-10-20 10:15:00 ERROR cannot reach api\n--- last 3 lines ---\n2026-10-20 10:03:10 INFO  GET /\n2026-10-20 10:04:55 WARN  api slow (2.1 s)\n2026-10-20 10:15:00 ERROR cannot reach api","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `>` instead of `>>`. The whole log is replaced by one line.","Closing the terminal window to stop `tail -f`. Use `Ctrl+C`.","Using `tail -f` on a log that is rotated (renamed). Use `tail -F` (capital F) to follow the new file after rotation."],"interview_say":"I use `tail -f` to watch a log live while I reproduce the problem. For logs that rotate I use `tail -F`. In Kubernetes the same idea is `kubectl logs -f`.","try_yourself":"Run `tail -f var/log/frontend.log | grep ERROR` in terminal 2, then add an INFO line and an ERROR line from terminal 1. Which ones appear?"},{"id":"d02p03","title":"Find the errors with grep","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The backend lost its database connection this morning. The user must show the team only the error lines, count them, and see what happened just before the first error.","task":["Show all lines with `ERROR` in `var/log/backend.log`.","Count them with `grep -c`.","Show the line numbers of the WARN lines with `grep -n`.","Show lines that do **not** contain `INFO` with `grep -v`.","Search for `error` without caring about upper or lower case (`-i`), and count."],"hints":["`grep WORD file` prints matching lines.","`-c` counts, `-n` adds line numbers, `-v` inverts (non-matching lines), `-i` ignores case.","`grep -c ERROR var/log/backend.log`, `grep -n WARN ...`, `grep -v INFO ...`, `grep -ic error ...`."],"solution":["grep ERROR var/log/backend.log","grep -c ERROR var/log/backend.log","grep -n WARN var/log/backend.log","grep -v INFO var/log/backend.log","grep -ic error var/log/backend.log"],"explanation":[{"part":"grep ERROR file","meaning":"Print lines that contain the text `ERROR` (case-sensitive)."},{"part":"-c","meaning":"Print only the number of matching lines."},{"part":"-n","meaning":"Show the line number before each match."},{"part":"-v","meaning":"Invert: show lines that do NOT match."},{"part":"-i","meaning":"Ignore case: `error`, `Error` and `ERROR` all match."}],"expected_output":"2026-10-20 10:07:40 ERROR database connection lost\n2026-10-20 10:07:46 ERROR database connection lost\n2\n3:2026-10-20 10:05:12 WARN  slow query: 1200 ms\n8:2026-10-20 10:12:03 WARN  slow query: 950 ms\n2026-10-20 10:05:12 WARN  slow query: 1200 ms\n2026-10-20 10:07:40 ERROR database connection lost\n2026-10-20 10:07:46 ERROR database connection lost\n2026-10-20 10:12:03 WARN  slow query: 950 ms\n2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Wrong case: `grep error var/log/backend.log` prints nothing, because the log uses `ERROR`. Add `-i`.","Putting the file first: `grep var/log/backend.log ERROR` gives `grep: ERROR: No such file or directory`. The pattern comes first.","Thinking `grep -c` counts words. It counts lines. Two errors on one line count as 1."],"checks":[{"run":"grep var/log/backend.log ERROR","expect":"grep: ERROR: No such file or directory"}],"interview_say":"I use `grep` to filter logs: `-i` to ignore case, `-v` to remove noise, `-n` for line numbers and `-c` to count. Day 10 adds context options like `-B` and `-A`.","try_yourself":"Run `grep -B 1 ERROR var/log/backend.log`. What does `-B 1` add? Try `-A 1` too."},{"id":"d02p04","title":"Unique server names: sort and uniq","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"Three teams sent lists of servers that need a security patch. The lists were joined into `servers.txt`, so some names repeat. The user needs a clean list and wants to know which servers were reported more than once.","task":["Show `servers.txt` with `cat`.","Print the names sorted A-Z.","Print each name only once (sorted).","Print how many times each name appears (use `uniq -c`).","Show only the names that appear more than once (use `uniq -d`)."],"hints":["`uniq` only removes repeats that are next to each other. So sort first.","`sort file | uniq` or simply `sort -u file`.","`sort servers.txt | uniq -c` counts; `sort servers.txt | uniq -d` shows duplicates only."],"solution":["cat servers.txt","echo \"--- sorted ---\"","sort servers.txt","echo \"--- unique ---\"","sort -u servers.txt","echo \"--- count ---\"","sort servers.txt | uniq -c","echo \"--- reported more than once ---\"","sort servers.txt | uniq -d"],"explanation":[{"part":"sort","meaning":"Sort lines alphabetically (A-Z)."},{"part":"sort -u","meaning":"Sort and keep each line once."},{"part":"uniq -c","meaning":"Count each group of equal lines. The count comes first."},{"part":"uniq -d","meaning":"Print only lines that repeat."}],"expected_output":"web-02\ndb-01\nweb-01\nweb-02\ncache-01\nweb-01\ndb-01\nweb-03\n--- sorted ---\ncache-01\ndb-01\ndb-01\nweb-01\nweb-01\nweb-02\nweb-02\nweb-03\n--- unique ---\ncache-01\ndb-01\nweb-01\nweb-02\nweb-03\n--- count ---\n      1 cache-01\n      2 db-01\n      2 web-01\n      2 web-02\n      1 web-03\n--- reported more than once ---\ndb-01\nweb-01\nweb-02","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Running `uniq servers.txt` without sorting. `web-02` stays twice because the two copies are not next to each other.","Expecting `uniq -c` output to be sorted by count. Add `| sort -rn` for that (Day 12)."],"interview_say":"`uniq` only removes neighbour duplicates, so I always `sort` first. `sort | uniq -c | sort -rn` is my standard way to count things, like IPs in a log.","try_yourself":"Run `sort servers.txt | uniq -u`. What does `-u` on uniq show?"},{"id":"d02p05","title":"What changed in the config? diff","type":"command","topic":"Text","minutes":10,"optional":false,"core":false,"workdir":".","situation":"After a deploy, the backend cannot reach the database. Someone changed the config. The user has the old file `app-v1.conf` and the new file `app-v2.conf` and must find the exact changes.","task":["Compare the two files with `diff app-v1.conf app-v2.conf`.","Compare again with `diff -u` (the format used by git).","Check the exit code with `echo $?` right after `diff`."],"hints":["In plain `diff`, `<` lines come from the first file and `>` lines from the second file.","In `diff -u`, `-` means removed and `+` means added.","`diff` exits with 0 when the files are the same and 1 when they are different."],"solution":["diff app-v1.conf app-v2.conf","echo \"exit code: $?\"","diff -u app-v1.conf app-v2.conf | tail -n +3    # skip the 2 header lines with dates"],"explanation":[{"part":"diff a b","meaning":"Show lines that are different. `2,3c2,3` means lines 2-3 were changed (c = change)."},{"part":"< / >","meaning":"`<` = line from the first file, `>` = line from the second file."},{"part":"$?","meaning":"Exit code of diff: 0 = same, 1 = different, 2 = error (for example a missing file)."},{"part":"diff -u","meaning":"Unified format, like `git diff`: `-` removed, `+` added, with some lines around for context."},{"part":"tail -n +3","meaning":"Print from line 3 to the end. Here it hides the header with file dates."}],"expected_output":"2,3c2,3\n< db_host=db.internal\n< db_pool=10\n---\n> db_host=db-new.internal\n> db_pool=20\nexit code: 1\n@@ -1,5 +1,5 @@\n port=8080\n-db_host=db.internal\n-db_pool=10\n+db_host=db-new.internal\n+db_pool=20\n log_level=info\n cache=on","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Thinking exit code 1 from `diff` means the command failed. For `diff`, 1 only means \"files are different\". In a script with `set -e`, this stops the script.","Mixing up the order. `diff old new` shows `>` for the new lines. Always put the old file first."],"interview_say":"I compare configs with `diff -u old new`. The changed lines show the bug quickly; here `db_host` and `db_pool` changed.","try_yourself":"Run `diff app-v1.conf app-v1.conf; echo $?`. Then try `diff app-v1.conf nofile.conf; echo $?`."},{"id":"d02p06","title":"Find the bug: the log report script","type":"fix-bug","topic":"Text","minutes":12,"optional":true,"core":false,"workdir":".","situation":"A teammate wrote `report.sh` to print the last 5 lines of the backend log and the number of errors. It hangs, and the error count looks wrong.","task":["Look at the script with `cat report.sh`. Do **not** run it yet (it waits for input forever).","Find 2 bugs: one variable name problem and one wrong pipe.","Fix the script and run it with `bash report.sh`."],"hints":["Bash variable names are case-sensitive. `LOG` and `log` are two different variables.","When `$log` is empty, the command is just `tail -5`, which reads from the keyboard and waits.","In a pipe, `wc -l` must read from the pipe, so do not give it a file name: `grep ERROR file | wc -l`, or use `grep -c`."],"solution":["cat > report.sh <<'EOF'","#!/bin/bash","# Print the last 5 lines of the backend log and count ERROR lines","LOG=var/log/backend.log","tail -5 \"$LOG\"","echo \"Errors:\"","grep -c ERROR \"$LOG\"","EOF","bash report.sh"],"explanation":[{"part":"\"$LOG\"","meaning":"Bug 1: the script set `LOG` but used `$log`. The empty variable made `tail` wait for keyboard input. Quotes also protect paths with spaces."},{"part":"grep -c ERROR \"$LOG\"","meaning":"Bug 2: `wc -l file` ignored the pipe and counted all lines of the file. `grep -c` counts only matching lines."}],"expected_output":"2026-10-20 10:07:40 ERROR database connection lost\n2026-10-20 10:07:41 INFO  retrying connection\n2026-10-20 10:07:46 ERROR database connection lost\n2026-10-20 10:07:51 INFO  connected to database\n2026-10-20 10:12:03 WARN  slow query: 950 ms\nErrors:\n2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Running the broken script: it hangs with no message. Press `Ctrl+C` to stop it.","Counting with `wc -l var/log/backend.log` after the pipe: the output is `8 var/log/backend.log`, the total lines, not the errors."],"checks":[{"run":"tail -5 var/log/backend.log >/dev/null; wc -l var/log/backend.log","expect":"8 var/log/backend.log"}],"interview_say":"Variable names in bash are case-sensitive, and an empty variable can change a command completely. I use ShellCheck and `set -u` to catch this.","try_yourself":"Add `set -u` as the second line of the broken script and run it. What error do you get now?"}],"interview":[{"q":"What is the difference between `head`, `tail` and `tail -f`?","a":"`head` shows the first lines, `tail` the last lines, and `tail -f` keeps the file open and prints new lines as they are written.","topic":"Text"},{"q":"How do you count the error lines in a log file?","a":"`grep -c ERROR app.log`. Or `grep ERROR app.log | wc -l`.","topic":"Text"},{"q":"Why do we use `sort` before `uniq`?","a":"`uniq` only removes duplicate lines that are next to each other. `sort` puts equal lines together first.","topic":"Text"},{"q":"How do you see what changed between two config files?","a":"`diff -u old.conf new.conf`. Lines with `-` were removed and lines with `+` were added.","topic":"Text"},{"q":"Why not use `cat` for a 2 GB log file?","a":"It prints everything to the screen and is slow. `less` lets the user scroll and search, and `tail` or `grep` show only the useful part.","topic":"Text"}],"recap":[{"cmd":"cat","meaning":"Print a whole (small) file","example":"cat servers.txt","topic":"Text"},{"cmd":"less","meaning":"Scroll and search a file (q quits)","example":"less /var/log/syslog","topic":"Text"},{"cmd":"head -n N","meaning":"First N lines","example":"head -n 3 access.log","topic":"Text"},{"cmd":"tail -n N","meaning":"Last N lines","example":"tail -n 20 app.log","topic":"Text"},{"cmd":"tail -f","meaning":"Follow a log live (Ctrl+C stops)","example":"tail -f backend.log","topic":"Text"},{"cmd":"tail -n +N","meaning":"From line N to the end","example":"tail -n +2 data.csv","topic":"Text"},{"cmd":"wc -l","meaning":"Count lines","example":"wc -l access.log","topic":"Text"},{"cmd":"nl","meaning":"Print with line numbers","example":"nl app.conf","topic":"Text"},{"cmd":"grep -c / -n / -v / -i","meaning":"Count / line numbers / invert / ignore case","example":"grep -ic error app.log","topic":"Text"},{"cmd":"sort","meaning":"Sort lines A-Z","example":"sort servers.txt","topic":"Text"},{"cmd":"sort -u","meaning":"Sort and remove duplicates","example":"sort -u servers.txt","topic":"Text"},{"cmd":"uniq -c","meaning":"Count equal neighbour lines","example":"sort ips | uniq -c","topic":"Text"},{"cmd":"uniq -d","meaning":"Show only repeated lines","example":"sort servers.txt | uniq -d","topic":"Text"},{"cmd":"diff -u","meaning":"Show changes between two files","example":"diff -u old.conf new.conf","topic":"Text"}],"coverage":[{"item":"cat","problems":["d02p04"]},{"item":"less","problems":["d02p02"]},{"item":"head, tail","problems":["d02p01","d02p02"]},{"item":"tail -f","problems":["d02p02"]},{"item":"wc","problems":["d02p01","d02p06"]},{"item":"grep basics","problems":["d02p03","d02p06"]},{"item":"diff","problems":["d02p05"]},{"item":"sort, uniq","problems":["d02p04"]},{"item":"nl","problems":["d02p01"]},{"item":"Reading /var/log-style logs","problems":["d02p01","d02p02","d02p03"]}],"reset":"rm -rf ~/bash-practice/day02"},{"day":3,"week":1,"title":"Permissions, users, groups and sudo","goal":"Read and set file permissions with numbers and letters, and know who can do what: owner, group, others and root.","minutes":90,"setup":["mkdir -p ~/bash-practice/day03 && cd ~/bash-practice/day03","# P1: a deploy kit that came without permissions","mkdir -p kit","printf '#!/bin/bash\\necho \"deploying todo-api...\"\\n' > kit/deploy.sh","printf 'port: 8080\\n' > kit/app.yml","printf 'DB_PASSWORD=change-me\\n' > kit/.env","chmod 644 kit/deploy.sh kit/app.yml kit/.env","# P2: files for symbolic chmod","mkdir -p team","touch team/report.txt team/build.sh team/notes.md","chmod 644 team/report.txt team/build.sh team/notes.md","# P3: a private file","echo 'api_key=demo-123' > secret.txt","# P5: broken permission script","mkdir -p app/scripts app/config","printf '#!/bin/bash\\necho \"app started\"\\n' > app/scripts/start.sh","printf 'port: 8080\\n' > app/config/app.yml","printf 'DB_PASSWORD=change-me\\n' > app/.env","printf '%s\\n' '#!/bin/bash' '# Goal: start.sh runnable by everyone, app.yml readable by everyone, .env only for the owner' 'chmod 644 app/scripts/start.sh' 'chmod 755 app/config/app.yml' 'chmod 664 app/.env' './app/scripts/start.sh' > fix-perms.sh","# P8: folders for special bits","mkdir -p shared dropbox","cd ~/bash-practice/day03"],"warmup":[{"q":"What does `uniq` need before it can remove all duplicates?","a":"Sorted input. `sort file | uniq` (or `sort -u file`), because `uniq` only removes neighbour duplicates.","from_day":2},{"q":"How do you follow a log file live?","a":"`tail -f app.log` (stop with `Ctrl+C`).","from_day":2},{"q":"Where are log files kept? Where are config files kept?","a":"Logs: `/var/log`. Configs: `/etc`.","from_day":1},{"q":"Which command makes a symlink `current` pointing to `releases/v2`?","a":"`ln -s releases/v2 current` (TARGET first, then the link name).","from_day":1}],"problems":[{"id":"d03p01","title":"Permission denied: fix it with numbers","type":"command","topic":"Permissions","minutes":12,"optional":false,"core":true,"workdir":"kit","situation":"A teammate copied a deploy kit to the server. Running `./deploy.sh` gives `Permission denied`. The `.env` file has a password and must be private. The config can be read by everyone.","task":["In `kit`, try `./deploy.sh` and read the error.","Show permissions of all files with `stat -c '%A %a %n' deploy.sh app.yml .env`.","Make `deploy.sh` 755, `app.yml` 644 and `.env` 600.","Show the permissions again and run `./deploy.sh`."],"hints":["Each digit is a sum: read = 4, write = 2, execute = 1. The 3 digits are owner, group, others.","7 = 4+2+1 = rwx. 5 = 4+1 = r-x. 6 = 4+2 = rw-. 0 = ---.","`chmod 755 deploy.sh`, `chmod 644 app.yml`, `chmod 600 .env`."],"solution":["./deploy.sh || echo \"exit code: $?\"","stat -c '%A %a %n' deploy.sh app.yml .env","chmod 755 deploy.sh      # rwx r-x r-x : owner can change, everyone can run","chmod 644 app.yml        # rw- r-- r-- : everyone can read","chmod 600 .env           # rw- --- --- : only the owner (secrets!)","stat -c '%A %a %n' deploy.sh app.yml .env","./deploy.sh"],"explanation":[{"part":"Permission denied (exit 126)","meaning":"The file has no `x` (execute) permission. Exit code 126 = found but cannot run."},{"part":"stat -c '%A %a %n'","meaning":"Show permissions as letters (`%A`), as a number (`%a`), and the name."},{"part":"755","meaning":"Owner rwx (7), group r-x (5), others r-x (5). Normal for scripts."},{"part":"644","meaning":"Owner rw- (6), group r-- (4), others r-- (4). Normal for config and web files."},{"part":"600","meaning":"Owner rw-, nobody else. Use it for secrets, `.env` and SSH private keys."}],"expected_output":"bash: ./deploy.sh: Permission denied\nexit code: 126\n-rw-r--r-- 644 deploy.sh\n-rw-r--r-- 644 app.yml\n-rw-r--r-- 644 .env\n-rwxr-xr-x 755 deploy.sh\n-rw-r--r-- 644 app.yml\n-rw------- 600 .env\ndeploying todo-api...","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Running `deploy.sh` without `./` gives `deploy.sh: command not found`. The current folder is not in `PATH`.","Using `chmod 777` to \"fix\" the error. It lets every user change the script. Never use 777 on a server.","Writing `chmod 0.6.0.0`, or using 8 or 9. Each digit is only 0-7."],"checks":[{"run":"deploy.sh","expect":"deploy.sh: command not found"}],"interview_say":"Permissions are read 4, write 2, execute 1, for owner, group and others. Scripts are usually 755, configs 644, and secrets like `.env` or SSH keys 600.","try_yourself":"Run `bash deploy.sh` while the file is still 644. Does it work? Why? (Hint: bash reads the file; it does not execute it.)","table":{"head":["Number","Letters","Meaning"],"rows":[["7","rwx","read, write, execute"],["6","rw-","read, write"],["5","r-x","read, execute"],["4","r--","read only"],["0","---","nothing"]]}},{"id":"d03p02","title":"Predict the result of chmod with letters","type":"predict","topic":"Permissions","minutes":12,"optional":false,"core":false,"workdir":"team","situation":"The team shares a folder. A senior engineer prefers letters in `chmod` because they change only one part. The user must predict the new permissions before running each command.","task":["All three files start as 644 (`rw-r--r--`).","Predict the result of: `chmod u+x build.sh`, `chmod g+w report.txt`, `chmod o-r report.txt`, `chmod u=rw,g=r,o= notes.md`, `chmod a+x build.sh`.","Write your 3-digit answers on paper.","Run the commands, then check with `stat -c '%a %A %n' *`."],"hints":["Who: `u` user (owner), `g` group, `o` others, `a` all. Action: `+` add, `-` remove, `=` set exactly.","`o=` with nothing after `=` removes all permissions for others.","build.sh: 644 → 744 → 755. report.txt: 644 → 664 → 660. notes.md: 640."],"solution":["chmod u+x build.sh             # owner gets x: rwxr--r-- = 744","chmod g+w report.txt           # group gets w: rw-rw-r-- = 664","chmod o-r report.txt           # others lose r: rw-rw---- = 660","chmod u=rw,g=r,o= notes.md     # set exactly:  rw-r----- = 640","chmod a+x build.sh             # everyone gets x: rwxr-xr-x = 755","stat -c '%a %A %n' *"],"explanation":[{"part":"u / g / o / a","meaning":"user (owner) / group / others / all three."},{"part":"+ / - / =","meaning":"add / remove / set exactly (other bits for that who are removed)."},{"part":"u=rw,g=r,o=","meaning":"Several rules with commas, no spaces."},{"part":"letters vs numbers","meaning":"Letters change only what the user names. Numbers set all 9 bits at once."}],"expected_output":"755 -rwxr-xr-x build.sh\n640 -rw-r----- notes.md\n660 -rw-rw---- report.txt","expect_exit":0,"output_check":true,"verified":true,"mistakes":["A space after the comma: `chmod u=rw, g=r notes.md` gives `chmod: invalid mode: ‘u=rw,’`.","Thinking `o` means owner. `o` is **others**. Owner is `u` (user)."],"checks":[{"run":"chmod u=rw, g=r notes.md","expect":"chmod: invalid mode: ‘u=rw,’"}],"interview_say":"With letters I change only one part, for example `chmod g+w file` adds write for the group. `u`, `g`, `o` and `a` choose who, and `+`, `-`, `=` choose the action.","try_yourself":"Run `chmod -x build.sh` and check. Then run `chmod 4755 build.sh` and look at the letters. What is the `s`? (Extra problem E3 explains it.)"},{"id":"d03p03","title":"Others vs root: who can read a secret?","type":"concept","topic":"Permissions","minutes":12,"optional":false,"core":true,"workdir":".","situation":"The user wonders: \"If I set my file to 600, can root still read it? And why can every user read `/etc/passwd` but not `/etc/shadow`?\" Interviewers like this question.","task":["Compare `/etc/passwd` and `/etc/shadow` with `stat -c '%A %U %G %n' /etc/passwd /etc/shadow`.","Try `cat /etc/shadow` as the normal user. Read the error.","Run `chmod 000 secret.txt`, then `cat secret.txt`. The owner is blocked too!","Give the read permission back to the owner: `chmod 600 secret.txt`, and read it again.","Read only (do not run if you are not sure): `sudo cat /etc/shadow | head -n 1` works, because root ignores read and write permissions."],"hints":["\"Others\" means every user who is not the owner and not in the file's group.","Linux checks permissions in order: owner? then group? then others. Root skips most checks.","`/etc/passwd` is 644 (everyone can read user names). `/etc/shadow` is 640 root:shadow (password hashes)."],"solution":["stat -c '%A %U %G %n' /etc/passwd /etc/shadow","cat /etc/shadow || echo \"exit code: $?\"","chmod 000 secret.txt","cat secret.txt || echo \"exit code: $?\"","chmod 600 secret.txt","cat secret.txt"],"explanation":[{"part":"/etc/passwd (644)","meaning":"List of users. Everyone may read it. It has no passwords (only an `x`)."},{"part":"/etc/shadow (640, root:shadow)","meaning":"Password hashes. Only root and the `shadow` group can read it. A normal user is \"others\" here, and others have `---`."},{"part":"chmod 000","meaning":"No permissions for anyone, including the owner. The owner can still change permissions back, because the owner owns the file."},{"part":"root","meaning":"The root user ignores read/write permissions. Only `x` for files needs at least one x bit. So 600 protects from other users, not from root."}],"expected_output":"-rw-r--r-- root root /etc/passwd\n-rw-r----- root shadow /etc/shadow\ncat: /etc/shadow: Permission denied\nexit code: 1\ncat: secret.txt: Permission denied\nexit code: 1\napi_key=demo-123","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Thinking \"others\" includes root. Others are normal users that are not owner or group. Root is special and ignores most permissions.","Thinking `chmod 000` locks the file forever. The owner (and root) can always run `chmod` again.","Running `sudo` for everything. Use it only when a task needs root; mistakes as root break the system."],"interview_say":"Permissions are checked as owner, then group, then others. Root ignores read and write permissions, so file permissions protect from other users but not from root. That is why we limit who has sudo.","try_yourself":"Run `ls -l /etc/sudoers` (read only). Who can read it? Why do you think it is so strict?","table":{"head":["Word","Meaning"],"rows":[["owner (u)","the user who owns the file"],["group (g)","users in the file's group"],["others (o)","everyone else (not root!)"],["root","admin user, user id 0, ignores most permissions"],["`/`","root directory: a folder, not a user"]]}},{"id":"d03p04","title":"Who am I? id, groups and /etc/passwd","type":"command","topic":"Permissions","minutes":10,"optional":false,"core":false,"workdir":".","situation":"A Jenkins job fails with `Permission denied` when it writes to a folder. The first question is always: which user runs the job, and which groups does it have?","task":["Print your user name with `whoami` and your ids with `id`.","Print your groups with `groups`.","Find your line in `/etc/passwd` with `grep \"^$USER:\" /etc/passwd`. Read the 7 fields.","List all user names and their shells: `cut -d: -f1,7 /etc/passwd | head -n 3`.","Show the members of the `sudo` group: `getent group sudo`."],"hints":["`/etc/passwd` fields are separated by `:`.","The fields are: name : x : user id : group id : comment : home : shell.","`cut -d: -f1,7` takes fields 1 and 7 with `:` as the separator."],"solution":["whoami","id","groups","grep \"^$USER:\" /etc/passwd","cut -d: -f1,7 /etc/passwd | head -n 3","getent group sudo"],"explanation":[{"part":"whoami","meaning":"Current user name."},{"part":"id","meaning":"User id (uid), main group id (gid), and all groups."},{"part":"groups","meaning":"Only the group names."},{"part":"^$USER:","meaning":"`^` = start of line. Double quotes let bash put the user name into the pattern."},{"part":"/etc/passwd fields","meaning":"name:x:uid:gid:comment:home:shell. The `x` means the password is in `/etc/shadow`."},{"part":"getent group sudo","meaning":"Show a group line from `/etc/group`: name:x:gid:members."}],"expected_output":"wicky\nuid=30033(wicky) gid=30033(wicky) groups=30033(wicky)\nwicky\nwicky:x:30033:30033::/home/wicky:/bin/bash\nroot:/bin/bash\ndaemon:/usr/sbin/nologin\nbin:/usr/sbin/nologin\nsudo:x:27:ubuntu","expect_exit":0,"output_check":false,"output_note":"This output is from the sandbox. On WSL the user id is usually 1000, `groups` shows more groups (like `adm sudo`), and the `sudo` line lists `wicky`.","verified":true,"mistakes":["Using single quotes: `grep '^$USER:' /etc/passwd` finds nothing, because `$USER` is not expanded inside single quotes.","After `usermod -aG docker wicky`, `groups` still does not show `docker`. The new group works only after a new login (or `newgrp docker`)."],"checks":[{"run":"grep '^$USER:' /etc/passwd || echo 'no match'","expect":"no match"}],"interview_say":"When I see `Permission denied`, I check which user runs the process with `id`, then compare it with the owner and permissions of the file using `ls -l`.","try_yourself":"Run `grep -c /bin/bash /etc/passwd`. How many users have bash as their login shell?"},{"id":"d03p05","title":"Find the bug: the permission fix script","type":"fix-bug","topic":"Permissions","minutes":14,"optional":false,"core":false,"workdir":".","situation":"A teammate wrote `fix-perms.sh` before the release. The goal is in the comment. After running it, `start.sh` cannot run and the password file is readable by the group.","task":["Read the script with `cat fix-perms.sh`. Compare each line with the goal.","Run it with `bash fix-perms.sh` and read the error.","Fix the three numbers. Run it again.","Check the result with `stat -c '%a %n' app/scripts/start.sh app/config/app.yml app/.env`."],"hints":["\"Runnable by everyone\" needs x for owner, group and others.","A config file does not need `x`. A secret must have 0 for group and others.","start.sh → 755, app.yml → 644, .env → 600."],"solution":["bash fix-perms.sh || echo \"exit code: $?\"","cat > fix-perms.sh <<'EOF'","#!/bin/bash","# Goal: start.sh runnable by everyone, app.yml readable by everyone, .env only for the owner","chmod 755 app/scripts/start.sh","chmod 644 app/config/app.yml","chmod 600 app/.env","./app/scripts/start.sh","EOF","bash fix-perms.sh","stat -c '%a %n' app/scripts/start.sh app/config/app.yml app/.env"],"explanation":[{"part":"chmod 755 start.sh","meaning":"Bug 1: 644 has no `x`, so `./start.sh` gave `Permission denied`."},{"part":"chmod 644 app.yml","meaning":"Bug 2: 755 made a config file executable. It works, but it is wrong and a security smell."},{"part":"chmod 600 .env","meaning":"Bug 3: 664 let the group read and even write the password."}],"expected_output":"fix-perms.sh: line 6: ./app/scripts/start.sh: Permission denied\nexit code: 126\napp started\n755 app/scripts/start.sh\n644 app/config/app.yml\n600 app/.env","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Only fixing the line that shows an error. Bugs 2 and 3 give no error at all; they are security problems. Read the whole script.","Using `chmod -R 755 app` for everything. Then `.env` and configs become executable and readable by all."],"interview_say":"Not every permission bug shows an error. A secret with 664 works fine but is a security risk, so I check secrets are 600 and only scripts have the execute bit.","try_yourself":"Write a one-line check that prints `.env is safe` only if its permission is 600: `[ \"$(stat -c %a app/.env)\" = 600 ] && echo \".env is safe\"`."},{"id":"d03p06","title":"Users, groups, chown and sudo (on WSL only)","type":"command","topic":"Permissions","minutes":12,"optional":true,"core":false,"workdir":".","situation":"The team adds a `deploybot` user for automatic deploys and a `devops` group. The release folder must belong to `deploybot` and the `devops` group. This needs `sudo`, so it is not run in the sandbox.","task":["**Warning:** these commands change users on your WSL machine. They are safe, and the last step removes everything again.","Create the user: `sudo useradd -m -s /bin/bash deploybot`. Check with `id deploybot`.","Create a group and add the user: `sudo groupadd devops`, `sudo usermod -aG devops deploybot`, then `groups deploybot`.","Create `release/app.jar`. Give the folder to the bot: `sudo chown -R deploybot:devops release`.","Change only the group of one file: `sudo chgrp wicky release/app.jar`. Check with `stat`.","Clean up: `sudo userdel -r deploybot` and `sudo groupdel devops`."],"hints":["`useradd -m` creates the home folder; `-s` sets the login shell.","`usermod -aG group user`: `-a` (append) is very important. Without it the user loses other groups.","`chown user:group path` changes owner and group. `chgrp group path` changes only the group."],"solution":["sudo useradd -m -s /bin/bash deploybot","id deploybot","sudo groupadd devops","sudo usermod -aG devops deploybot","groups deploybot","getent group devops","mkdir -p release && touch release/app.jar","sudo chown -R deploybot:devops release","stat -c '%A %U %G %n' release release/app.jar","sudo chgrp wicky release/app.jar","stat -c '%A %U %G %n' release/app.jar","grep deploybot /etc/passwd","# clean up","sudo userdel -r deploybot","sudo groupdel devops","id deploybot"],"explanation":[{"part":"useradd -m -s /bin/bash","meaning":"Create a user with a home folder and bash as shell."},{"part":"groupadd devops","meaning":"Create a new group."},{"part":"usermod -aG devops deploybot","meaning":"Add the user to one more group. `-a` = append, keep old groups."},{"part":"chown -R user:group","meaning":"Change owner and group of a folder and everything inside (`-R`)."},{"part":"chgrp","meaning":"Change only the group."},{"part":"userdel -r","meaning":"Delete the user and the home folder."}],"expected_output":"","expect_exit":0,"output_check":false,"output_note":"This output was recorded as root in a test container, not by verify.py. On WSL the ids are usually 1001 and 1002, and `sudo` asks for the user's password first.","verified":false,"typical_output":"uid=30034(deploybot) gid=30034(deploybot) groups=30034(deploybot)\ndeploybot : deploybot devops\ndevops:x:30035:deploybot\ndrwxr-xr-x deploybot devops release\n-rw-r--r-- deploybot devops release/app.jar\n-rw-r--r-- deploybot wicky release/app.jar\ndeploybot:x:30034:30034::/home/deploybot:/bin/bash\nuserdel: deploybot mail spool (/var/mail/deploybot) not found\nid: ‘deploybot’: no such user","mistakes":["`usermod -G devops deploybot` without `-a` removes the user from all other extra groups.","Running `chown` without sudo gives `chown: changing ownership of 'release': Operation not permitted`.","Forgetting that a group change needs a new login: the user must log out and in, or run `newgrp devops`."],"interview_say":"I create service users with `useradd`, add them to groups with `usermod -aG`, and give folders to them with `chown -R user:group`. I never forget the `-a`.","try_yourself":"After step 3, run `sudo -u deploybot whoami`. `sudo -u` runs one command as another user."},{"id":"d03p07","title":"Why new files are 644: umask","type":"predict","topic":"Permissions","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Log files created by the backend are readable by every user on the server. The security team wants new files to be private to the owner and the group. This is controlled by `umask`.","task":["Set the normal umask with `umask 022` and print it with `umask`.","Create `a.log` and folder `adir`. Check their permissions.","In a subshell `( ... )`, set `umask 027`, then create `b.log` and `bdir`. Predict the permissions first.","Check all four with `stat -c '%a %n' a.log adir b.log bdir`."],"hints":["New files start from 666, new folders from 777. The umask removes bits.","666 - 022 = 644 and 777 - 022 = 755.","With 027: files 640, folders 750."],"solution":["umask 022","umask","touch a.log && mkdir adir","( umask 027; touch b.log; mkdir bdir )     # only inside the ( ) subshell","stat -c '%a %n' a.log adir b.log bdir","umask                                     # still 0022 out here"],"explanation":[{"part":"umask","meaning":"A mask of bits to remove from new files and folders."},{"part":"666 / 777","meaning":"Start values: new files never get `x` automatically; new folders start with all bits."},{"part":"022","meaning":"Remove write for group and others: files 644, folders 755."},{"part":"027","meaning":"Remove write for group, and everything for others: files 640, folders 750."},{"part":"( ... )","meaning":"Subshell: the umask change stays inside and does not change the main shell."}],"expected_output":"0022\n644 a.log\n755 adir\n640 b.log\n750 bdir\n0022","expect_exit":0,"output_check":true,"output_note":"On some Ubuntu setups the default umask is 0002. That is why the solution sets 022 first.","verified":true,"mistakes":["Thinking umask is a permission. It is the opposite: the bits to take away.","Setting `umask 027` in a terminal and expecting it to last. Put it in `~/.bashrc` or in the service file."],"interview_say":"The umask removes bits from the default 666 for files and 777 for folders. With umask 022 new files are 644 and new folders 755.","try_yourself":"What do you get with `umask 077`? Predict, then test in a subshell."},{"id":"d03p08","title":"Special bits: setuid, setgid, sticky","type":"concept","topic":"Permissions","minutes":10,"optional":true,"core":false,"workdir":".","situation":"In an interview the user sees `-rwsr-xr-x` and `drwxrwxrwt` and is asked what `s` and `t` mean. The user learns it with read-only commands and two practice folders.","task":["Look at `stat -c '%A %a %n' /usr/bin/passwd /tmp` (read only).","Set the setgid bit on your folder `shared`: `chmod g+s shared`.","Set the sticky bit on your folder `dropbox`: `chmod +t dropbox`.","Check both with `stat -c '%A %a %n' shared dropbox`."],"hints":["`s` in the owner part = setuid: the program runs with the owner's rights (root for `passwd`).","`s` in the group part on a folder = setgid: new files get the folder's group.","`t` at the end = sticky: in a shared folder like `/tmp`, users can delete only their own files."],"solution":["stat -c '%A %a %n' /usr/bin/passwd /tmp","chmod g+s shared","chmod +t dropbox","stat -c '%A %a %n' shared dropbox"],"explanation":[{"part":"4755 (rws)","meaning":"setuid. `passwd` must write `/etc/shadow`, so it runs as root for every user."},{"part":"2755 (rws in group)","meaning":"setgid on a folder: files created inside get the folder's group. Good for team folders."},{"part":"1777 (rwt)","meaning":"sticky bit on `/tmp`: everyone can write, but only the owner can delete a file."}],"expected_output":"-rwsr-xr-x 4755 /usr/bin/passwd\ndrwxrwxrwt 1777 /tmp\ndrwxr-sr-x 2755 shared\ndrwxr-xr-t 1755 dropbox","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Setting setuid on shell scripts. Linux ignores setuid on scripts, and on programs it is a big security risk.","Reading `T` (capital) as the same as `t`. Capital means the bit is set but `x` is missing for that part."],"interview_say":"setuid lets a program run with its owner's rights, like `passwd`. setgid on a folder keeps the group for new files. The sticky bit on `/tmp` stops users deleting each other's files.","try_yourself":"Run `find /usr/bin -perm -4000 | head -n 5`. These are all setuid programs on the system."}],"interview":[{"q":"What does `chmod 755` mean?","a":"Owner read, write, execute (7). Group read and execute (5). Others read and execute (5). Typical for scripts and folders.","topic":"Permissions"},{"q":"What permission should an SSH private key or a `.env` file have?","a":"600: only the owner can read and write. SSH even refuses a private key that others can read.","topic":"Permissions"},{"q":"What does `chmod g+w file` do?","a":"It adds write permission for the group and changes nothing else.","topic":"Permissions"},{"q":"Can root read a file with permission 600 owned by another user?","a":"Yes. Root ignores read and write permissions. File permissions protect from other normal users, not from root.","topic":"Permissions"},{"q":"How do you add an existing user to the docker group?","a":"`sudo usermod -aG docker username`. The `-a` keeps the old groups. The user must log in again for it to work.","topic":"Permissions"}],"recap":[{"cmd":"chmod 755 / 644 / 600","meaning":"Set permissions with numbers (r=4 w=2 x=1)","example":"chmod 600 .env","topic":"Permissions"},{"cmd":"chmod u+x","meaning":"Add execute for the owner","example":"chmod u+x deploy.sh","topic":"Permissions"},{"cmd":"chmod g+w,o-r","meaning":"Change only group and others","example":"chmod g+w,o-r report.txt","topic":"Permissions"},{"cmd":"stat -c '%a %A %n'","meaning":"Show permission number and letters","example":"stat -c '%a %A %n' *","topic":"Permissions"},{"cmd":"umask","meaning":"Bits removed from new files (666) and folders (777)","example":"umask 027","topic":"Permissions"},{"cmd":"whoami / id / groups","meaning":"Current user, ids, groups","example":"id","topic":"Permissions"},{"cmd":"getent group","meaning":"Show a group and its members","example":"getent group sudo","topic":"Permissions"},{"cmd":"useradd -m -s","meaning":"Create a user with home and shell","example":"sudo useradd -m -s /bin/bash deploybot","topic":"Permissions"},{"cmd":"usermod -aG","meaning":"Add user to a group (keep old groups)","example":"sudo usermod -aG docker wicky","topic":"Permissions"},{"cmd":"chown -R user:group","meaning":"Change owner and group","example":"sudo chown -R www-data:www-data /var/www","topic":"Permissions"},{"cmd":"chgrp","meaning":"Change only the group","example":"sudo chgrp devops app.jar","topic":"Permissions"},{"cmd":"sudo","meaning":"Run one command as root","example":"sudo cat /etc/shadow","topic":"Permissions"},{"cmd":"chmod g+s / +t","meaning":"setgid folder / sticky bit","example":"chmod +t dropbox","topic":"Permissions"}],"coverage":[{"item":"chmod with numbers","problems":["d03p01","d03p05"]},{"item":"chmod with letters","problems":["d03p02","d03p08"]},{"item":"chown, chgrp","problems":["d03p06"]},{"item":"umask","problems":["d03p07"]},{"item":"useradd, usermod, groups, id","problems":["d03p04","d03p06"]},{"item":"/etc/passwd, /etc/group","problems":["d03p03","d03p04","d03p06"]},{"item":"sudo","problems":["d03p03","d03p06"]},{"item":"setuid, setgid, sticky bit (read-only demos)","problems":["d03p08"]},{"item":"root vs \"others\" rule","problems":["d03p03"]}],"reset":"rm -rf ~/bash-practice/day03"},{"day":4,"week":1,"title":"Redirection and pipes","goal":"Send normal output and errors where the user wants them, and connect commands with pipes, tee and xargs.","minutes":90,"setup":["mkdir -p ~/bash-practice/day04 && cd ~/bash-practice/day04","# P1: a health script that prints OK lines (stdout) and FAIL lines (stderr)","printf '%s\\n' '#!/bin/bash' 'echo \"OK   nginx is running\"' 'echo \"FAIL redis is not running\" >&2' 'echo \"OK   todo-api is running\"' 'echo \"FAIL postgres port 5432 closed\" >&2' > check-services.sh","chmod +x check-services.sh","# P3: image list and temp build files (one name has a space)","printf '%s\\n' todo-frontend:1.4 todo-backend:2.1 postgres:16 > images.txt","mkdir -p tmp-build","touch tmp-build/a.tmp tmp-build/b.tmp \"tmp-build/c d.tmp\" tmp-build/keep.txt","# P5: a broken deploy step script","printf '%s\\n' '#!/bin/bash' '# Run 3 steps, keep a list of ALL steps in steps.log,' '# save stdout AND stderr of the build in build.log,' '# and restart only if the build worked.' 'build() { echo \"compiling todo-api\"; echo \"error: tests failed\" >&2; return 1; }' 'for step in lint test package; do' '  echo \"step: $step\" > steps.log' 'done' 'build 2>&1 > build.log || echo \"restarting service\"' > deploy-step.sh","cd ~/bash-practice/day04"],"warmup":[{"q":"What number do you give `chmod` for a secret file that only the owner may read and write?","a":"`chmod 600 file`","from_day":3},{"q":"What does `usermod -aG docker wicky` do, and why is `-a` important?","a":"It adds wicky to the docker group. Without `-a`, the user is removed from all other extra groups.","from_day":3},{"q":"Which command shows lines 10 to 12 of a file?","a":"`head -n 12 file | tail -n 3`","from_day":2},{"q":"What does `ls -a` show that `ls` does not?","a":"Hidden files: names that start with a dot, like `.env`.","from_day":1}],"problems":[{"id":"d04p01","title":"Split normal output and errors","type":"command","topic":"Redirection","minutes":13,"optional":false,"core":true,"workdir":".","situation":"A cron job runs `check-services.sh` every 5 minutes. The team wants normal lines in one file and errors in another, and sometimes everything in one log. Each program has two output streams: stdout (normal) and stderr (errors).","task":["Run `./check-services.sh`. All 4 lines appear on the screen.","Send only stdout to `ok.log` with `>`. Which lines still appear on the screen?","Send only stderr to `err.log` with `2>`, and hide stdout with `> /dev/null`.","Send both to `all.log` with `> all.log 2>&1`. Then do the same with the short form `&> all2.log`.","Try the wrong order `2>&1 > wrong.log` and look at what goes into the file."],"hints":["File descriptor 1 = stdout, 2 = stderr. `>` is the same as `1>`.","`2>&1` means \"send 2 to the same place as 1 is going **now**\". Order matters.","Bash reads redirections from left to right: first `> all.log`, then `2>&1`."],"solution":["./check-services.sh > ok.log                  # stdout to file; errors still on screen","echo \"--- ok.log ---\"; cat ok.log","./check-services.sh 2> err.log > /dev/null    # only errors to the file, hide the rest","echo \"--- err.log ---\"; cat err.log","./check-services.sh > all.log 2>&1            # both streams into one file","echo \"--- all.log ---\"; cat all.log","./check-services.sh &> all2.log               # bash short form of > file 2>&1","wc -l all2.log","./check-services.sh 2>&1 > wrong.log          # WRONG order: errors go to the screen","echo \"--- wrong.log ---\"; cat wrong.log"],"explanation":[{"part":"> file","meaning":"Send stdout (stream 1) to a file. The file is emptied first."},{"part":"2> file","meaning":"Send stderr (stream 2) to a file."},{"part":"> /dev/null","meaning":"`/dev/null` is a special file that throws away everything written to it."},{"part":"> all.log 2>&1","meaning":"First stdout goes to the file, then stderr follows stdout. Both end in the file."},{"part":"&> file","meaning":"Bash shortcut for `> file 2>&1`."},{"part":"2>&1 > wrong.log","meaning":"stderr is pointed to the screen (where stdout was at that moment), then stdout moves to the file. Errors stay on screen."}],"expected_output":"FAIL redis is not running\nFAIL postgres port 5432 closed\n--- ok.log ---\nOK   nginx is running\nOK   todo-api is running\n--- err.log ---\nFAIL redis is not running\nFAIL postgres port 5432 closed\n--- all.log ---\nOK   nginx is running\nFAIL redis is not running\nOK   todo-api is running\nFAIL postgres port 5432 closed\n4 all2.log\nFAIL redis is not running\nFAIL postgres port 5432 closed\n--- wrong.log ---\nOK   nginx is running\nOK   todo-api is running","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Writing `2 > err.log` with a space. Bash then passes `2` as an argument and sends stdout to the file.","Using the wrong order `2>&1 > file` in a cron job. Errors are lost, because cron has no screen.","Writing `&2>1`. The correct text is `2>&1` (number, `>`, `&`, number)."],"interview_say":"Every process has stdout (1) and stderr (2). I use `> file 2>&1` to save both, `2> file` for only errors, and `> /dev/null` to hide output. The order matters: the file redirect comes first.","try_yourself":"Run `./check-services.sh 2>&1 | grep FAIL`. Then run `./check-services.sh | grep FAIL`. Why is the output the same on the screen but not for the same reason?","table":{"head":["Write","stdout goes to","stderr goes to"],"rows":[["`cmd > f`","f","screen"],["`cmd 2> f`","screen","f"],["`cmd > f 2>&1`","f","f"],["`cmd &> f`","f","f"],["`cmd 2>&1 > f`","f","screen"]]}},{"id":"d04p02","title":"Overwrite, append and tee: the deploy log","type":"command","topic":"Redirection","minutes":11,"optional":false,"core":false,"workdir":".","situation":"A deploy script writes one line per deploy into `deploy.log`. Yesterday the history disappeared: someone used `>` instead of `>>`. The user also wants to see messages on the screen and save them at the same time.","task":["Write `deploy v1.0` and then `deploy v1.1` into `deploy.log`, both with `>`. Show the file.","Add `deploy v1.2` with `>>`. Show the file.","Use `tee -a` to print `health check OK` on the screen **and** add it to the file.","Show the final file with `cat -n deploy.log`."],"hints":["`>` replaces the file. `>>` adds to the end.","`tee` reads stdin and writes it to the screen and to a file.","`echo \"health check OK\" | tee -a deploy.log`"],"solution":["echo \"deploy v1.0\" > deploy.log","echo \"deploy v1.1\" > deploy.log     # > empties the file first: v1.0 is gone","cat deploy.log","echo \"deploy v1.2\" >> deploy.log    # >> adds at the end","echo \"health check OK\" | tee -a deploy.log","echo \"--- final file ---\"","cat -n deploy.log"],"explanation":[{"part":"> deploy.log","meaning":"Create or empty the file, then write."},{"part":">> deploy.log","meaning":"Append to the end. The old lines stay."},{"part":"tee -a file","meaning":"Copy stdin to the screen and append it to the file. Without `-a`, tee replaces the file."},{"part":"cat -n","meaning":"Print with line numbers."}],"expected_output":"deploy v1.1\nhealth check OK\n--- final file ---\n     1\tdeploy v1.1\n     2\tdeploy v1.2\n     3\thealth check OK","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `>` in a loop or a cron job: only the last line is kept.","Writing `tee deploy.log` without `-a`: the log is replaced, like with `>`.","Running `sudo echo x > /etc/file`. The redirect is done by the normal user, so it fails. Use `echo x | sudo tee -a /etc/file` (Extra E2)."],"interview_say":"`>` overwrites and `>>` appends. When I want to see output and save it, I pipe into `tee -a logfile`.","try_yourself":"Run `set -o noclobber`, then `echo test > deploy.log`. What happens? Turn it off with `set +o noclobber`."},{"id":"d04p03","title":"Pipes and xargs: one command for each image","type":"command","topic":"Redirection","minutes":13,"optional":false,"core":false,"workdir":".","situation":"The user must remove old Docker images listed in `images.txt`, and clean temp build files. To be safe, the user first prints the commands with `echo` (a dry run). One temp file has a space in its name.","task":["Use `xargs` to build one command with all images: `echo docker rmi ...`.","Use `xargs -n 1` to build one command per image.","Use `xargs -I{}` to build `docker pull registry.local/IMAGE` for each image.","Delete only the `.tmp` files in `tmp-build`, also `c d.tmp`, using `printf '%s\\0'` and `xargs -0 rm -v`.","List `tmp-build` to check that `keep.txt` is still there."],"hints":["`xargs` reads words from stdin and adds them to the end of a command.","`-n 1` = one word per command. `-I{}` = put each line where `{}` is.","Names with spaces break plain xargs. Separate names with a null byte (`\\0`) and use `xargs -0`."],"solution":["xargs echo docker rmi < images.txt                  # one command, all images","xargs -n 1 echo docker rmi < images.txt             # one command per image","xargs -I{} echo docker pull registry.local/{} < images.txt","printf '%s\\0' tmp-build/*.tmp | xargs -0 rm -v      # safe with spaces in names","ls tmp-build"],"explanation":[{"part":"xargs cmd < file","meaning":"Read words from the file and run `cmd` with them as arguments."},{"part":"echo docker rmi","meaning":"Dry run: print the command instead of running it. Remove `echo` when the list is correct."},{"part":"-n 1","meaning":"Use at most 1 argument per command."},{"part":"-I{}","meaning":"Run once per line and replace `{}` with the line."},{"part":"printf '%s\\0' files | xargs -0","meaning":"Separate names with a null byte, so spaces in names are safe."},{"part":"rm -v","meaning":"Verbose: print each file that is removed."}],"expected_output":"docker rmi todo-frontend:1.4 todo-backend:2.1 postgres:16\ndocker rmi todo-frontend:1.4\ndocker rmi todo-backend:2.1\ndocker rmi postgres:16\ndocker pull registry.local/todo-frontend:1.4\ndocker pull registry.local/todo-backend:2.1\ndocker pull registry.local/postgres:16\nremoved 'tmp-build/a.tmp'\nremoved 'tmp-build/b.tmp'\nremoved 'tmp-build/c d.tmp'\nkeep.txt","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`ls tmp-build/*.tmp | xargs rm` splits `c d.tmp` into two names: `rm: cannot remove 'tmp-build/c': No such file or directory`.","Running the real `docker rmi` before checking the list with `echo`."],"checks":[{"run":"ls tmp-build/*.tmp | xargs rm","expect":"rm: cannot remove 'tmp-build/c': No such file or directory"}],"interview_say":"A pipe sends the output of one command into the input of the next. `xargs` turns input lines into arguments. I always do a dry run with `echo` first, and use `-0` when names can have spaces.","try_yourself":"Run `seq 1 6 | xargs -n 2 echo pair:`. Then try `-n 3`."},{"id":"d04p04","title":"Write a config file with a here-doc","type":"command","topic":"Redirection","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A setup script must create an Nginx config for the to-do app. The port comes from a variable. A here-doc (`<<EOF`) writes many lines into a file in one command, without an editor.","task":["Set `APP=todo-api` and `PORT=8080`.","Use `cat > nginx-todo.conf <<EOF ... EOF` to write a small `server { }` block that uses `$PORT` and `$APP`.","Show the file. Check that the real port number is inside.","Print a line with `cat <<'EOF'` (quoted). See that `$APP` is NOT replaced.","Use a here-string `<<<` to split `deploy@web-01` into user and host with `read`."],"hints":["Unquoted `EOF`: bash replaces variables inside. Quoted `'EOF'`: text stays exactly as written.","The last line must be only `EOF`, with no spaces before or after.","`IFS=@ read -r user host <<< \"deploy@web-01\"`"],"solution":["APP=todo-api","PORT=8080","cat > nginx-todo.conf <<EOF","server {","    listen 80;","    # app: $APP","    location /api/ {","        proxy_pass http://127.0.0.1:$PORT;","    }","}","EOF","cat nginx-todo.conf","cat <<'EOF'","Quoted EOF: $APP and $(date) are not replaced","EOF","IFS=@ read -r user host <<< \"deploy@web-01\"","echo \"user=$user host=$host\""],"explanation":[{"part":"cat > file <<EOF","meaning":"Here-doc: all lines until `EOF` become the input of `cat`, which writes them into the file."},{"part":"$PORT inside","meaning":"With unquoted EOF, variables and `$( )` are replaced."},{"part":"<<'EOF'","meaning":"Quoted: nothing is replaced. Use it for scripts that contain `$`."},{"part":"<<< \"text\"","meaning":"Here-string: one string as stdin."},{"part":"IFS=@ read -r user host","meaning":"Split the input at `@` into two variables. `IFS` is the field separator."}],"expected_output":"server {\n    listen 80;\n    # app: todo-api\n    location /api/ {\n        proxy_pass http://127.0.0.1:8080;\n    }\n}\nQuoted EOF: $APP and $(date) are not replaced\nuser=deploy host=web-01","expect_exit":0,"output_check":true,"verified":true,"mistakes":["A space after the closing `EOF`, or `EOF` indented: bash does not see the end. It prints a warning with `here-document at line 1 delimited by end-of-file`, and the `EOF ` line goes into the file.","Using unquoted `EOF` for a script that contains `$1` or `$(...)`: they are replaced too early. Use `<<'EOF'`."],"checks":[{"run":"printf 'cat <<EOF\\nhello\\nEOF \\n' > hd.sh; bash hd.sh","expect":"here-document at line 1 delimited by end-of-file"}],"interview_say":"I use a here-doc to write config files from scripts. Unquoted EOF puts variables in; quoted `'EOF'` keeps the text exactly.","try_yourself":"Run `wc -w <<< \"one two three\"`. Then try `tr a-z A-Z <<< \"hello\"`."},{"id":"d04p05","title":"Find the bug: the deploy step script","type":"fix-bug","topic":"Redirection","minutes":14,"optional":false,"core":false,"workdir":".","situation":"In Jenkins, `deploy-step.sh` restarted the service even though the build failed. Also `steps.log` has only one line, and the build errors are not in `build.log`. The goal is written in the comments.","task":["Read `deploy-step.sh`. Then run `bash deploy-step.sh` and look at `steps.log` and `build.log`.","Find 3 bugs: one is in the loop, one is the redirect order, one is the operator before \"restarting\".","Fix them. Run the script again and check both files."],"hints":["Inside the loop, `>` empties `steps.log` every time.","`2>&1 > build.log` sends stderr to the screen. Swap the order.","`||` runs the right side when the left side **fails**. Use `if ... then ... else`."],"solution":["bash deploy-step.sh","echo \"--- steps.log (before) ---\"; cat steps.log","cat > deploy-step.sh <<'EOF'","#!/bin/bash","# Run 3 steps, keep a list of ALL steps in steps.log,","# save stdout AND stderr of the build in build.log,","# and restart only if the build worked.","build() { echo \"compiling todo-api\"; echo \"error: tests failed\" >&2; return 1; }",": > steps.log                        # start with an empty file","for step in lint test package; do","  echo \"step: $step\" >> steps.log    # >> keeps every step","done","if build > build.log 2>&1; then      # file first, then 2>&1","  echo \"restarting service\"","else","  echo \"build failed: not restarting (see build.log)\"","fi","EOF","bash deploy-step.sh","echo \"--- steps.log ---\"; cat steps.log","echo \"--- build.log ---\"; cat build.log"],"explanation":[{"part":"Bug 1: > in the loop","meaning":"Each step emptied the file. Use `>>`, and empty the file once before the loop with `: > steps.log`."},{"part":"Bug 2: 2>&1 > build.log","meaning":"Wrong order, errors went to the screen. Correct: `> build.log 2>&1`."},{"part":"Bug 3: ||","meaning":"`a || b` runs `b` when `a` fails. So the service restarted after a failed build. Use `if` (or `&&`)."},{"part":": > file","meaning":"`:` is a command that does nothing. With `>` it just empties the file."}],"expected_output":"error: tests failed\nrestarting service\n--- steps.log (before) ---\nstep: package\nbuild failed: not restarting (see build.log)\n--- steps.log ---\nstep: lint\nstep: test\nstep: package\n--- build.log ---\ncompiling todo-api\nerror: tests failed","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Writing `build && echo restart || echo failed`. If `echo restart` itself fails, `failed` also prints. An `if` is clearer.","Checking only the screen. With redirects, the useful text is in the file, so always `cat` the log."],"interview_say":"`&&` runs the next command only on success and `||` only on failure. For a deploy step I use `if build > build.log 2>&1; then restart; fi`, so a failed build never restarts the service.","try_yourself":"Change `return 1` to `return 0` in the fixed script and run it. Does it restart now?"},{"id":"d04p06","title":"Group commands: { } vs ( ), and ; && ||","type":"predict","topic":"Redirection","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A health report needs several commands in one file, and a script must look into another folder without changing its own folder. The user predicts each line before running.","task":["Predict, then run: `{ echo \"== report ==\"; echo \"disk ok\"; } > report.txt; cat report.txt`.","Predict, then run: `(cd /var/log && pwd); pwd`.","Predict, then run: `X=1; ( X=2 ); echo \"X is $X\"`.","Predict, then run: `false ; echo A`, `false && echo B`, `false || echo C`."],"hints":["`{ ...; }` runs in the current shell. Note the spaces and the last `;`.","`( ... )` runs in a subshell (a copy). Changes inside do not come back.","`;` always runs the next command, `&&` only after success, `||` only after failure."],"solution":["{ echo \"== report ==\"; echo \"disk ok\"; } > report.txt   # one redirect for both","cat report.txt","(cd /var/log && pwd)       # subshell: folder change stays inside","pwd                        # still in day04","X=1; ( X=2 ); echo \"X is $X\"","false ; echo \"A: after ; always\"","false && echo \"B: never printed\"","false || echo \"C: after || because false failed\""],"explanation":[{"part":"{ a; b; } > f","meaning":"Group in the current shell. One redirect for all commands."},{"part":"( cd x )","meaning":"Subshell. `cd` and variables inside do not change the main shell."},{"part":"false","meaning":"A command that only fails (exit code 1). Good for tests."},{"part":"; / && / ||","meaning":"always / only if the left side worked / only if the left side failed."}],"expected_output":"== report ==\ndisk ok\n/var/log\n/home/wicky/bash-practice/day04\nX is 1\nA: after ; always\nC: after || because false failed","expect_exit":0,"output_check":true,"output_note":"`pwd` shows the folder where the user runs it.","verified":true,"mistakes":["Writing `{echo a; echo b}` without spaces and the last `;`: bash sees a command called `{echo` and prints `bash: {echo: command not found`.","Expecting a variable set inside `( )` to be available later."],"checks":[{"run":"{echo a; echo b}","expect":"bash: {echo: command not found"}],"interview_say":"Braces group commands in the same shell; parentheses start a subshell, so `cd` and variables inside do not leak out. I use `( cd dir && make )` in scripts to stay in my folder.","try_yourself":"Run `( exit 3 ); echo $?`. What exit code do you see?"},{"id":"d04p07","title":"Explain the error: sudo and redirection","type":"explain-error","topic":"Redirection","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A teammate runs `sudo echo \"127.0.0.1 todo.local\" >> /etc/hosts` and gets `Permission denied`, even with sudo. The user must explain why. Here we test the same idea safely on `/root`, where a normal user cannot write.","task":["As your normal user, run `echo hi > /root/note.txt`. Read the error. (It fails, nothing is changed.)","Think: who opens the file in `sudo echo hi > /root/note.txt`? sudo or your shell?","Practise the correct pattern on a copy: copy `/etc/hosts` to `hosts-copy`, then add a line with `echo ... | tee -a hosts-copy > /dev/null`.","Read only: on a real server the fix is `echo \"127.0.0.1 todo.local\" | sudo tee -a /etc/hosts`."],"hints":["The shell handles `>` before the command starts.","`sudo` gives root rights only to the command after it (`echo`), not to the shell's redirect.","`tee` opens the file itself, so `sudo tee` opens it as root."],"solution":["echo hi > /root/note.txt || echo \"exit code: $?\"","cp /etc/hosts hosts-copy","echo \"127.0.0.1 todo.local\" | tee -a hosts-copy > /dev/null","tail -n 1 hosts-copy"],"explanation":[{"part":"Permission denied","meaning":"The user's shell tries to open `/root/note.txt` for writing. The user has no write permission on `/root`."},{"part":"sudo echo hi > file","meaning":"Same error: `echo` runs as root, but the redirect is still done by the normal shell."},{"part":"| sudo tee -a file","meaning":"`tee` runs as root and opens the file itself. `-a` appends."},{"part":"> /dev/null","meaning":"Hide the copy that `tee` prints on the screen."}],"expected_output":"bash: /root/note.txt: Permission denied\nexit code: 1\n127.0.0.1 todo.local","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `sudo bash -c 'echo ... >> /etc/hosts'` everywhere. It works, but quoting gets hard. `sudo tee -a` is simpler.","Forgetting `-a` with tee: `sudo tee /etc/hosts` replaces the whole hosts file."],"interview_say":"The redirect is done by my shell, not by the command, so `sudo echo x > file` still fails. I use `echo x | sudo tee -a file` instead.","try_yourself":"Run `ls -ld /root`. Which permission bits explain the error?"}],"interview":[{"q":"What is the difference between `>` and `>>`?","a":"`>` creates or empties the file and writes. `>>` adds to the end and keeps old content.","topic":"Redirection"},{"q":"What does `2>&1` mean?","a":"Send stderr (2) to the same place as stdout (1) at that moment. `cmd > file 2>&1` puts both in the file.","topic":"Redirection"},{"q":"What is `/dev/null` used for?","a":"It is a special file that throws away everything. `cmd > /dev/null 2>&1` hides all output.","topic":"Redirection"},{"q":"What is the difference between a pipe `|` and a redirect `>`?","a":"A pipe connects the output of one command to the input of another command. A redirect sends output to a file.","topic":"Redirection"},{"q":"What does `tee` do?","a":"It reads stdin and writes it to the screen and to a file at the same time. `tee -a` appends.","topic":"Redirection"}],"recap":[{"cmd":"> / >>","meaning":"Write (overwrite) / append stdout to a file","example":"echo done >> deploy.log","topic":"Redirection"},{"cmd":"2>","meaning":"Send stderr to a file","example":"cmd 2> err.log","topic":"Redirection"},{"cmd":"> file 2>&1","meaning":"Send stdout and stderr to one file","example":"./job.sh > job.log 2>&1","topic":"Redirection"},{"cmd":"&>","meaning":"Bash short form of > file 2>&1","example":"./job.sh &> job.log","topic":"Redirection"},{"cmd":"/dev/null","meaning":"Throw output away","example":"cmd > /dev/null 2>&1","topic":"Redirection"},{"cmd":"|","meaning":"Pipe: output of one command into the next","example":"grep ERROR app.log | wc -l","topic":"Redirection"},{"cmd":"tee -a","meaning":"Show on screen and append to file","example":"echo ok | tee -a deploy.log","topic":"Redirection"},{"cmd":"| sudo tee -a","meaning":"Append to a root-owned file","example":"echo x | sudo tee -a /etc/hosts","topic":"Redirection"},{"cmd":"xargs","meaning":"Turn input into command arguments","example":"xargs -n 1 echo docker rmi < images.txt","topic":"Redirection"},{"cmd":"xargs -I{}","meaning":"Run once per line, {} = the line","example":"xargs -I{} echo pull {} < list","topic":"Redirection"},{"cmd":"xargs -0","meaning":"Null-separated input (safe for spaces)","example":"printf '%s\\0' *.tmp | xargs -0 rm","topic":"Redirection"},{"cmd":"<<EOF / <<'EOF'","meaning":"Here-doc (with / without variables)","example":"cat > app.conf <<EOF","topic":"Redirection"},{"cmd":"<<<","meaning":"Here-string: one string as stdin","example":"wc -w <<< \"a b c\"","topic":"Redirection"},{"cmd":"{ ...; } / ( ... )","meaning":"Group in this shell / in a subshell","example":"(cd /tmp && ls)","topic":"Redirection"},{"cmd":"; && ||","meaning":"Always / on success / on failure","example":"mkdir -p out && cd out","topic":"Redirection"}],"coverage":[{"item":"stdin, stdout, stderr","problems":["d04p01","d04p04"]},{"item":"> and >>","problems":["d04p02","d04p05"]},{"item":"2>, 2>&1, &>","problems":["d04p01","d04p05"]},{"item":"/dev/null","problems":["d04p01","d04p07"]},{"item":"| (pipe)","problems":["d04p02","d04p03"]},{"item":"tee","problems":["d04p02","d04p07"]},{"item":"xargs","problems":["d04p03"]},{"item":"here-doc, here-string","problems":["d04p04","d04p05"]},{"item":"grouping { } and ( )","problems":["d04p06"]},{"item":"; && ||","problems":["d04p05","d04p06"]}],"reset":"rm -rf ~/bash-practice/day04"},{"day":5,"week":1,"title":"Variables and quoting","goal":"Use variables, quotes, command substitution and arithmetic correctly, and know which variables a child process can see.","minutes":90,"setup":["mkdir -p ~/bash-practice/day05/bin && cd ~/bash-practice/day05","# P2: version file of the
