ace range: web-01 web-02 web-03."},{"part":"for ((i=1; i<=3; i++))","meaning":"C-style loop with a counter: start; condition; step."},{"part":"for f in logs/*.log","meaning":"Bash expands the wildcard into file names. Names with spaces stay one item."},{"part":"\"$f\"","meaning":"Quote the loop variable, or `worker 2.log` breaks into two words."}],"expected_output":"ssh web-01 uptime\nssh web-02 uptime\nssh db-01 uptime\ncheck web-01\ncheck web-02\ncheck web-03\nattempt 1 of 3\nattempt 2 of 3\nattempt 3 of 3\nlogs/api.log: 2 lines\nlogs/web.log: 3 lines\nlogs/worker 2.log: 1 lines","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`for i in {1..$N}` does not work: braces expand before variables. Use `for ((i = 1; i <= N; i++))` or `seq 1 \"$N\"`.","No match: if `logs/*.log` matches nothing, the loop runs once with the text `logs/*.log`. Check with `[ -e \"$f\" ] || continue`."],"checks":[{"run":"N=3; for i in {1..$N}; do echo $i; done","expect":"{1..3}"}],"interview_say":"I use a list loop for hosts, a C-style loop for counters and retries, and a glob like `for f in *.log` for files, always quoting `\"$f\"` because names can have spaces.","try_yourself":"Run `N=3; for i in {1..$N}; do echo $i; done`. What prints? Why?"},{"id":"d08p03","title":"until: wait for the database to be ready","type":"script","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"In `docker compose`, the backend often starts before the database is ready and then crashes. A start script must wait until the database answers, but not forever: at most 5 tries.","task":["Use the given fake check `db_ready` (it succeeds on the 3rd call).","Write an `until db_ready; do ... done` loop that prints `waiting for db (try N)`.","Stop with an error message and `exit 1` after 5 tries.","After the loop, print `db is ready after N tries`."],"hints":["`until CMD` loops while CMD fails. It is the opposite of `while CMD`.","Count with `TRY=$((TRY + 1))` and test `[ \"$TRY\" -ge 5 ]` inside the loop.","In real life use `sleep 2` between tries. Here `sleep 0.2` keeps it fast."],"solution":["CALLS=0","db_ready() { CALLS=$((CALLS + 1)); [ \"$CALLS\" -ge 3 ]; }   # fake: ready on the 3rd call","TRY=1","until db_ready; do","  echo \"waiting for db (try $TRY)\"","  if [ \"$TRY\" -ge 5 ]; then echo \"db not ready after $TRY tries\" >&2; exit 1; fi","  TRY=$((TRY + 1))","  sleep 0.2","done","echo \"db is ready after $TRY tries\""],"explanation":[{"part":"until cmd; do ...; done","meaning":"Repeat the body while `cmd` fails (exit code not 0)."},{"part":"db_ready()","meaning":"A fake check. A real one could be `pg_isready -h db` or `nc -z db 5432`."},{"part":"max tries + exit 1","meaning":"Never wait forever in automation. Fail clearly after a limit."},{"part":"sleep 0.2","meaning":"Wait between tries so the loop does not use 100% CPU."}],"expected_output":"waiting for db (try 1)\nwaiting for db (try 2)\ndb is ready after 3 tries","expect_exit":0,"output_check":true,"verified":true,"mistakes":["No limit: an `until` loop without a counter can run forever and block the pipeline.","No `sleep`: the loop checks thousands of times per second and floods the logs."],"interview_say":"I use `until check; do sleep 2; done` to wait for a dependency, always with a maximum number of tries and a clear error, so a pipeline never hangs forever.","try_yourself":"Change the fake check to succeed on the 7th call. What does the script print, and what is the exit code?"},{"id":"d08p04","title":"Indexed and associative arrays","type":"command","topic":"Scripting","minutes":13,"optional":false,"core":false,"workdir":".","situation":"A release script must build three Docker images (a list), and must know the port of each service (a name-to-number map). Bash has indexed arrays for lists and associative arrays for maps.","task":["Create `IMAGES=(todo-frontend todo-backend \"todo worker\")`. Print the count, the first item, and all items one per line.","Add `todo-cron` to the end with `+=`. Print the count again.","Create a map: `declare -A PORTS=([frontend]=80 [backend]=8080 [db]=5432)`.","Print the port of `backend`. Then loop over all keys (sorted) and print `key -> port`.","Check if the key `cache` exists."],"hints":["`${#ARR[@]}` = count, `${ARR[0]}` = first item, `\"${ARR[@]}\"` = all items, each one separate.","Associative arrays need `declare -A`. `${!MAP[@]}` gives the keys.","Keys have no fixed order. Sort them: `printf '%s\\n' \"${!PORTS[@]}\" | sort`."],"solution":["IMAGES=(todo-frontend todo-backend \"todo worker\")","echo \"count: ${#IMAGES[@]}, first: ${IMAGES[0]}\"","for img in \"${IMAGES[@]}\"; do echo \"build: $img\"; done","IMAGES+=(todo-cron)","echo \"count now: ${#IMAGES[@]}, last: ${IMAGES[-1]}\"","declare -A PORTS=([frontend]=80 [backend]=8080 [db]=5432)","echo \"backend port: ${PORTS[backend]}\"","for key in $(printf '%s\\n' \"${!PORTS[@]}\" | sort); do","  echo \"$key -> ${PORTS[$key]}\"","done","[[ -v PORTS[cache] ]] && echo \"cache is set\" || echo \"no port for cache\""],"explanation":[{"part":"ARR=(a b \"c d\")","meaning":"Indexed array with 3 items. Quotes keep `c d` as one item."},{"part":"${#ARR[@]} / ${ARR[0]} / ${ARR[-1]}","meaning":"Number of items / first item (index 0) / last item."},{"part":"\"${ARR[@]}\"","meaning":"All items, each one as a separate word. Always quote it."},{"part":"ARR+=(x)","meaning":"Add an item at the end."},{"part":"declare -A MAP=([k]=v)","meaning":"Associative array: keys are names, not numbers."},{"part":"${!MAP[@]}","meaning":"All keys. The order is random, so sort them for stable output."},{"part":"[[ -v MAP[key] ]]","meaning":"True if the key exists."}],"expected_output":"count: 3, first: todo-frontend\nbuild: todo-frontend\nbuild: todo-backend\nbuild: todo worker\ncount now: 4, last: todo-cron\nbackend port: 8080\nbackend -> 8080\ndb -> 5432\nfrontend -> 80\nno port for cache","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`for img in ${IMAGES[@]}` without quotes splits `todo worker` into two images.","Forgetting `declare -A`: bash makes an indexed array, every key becomes 0, and only the last value stays.","Using `$IMAGES` alone: it gives only the first item."],"checks":[{"run":"IMAGES=(a b \"todo worker\"); for i in ${IMAGES[@]}; do echo \"[$i]\"; done","expect":"[todo]"}],"interview_say":"I use indexed arrays for lists, like images to build, and `declare -A` maps for name-to-value data, like service ports. I always loop with `\"${arr[@]}\"` in quotes.","try_yourself":"Run `unset 'IMAGES[1]'` and print `${!IMAGES[@]}` (the indexes). Is index 1 gone? Is the count 3?"},{"id":"d08p05","title":"Find the bug: the counting loop","type":"fix-bug","topic":"Scripting","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`count-loop.sh` should print the line count of every log, then each path from `paths.txt` exactly as written (one is a Windows path), and the number of paths. The output is wrong in three places.","task":["Run `bash count-loop.sh` and compare with the goal in the comments.","Find 3 bugs: the file loop, the `read` options, and the pipe into `while`.","Fix them and run again. The Windows path must keep its backslashes `\\`, and the third path must keep its 2 leading spaces."],"hints":["`$(ls logs/*.log)` splits `worker 2.log` at the space.","Without `-r`, `read` eats backslashes. Without `IFS=`, it removes leading spaces.","`cat file | while ...` runs the loop in a subshell; COUNT is lost. Use `done < paths.txt`."],"solution":["bash count-loop.sh","echo \"--- fixed ---\"","cat > count-loop.sh <<'EOF'","#!/bin/bash","# Print the line count of every .log file in logs/,","# then print each path in paths.txt exactly as written, and count them.","COUNT=0","for f in logs/*.log; do                  # let bash expand the glob","  echo \"$f: $(wc -l < \"$f\") lines\"","done","while IFS= read -r p; do                 # IFS= keeps spaces, -r keeps backslashes","  echo \"path: [$p]\"","  COUNT=$((COUNT + 1))","done < paths.txt                         # no pipe: COUNT survives","echo \"paths read: $COUNT\"","EOF","bash count-loop.sh"],"explanation":[{"part":"for f in logs/*.log","meaning":"Bug 1: `$(ls ...)` gave words, not names. `worker 2.log` became `logs/worker` and `2.log`."},{"part":"IFS= read -r p","meaning":"Bug 2: `-r` keeps `\\`. `IFS=` (empty) keeps leading and trailing spaces."},{"part":"done < paths.txt","meaning":"Bug 3: with `cat ... |`, the loop was a subshell, so `COUNT` was back to 0 after it."}],"expected_output":"logs/api.log: 2 lines\nlogs/web.log: 3 lines\ncount-loop.sh: line 6: logs/worker: No such file or directory\nlogs/worker:  lines\ncount-loop.sh: line 6: 2.log: No such file or directory\n2.log:  lines\npath: [C:Userswickytodo-app]\npath: [/var/log/todo]\npath: [/opt/todo/config]\npaths read: 0\n--- fixed ---\nlogs/api.log: 2 lines\nlogs/web.log: 3 lines\nlogs/worker 2.log: 1 lines\npath: [C:\\Users\\wicky\\todo-app]\npath: [/var/log/todo]\npath: [  /opt/todo/config]\npaths read: 3","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Thinking `C:Userswickytodo-app` is a typo in the file. It is `read` without `-r` removing the backslashes.","Moving `echo \"paths read\"` inside the loop to \"fix\" the count. The real fix is to remove the pipe."],"checks":[{"run":"bash count-loop.sh","expect":"path: [C:Userswickytodo-app]"},{"run":"bash count-loop.sh","expect":"paths read: 0"}],"interview_say":"The safe pattern is `while IFS= read -r line; do ...; done < file`. Looping over `$(ls)` breaks on spaces, and piping into `while` loses variables because of the subshell.","try_yourself":"Keep the pipe but add `shopt -s lastpipe` at the top of the script. Does COUNT work now? (It works in scripts, not in an interactive shell.)"},{"id":"d08p06","title":"Stop at the first failure: break and continue","type":"script","topic":"Scripting","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A rolling deploy updates servers one by one. Servers marked `SKIP` are in maintenance. If one server returns `FAIL`, the deploy must stop at once so the other servers keep the old, working version.","task":["Read `results.txt` (`host status`) line by line.","`SKIP`: print `skip HOST` and `continue`.","`FAIL`: print `FAIL on HOST, stopping rollout`, and `break`.","`OK`: print `updated HOST`. After the loop, print how many servers were updated."],"hints":["Use `case \"$status\" in ... esac` inside the loop.","`continue` jumps to the next line; `break` leaves the loop.","`db-02` must not be updated, because `db-01` failed before it."],"solution":["UPDATED=0","while read -r host status; do","  case \"$status\" in","    SKIP) echo \"skip $host\"; continue ;;","    FAIL) echo \"FAIL on $host, stopping rollout\"; break ;;","    OK)   echo \"updated $host\"; UPDATED=$((UPDATED + 1)) ;;","  esac","done < results.txt","echo \"servers updated: $UPDATED\""],"explanation":[{"part":"continue","meaning":"Go to the next loop round (next server)."},{"part":"break","meaning":"Leave the loop. Lines after `db-01` are never read."},{"part":"case inside while","meaning":"A common pattern: read a status, then decide."}],"expected_output":"updated web-01\nskip web-02\nupdated web-03\nFAIL on db-01, stopping rollout\nservers updated: 2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `exit` instead of `break`: the whole script ends and the summary line is never printed.","Using `break` in a nested loop and expecting both loops to end. Use `break 2` for two levels."],"interview_say":"In a rolling update I loop over servers, `continue` for ones in maintenance, and `break` on the first failure so the rest keep the working version.","try_yourself":"Change `break` to `break 2` and wrap the `while` loop in `for round in 1 2; do ... done`. What changes?"},{"id":"d08p07","title":"Loop over command output: mapfile and < <( )","type":"command","topic":"Scripting","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The user wants to loop over the output of a command (for example a list of pods or files) and still keep counters after the loop. Two safe ways: `mapfile` into an array, or a loop that reads from `< <(command)`.","task":["Read the log file names into an array: `mapfile -t FILES < <(printf '%s\\n' logs/*.log)`.","Print how many files there are, and each one in brackets.","Count lines over all files with `while IFS= read -r f; do ... done < <(printf '%s\\n' logs/*.log)`.","Print the total after the loop."],"hints":["`<(command)` is process substitution: bash gives the command output as a file.","`mapfile -t ARR` reads lines into an array; `-t` removes the new line at the end of each line.","The loop reads from `< <(...)`, so it runs in the main shell and `TOTAL` keeps its value."],"solution":["mapfile -t FILES < <(printf '%s\\n' logs/*.log)","echo \"files: ${#FILES[@]}\"","for f in \"${FILES[@]}\"; do echo \"[$f]\"; done","TOTAL=0","while IFS= read -r f; do","  TOTAL=$((TOTAL + $(wc -l < \"$f\")))","done < <(printf '%s\\n' logs/*.log)","echo \"total lines: $TOTAL\""],"explanation":[{"part":"<(cmd)","meaning":"Process substitution: the output of `cmd` looks like a file."},{"part":"< <(cmd)","meaning":"Redirect that \"file\" into the loop. Note the space between `<` and `<(`."},{"part":"mapfile -t ARR","meaning":"Read every line into the array ARR (also called `readarray`)."}],"expected_output":"files: 3\n[logs/api.log]\n[logs/web.log]\n[logs/worker 2.log]\ntotal lines: 6","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Writing `<<(cmd)` without the space: `syntax error near unexpected token` (bash reads it as a here-doc).","Using `mapfile` in `sh`: it is a bash feature. Run the script with `bash`."],"checks":[{"run":"printf 'while read x; do echo $x; done <<(echo hi)\\n' > t.sh; bash t.sh","expect":"syntax error near unexpected token"}],"interview_say":"To loop over command output without losing variables, I use `while IFS= read -r x; do ...; done < <(cmd)` or `mapfile -t arr < <(cmd)`.","try_yourself":"Use `mapfile -t LINES < inventory.csv` and print `${LINES[1]}`. Which line is it?"}],"interview":[{"q":"How do you read a file line by line in bash?","a":"`while IFS= read -r line; do ...; done < file`. `-r` keeps backslashes, `IFS=` keeps spaces, and the redirect keeps variables in the main shell.","topic":"Scripting"},{"q":"Why is `for f in $(ls)` a bad idea?","a":"The output is split at spaces, so names with spaces break. Use a glob: `for f in *`.","topic":"Scripting"},{"q":"What is the difference between `break` and `continue`?","a":"`continue` skips to the next loop round. `break` leaves the loop completely.","topic":"Scripting"},{"q":"How do you wait for a service in a script without hanging forever?","a":"An `until` (or `while`) loop with a check, a `sleep`, and a maximum number of tries that ends with `exit 1`.","topic":"Scripting"},{"q":"What is an associative array, and how do you create one?","a":"A map from names to values. `declare -A PORTS=([web]=80)`, then `${PORTS[web]}`. Keys: `${!PORTS[@]}`.","topic":"Scripting"}],"recap":[{"cmd":"for x in a b c","meaning":"Loop over a list","example":"for h in web-{01..03}; do ...; done","topic":"Scripting"},{"cmd":"for ((i=1; i<=N; i++))","meaning":"C-style counter loop","example":"for ((i=1; i<=3; i++)); do ...; done","topic":"Scripting"},{"cmd":"for f in *.log","meaning":"Loop over files (safe with spaces)","example":"for f in logs/*.log; do wc -l \"$f\"; done","topic":"Scripting"},{"cmd":"while IFS= read -r line","meaning":"Read a file line by line","example":"while IFS= read -r l; do ...; done < file","topic":"Scripting"},{"cmd":"IFS=, read -r a b c","meaning":"Split a CSV line into variables","example":"while IFS=, read -r h p e; do ...","topic":"Scripting"},{"cmd":"until cmd","meaning":"Loop while a command fails","example":"until nc -z db 5432; do sleep 2; done","topic":"Scripting"},{"cmd":"break / continue","meaning":"Leave loop / skip to next round","example":"[[ $l == END ]] && break","topic":"Scripting"},{"cmd":"ARR=(a b) / \"${ARR[@]}\"","meaning":"Indexed array / all items","example":"for i in \"${IMAGES[@]}\"; do ...","topic":"Scripting"},{"cmd":"${#ARR[@]} / ARR+=(x)","meaning":"Array length / add item","example":"IMAGES+=(todo-cron)","topic":"Scripting"},{"cmd":"declare -A","meaning":"Associative array (map)","example":"declare -A PORTS=([db]=5432)","topic":"Scripting"},{"cmd":"${!MAP[@]}","meaning":"All keys of a map","example":"printf '%s\\n' \"${!PORTS[@]}\" | sort","topic":"Scripting"},{"cmd":"mapfile -t","meaning":"Read lines into an array","example":"mapfile -t FILES < <(ls)","topic":"Scripting"},{"cmd":"< <(cmd)","meaning":"Loop over command output, keep variables","example":"while read -r x; do ...; done < <(cmd)","topic":"Scripting"}],"coverage":[{"item":"for (list, C-style, files)","problems":["d08p02","d08p05"]},{"item":"while","problems":["d08p01","d08p06"]},{"item":"until","problems":["d08p03"]},{"item":"while IFS= read -r","problems":["d08p01","d08p05","d08p07"]},{"item":"break, continue","problems":["d08p01","d08p06"]},{"item":"Indexed arrays","problems":["d08p04","d08p07"]},{"item":"Associative arrays","problems":["d08p04"]},{"item":"Looping over command output safely","problems":["d08p05","d08p07"]}],"reset":"rm -rf ~/bash-practice/day08"},{"day":9,"week":2,"title":"Functions and script arguments","goal":"Write reusable functions that return data the right way, and scripts that accept options, check input and print a clear usage message.","minutes":90,"setup":["mkdir -p ~/bash-practice/day09 && cd ~/bash-practice/day09","# P5: files of known size, one name with a space","head -c 307200 /dev/zero > big.log","head -c 5120 /dev/zero > small.log","head -c 2048 /dev/zero > \"my notes.txt\"","printf '%s\\n' '#!/bin/bash' '# Print the size in KB of each file given as an argument, then the total.' 'total=0' 'to_kb() {' '  size=$(stat -c %s \"$1\")' '  return $(( size / 1024 ))' '}' 'for f in $*; do' '  to_kb \"$f\"' '  kb=$?' '  echo \"$f: $kb KB\"' '  total=$((total + kb))' 'done' 'echo \"total: $total KB\"' > sizes.sh","# P7: a small helper library","printf '%s\\n' '# helpers.sh - shared functions. Load with: source helpers.sh' 'log()  { echo \"[$(date +%H:%M:%S)] INFO  $*\"; }' 'warn() { echo \"[$(date +%H:%M:%S)] WARN  $*\" >&2; }' 'die()  { echo \"[$(date +%H:%M:%S)] ERROR $*\" >&2; exit 1; }' > helpers.sh","cd ~/bash-practice/day09"],"warmup":[{"q":"Why does `cat file | while read x; do n=$((n+1)); done; echo $n` print an empty or 0 value?","a":"The pipe runs the loop in a subshell. Use `while ...; done < file` instead.","from_day":8},{"q":"How do you get the number of items in the array `IMAGES`?","a":"`${#IMAGES[@]}`","from_day":8},{"q":"What does `${1:-0}` mean?","a":"Use the first argument, or `0` if it is empty or missing.","from_day":6},{"q":"Single or double quotes for `echo \"Hello $USER\"`, and why?","a":"Double quotes, so `$USER` is replaced. Single quotes would print `$USER` literally.","from_day":5}],"problems":[{"id":"d09p01","title":"return vs echo: get a value out of a function","type":"explain-error","topic":"Scripting","minutes":12,"optional":false,"core":true,"workdir":".","situation":"A teammate wrote `get_port() { return 8080; }` and the script tries to connect to port 144. Interviewers love this one: in bash, `return` gives only an exit code (0-255). Real data must be printed with `echo` and caught with `$( )`.","task":["Define `get_port() { return 8080; }`. Call it, then print `$?`. What number do you get?","Define `get_port() { echo 8080; }`. Save the result with `PORT=$(get_port)` and print it.","Write `is_port_open()` that uses `return 0` or `return 1`, and use it in an `if`.","Explain in one sentence when to use `return` and when to use `echo`."],"hints":["Exit codes are 8 bits: 8080 is taken modulo 256.","Data = `echo` + `$(func)`. Success or failure = `return 0` / `return 1` + `if func`.","`8080 % 256` = 144."],"solution":["get_port() { return 8080; }          # WRONG: return is only an exit code","get_port; echo \"return gave: $?\"","get_port() { echo 8080; }            # RIGHT: print the data","PORT=$(get_port)","echo \"echo gave: $PORT\"","is_port_open() {                     # return = yes/no answer","  local port=$1","  [ \"$port\" -eq 8080 ] && return 0","  return 1","}","if is_port_open \"$PORT\"; then echo \"port $PORT is open\"; fi","is_port_open 22 || echo \"port 22 is closed\""],"explanation":[{"part":"return N","meaning":"Ends the function with exit code N (0-255). Read it with `$?` or use the function in `if`."},{"part":"8080 → 144","meaning":"8080 modulo 256 = 144. The value is silently wrong."},{"part":"echo + $(func)","meaning":"The function prints the data; `$( )` catches the output into a variable."},{"part":"if is_port_open","meaning":"`if` looks at the exit code: 0 = true."},{"part":"local port=$1","meaning":"A variable only for this function. Inside a function, `$1` is the function's first argument."}],"expected_output":"return gave: 144\necho gave: 8080\nport 8080 is open\nport 22 is closed","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`return \"todo-api\"` gives `return: todo-api: numeric argument required`.","Printing debug messages with `echo` inside a function that returns data with `echo`: the debug text ends up in the variable. Send debug text to stderr: `echo \"debug\" >&2`."],"checks":[{"run":"f() { return \"todo-api\"; }; f","expect":"return: todo-api: numeric argument required"}],"interview_say":"In bash, `return` only sets the exit code from 0 to 255, so I use it for success or failure. To return data, the function prints it with `echo` and the caller captures it with `$(func)`.","try_yourself":"Run `f() { echo data; echo debug >&2; }; X=$(f); echo \"X=[$X]\"`. Where does `debug` go?","table":{"head":["","return","echo"],"rows":[["Gives","exit code 0-255","any text or number"],["Read with","`$?` or `if func`","`VAR=$(func)`"],["Use for","yes / no, success / failure","data: ports, names, lists"]]}},{"id":"d09p02","title":"Predict: local vs global variables","type":"predict","topic":"Scripting","minutes":11,"optional":false,"core":false,"workdir":".","situation":"A deploy script loops over servers with `i`, and calls a helper that also uses `i`. After the helper runs, the main loop is broken. Bash variables are global by default, even inside functions.","task":["Read the code in the solution box only after you predict: `count_to_2() { for i in 1 2; do :; done; }`.","Predict, then run: `i=10; count_to_2; echo \"i=$i\"`.","Predict, then run the same with `local i` inside the function.","Predict, then run: a function that sets `RESULT=done` (no local). Is `RESULT` visible after the call?"],"hints":["Without `local`, the function changes the global `i`.","`local i` makes a new `i` that exists only while the function runs.","A global set inside a function stays after the call."],"solution":["count_to_2() { for i in 1 2; do :; done; }","i=10; count_to_2; echo \"without local: i=$i\"","count_to_2() { local i; for i in 1 2; do :; done; }","i=10; count_to_2; echo \"with local:    i=$i\"","set_result() { RESULT=done; }","set_result; echo \"RESULT=$RESULT\""],"explanation":[{"part":"no local","meaning":"The function uses the same global `i`. After the loop, `i` is 2."},{"part":"local i","meaning":"A separate `i` for the function only. The global `i` keeps 10."},{"part":"RESULT=done","meaning":"Global again: visible after the call. Sometimes useful, often a surprise."},{"part":":","meaning":"A command that does nothing. Here it is the empty loop body."}],"expected_output":"without local: i=2\nwith local:    i=10\nRESULT=done","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `local` outside a function: `bash: local: can only be used in a function`.","`local x=$(cmd)` hides the exit code of `cmd` (`$?` is the exit code of `local`). Write `local x; x=$(cmd)` when the exit code matters."],"checks":[{"run":"local x=1","expect":"local: can only be used in a function"}],"interview_say":"Variables in bash are global by default, also inside functions. I declare every function variable with `local` so helpers do not break the caller's variables.","try_yourself":"Run `f() { local x; x=$(false); echo $?; }; f` and `g() { local x=$(false); echo $?; }; g`. Why are the numbers different?"},{"id":"d09p03","title":"getopts: a deploy script with options","type":"script","topic":"Scripting","minutes":15,"optional":false,"core":true,"workdir":".","situation":"The team wants `deploy.sh -e staging -v 2.4.1 [-n]`: `-e` environment (required), `-v` version (default `latest`), `-n` dry run. Wrong input must show a usage message and exit 2. This is how real CLI tools behave.","task":["Write a `usage()` function that prints the usage to stderr and exits 2.","Parse options with `while getopts \"e:v:nh\" opt; do case $opt in ... esac; done`.","Set defaults: `VERSION=latest`, `DRY_RUN=false`. Check that `-e` was given and is `dev`, `staging` or `prod`.","Print `deploy VERSION to ENV (dry run: yes/no)`.","Test: `-e staging -v 2.4.1`, `-n -e prod`, no options, `-e test`, and `-x`. Print the exit code each time."],"hints":["In `\"e:v:nh\"`, a colon after a letter means \"this option needs a value\". The value is in `$OPTARG`.","`\\?)` handles unknown options (getopts prints its own error first).","After the loop, check: `[ -n \"$ENV\" ] || usage` and `case $ENV in dev|staging|prod) ;; *) usage ;; esac`."],"solution":["cat > deploy.sh <<'EOF'","#!/bin/bash","usage() {","  echo \"usage: deploy.sh -e <dev|staging|prod> [-v version] [-n]\" >&2","  exit 2","}","ENV=\"\"","VERSION=latest          # default value","DRY_RUN=false","while getopts \"e:v:nh\" opt; do","  case $opt in","    e) ENV=$OPTARG ;;","    v) VERSION=$OPTARG ;;","    n) DRY_RUN=true ;;","    h) usage ;;","    \\?) usage ;;        # unknown option","  esac","done","[ -n \"$ENV\" ] || usage","case $ENV in dev|staging|prod) ;; *) echo \"error: unknown environment '$ENV'\" >&2; usage ;; esac","echo \"deploy $VERSION to $ENV (dry run: $DRY_RUN)\"","EOF","bash deploy.sh -e staging -v 2.4.1; echo \"exit: $?\"","bash deploy.sh -n -e prod;          echo \"exit: $?\"","bash deploy.sh;                     echo \"exit: $?\"","bash deploy.sh -e test;             echo \"exit: $?\"","bash deploy.sh -x;                  echo \"exit: $?\""],"explanation":[{"part":"getopts \"e:v:nh\" opt","meaning":"Read one option per loop round into `opt`. `e:` and `v:` need a value; `n` and `h` do not."},{"part":"$OPTARG","meaning":"The value of the current option, for example `staging`."},{"part":"\\?)","meaning":"getopts sets `opt` to `?` for an unknown option or a missing value."},{"part":"usage() ... exit 2","meaning":"One place for the help text. Exit 2 = wrong usage."},{"part":"defaults before the loop","meaning":"Options only overwrite them when given."},{"part":"validation after the loop","meaning":"Required options and allowed values are checked once, at the end."}],"expected_output":"deploy 2.4.1 to staging (dry run: false)\nexit: 0\ndeploy latest to prod (dry run: true)\nexit: 0\nusage: deploy.sh -e <dev|staging|prod> [-v version] [-n]\nexit: 2\nerror: unknown environment 'test'\nusage: deploy.sh -e <dev|staging|prod> [-v version] [-n]\nexit: 2\ndeploy.sh: illegal option -- x\nusage: deploy.sh -e <dev|staging|prod> [-v version] [-n]\nexit: 2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Forgetting the colon: `getopts \"ev:n\"` and `-e staging` sets nothing, and `staging` is left as a normal argument.","Using `$1`, `$2` by hand for options: it breaks when the user changes the order. getopts handles any order.","getopts only supports short options like `-e`. For `--env`, use a `while`/`case`/`shift` loop (see P4)."],"interview_say":"For script options I use `getopts`, set defaults first, validate required values after the loop, and call a `usage` function that prints to stderr and exits with code 2.","try_yourself":"Add `-r replicas` with a default of 2, and reject values that are not numbers using `[[ $REPLICAS =~ ^[0-9]+$ ]]`."},{"id":"d09p04","title":"\"$@\" vs \"$*\", and shift","type":"command","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A wrapper script `kube.sh` passes all its arguments to another command. One argument contains a space (a label value). Only `\"$@\"` keeps every argument exactly. `shift` is used to take off the first word (a subcommand).","task":["Write `show_args() { for a in \"$@\"; do echo \"[$a]\"; done; }`.","Call a function with `\"$@\"`, with `\"$*\"`, and with `$@` (no quotes), passing: `get pods \"app=todo api\"`.","Use `shift` to read a subcommand: `cmd=$1; shift`, then print the subcommand and the rest.","Print `$#` before and after `shift`."],"hints":["`\"$@\"` = each argument as a separate word, exactly as given.","`\"$*\"` = all arguments joined into ONE word. `$@` without quotes splits at spaces again.","`shift` removes `$1`; then `$2` becomes `$1`, and `$#` is one smaller."],"solution":["show_args() { for a in \"$@\"; do echo \"  [$a]\"; done; }","wrapper() {","  echo \"with \\\"\\$@\\\":\"; show_args \"$@\"","  echo \"with \\\"\\$*\\\":\"; show_args \"$*\"","  echo \"with \\$@ (no quotes):\"; show_args $@","}","wrapper get pods \"app=todo api\"","subcommand() {","  echo \"args: $#\"","  local cmd=$1; shift","  echo \"subcommand: $cmd, rest: $#\"","  show_args \"$@\"","}","subcommand deploy staging \"v2 final\""],"explanation":[{"part":"\"$@\"","meaning":"Each argument separate and unchanged. Use this to pass arguments on."},{"part":"\"$*\"","meaning":"All arguments as one string (joined with spaces). Good for messages only."},{"part":"$@ without quotes","meaning":"Split again at spaces: `app=todo api` becomes two words. A bug."},{"part":"shift","meaning":"Drop the first argument. Common for `tool.sh <subcommand> <args...>`."}],"expected_output":"with \"$@\":\n  [get]\n  [pods]\n  [app=todo api]\nwith \"$*\":\n  [get pods app=todo api]\nwith $@ (no quotes):\n  [get]\n  [pods]\n  [app=todo]\n  [api]\nargs: 3\nsubcommand: deploy, rest: 2\n  [staging]\n  [v2 final]","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Writing `exec kubectl $@` in a wrapper: arguments with spaces break. Always `\"$@\"`.","Calling `shift` when there are no arguments: nothing happens and the exit code is 1. Check `$#` first."],"interview_say":"`\"$@\"` passes every argument exactly as given, so I use it in wrappers. `\"$*\"` joins them into one string. `shift` removes the first argument, which is handy for subcommands.","try_yourself":"Write a loop `while [ $# -gt 0 ]; do echo \"arg: $1\"; shift; done` inside a function and call it with 4 arguments."},{"id":"d09p05","title":"Find the bug: the file size helper","type":"fix-bug","topic":"Scripting","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`sizes.sh` should print the size in KB of each file and the total. For `big.log` (300 KB) it says 44 KB, and `my notes.txt` gives an error. The function uses `return` for data.","task":["Run `bash sizes.sh big.log small.log \"my notes.txt\"`. Compare with `ls -l`.","Find 3 bugs: data returned with `return`, `$*` in the loop, and a variable that should be `local`.","Fix them and run again."],"hints":["300 % 256 = 44. That is the `return` problem from P1.","`for f in $*` splits `my notes.txt` into two words. Use `\"$@\"`.","Inside the function: `local size`. Print the result with `echo`, catch it with `kb=$(to_kb \"$f\")`."],"solution":["bash sizes.sh big.log small.log \"my notes.txt\"","echo \"--- fixed ---\"","cat > sizes.sh <<'EOF'","#!/bin/bash","# Print the size in KB of each file given as an argument, then the total.","total=0","to_kb() {","  local size","  size=$(stat -c %s \"$1\") || return 1","  echo $(( size / 1024 ))","}","for f in \"$@\"; do","  kb=$(to_kb \"$f\") || { echo \"skip $f\" >&2; continue; }","  echo \"$f: $kb KB\"","  total=$((total + kb))","done","echo \"total: $total KB\"","EOF","bash sizes.sh big.log small.log \"my notes.txt\""],"explanation":[{"part":"echo $(( size / 1024 ))","meaning":"Bug 1: print the number. `return 300` became 44."},{"part":"kb=$(to_kb \"$f\")","meaning":"Catch the printed number. `|| { ...; continue; }` skips files that fail."},{"part":"for f in \"$@\"","meaning":"Bug 2: `$*` split `my notes.txt` into `my` and `notes.txt`."},{"part":"local size","meaning":"Bug 3: `size` was global and could clash with the caller."}],"expected_output":"big.log: 44 KB\nsmall.log: 5 KB\nstat: cannot statx 'my': No such file or directory\nmy: 0 KB\nstat: cannot statx 'notes.txt': No such file or directory\nnotes.txt: 0 KB\ntotal: 49 KB\n--- fixed ---\nbig.log: 300 KB\nsmall.log: 5 KB\nmy notes.txt: 2 KB\ntotal: 307 KB","expect_exit":0,"output_check":true,"output_note":"On Ubuntu 22.04 the error says `cannot stat` instead of `cannot statx` (older coreutils). The rest is the same.","verified":true,"mistakes":["Seeing `stat: cannot statx 'my': No such file or directory` and renaming the file. The script must handle spaces.","Keeping `return` and adding `* 256`. Exit codes are never for data."],"checks":[{"run":"bash sizes.sh \"my notes.txt\"","expect":"stat: cannot statx 'my': No such file or directory"}],"interview_say":"I return data with `echo` and capture it with `$( )`, loop over `\"$@\"` so file names with spaces work, and declare function variables `local`.","try_yourself":"Add a check at the top: if no files are given, print `usage: sizes.sh FILE...` to stderr and exit 2."},{"id":"d09p06","title":"Input validation: required, defaults, numbers","type":"script","topic":"Scripting","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A scale script takes `scale.sh <service> [replicas]`. The service is required. Replicas default to 2, must be a whole number, and must be between 1 and 10, or the cluster could be overloaded.","task":["Use `${1:?message}` to stop when the service is missing.","Use `${2:-2}` for the default number of replicas.","Reject non-numbers with `[[ $R =~ ^[0-9]+$ ]]` and values outside 1-10.","Test with: no args, `todo-api`, `todo-api 5`, `todo-api five`, `todo-api 50`."],"hints":["`${1:?service name is required}` prints the message and exits the script (code 1) when `$1` is empty.","Use `(( R >= 1 && R <= 10 ))` for the range check.","Send errors to `>&2` and use `exit 2` for bad input."],"solution":["cat > scale.sh <<'EOF'","#!/bin/bash","SERVICE=${1:?service name is required}","R=${2:-2}","[[ $R =~ ^[0-9]+$ ]] || { echo \"error: replicas must be a number, got '$R'\" >&2; exit 2; }","(( R >= 1 && R <= 10 )) || { echo \"error: replicas must be 1-10, got $R\" >&2; exit 2; }","echo \"kubectl scale deployment/$SERVICE --replicas=$R\"","EOF","for args in \"\" \"todo-api\" \"todo-api 5\" \"todo-api five\" \"todo-api 50\"; do","  bash scale.sh $args; echo \"exit: $?\"","done"],"explanation":[{"part":"${1:?msg}","meaning":"If `$1` is empty or missing: print `msg` to stderr and exit."},{"part":"${2:-2}","meaning":"Default value 2 when the second argument is missing."},{"part":"=~ ^[0-9]+$","meaning":"Only digits, at least one."},{"part":"(( R >= 1 && R <= 10 ))","meaning":"Range check with normal math operators."}],"expected_output":"scale.sh: line 2: 1: service name is required\nexit: 1\nkubectl scale deployment/todo-api --replicas=2\nexit: 0\nkubectl scale deployment/todo-api --replicas=5\nexit: 0\nerror: replicas must be a number, got 'five'\nexit: 2\nerror: replicas must be 1-10, got 50\nexit: 2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Checking the range before the number check: `(( five >= 1 ))` treats `five` as an empty variable (0) and gives a confusing result.","Forgetting that `${1:?}` exits the whole script, not only the function."],"interview_say":"I validate input at the top of the script: required arguments with `${1:?msg}`, defaults with `${2:-value}`, and numbers with a regex and a range check, so bad input never reaches kubectl.","try_yourself":"Change the default to come from an environment variable: `R=${2:-${DEFAULT_REPLICAS:-2}}`. Test with `DEFAULT_REPLICAS=3 bash scale.sh todo-api`."},{"id":"d09p07","title":"A shared function library with source","type":"command","topic":"Scripting","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Every team script has the same `log`, `warn` and `die` functions copied in. A better way: keep them in one file `helpers.sh` and load it with `source`. Then all scripts print messages in the same format.","task":["Read `helpers.sh`.","Write `job.sh` that does `source \"$(dirname \"$0\")/helpers.sh\"`, then calls `log`, `warn`, and `die` if a file is missing.","Run `bash job.sh` and print the exit code. Send stderr to `/dev/null` once to see the difference."],"hints":["`$(dirname \"$0\")` is the folder of the script, so `source` works from any folder.","`warn` and `die` print to stderr; `die` also exits with code 1.","`[ -f config.yml ] || die \"config.yml not found\"`."],"solution":["cat > job.sh <<'EOF'","#!/bin/bash","source \"$(dirname \"$0\")/helpers.sh\"","log \"backup job started\"","warn \"disk is 85% full\"","[ -f config.yml ] || die \"config.yml not found\"","log \"never printed\"","EOF","bash job.sh; echo \"exit: $?\"","echo \"--- stderr hidden ---\"","bash job.sh 2>/dev/null; echo \"exit: $?\""],"explanation":[{"part":"source helpers.sh","meaning":"Load the functions into the current script."},{"part":"$(dirname \"$0\")","meaning":"The script's own folder, so the path works from anywhere."},{"part":"die() { ...; exit 1; }","meaning":"Print an error and stop. Very common helper."},{"part":"$*","meaning":"In a message function, `$*` joins all words into one line."}],"expected_output":"[15:59:16] INFO  backup job started\n[15:59:16] WARN  disk is 85% full\n[15:59:16] ERROR config.yml not found\nexit: 1\n--- stderr hidden ---\n[15:59:16] INFO  backup job started\nexit: 1","expect_exit":0,"output_check":false,"output_note":"The time in brackets is the current time, so it is different on every run.","verified":true,"mistakes":["`source helpers.sh` with a relative path: it fails when the script is started from another folder (`helpers.sh: No such file or directory`).","Putting `exit` in a sourced library outside a function: it ends the script that sources it."],"checks":[{"run":"mkdir -p other && cd other && printf 'source helpers.sh\\n' > j.sh && bash j.sh","expect":"helpers.sh: No such file or directory"}],"interview_say":"I keep shared functions like `log` and `die` in one file and load it with `source`. Errors go to stderr, so tools that read stdout get clean data.","try_yourself":"Add a `debug()` function that only prints when `DEBUG=1` is set. Test with `DEBUG=1 bash job.sh`."}],"interview":[{"q":"How do you return a string from a bash function?","a":"Print it with `echo` and capture it with `VAR=$(func)`. `return` only sets an exit code from 0 to 255.","topic":"Scripting"},{"q":"What does `local` do?","a":"It makes a variable that exists only inside the function, so it does not change a global variable with the same name.","topic":"Scripting"},{"q":"What is the difference between `\"$@\"` and `\"$*\"`?","a":"`\"$@\"` keeps each argument separate and unchanged. `\"$*\"` joins all arguments into one string.","topic":"Scripting"},{"q":"How do you parse options like `-e staging -v 2.4` in bash?","a":"With `while getopts \"e:v:\" opt; do case $opt in e) ENV=$OPTARG;; ... esac; done`. A colon means the option needs a value.","topic":"Scripting"},{"q":"What should a script do when it gets wrong input?","a":"Print a short usage message to stderr and exit with a non-zero code, usually 2.","topic":"Scripting"}],"recap":[{"cmd":"name() { ...; }","meaning":"Define a function","example":"log() { echo \"[INFO] $*\"; }","topic":"Scripting"},{"cmd":"local","meaning":"Variable only inside the function","example":"local port=$1","topic":"Scripting"},{"cmd":"return 0/1","meaning":"Function exit code (yes/no only)","example":"is_up() { curl -sf \"$1\" >/dev/null; }","topic":"Scripting"},{"cmd":"VAR=$(func)","meaning":"Get data from a function (it echoes)","example":"PORT=$(get_port)","topic":"Scripting"},{"cmd":"\"$@\"","meaning":"Pass all arguments unchanged","example":"kubectl \"$@\"","topic":"Scripting"},{"cmd":"\"$*\"","meaning":"All arguments as one string","example":"echo \"args: $*\"","topic":"Scripting"},{"cmd":"shift","meaning":"Drop the first argument","example":"cmd=$1; shift","topic":"Scripting"},{"cmd":"getopts","meaning":"Parse short options","example":"while getopts \"e:v:n\" opt; do ...","topic":"Scripting"},{"cmd":"$OPTARG","meaning":"Value of the current option","example":"e) ENV=$OPTARG ;;","topic":"Scripting"},{"cmd":"${1:?msg}","meaning":"Required argument, else exit with msg","example":"SERVICE=${1:?service required}","topic":"Scripting"},{"cmd":"usage() { ...; exit 2; }","meaning":"Usage message to stderr","example":"[ $# -ge 1 ] || usage","topic":"Scripting"},{"cmd":"source file","meaning":"Load shared functions","example":"source \"$(dirname \"$0\")/helpers.sh\"","topic":"Scripting"}],"coverage":[{"item":"Functions","problems":["d09p01","d09p05","d09p07"]},{"item":"local","problems":["d09p02","d09p05"]},{"item":"return vs echo","problems":["d09p01","d09p05"]},{"item":"Positional parameters","problems":["d09p04","d09p06"]},{"item":"shift","problems":["d09p04"]},{"item":"\"$@\" vs \"$*\"","problems":["d09p04","d09p05"]},{"item":"getopts","problems":["d09p03"]},{"item":"Usage messages","problems":["d09p03","d09p06"]},{"item":"Default values","problems":["d09p03","d09p06"]},{"item":"Input validation","problems":["d09p03","d09p06"]}],"reset":"rm -rf ~/bash-practice/day09"},{"day":10,"week":2,"title":"grep and regular expressions","goal":"Find exactly the lines and values you need in logs and configs with grep options and regular expressions.","minutes":90,"setup":["mkdir -p ~/bash-practice/day10/logs ~/bash-practice/day10/configs && cd ~/bash-practice/day10","# P1: backend log with a Java-style stack trace","printf '%s\\n' '2026-10-20 09:00:01 INFO  OrderService started' '2026-10-20 09:02:15 INFO  GET /api/orders 200' '2026-10-20 09:02:16 WARN  retrying payment call' '2026-10-20 09:02:17 ERROR PaymentClient failed' 'java.net.SocketTimeoutException: Read timed out' '    at PaymentClient.call(PaymentClient.java:42)' '    at OrderService.pay(OrderService.java:88)' '2026-10-20 09:03:00 INFO  GET /api/orders 200' '2026-10-20 09:05:40 ERROR Database pool exhausted' '2026-10-20 09:05:41 INFO  pool size raised to 30' > logs/orders.log","# P2: configs that mention database hosts","printf '%s\\n' 'db_host=db01.internal' 'db_port=5432' > configs/orders.conf","printf '%s\\n' 'db_host=db01.internal' 'cache=redis01' > configs/payments.conf","printf '%s\\n' 'db_host=db011.internal' 'note: db01 is old' > configs/reports.conf","printf '%s\\n' 'cache=redis01' > configs/web.conf","# P3: nginx access log with response times","printf '%s\\n' '10.0.0.5 - - [20/Oct/2026:09:00:01] \"GET /api/todos HTTP/1.1\" 200 512 time=35ms' '10.0.0.7 - - [20/Oct/2026:09:00:02] \"POST /api/todos HTTP/1.1\" 201 128 time=120ms' '192.168.1.20 - - [20/Oct/2026:09:00:03] \"GET /api/todos HTTP/1.1\" 500 64 time=2300ms' '10.0.0.5 - - [20/Oct/2026:09:00:04] \"GET /health HTTP/1.1\" 200 2 time=1ms' '10.0.0.55 - - [20/Oct/2026:09:00:05] \"DELETE /api/todos/7 HTTP/1.1\" 204 0 time=40ms' '192.168.1.20 - - [20/Oct/2026:09:00:06] \"GET /api/todos HTTP/1.1\" 500 64 time=1900ms' > logs/access.log","# P4: sshd-style config with comments and empty lines","printf '%s\\n' '# Example SSH server config (practice copy)' '' 'Port 22' '#PermitRootLogin yes' 'PermitRootLogin no' '' '   # indented comment' 'PasswordAuthentication no' 'MaxAuthTries 3' > configs/sshd_config.copy","# P5: broken alert script","printf '%s\\n' '2026-10-20 10:00:00 ERROR disk write failed' '2026-10-20 10:00:05 FATAL kernel panic on node-3' '2026-10-20 10:00:09 INFO request from 10.0.0.5' '2026-10-20 10:00:10 INFO request from 10.0.0.50' '2026-10-20 10:00:12 INFO request from 10a0b0c5' '2026-10-20 10:00:20 WARN Timeout calling api' '2026-10-20 10:00:21 WARN timeout calling db' > logs/node.log","printf '%s\\n' '#!/bin/bash' '# 1) count lines with ERROR or FATAL' '# 2) show requests from the IP 10.0.0.5 only' '# 3) count timeout warnings (any case)' 'echo \"errors: $(grep -c \"ERROR|FATAL\" logs/node.log)\"' 'grep \"10.0.0.5\" logs/node.log' 'echo \"timeouts: $(grep -c \"timeout\" logs/node.log)\"' > alert.sh","# P6: text with special characters","printf '%s\\n' '[ERROR] price is $5.00' 'ERROR price is 5x00' 'path a.b*c found' > special.txt","cd ~/bash-practice/day10"],"warmup":[{"q":"How does a function give back a string?","a":"It prints it with `echo`; the caller catches it with `VAR=$(func)`. `return` is only for exit codes 0-255.","from_day":9},{"q":"Which loop reads a file line by line safely?","a":"`while IFS= read -r line; do ...; done < file`","from_day":8},{"q":"How do you count ERROR lines in a log?","a":"`grep -c ERROR app.log`","from_day":2},{"q":"Which grep option hides lines that match?","a":"`-v` (invert)","from_day":2}],"problems":[{"id":"d10p01","title":"Errors with context: -n -A -B -C","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The Spring Boot order service failed a payment. `grep ERROR` shows one line, but the real reason (the exception and the stack trace) is in the lines after it. The user also wants the line before each error.","task":["Show ERROR lines with line numbers (`-n`).","Show each ERROR line plus the 3 lines after it (`-A 3`).","Show each ERROR line plus 1 line before it (`-B 1`).","Show 1 line before and after (`-C 1`) for `Timeout`, ignoring case."],"hints":["A = after, B = before, C = context (both sides).","grep prints `--` between groups that are not next to each other.","`grep -n -A 3 ERROR logs/orders.log`"],"solution":["grep -n ERROR logs/orders.log","echo \"=== -A 3 ===\"","grep -A 3 ERROR logs/orders.log","echo \"=== -B 1 ===\"","grep -B 1 ERROR logs/orders.log","echo \"=== -i -C 1 timeout ===\"","grep -i -C 1 timeout logs/orders.log"],"explanation":[{"part":"-n","meaning":"Line numbers. Then the user can open the file at that line (`less +N file`)."},{"part":"-A 3","meaning":"Also print 3 lines After each match: the exception and the stack trace."},{"part":"-B 1","meaning":"Also print 1 line Before each match: what happened just before."},{"part":"-C 1","meaning":"Context: 1 line before and 1 after."},{"part":"--","meaning":"Separator between groups of lines that are far apart."}],"expected_output":"4:2026-10-20 09:02:17 ERROR PaymentClient failed\n9:2026-10-20 09:05:40 ERROR Database pool exhausted\n=== -A 3 ===\n2026-10-20 09:02:17 ERROR PaymentClient failed\njava.net.SocketTimeoutException: Read timed out\n    at PaymentClient.call(PaymentClient.java:42)\n    at OrderService.pay(OrderService.java:88)\n--\n2026-10-20 09:05:40 ERROR Database pool exhausted\n2026-10-20 09:05:41 INFO  pool size raised to 30\n=== -B 1 ===\n2026-10-20 09:02:16 WARN  retrying payment call\n2026-10-20 09:02:17 ERROR PaymentClient failed\n--\n2026-10-20 09:03:00 INFO  GET /api/orders 200\n2026-10-20 09:05:40 ERROR Database pool exhausted\n=== -i -C 1 timeout ===\n2026-10-20 09:02:17 ERROR PaymentClient failed\njava.net.SocketTimeoutException: Read timed out\n    at PaymentClient.call(PaymentClient.java:42)","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Writing `grep -A3B1`. Options with numbers must be separate: `grep -A 3 -B 1`.","Using `-c` together with `-A`: `-c` only counts and ignores the context."],"interview_say":"When I search errors, I use `-A` and `-B` to see the stack trace and what happened before, and `-n` to know the line number.","try_yourself":"Run `grep -n -A 2 'Exception' logs/orders.log`. Then find which Java file and line number caused it."},{"id":"d10p02","title":"Search many files: -r -l -c -w","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The old database server `db01` is being shut down. The user must find every config file that still uses it as `db_host`. Careful: `db011` is a different server, and a comment line only mentions `db01`.","task":["Search all files in `configs/` for `db01` with `-r`. Look at the result.","Show only the file names with `-l`.","Use `-w` (whole word) for `db01`. `reports.conf` uses `db011`, but it is still listed. Why?","Count matches per file with `-c`.","Find only real settings: lines that start with `db_host=db01.`."],"hints":["`-r` = recursive (all files in all sub-folders).","`-w` matches only whole words: `db011` is not the word `db01`.","For the last step use an anchor and escape the dot: `grep -rl '^db_host=db01\\.' configs`."],"solution":["grep -r db01 configs | sort","echo \"=== -l ===\"","grep -rl db01 configs | sort","echo \"=== -w ===\"","grep -rlw db01 configs | sort","echo \"=== -c ===\"","grep -rc db01 configs | sort","echo \"=== real settings ===\"","grep -rl '^db_host=db01\\.' configs | sort"],"explanation":[{"part":"-r","meaning":"Search all files under a folder. Each line starts with `file:`."},{"part":"-l","meaning":"Print only names of files that match (good for a to-do list)."},{"part":"-w","meaning":"Whole word only. `db011` no longer matches, but `reports.conf` stays in the list because its comment line has the whole word `db01`."},{"part":"-c with -r","meaning":"Count per file, also files with 0."},{"part":"^db_host=db01\\.","meaning":"Line starts with `db_host=db01.`. `\\.` is a real dot."},{"part":"| sort","meaning":"grep -r reads files in folder order, which can differ. `sort` makes the output stable."}],"expected_output":"configs/orders.conf:db_host=db01.internal\nconfigs/payments.conf:db_host=db01.internal\nconfigs/reports.conf:db_host=db011.internal\nconfigs/reports.conf:note: db01 is old\n=== -l ===\nconfigs/orders.conf\nconfigs/payments.conf\nconfigs/reports.conf\n=== -w ===\nconfigs/orders.conf\nconfigs/payments.conf\nconfigs/reports.conf\n=== -c ===\nconfigs/orders.conf:1\nconfigs/payments.conf:1\nconfigs/reports.conf:2\nconfigs/sshd_config.copy:0\nconfigs/web.conf:0\n=== real settings ===\nconfigs/orders.conf\nconfigs/payments.conf","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Forgetting `-r` with a folder: `grep: configs: Is a directory`.","Searching `db01` without `-w` or anchors and changing `db011` by mistake in a bulk edit."],"checks":[{"run":"grep db01 configs","expect":"grep: configs: Is a directory"}],"interview_say":"I use `grep -rl` to list the files that contain a string, `-w` to avoid partial matches, and anchors like `^` to match only real settings, not comments.","try_yourself":"Use `grep -rL db01 configs` (capital L). What does it list?"},{"id":"d10p03","title":"Extract values with -o and -E","type":"command","topic":"Text","minutes":14,"optional":false,"core":true,"workdir":".","situation":"The API is slow. The user must pull out only the useful values from the access log: the IP addresses, the response times, and the slow requests over one second. `grep -o` prints only the matching part, not the whole line.","task":["Print all IP addresses (only the IP) with `grep -oE`.","Count requests per IP (sorted).","Print only the `time=...ms` part of each line.","Show full lines where the time has 4 or more digits (1000 ms or more).","Count the 5xx status codes with a regex."],"hints":["IP pattern: `[0-9]{1,3}(\\.[0-9]{1,3}){3}` (1-3 digits, then 3 times dot + 1-3 digits). Use it with `^` because the IP is at the start.","`{4,}` means 4 or more times: `time=[0-9]{4,}ms`.","Status codes are after the closing quote: `\" 5[0-9]{2} `."],"solution":["grep -oE '^[0-9]{1,3}(\\.[0-9]{1,3}){3}' logs/access.log","echo \"=== requests per IP ===\"","grep -oE '^[0-9]{1,3}(\\.[0-9]{1,3}){3}' logs/access.log | sort | uniq -c | sort -rn","echo \"=== response times ===\"","grep -oE 'time=[0-9]+ms' logs/access.log","echo \"=== slow requests (>= 1000 ms) ===\"","grep -E 'time=[0-9]{4,}ms' logs/access.log","echo \"=== 5xx count ===\"","grep -cE '\" 5[0-9]{2} ' logs/access.log"],"explanation":[{"part":"-o","meaning":"Print only the matching text, one match per line."},{"part":"-E","meaning":"Extended regex: `+ ? {n,m} ( ) |` work without backslashes."},{"part":"[0-9]{1,3}","meaning":"A digit, 1 to 3 times."},{"part":"(\\.[0-9]{1,3}){3}","meaning":"A group: a real dot and 1-3 digits, repeated 3 times."},{"part":"[0-9]+","meaning":"One or more digits."},{"part":"{4,}","meaning":"4 or more times, so 1000 and more."},{"part":"sort -rn","meaning":"Sort numbers, biggest first (Day 12)."}],"expected_output":"10.0.0.5\n10.0.0.7\n192.168.1.20\n10.0.0.5\n10.0.0.55\n192.168.1.20\n=== requests per IP ===\n      2 192.168.1.20\n      2 10.0.0.5\n      1 10.0.0.7\n      1 10.0.0.55\n=== response times ===\ntime=35ms\ntime=120ms\ntime=2300ms\ntime=1ms\ntime=40ms\ntime=1900ms\n=== slow requests (>= 1000 ms) ===\n192.168.1.20 - - [20/Oct/2026:09:00:03] \"GET /api/todos HTTP/1.1\" 500 64 time=2300ms\n192.168.1.20 - - [20/Oct/2026:09:00:06] \"GET /api/todos HTTP/1.1\" 500 64 time=1900ms\n=== 5xx count ===\n2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Without `-E`, `+` and `{3}` are normal characters in basic grep. `grep -o 'time=[0-9]+ms'` finds nothing.","Using `.` for a dot: `10.0.0.5` also matches `10a0b0c5`. Escape it: `10\\.0\\.0\\.5`.","Forgetting the anchor: the IP pattern also finds numbers inside the date or URL in other logs."],"checks":[{"run":"grep -o 'time=[0-9]+ms' logs/access.log || echo 'no match'","expect":"no match"}],"interview_say":"I use `grep -oE` to extract only the values I need, like IPs or response times, then `sort | uniq -c` to count them. `-E` enables extended regex with `+`, `{n}` and groups.","try_yourself":"Extract only the numbers: `grep -oE 'time=[0-9]+' logs/access.log | grep -oE '[0-9]+'`. Then add them up in Day 11 with awk."},{"id":"d10p04","title":"Anchors and classes: only the real settings","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A security audit asks: \"Show the active SSH settings, without comments and empty lines.\" The file is a practice copy `configs/sshd_config.copy`. Comments can be indented. The user also checks for `PermitRootLogin`.","task":["Print the file without empty lines (`^$`).","Print it without comment lines too. Use one `grep -Ev` with `^[[:space:]]*(#|$)`.","Print only lines that start with a capital letter (`^[A-Z]`).","Show the active `PermitRootLogin` line (not the commented one).","Find setting lines that end with a number (`[0-9]+$`)."],"hints":["`^` = start of the line, `$` = end. `^$` = an empty line.","`[[:space:]]*` = zero or more spaces or tabs. It catches indented comments.","`grep '^PermitRootLogin'` does not match `#PermitRootLogin` because `#` is first."],"solution":["grep -v '^$' configs/sshd_config.copy","echo \"=== no comments, no empty lines ===\"","grep -Ev '^[[:space:]]*(#|$)' configs/sshd_config.copy","echo \"=== lines starting with a capital ===\"","grep '^[A-Z]' configs/sshd_config.copy","echo \"=== active PermitRootLogin ===\"","grep '^PermitRootLogin' configs/sshd_config.copy","echo \"=== ends with a number ===\"","grep -E '[0-9]+$' configs/sshd_config.copy"],"explanation":[{"part":"^$","meaning":"An empty line: start and end with nothing between."},{"part":"^[[:space:]]*(#|$)","meaning":"Line that is only spaces, or spaces then `#`. With `-v` these are removed."},{"part":"[A-Z]","meaning":"One capital letter. `[[:upper:]]` is the same."},{"part":"[0-9]+$","meaning":"One or more digits at the end of the line."}],"expected_output":"# Example SSH server config (practice copy)\nPort 22\n#PermitRootLogin yes\nPermitRootLogin no\n   # indented comment\nPasswordAuthentication no\nMaxAuthTries 3\n=== no comments, no empty lines ===\nPort 22\nPermitRootLogin no\nPasswordAuthentication no\nMaxAuthTries 3\n=== lines starting with a capital ===\nPort 22\nPermitRootLogin no\nPasswordAuthentication no\nMaxAuthTries 3\n=== active PermitRootLogin ===\nPermitRootLogin no\n=== ends with a number ===\nPort 22\nMaxAuthTries 3","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `grep -v '#'`: it also removes setting lines that have a `#` later in the line.","Thinking `*` in regex means \"any text\" like in file globs. In regex, `.*` means any text."],"interview_say":"To see active config lines I use `grep -Ev '^[[:space:]]*(#|$)' file`. It removes comments, indented comments and empty lines.","try_yourself":"On your real WSL, run the same command on `/etc/ssh/sshd_config` if it exists (read only, no sudo needed for most systems). Compare.","table":{"head":["Regex","Meaning"],"rows":[["`.`","any one character"],["`*`","previous item 0 or more times"],["`+` (-E)","1 or more times"],["`?` (-E)","0 or 1 time"],["`^` / `$`","start / end of line"],["`[abc]` / `[^abc]`","one of / none of"],["`[[:digit:]]` `[[:space:]]`","digit / space or tab"],["`(a|b)` (-E)","a or b"]]}},{"id":"d10p05","title":"Find the bug: the alert script","type":"fix-bug","topic":"Text","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`alert.sh` feeds a Slack alert. It says `errors: 0` but there is an ERROR and a FATAL line. It shows requests from three \"IPs\" instead of one. And it counts only one timeout warning.","task":["Run `bash alert.sh`. Compare with `cat logs/node.log`.","Find 3 bugs: the `|` in a basic regex, the dots in the IP, and the case of `timeout`.","Fix them. The expected result: errors 2, one line for 10.0.0.5, timeouts 2."],"hints":["In basic grep, `|` is a normal character. Use `-E`.","A `.` matches any character, and `10.0.0.5` is also inside `10.0.0.50`. Use `-F` (fixed text) and `-w` (whole word).","`Timeout` and `timeout`: add `-i`."],"solution":["bash alert.sh","echo \"--- fixed ---\"","cat > alert.sh <<'EOF'","#!/bin/bash","# 1) count lines with ERROR or FATAL","# 2) show requests from the IP 10.0.0.5 only","# 3) count timeout warnings (any case)","echo \"errors: $(grep -cE 'ERROR|FATAL' logs/node.log)\"","grep -Fw '10.0.0.5' logs/node.log","echo \"timeouts: $(grep -ci 'timeout' logs/node.log)\"","EOF","bash alert.sh"],"explanation":[{"part":"-E 'ERROR|FATAL'","meaning":"Bug 1: basic grep looked for the text `ERROR|FATAL` literally, so the count was 0."},{"part":"-Fw '10.0.0.5'","meaning":"Bug 2: `-F` = fixed string (dots are dots), `-w` = whole word (not `10.0.0.50`)."},{"part":"-ci","meaning":"Bug 3: count, ignore case: `Timeout` and `timeout`."}],"expected_output":"errors: 0\n2026-10-20 10:00:09 INFO request from 10.0.0.5\n2026-10-20 10:00:10 INFO request from 10.0.0.50\n2026-10-20 10:00:12 INFO request from 10a0b0c5\ntimeouts: 1\n--- fixed ---\nerrors: 2\n2026-10-20 10:00:09 INFO request from 10.0.0.5\ntimeouts: 2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Escaping `\\|` in basic grep works in GNU grep but not everywhere. `-E` is clearer and portable.","Only adding `-F` for the IP: `10.0.0.50` still matches. `-w` is needed too."],"interview_say":"Three regex traps: `|` needs `-E`, a dot matches any character, and grep is case-sensitive. For IPs I use `grep -Fw`.","try_yourself":"Without `-F`, write a regex that matches only `10.0.0.5` as a whole word: `grep -E '\\b10\\.0\\.0\\.5\\b'`."},{"id":"d10p06","title":"grep -F for text with special characters","type":"command","topic":"Text","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A log uses `[ERROR]` in square brackets and shows prices with `$` and dots. In regex, `[ ]`, `$`, `.` and `*` have special meanings, so a normal grep finds the wrong lines. `-F` treats the pattern as plain text.","task":["Run `grep '[ERROR]' special.txt`. Why does it also match the second line, which has no `[ERROR]`?","Run `grep -F '[ERROR]' special.txt`.","Find `$5.00` exactly with `-F`.","Find the text `a.b*c` exactly."],"hints":["`[ERROR]` in regex means \"one of the letters E, R, O\".","`-F` = fixed strings, no regex.","Use single quotes so bash does not touch `$5`."],"solution":["grep '[ERROR]' special.txt","echo \"=== -F ===\"","grep -F '[ERROR]' special.txt","grep -F '$5.00' special.txt","grep -F 'a.b*c' special.txt"],"explanation":[{"part":"[ERROR] as regex","meaning":"A character class: any one of the letters E, R, O. The second line has `ERROR` without brackets, so it matches too."},{"part":"-F","meaning":"Plain text search. Fast, and no character is special."},{"part":"'$5.00'","meaning":"Single quotes: bash does not replace `$5` (the 5th argument)."}],"expected_output":"[ERROR] price is $5.00\nERROR price is 5x00\n=== -F ===\n[ERROR] price is $5.00\n[ERROR] price is $5.00\npath a.b*c found","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Double quotes: `grep -F \"$5.00\"` becomes `grep -F \".00\"`, because `$5` is empty.","Escaping every character by hand: `\\[ERROR\\]` works, but `-F` is simpler and safer."],"checks":[{"run":"set -- a b c d; grep -F \"$5.00\" special.txt","expect":"[ERROR] price is $5.00"}],"interview_say":"When I search for text with special characters like brackets, dots or dollars, I use `grep -F` with single quotes, so nothing is treated as regex.","try_yourself":"Put three IPs in a file `ips.txt`, one per line, and run `grep -Ff ips.txt logs/access.log`. `-f` reads many patterns from a file."},{"id":"d10p07","title":"Groups and alternation: (GET|POST) /api/(todos|users)","type":"command","topic":"Text","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The team lead wants to know how many write requests (POST, PUT, DELETE) the to-do API had, and how many requests went to `/api/todos` with or without an id.","task":["Count requests whose method is POST, PUT or DELETE with `grep -cE`.","Print only the method and path of every API request: `grep -oE '\"(GET|POST|PUT|DELETE) /api/[^ ]*'`.","Match `/api/todos` and `/api/todos/7` with one pattern using `(/[0-9]+)?`."],"hints":["`(A|B|C)` = A or B or C (needs `-E`).","`[^ ]*` = any characters except a space.","`?` after a group = the group is optional."],"solution":["grep -cE '\"(POST|PUT|DELETE) ' logs/access.log","grep -oE '\"(GET|POST|PUT|DELETE) /api/[^ ]*' logs/access.log | tr -d '\"'","grep -cE '/api/todos(/[0-9]+)? ' logs/access.log"],"explanation":[{"part":"(POST|PUT|DELETE)","meaning":"Alternation inside a group: one of the three words."},{"part":"[^ ]*","meaning":"Negated class: everything up to the next space (the path)."},{"part":"(/[0-9]+)?","meaning":"An optional group: `/7`, `/42` or nothing."},{"part":"tr -d '\"'","meaning":"Delete the quote characters from the output (Day 12)."}],"expected_output":"2\nGET /api/todos\nPOST /api/todos\nGET /api/todos\nDELETE /api/todos/7\nGET /api/todos\n5","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Forgetting the space after the method in the pattern: `\"(GET|POST)` also matches `\"GETTER` in other logs.","Writing the group without `-E`: basic grep needs `\\(` `\\)` and `\\|`."],"interview_say":"With `grep -E` I use groups and `|` to match several words, and `?` to make a part optional, for example `/api/todos(/[0-9]+)?`.","try_yourself":"Count requests per method: `grep -oE '\"[A-Z]+ ' logs/access.log | sort | uniq -c`."}],"interview":[{"q":"How do you show 5 lines after each error in a log?","a":"`grep -A 5 ERROR app.log`. `-B` shows lines before, `-C` lines on both sides.","topic":"Text"},{"q":"How do you list only the files that contain a word, in a whole folder?","a":"`grep -rl word folder/`. `-r` searches all files, `-l` prints only file names.","topic":"Text"},{"q":"What does `grep -o` do?","a":"It prints only the matching part of each line, not the whole line. Good for extracting IPs or IDs.","topic":"Text"},{"q":"What is the difference between `grep`, `grep -E` and `grep -F`?","a":"`grep` uses basic regex. `-E` uses extended regex (`+`, `?`, `|`, `{n}`, groups). `-F` searches plain text, no regex at all.","topic":"Text"},{"q":"How do you remove comments and empty lines from a config file?","a":"`grep -Ev '^[[:space:]]*(#|$)' file`.","topic":"Text"}],"recap":[{"cmd":"grep -n","meaning":"Show line numbers","example":"grep -n ERROR app.log","topic":"Text"},{"cmd":"grep -A / -B / -C N","meaning":"N lines after / before / around","example":"grep -A 3 ERROR app.log","topic":"Text"},{"cmd":"grep -r","meaning":"Search a folder recursively","example":"grep -r db01 /etc/app","topic":"Text"},{"cmd":"grep -l / -L","meaning":"Files that match / do not match","example":"grep -rl db01 configs","topic":"Text"},{"cmd":"grep -w","meaning":"Whole words only","example":"grep -w db01 hosts","topic":"Text"},{"cmd":"grep -o","meaning":"Print only the matching part","example":"grep -oE 'time=[0-9]+ms' access.log","topic":"Text"},{"cmd":"grep -E","meaning":"Extended regex: + ? | {n} ( )","example":"grep -E 'ERROR|FATAL' app.log","topic":"Text"},{"cmd":"grep -F","meaning":"Fixed text, no regex","example":"grep -F '[ERROR]' app.log","topic":"Text"},{"cmd":"grep -Ev '^[[:space:]]*(#|$)'","meaning":"Remove comments and empty lines","example":"grep -Ev '^[[:space:]]*(#|$)' sshd_config","topic":"Text"},{"cmd":"^ $ . * [ ] [^ ]","meaning":"Start, end, any char, repeat, class, not-class","example":"grep '^Port' sshd_config","topic":"Text"},{"cmd":"{n,m}","meaning":"Repeat n to m times (-E)","example":"grep -E '[0-9]{4,}ms' access.log","topic":"Text"},{"cmd":"(a|b)","meaning":"Group and alternation (-E)","example":"grep -E '\"(POST|PUT) ' access.log","topic":"Text"}],"coverage":[{"item":"-i -v -c -n","problems":["d10p01","d10p04","d10p05"]},{"item":"-o","problems":["d10p03","d10p07"]},{"item":"-r -l -w","problems":["d10p02","d10p05"]},{"item":"-E -F","problems":["d10p03","d10p05","d10p06"]},{"item":"-A -B -C","problems":["d10p01"]},{"item":"Anchors","problems":["d10p02","d10p04"]},{"item":"Character classes","problems":["d10p04","d10p06"]},{"item":"Groups, extended regex","problems":["d10p03","d10p07"]},{"item":"grep on logs","problems":["d10p01","d10p03","d10p05"]}],"reset":"rm -rf ~/bash-practice/day10"},{"day":11,"week":2,"title":"sed and awk","goal":"Edit config files with sed, cut out parts of logs, and compute counts, sums and averages with awk.","minutes":90,"setup":["mkdir -p ~/bash-practice/day11 && cd ~/bash-practice/day11","# P1/P5/P7: a Spring Boot style config","printf '%s\\n' '# todo-api config' 'server.port=8080' 'db.url=jdbc:postgresql://db01.internal:5432/todo' 'db.password=S3cret!' 'log.path=/var/log/todo/app.log' 'log.level=INFO' 'cache.enabled=false' > app.conf","# P2: a deploy log with sections","printf '%s\\n' '# deploy log' '09:00 checking cluster' '=== deploy start ===' '09:01 pull image todo-api:2.4.1' '09:02 apply manifests' '09:03 rollout status: ok' '=== deploy end ===' '09:04 cleanup' '# end of file' > deploy.log","# P3: access log: ip method path status bytes ms","printf '%s\\n' '10.0.0.5 GET /api/todos 200 512 35' '10.0.0.7 POST /api/todos 201 128 120' '192.168.1.20 GET /api/todos 500 64 2300' '10.0.0.5 GET /health 200 2 1' '10.0.0.7 DELETE /api/todos/7 204 0 40' '192.168.1.20 GET /api/todos 503 64 1900' > access.log","# P4: cloud cost export","printf '%s\\n' 'date,service,cost' '2026-10-01,EC2,12.50' '2026-10-01,S3,1.20' '2026-10-02,EC2,12.50' '2026-10-02,RDS,8.00' '2026-10-03,S3,1.30' '2026-10-03,EC2,13.00' > billing.csv","# P5: users file and a broken script","printf '%s\\n' 'name,team,role' 'pasindu,devops,associate' 'nimal,backend,senior' 'kavya,qa,lead' > users.csv","printf '%s\\n' '#!/bin/bash' '# 1) Print app.conf with the log path /var/log/todo changed to /data/logs/todo (no edit)' '# 2) Print name and role (columns 1 and 3) of each user in users.csv (comma separated), no header' 'OLD=/var/log/todo' 'NEW=/data/logs/todo' 'sed \"s/$OLD/$NEW/\" app.conf' 'awk \"{print $1, $3}\" users.csv' > report.sh","cd ~/bash-practice/day11"],"warmup":[{"q":"Which grep options print only the matching part with extended regex?","a":"`grep -oE 'pattern' file`","from_day":10},{"q":"How do you remove comment and empty lines from a config with grep?","a":"`grep -Ev '^[[:space:]]*(#|$)' file`","from_day":10},{"q":"What is wrong with `get_port() { return 8080; }`?","a":"`return` gives only an exit code 0-255; 8080 becomes 144. Use `echo 8080` and `PORT=$(get_port)`.","from_day":9},{"q":"What does `\"$@\"` do in a wrapper script?","a":"It passes every argument on, exactly as given, also arguments with spaces.","from_day":9}],"problems":[{"id":"d11p01","title":"sed: change config values safely","type":"command","topic":"Text","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The to-do API moves to a new database server and a new port. The user must change `app.conf` without opening an editor (a CI job will do the same). First print the result, then edit the file with a backup, then check the change with `diff`.","task":["Print the file with `server.port` changed from 8080 to 9090 (no edit yet).","Print it with every `db01.internal` changed to `db02.internal`.","Change the log path `/var/log/todo` to `/data/logs/todo`. Use `|` as the delimiter, because the path has `/`.","Now edit the file for real with all three changes in one `sed -i.bak` command (with `-e` for each change).","Show what changed with `diff app.conf.bak app.conf`."],"hints":["Basic form: `sed 's/old/new/' file`. Add `g` at the end to change every match on a line.","Any character can be the delimiter: `sed 's|/var/log/todo|/data/logs/todo|'`.","`-i.bak` edits the file and keeps the old version as `app.conf.bak`."],"solution":["sed 's/^server.port=8080$/server.port=9090/' app.conf | grep port","sed 's/db01\\.internal/db02.internal/g' app.conf | grep db.url","sed 's|/var/log/todo|/data/logs/todo|' app.conf | grep log.path","sed -i.bak -e 's/^server.port=8080$/server.port=9090/' \\","           -e 's/db01\\.internal/db02.internal/g' \\","           -e 's|/var/log/todo|/data/logs/todo|' app.conf","diff app.conf.bak app.conf; echo \"diff exit code: $? (1 = files differ)\""],"explanation":[{"part":"s/old/new/","meaning":"Substitute: replace the first match on each line."},{"part":"g","meaning":"Global: replace every match on the line, not only the first."},{"part":"^...$","meaning":"Anchors: match the whole line, so `server.port=80800` is not changed."},{"part":"db01\\.internal","meaning":"Escape the dot. In regex `.` means any character."},{"part":"s|a|b|","meaning":"Another delimiter, so slashes in paths need no escaping."},{"part":"-i.bak","meaning":"Edit in place and save the original as `.bak`. Without `-i`, sed only prints."},{"part":"-e ... -e ...","meaning":"Several edits in one run. `\\` at the end of a line continues the command."},{"part":"diff exit code 1","meaning":"`diff` returns 1 when the files are different (Day 2). Here that is the expected result."}],"expected_output":"server.port=9090\ndb.url=jdbc:postgresql://db02.internal:5432/todo\nlog.path=/data/logs/todo/app.log\n2,3c2,3\n< server.port=8080\n< db.url=jdbc:postgresql://db01.internal:5432/todo\n---\n> server.port=9090\n> db.url=jdbc:postgresql://db02.internal:5432/todo\n5c5\n< log.path=/var/log/todo/app.log\n---\n> log.path=/data/logs/todo/app.log\ndiff exit code: 1 (1 = files differ)","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Slashes in the pattern: `sed \"s/$OLD/$NEW/\"` with a path gives `sed: -e expression #1, char 9: unknown option to` and the letter `s`. Use `|` as delimiter.","`sed -i` with no backup on the only copy of a config. One wrong regex and the file is broken. Use `-i.bak` or test without `-i` first.","`sed 's/old/new/' file > file` empties the file: bash truncates it before sed reads it."],"checks":[{"run":"OLD=/var/log/todo; NEW=/data; sed \"s/$OLD/$NEW/\" app.conf","expect":"unknown option to `s'"},{"run":"cp app.conf c.conf; sed 's/a/b/' c.conf > c.conf; wc -c < c.conf","expect":"0"}],"interview_say":"I first run sed without `-i` to see the result, then use `sed -i.bak` so I have a backup, and check with `diff`. For paths I use `|` as the delimiter.","try_yourself":"Use a variable: `PORT=7070; sed \"s/^server.port=.*/server.port=$PORT/\" app.conf | grep port`. Why double quotes here?"},{"id":"d11p02","title":"sed: print and delete lines and ranges","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The release manager wants only the deploy part of `deploy.log` (from `=== deploy start ===` to `=== deploy end ===`) for the release notes, without comment lines.","task":["Print only lines 2 to 4 with `sed -n '2,4p'`.","Delete comment lines with `sed '/^#/d'`.","Print the block from `deploy start` to `deploy end` with a range of two patterns.","Print the same block, but without the two `===` marker lines.","Delete the first and the last line of the file (`1d` and `$d`)."],"hints":["`-n` = print nothing unless told. `p` = print. `d` = delete.","A range is `start,end`. Both can be line numbers or `/patterns/`.","For the inner block: pipe the result into `sed '1d;$d'`."],"solution":["sed -n '2,4p' deploy.log","echo \"=== no comments ===\"","sed '/^#/d' deploy.log","echo \"=== deploy block ===\"","sed -n '/deploy start/,/deploy end/p' deploy.log","echo \"=== block without markers ===\"","sed -n '/deploy start/,/deploy end/p' deploy.log | sed '1d;$d'","echo \"=== without first and last line ===\"","sed '1d;$d' deploy.log"],"explanation":[{"part":"sed -n '2,4p'","meaning":"Print only lines 2, 3 and 4."},{"part":"/^#/d","meaning":"Delete every line that starts with `#`."},{"part":"/start/,/end/p","meaning":"Print from the first line that matches `start` to the next line that matches `end`."},{"part":"1d;$d","meaning":"Delete line 1 and the last line. `$` here means the last line, and `;` separates two commands."}],"expected_output":"09:00 checking cluster\n=== deploy start ===\n09:01 pull image todo-api:2.4.1\n=== no comments ===\n09:00 checking cluster\n=== deploy start ===\n09:01 pull image todo-api:2.4.1\n09:02 apply manifests\n09:03 rollout status: ok\n=== deploy end ===\n09:04 cleanup\n=== deploy block ===\n=== deploy start ===\n09:01 pull image todo-api:2.4.1\n09:02 apply manifests\n09:03 rollout status: ok\n=== deploy end ===\n=== block without markers ===\n09:01 pull image todo-api:2.4.1\n09:02 apply manifests\n09:03 rollout status: ok\n=== without first and last line ===\n09:00 checking cluster\n=== deploy start ===\n09:01 pull image todo-api:2.4.1\n09:02 apply manifests\n09:03 rollout status: ok\n=== deploy end ===\n09:04 cleanup","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Forgetting `-n` with `p`: every line is printed, and the matching lines are printed twice.","Using double quotes around `'1d;$d'`: bash replaces `$d` with an empty variable, and sed gets `1d;`."],"interview_say":"`sed -n 'X,Yp'` prints a range of lines, and `/start/,/end/p` prints a block between two patterns. `d` deletes lines, for example `sed '/^#/d'` removes comments.","try_yourself":"Print the file with line numbers using `sed =`. Then try `sed -n '$='` to count the lines."},{"id":"d11p03","title":"awk: a response time report","type":"command","topic":"Text","minutes":14,"optional":false,"core":true,"workdir":".","situation":"The team lead asks: \"How many requests failed, what was the average response time, and which requests were slow?\" The access log has 6 fields: ip, method, path, status, bytes, ms. awk splits each line into fields `$1` to `$NF`.","task":["Print the IP and the status of each line (`$1`, `$4`).","Print the line number (`NR`) and the number of fields (`NF`) of each line.","Print only requests with status 500 or more (`$4 >= 500`).","Count requests and compute the average time (`$6`) in `END`.","Print a header in `BEGIN` and a nicely formatted summary with `printf`."],"hints":["`awk '{print $1, $4}' access.log`. A comma between fields prints a space.","A condition before the braces: `awk '$4 >= 500 {print}' file`.","`{ sum += $6; n++ } END { printf \"avg %.1f ms\\n\", sum / n }`."],"solution":["awk '{print $1, $4}' access.log","echo \"=== NR and NF ===\"","awk '{print NR, NF}' access.log | head -n 2","echo \"=== failed (status >= 500) ===\"","awk '$4 >= 500 {print $1, $3, $4}' access.log","echo \"=== summary ===\"","awk 'BEGIN { printf \"%-14s %6s\\n\", \"path\", \"ms\" }","     $6 > 1000 { printf \"%-14s %6d  SLOW\\n\", $3, $6 }","     { sum += $6; n++; if ($4 >= 500) err++ }","     END { printf \"requests: %d, errors: %d, avg: %.1f ms\\n\", n, err, sum / n }' access.log"],"explanation":[{"part":"$1 ... $6","meaning":"Fields of the line, split by spaces. `$0` is the whole line."},{"part":"NR / NF","meaning":"Number of the Record (line) / Number of Fields on this line."},{"part":"$4 >= 500 {print}","meaning":"Pattern and action: run the action only for lines where the pattern is true."},{"part":"sum += $6; n++","meaning":"Variables start at 0. Add up the time and count the lines."},{"part":"BEGIN / END","meaning":"Run once before the first line / once after the last line."},{"part":"printf \"%-14s %6d %.1f\"","meaning":"Formatted print: text left in 14 spaces, number right in 6, decimal with 1 digit."}],"expected_output":"10.0.0.5 200\n10.0.0.7 201\n192.168.1.20 500\n10.0.0.5 200\n10.0.0.7 204\n192.168.1.20 503\n=== NR and NF ===\n1 6\n2 6\n=== failed (status >= 500) ===\n192.168.1.20 /api/todos 500\n192.168.1.20 /api/todos 503\n=== summary ===\npath               ms\n/api/todos       2300  SLOW\n/api/todos       1900  SLOW\nrequests: 6, errors: 2, avg: 732.7 ms","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Double quotes around awk code: `awk \"{print $1}\"` lets bash replace `$1` first. Always use single quotes.","Dividing in `END` when the file is empty: Ubuntu's default awk (mawk) prints `-nan`, and gawk stops with `division by zero attempted`. Check `if (n > 0)` first.","Comparing as text: if a field is `-` or has letters, awk compares it as a string and the result is strange."],"checks":[{"run":"awk '{s+=$1; n++} END {print s/n}' /dev/null","expect":"-nan"}],"interview_say":"awk splits each line into fields. I use `$1`, `NR` and `NF`, conditions like `$4 >= 500`, and `END` to print sums and averages, for example `awk '{s+=$6} END {print s/NR}'`.","try_yourself":"Print the slowest request only: `sort -k6 -n access.log | tail -n 1`, then do the same with awk using a `max` variable."},{"id":"d11p04","title":"awk on a CSV: cost per service","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"Finance sent the cloud cost export `billing.csv`. The user must report the total cost per service (EC2, S3, RDS) and the grand total. The file is comma separated and has a header line.","task":["Print the service and cost columns with `-F,` (skip the header with `NR > 1`).","Sum the cost per service in an awk array: `sum[$2] += $3`.","Print each service and its total in `END`, sorted by name.","Print the grand total with 2 decimals."],"hints":["`-F,` sets the field separator to a comma.","awk arrays work like bash associative arrays: `sum[\"EC2\"]`.","`for (s in sum)` has no fixed order; pipe the output into `sort`."],"solution":["awk -F, 'NR > 1 {print $2, $3}' billing.csv","echo \"=== total per service ===\"","awk -F, 'NR > 1 { sum[$2] += $3 }","         END { for (s in sum) printf \"%-4s %6.2f\\n\", s, sum[s] }' billing.csv | sort","echo \"=== grand total ===\"","awk -F, 'NR > 1 { t += $3 } END { printf \"%.2f USD\\n\", t }' billing.csv"],"explanation":[{"part":"-F,","meaning":"Split fields at commas instead of spaces."},{"part":"NR > 1","meaning":"Skip line 1 (the header)."},{"part":"sum[$2] += $3","meaning":"An array keyed by service name; add the cost to that key."},{"part":"for (s in sum)","meaning"
