xy_pass\" is not terminated by \";\" in etc-nginx/sites-enabled/todo.conf:5\nnginx: configuration file etc-nginx/sites-enabled/todo.conf test failed\nERROR: new-config/todo.conf failed the nginx test; old config restored, nginx NOT reloaded\nexit code: 1\nthe live config is still the old one\n--- fixed, good config ---\nnginx: the configuration file etc-nginx/sites-enabled/todo.conf syntax is ok\nnginx: configuration file etc-nginx/sites-enabled/todo.conf test is successful\n[mock systemctl] systemctl reload nginx\ndeployed new-config/todo-good.conf\nexit code: 0","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`systemctl restart nginx` instead of `reload`: restart drops open connections; reload keeps serving with the old workers while new ones start.","Editing files directly in `/etc/nginx` on many servers by hand. Use config management (Ansible) or a container image."],"checks":[{"run":"export PATH=\"$PWD/mockbin:$PATH\"; nginx -t -c new-config/todo.conf","expect":"is not terminated by \";\""}],"interview_say":"Before reloading nginx I always run `nginx -t`. My deploy script backs up the old config, tests the new one, reloads only if the test passes, and restores the backup and fails otherwise.","try_yourself":"Add a health check after the reload (`curl -fsS localhost/health`). If it fails, restore the backup and reload again."},{"id":"d26p05","title":"Docker cleanup: keep the 2 newest tags (dry run)","type":"script","topic":"DevOps tools","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The Jenkins build server's disk is full of old Docker images. Policy: for each repository keep the 2 newest tags, remove the rest, and remove dangling `<none>` images. The script prints `docker rmi` commands (dry run) so a human can check them first. `docker images` is a mock that prints saved output.","task":["Use the mocks. Read `docker images` (here: repository, tag, id, created date).","Sort by repository, then by date (newest first).","With awk, count tags per repository and print the ones after the 2nd.","Also print dangling `<none>` images. Print every action as `docker rmi ...` (dry run)."],"hints":["`sort -k1,1 -k4,4r` = by repo, then date reversed.","`awk '$1 == \"<none>\" {print $3; next} ++seen[$1] > 2 {print $1 \":\" $2}'`","Real Docker: `docker images --format '{{.Repository}} {{.Tag}} {{.ID}} {{.CreatedAt}}'` gives the same columns."],"solution":["export PATH=\"$PWD/mockbin:$PATH\"","KEEP=2","docker images | sort -k1,1 -k4,4r \\","  | awk -v keep=\"$KEEP\" '$1 == \"<none>\" { print $3; next } ++seen[$1] > keep { print $1 \":\" $2 }' \\","  | while IFS= read -r img; do","      echo \"docker rmi $img\"","    done","echo \"(dry run: nothing was removed. Real cleanup: pipe into 'sh' after checking, or use: docker image prune -f)\""],"explanation":[{"part":"sort -k1,1 -k4,4r","meaning":"Group by repository; newest date first inside each group."},{"part":"++seen[$1] > keep","meaning":"Count rows per repository; print only after the 2nd."},{"part":"$1 == \"<none>\" ... next","meaning":"Dangling images (no tag): remove by ID, then skip the counter."},{"part":"echo docker rmi","meaning":"Dry run: print, do not run (Day 4)."},{"part":"docker image prune / system prune","meaning":"Built-in cleanup: `docker image prune -f` removes dangling images; `docker system df` shows usage."}],"expected_output":"docker rmi 1b2c3d4e5f6a\ndocker rmi todo-backend:2.3.9\ndocker rmi todo-backend:2.3.8\ndocker rmi todo-frontend:1.3.1\n(dry run: nothing was removed. Real cleanup: pipe into 'sh' after checking, or use: docker image prune -f)","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`docker rmi $(docker images -q)` removes everything, also images that running containers need (or fails with `conflict: unable to remove`).","Sorting dates as text works only for ISO dates (YYYY-MM-DD). Other formats sort wrong."],"interview_say":"To clean Docker images I list them with a fixed `--format`, group by repository, keep the newest N tags, remove dangling images, and print the commands first as a dry run. `docker system df` shows what uses the space.","try_yourself":"Change KEEP to 1. Which images are added to the list?"},{"id":"d26p06","title":"terraform in CI: fmt, validate, plan exit codes (mock)","type":"script","topic":"DevOps tools","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The infrastructure pipeline runs terraform in a shell step. `terraform plan -detailed-exitcode` returns 0 (no changes), 1 (error) or 2 (changes). The script must not treat 2 as a failure. terraform is a mock here.","task":["Use the mocks. Run `terraform fmt -check` and stop with a clear message if files are not formatted (create `.unformatted` to test).","Run `terraform validate`.","Run `terraform plan -detailed-exitcode -out=tfplan` and handle 0, 1 and 2 with `case`."],"hints":["With `set -e`, exit code 2 would stop the script. Capture it: `terraform plan ... || rc=$?`.","`case $rc in 0) ... ;; 2) ... ;; *) ... ;; esac`","`fmt -check` exits 3 when files need formatting."],"solution":["export PATH=\"$PWD/mockbin:$PATH\"","cat > tf-ci.sh <<'EOF'","#!/bin/bash","set -euo pipefail","terraform fmt -check > /dev/null || { echo \"ERROR: run 'terraform fmt' first\" >&2; exit 1; }","terraform validate","rc=0","terraform plan -detailed-exitcode -out=tfplan || rc=$?","case $rc in","  0) echo \"no changes: nothing to apply\" ;;","  2) echo \"changes found: saved to tfplan, waiting for approval\" ;;","  *) echo \"ERROR: plan failed ($rc)\" >&2; exit 1 ;;","esac","EOF","bash tf-ci.sh; echo \"exit code: $?\"","touch .unformatted","bash tf-ci.sh; echo \"exit code: $?\"","rm -f .unformatted"],"explanation":[{"part":"fmt -check","meaning":"Fail when files are not formatted (exit 3)."},{"part":"validate","meaning":"Syntax and internal consistency, no cloud calls."},{"part":"-detailed-exitcode","meaning":"0 = no changes, 1 = error, 2 = changes present."},{"part":"|| rc=$?","meaning":"Catch the exit code so `set -e` does not stop the script on 2."},{"part":"-out=tfplan","meaning":"Save the plan; `terraform apply tfplan` later applies exactly what was reviewed."}],"expected_output":"Success! The configuration is valid.\nPlan: 1 to add, 0 to change, 0 to destroy.\nchanges found: saved to tfplan, waiting for approval\nexit code: 0\nERROR: run 'terraform fmt' first\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Treating exit code 2 as a failure: the pipeline goes red whenever there are changes.","Running `terraform apply -auto-approve` without a reviewed plan in production."],"interview_say":"In CI I run `terraform fmt -check`, `validate`, and `plan -detailed-exitcode -out=tfplan`. I handle exit code 2 as \"changes found\", not as an error, and apply only the saved plan after approval.","try_yourself":"Add `terraform show -no-color tfplan > plan.txt` (it will print a mock line here) and save it as a CI artifact."},{"id":"d26p07","title":"Script patterns for git, docker, kubectl and aws","type":"concept","topic":"DevOps tools","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The same few patterns appear in almost every DevOps script. The user runs them with a dry-run wrapper: a `run` function that prints the command when `DRY_RUN=1` and runs it otherwise.","task":["Write `run() { if [ \"${DRY_RUN:-0}\" = 1 ]; then echo \"+ $*\"; else \"$@\"; fi; }`.","With `DRY_RUN=1`, use `run` for: docker build and push with a git-based tag, kubectl set image, rollout status, and an aws s3 cp.","Read the table of patterns."],"hints":["`\"$@\"` runs the command with its arguments exactly (Day 9).","A tag from git: `TAG=$(git rev-parse --short HEAD 2>/dev/null || echo dev)`.","`kubectl rollout status deployment/X --timeout=120s` waits for the rollout."],"solution":["run() { if [ \"${DRY_RUN:-0}\" = 1 ]; then echo \"+ $*\"; else \"$@\"; fi; }","DRY_RUN=1","TAG=$(git rev-parse --short HEAD 2>/dev/null || echo dev)","IMAGE=registry.example.com/todo-backend:$TAG","run docker build -t \"$IMAGE\" .","run docker push \"$IMAGE\"","run kubectl set image deployment/todo-backend backend=\"$IMAGE\" -n todo","run kubectl rollout status deployment/todo-backend -n todo --timeout=120s","run aws s3 cp build/report.html \"s3://todo-reports/$TAG/report.html\""],"explanation":[{"part":"run()","meaning":"One switch for the whole script: `DRY_RUN=1 ./deploy.sh` shows every command, changes nothing."},{"part":"git rev-parse --short HEAD || echo dev","meaning":"Commit id as image tag; `dev` when not in a git repo (like here)."},{"part":"kubectl set image + rollout status","meaning":"Update the image, then wait until the new pods are ready (fails after the timeout)."}],"expected_output":"+ docker build -t registry.example.com/todo-backend:dev .\n+ docker push registry.example.com/todo-backend:dev\n+ kubectl set image deployment/todo-backend backend=registry.example.com/todo-backend:dev -n todo\n+ kubectl rollout status deployment/todo-backend -n todo --timeout=120s\n+ aws s3 cp build/report.html s3://todo-reports/dev/report.html","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`echo $*` style dry runs that lose quotes: the printed command looks fine, but the real one breaks on spaces. The real run uses `\"$@\"`."],"interview_say":"My deploy scripts check that tools exist, use the git commit as the image tag, wait for `kubectl rollout status`, and support a `DRY_RUN` mode that prints every command instead of running it.","try_yourself":"Run the same lines with `DRY_RUN=0` and the mocks in PATH (`export PATH=\"$PWD/mockbin:$PATH\"`). Which mock answers?","table":{"head":["Task","Pattern"],"rows":[["tool installed?","`command -v kubectl >/dev/null || { echo 'kubectl missing' >&2; exit 1; }`"],["image tag","`git describe --tags --always` or `git rev-parse --short HEAD`"],["wait for rollout","`kubectl rollout status deploy/X --timeout=120s` (non-zero on failure)"],["roll back","`kubectl rollout undo deploy/X`"],["AWS identity check","`aws sts get-caller-identity` before changing anything"],["JSON from AWS","`aws ec2 describe-instances --output json | jq ...` or `--query`"],["docker disk use","`docker system df`, then `docker image prune -f`"]]}}],"interview":[{"q":"How do you read a value from a JSON API response in bash?","a":"With jq: `curl -fsS URL | jq -r '.items[0].name'`. `-r` gives raw text; `select()` filters; `--arg` passes bash values in.","topic":"DevOps tools"},{"q":"How do you find Kubernetes pods that are not healthy?","a":"`kubectl get pods -o json | jq` and check phase, ready and restartCount; or `kubectl get pods --field-selector=status.phase!=Running`. Then `kubectl describe pod` and `kubectl logs --previous`.","topic":"DevOps tools"},{"q":"How do you handle secrets in shell scripts?","a":"Take them from CI secrets or a 600 env file, never hard-code or echo them, mask them in output, avoid `set -x` around them, and keep `.env` in `.gitignore`.","topic":"DevOps tools"},{"q":"How do you change an nginx config safely?","a":"Back up the old file, put the new one in place, run `nginx -t`, and reload only if the test passes; otherwise restore the backup.","topic":"DevOps tools"},{"q":"What does `terraform plan -detailed-exitcode` return?","a":"0 = no changes, 1 = error, 2 = there are changes. CI scripts must not treat 2 as a failure.","topic":"DevOps tools"}],"recap":[{"cmd":"jq -r '.[].field'","meaning":"Raw values from a JSON array","example":"curl -fsS URL | jq -r '.[].tag_name'","topic":"DevOps tools"},{"cmd":"jq 'select(.x == y)'","meaning":"Filter JSON items","example":"jq '.[] | select(.prerelease == false)'","topic":"DevOps tools"},{"cmd":"jq --arg v \"$X\"","meaning":"Pass a bash value into jq","example":"jq --arg t \"$TAG\" '.[] | select(.tag_name == $t)'","topic":"DevOps tools"},{"cmd":"jq -r '... | @tsv'","meaning":"JSON to tab-separated lines","example":"kubectl get pods -o json | jq -r '.items[] | [.metadata.name, .status.phase] | @tsv'","topic":"DevOps tools"},{"cmd":"jq '.x // \"default\"'","meaning":"Default for missing values","example":"jq -r '.state.waiting.reason // \"-\"'","topic":"DevOps tools"},{"cmd":"set -a; source .env; set +a","meaning":"Load and export an env file","example":"set -a; source /etc/todo/.env; set +a","topic":"DevOps tools"},{"cmd":"${SECRET:0:4}****","meaning":"Mask a secret in output","example":"echo \"token: ${TOKEN:0:4}****\"","topic":"DevOps tools"},{"cmd":"nginx -t && systemctl reload nginx","meaning":"Test before reload","example":"sudo nginx -t && sudo systemctl reload nginx","topic":"DevOps tools"},{"cmd":"docker system df / image prune","meaning":"Docker disk use and cleanup","example":"docker image prune -f","topic":"DevOps tools"},{"cmd":"kubectl rollout status / undo","meaning":"Wait for / roll back a deploy","example":"kubectl rollout status deploy/todo-backend --timeout=120s","topic":"DevOps tools"},{"cmd":"terraform plan -detailed-exitcode","meaning":"0 none, 1 error, 2 changes","example":"terraform plan -detailed-exitcode -out=tfplan || rc=$?","topic":"DevOps tools"},{"cmd":"run() dry-run wrapper","meaning":"Print or run commands","example":"DRY_RUN=1 ./deploy.sh","topic":"DevOps tools"}],"coverage":[{"item":"jq","problems":["d26p01","d26p02"]},{"item":"curl to JSON APIs","problems":["d26p01"]},{"item":"docker/kubectl/aws/git/terraform patterns (mocks, dry-run)","problems":["d26p02","d26p05","d26p06","d26p07"]},{"item":"Env files and secrets handling","problems":["d26p03"]},{"item":"nginx -t then reload","problems":["d26p04"]},{"item":"Cleanup of old Docker images (dry-run)","problems":["d26p05"]}],"reset":"rm -rf ~/bash-practice/day26"},{"day":27,"week":4,"title":"CI/CD shell steps","goal":"Write the shell parts of a pipeline: retries with backoff, waiting for a port, version tags from git, a deploy with health check and rollback, and steps whose exit codes Jenkins and GitHub Actions understand.","minutes":90,"setup":["mkdir -p ~/bash-practice/day27 && cd ~/bash-practice/day27","# P3: a small git repo with fixed dates, so commit ids are the same on every machine","export GIT_AUTHOR_NAME=Pasindu GIT_AUTHOR_EMAIL=pasindu@example.com GIT_COMMITTER_NAME=Pasindu GIT_COMMITTER_EMAIL=pasindu@example.com","G=\"git -C repo -c commit.gpgsign=false -c core.autocrlf=false\"","rm -rf repo && git -c init.defaultBranch=main init -q repo","n=0","for msg in \"first version\" \"add todo API\" \"fix login bug\" \"add health endpoint\" \"speed up list query\"; do","  n=$((n + 1)); echo \"change $n\" >> repo/CHANGES.txt","  GIT_AUTHOR_DATE=\"2026-10-0${n}T10:00:00+0530\" GIT_COMMITTER_DATE=\"2026-10-0${n}T10:00:00+0530\" $G add CHANGES.txt","  GIT_AUTHOR_DATE=\"2026-10-0${n}T10:00:00+0530\" GIT_COMMITTER_DATE=\"2026-10-0${n}T10:00:00+0530\" $G commit -q -m \"$msg\"","  [ $n -eq 2 ] && $G tag v1.2.0","done","unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL G","# P4: releases for a symlink deploy, and a broken deploy script","for r in v1 v2-good v2-bad; do mkdir -p \"releases/$r\"; done","echo '{\"status\": \"UP\", \"version\": \"v1\"}' > releases/v1/health.json","echo '{\"status\": \"UP\", \"version\": \"v2\"}' > releases/v2-good/health.json","echo '{\"status\": \"UPGRADING_FAILED\", \"version\": \"v2\"}' > releases/v2-bad/health.json","ln -sfn releases/v1 current","printf '%s\\n' '#!/bin/bash' '# Usage: deploy.sh RELEASE   (a folder in releases/, for example v2-good)' '# Switch \"current\" to the new release, check health, and roll back to the old release' '# if the check fails. The exit code must tell CI if the deploy worked.' 'NEW=$1' 'OLD=$(readlink current)' 'ln -sfn releases/$NEW current' 'if curl -s http://127.0.0.1:8141/current/health.json | grep -q UP; then' '  echo \"deployed $NEW\"' 'else' '  echo \"health check failed, rolling back\"' '  ln -sfn $NEW current' 'fi' > deploy.sh","# P5: pipeline steps","mkdir -p steps","printf '%s\\n' '#!/bin/bash' 'echo \"lint: 0 problems\"' > steps/lint.sh","printf '%s\\n' '#!/bin/bash' 'echo \"test: 41 passed, 1 failed\"' 'exit 1' > steps/test.sh","printf '%s\\n' '#!/bin/bash' 'echo \"deploy: done\"' > steps/deploy.sh","cd ~/bash-practice/day27"],"warmup":[{"q":"How do you get the newest stable tag from a releases JSON API?","a":"`curl -fsS URL | jq -r 'map(select(.prerelease == false)) | .[0].tag_name'`","from_day":26},{"q":"What is the safe pattern for an nginx config change?","a":"Back up, put the new config in place, `nginx -t`, reload only if it passes, else restore.","from_day":26},{"q":"Why do CI scripts need `set -o pipefail`?","a":"Without it, `cmd | tee log` returns tee's exit code (0), so a failing `cmd` looks green.","from_day":22},{"q":"How do you replace a symlink `current` in one step?","a":"`ln -sfn releases/v2 current`","from_day":1}],"problems":[{"id":"d27p01","title":"retry with exponential backoff","type":"script","topic":"CI/CD","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The pipeline's `docker push` and `apt-get update` steps sometimes fail because of short network problems. Instead of failing the build, a `retry` function tries again, waiting 1, 2, 4 ... seconds (exponential backoff), up to a limit.","task":["Write `retry MAX FIRST_DELAY command...`: run the command; on failure wait, double the delay, try again.","Print each failed try to stderr. After MAX tries, return 1.","Test with the given `flaky` function (works on the 3rd call).","Test with `false` and 2 tries: print the exit code."],"hints":["`shift 2` removes MAX and DELAY; then `\"$@\"` is the command.","`until \"$@\"; do ... done` loops while the command fails.","`delay=$((delay * 2))` doubles the wait."],"solution":["retry() {      # usage: retry MAX_TRIES FIRST_DELAY command [args...]","  local max=$1 delay=$2 n=1","  shift 2","  until \"$@\"; do","    if (( n >= max )); then echo \"failed after $n tries: $*\" >&2; return 1; fi","    echo \"try $n failed: $*  (waiting ${delay}s)\" >&2","    sleep \"$delay\"","    n=$((n + 1)); delay=$((delay * 2))","  done","  echo \"ok after $n tries: $*\"","}","flaky() {      # fake network call: fails twice, then works","  local c; c=$(( $(cat .flaky-count 2>/dev/null || echo 0) + 1 ))","  echo \"$c\" > .flaky-count","  [ \"$c\" -ge 3 ]","}","retry 5 1 flaky","rm -f .flaky-count","retry 2 1 false; echo \"exit code: $?\""],"explanation":[{"part":"shift 2; \"$@\"","meaning":"The rest of the arguments is the command, run exactly as given (Day 9)."},{"part":"until \"$@\"","meaning":"Run the command; repeat the body while it fails (Day 8)."},{"part":"delay * 2","meaning":"Exponential backoff: 1, 2, 4, 8 ... seconds. Gives a busy service time to recover."},{"part":"(( n >= max ))","meaning":"A hard limit, so the pipeline fails clearly instead of hanging."},{"part":"return 1","meaning":"The caller (with `set -e`) stops the pipeline step."}],"expected_output":"try 1 failed: flaky  (waiting 1s)\ntry 2 failed: flaky  (waiting 2s)\nok after 3 tries: flaky\ntry 1 failed: false  (waiting 1s)\nfailed after 2 tries: false\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Retrying commands that are not safe to repeat (for example a database migration or a payment). Retry only idempotent steps.","Retrying a real error (wrong password, missing file) many times: it only makes the build slower. Retry network-type errors."],"interview_say":"For flaky network steps I wrap the command in a retry function with a maximum number of tries and exponential backoff, and I only retry steps that are safe to run again.","try_yourself":"Add random jitter: `sleep $((delay + RANDOM % 2))`. Why does jitter help when many clients retry at the same time?"},{"id":"d27p02","title":"wait_for_port before the next step","type":"script","topic":"CI/CD","minutes":12,"optional":false,"core":false,"workdir":".","situation":"In the integration test stage, the pipeline starts PostgreSQL and the backend in containers, then runs tests at once, and the tests fail because the backend is not listening yet. A `wait_for_port` function waits until the port accepts connections, with a timeout.","task":["Write `wait_for_port HOST PORT TIMEOUT` using bash's `/dev/tcp/HOST/PORT` (no extra tools).","Start a test server that begins listening after 2 seconds, in the background.","Wait for it (timeout 10). Then wait for a port that never opens (timeout 3) and print the exit code."],"hints":["`(echo > /dev/tcp/127.0.0.1/8142) 2>/dev/null` succeeds only if the port is open.","Use `SECONDS` to measure the time (Day 12).","`nc -z HOST PORT` is another way, if netcat is installed."],"solution":["wait_for_port() {      # usage: wait_for_port HOST PORT [TIMEOUT_SECONDS]","  local host=$1 port=$2 timeout=${3:-30} start=$SECONDS","  until (echo > \"/dev/tcp/$host/$port\") 2>/dev/null; do","    if (( SECONDS - start >= timeout )); then","      echo \"timeout: $host:$port not open after ${timeout}s\" >&2","      return 1","    fi","    sleep 1","  done","  echo \"$host:$port is open\"","}","( sleep 2; exec python3 -m http.server 8142 --bind 127.0.0.1 > /dev/null 2>&1 ) &","SRV=$!","wait_for_port 127.0.0.1 8142 10","wait_for_port 127.0.0.1 8143 3; echo \"exit code: $?\"","kill $SRV"],"explanation":[{"part":"/dev/tcp/HOST/PORT","meaning":"A bash feature: opening this \"file\" makes a TCP connection. Works without nc or curl."},{"part":"( ... ) 2>/dev/null","meaning":"Try in a subshell and hide the `Connection refused` message."},{"part":"SECONDS - start","meaning":"Seconds waited so far."},{"part":"return 1 on timeout","meaning":"The pipeline fails with a clear message instead of running tests against nothing."},{"part":"port open ≠ ready","meaning":"A port can be open before the app is ready. For HTTP apps also wait for the health endpoint (Day 25)."}],"expected_output":"127.0.0.1:8142 is open\ntimeout: 127.0.0.1:8143 not open after 3s\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`sleep 30` before the tests \"to be safe\": slow on good days, still too short on bad days. Wait for the real condition.","Using `/dev/tcp` in a script run by `sh`: it is a bash feature only."],"interview_say":"Instead of fixed sleeps, my pipelines wait for the real condition: `wait_for_port` with `/dev/tcp` or `nc -z`, then the health endpoint, always with a timeout that fails the step.","try_yourself":"In Docker Compose, the same idea is a `healthcheck` plus `depends_on: condition: service_healthy`. Find one in a compose file you know."},{"id":"d27p03","title":"Version tags with git describe","type":"command","topic":"CI/CD","minutes":12,"optional":false,"core":false,"workdir":".","situation":"Every build of the to-do backend needs a unique, readable version for the Docker tag and the release notes. `git describe` turns the last tag plus the commits since then into a version like `v1.2.0-3-g1a2b3c4`. The release job also needs the next patch version.","task":["In `repo`, show the history with `git log --oneline --decorate` and the tags.","Run `git describe --tags` and explain the 3 parts.","Get only the last tag (`--abbrev=0`) and compute the next patch version (v1.2.0 → v1.2.1).","Change a file without committing, and run `git describe --tags --dirty`.","Build the Docker image name from the describe output."],"hints":["`v1.2.0-3-gXXXXXXX` = tag, commits since the tag, `g` + short commit id.","`IFS=. read -r MA MI PA <<< \"${TAG#v}\"` splits the numbers.","`--dirty` adds `-dirty` when there are uncommitted changes."],"solution":["cd repo","git log --oneline --decorate","git tag","DESC=$(git describe --tags)","echo \"describe: $DESC\"","LAST=$(git describe --tags --abbrev=0)","IFS=. read -r MA MI PA <<< \"${LAST#v}\"","echo \"last tag: $LAST, next patch: v$MA.$MI.$((PA + 1))\"","echo \"change 6\" >> CHANGES.txt","echo \"with local changes: $(git describe --tags --dirty)\"","git checkout -q -- CHANGES.txt","echo \"image: registry.example.com/todo-backend:${DESC#v}\""],"explanation":[{"part":"git describe --tags","meaning":"Nearest tag + number of commits since it + `g` + short commit id."},{"part":"--abbrev=0","meaning":"Only the tag name."},{"part":"IFS=. read -r ... <<<","meaning":"Split `1.2.0` at the dots into three variables (Day 4, Day 8)."},{"part":"--dirty","meaning":"Mark builds made from uncommitted code: they must never go to production."},{"part":"git checkout -- file","meaning":"Throw away the local change again."},{"part":"${DESC#v}","meaning":"Docker tags often drop the `v` (Day 13)."}],"expected_output":"f763ad2 (HEAD -> main) speed up list query\n0c8bc65 add health endpoint\n4a81894 fix login bug\n59077f8 (tag: v1.2.0) add todo API\n330c79d first version\nv1.2.0\ndescribe: v1.2.0-3-gf763ad2\nlast tag: v1.2.0, next patch: v1.2.1\nwith local changes: v1.2.0-3-gf763ad2-dirty\nimage: registry.example.com/todo-backend:1.2.0-3-gf763ad2","expect_exit":0,"output_check":true,"output_note":"Commit ids are the same as here because the setup used fixed names and dates.","verified":true,"mistakes":["CI checks out with `--depth 1` (shallow clone): tags are missing and `git describe` fails with `fatal: No names found, cannot describe anything.` Fetch tags (`git fetch --tags --unshallow`) or use `--always`.","Using `latest` as the only tag: nobody can tell which code runs, and rolling back to a known version is hard."],"checks":[{"run":"git init -q empty && cd empty && git describe --tags","expect":"fatal: No names found, cannot describe anything."}],"interview_say":"I version builds with `git describe --tags --always --dirty`: the last tag, commits since it, and the commit id. It is unique per commit, readable, and I can roll back to any version.","try_yourself":"Run `git describe --tags --always` in a folder with a new repo that has no tags. What does `--always` print?"},{"id":"d27p04","title":"Find the bug: deploy with health check and rollback","type":"fix-bug","topic":"CI/CD","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`deploy.sh` switches the `current` symlink to a new release and checks its health. Yesterday a bad release stayed live after a failed check, CI showed the deploy as green, and a typo in the release name broke the site completely.","task":["Start the test server: `python3 -m http.server 8141 --bind 127.0.0.1 > /dev/null 2>&1 &`.","Run `bash deploy.sh v2-bad; echo $?` and then `readlink current`.","Reset with `ln -sfn releases/v1 current`. Run `bash deploy.sh v9; echo $?` (a release that does not exist).","Find 4 bugs: no check that the release exists, a health check that matches the wrong text, the rollback target, and the exit code.","Fix it and test `v2-bad`, `v9` and `v2-good`."],"hints":["`[ -d \"releases/$NEW\" ] || { echo ... >&2; exit 2; }` before switching.","`grep -q UP` also matches `UPGRADING_FAILED`. Match the exact JSON: `grep -q '\"status\": \"UP\"'`.","Roll back to `$OLD`, then `exit 1`."],"solution":["python3 -m http.server 8141 --bind 127.0.0.1 > /dev/null 2>&1 &","SRV=$!","sleep 1","bash deploy.sh v2-bad; echo \"exit code: $?\"; echo \"current -> $(readlink current)\"","ln -sfn releases/v1 current","bash deploy.sh v9; echo \"exit code: $?\"; echo \"current -> $(readlink current)\"","ln -sfn releases/v1 current","cat > deploy.sh <<'EOF'","#!/bin/bash","# Usage: deploy.sh RELEASE   (a folder in releases/, for example v2-good)","# Switch \"current\" to the new release, check health, and roll back to the old release","# if the check fails. The exit code must tell CI if the deploy worked.","set -euo pipefail","NEW=${1:?usage: deploy.sh RELEASE}","[ -d \"releases/$NEW\" ] || { echo \"error: release $NEW does not exist\" >&2; exit 2; }","OLD=$(readlink current)","ln -sfn \"releases/$NEW\" current","if curl -fs --max-time 5 http://127.0.0.1:8141/current/health.json | grep -q '\"status\": \"UP\"'; then","  echo \"deployed $NEW\"","else","  ln -sfn \"$OLD\" current","  echo \"health check failed, rolled back to $OLD\" >&2","  exit 1","fi","EOF","echo \"--- fixed ---\"","for r in v2-bad v9 v2-good; do","  bash deploy.sh \"$r\"; echo \"$r: exit code $?, current -> $(readlink current)\"","done","kill $SRV"],"explanation":[{"part":"[ -d releases/$NEW ]","meaning":"Bug 1: `v9` created a broken symlink, so the site served nothing."},{"part":"grep -q '\"status\": \"UP\"'","meaning":"Bug 2: `grep -q UP` matched `UPGRADING_FAILED`."},{"part":"ln -sfn \"$OLD\" current","meaning":"Bug 3: the rollback pointed to `$NEW` (and even without `releases/`)."},{"part":"exit 1 after rollback","meaning":"Bug 4: the script ended with 0, so CI showed a failed deploy as green."},{"part":"set -euo pipefail, curl -f --max-time","meaning":"Safe defaults (Day 22, Day 18)."},{"part":"symlink switch","meaning":"`ln -sfn` changes the live release in one step, and rollback is the same command with the old target."}],"expected_output":"deployed v2-bad\nexit code: 0\ncurrent -> releases/v2-bad\nhealth check failed, rolling back\nexit code: 0\ncurrent -> v9\n--- fixed ---\nhealth check failed, rolled back to releases/v1\nv2-bad: exit code 1, current -> releases/v1\nerror: release v9 does not exist\nv9: exit code 2, current -> releases/v1\ndeployed v2-good\nv2-good: exit code 0, current -> releases/v2-good","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Checking health only once, at once after the switch: some apps need a few seconds. Use the retry function from P1.","Rolling back without an alert: the team does not know the release failed. Exit non-zero so CI reports it."],"interview_say":"My deploy script validates the input, switches the release with an atomic symlink, runs a health check with timeout, and on failure rolls back to the previous release and exits non-zero so the pipeline goes red.","try_yourself":"Use `retry 3 1 check_health` from P1 instead of a single check."},{"id":"d27p05","title":"Pipeline steps: exit codes for Jenkins and GitHub Actions","type":"script","topic":"CI/CD","minutes":14,"optional":false,"core":false,"workdir":".","situation":"Jenkins `sh` steps and GitHub Actions `run:` steps are bash scripts: a non-zero exit code fails the stage. The user writes a small parameterised runner `ci.sh --env ENV --steps a,b,c [--dry-run]` that runs steps in order, stops at the first failure, and prints a GitHub Actions error annotation.","task":["Parse long options with a `while`/`case`/`shift` loop: `--env`, `--steps`, `--dry-run`. Validate `--env`.","Split `--steps` at commas into an array.","Run `steps/NAME.sh` for each step; on failure print `::error::step NAME failed (exit N)` and exit with that code.","Run it: dry run for all steps; real run for `lint,test,deploy`; real run for `lint,deploy`."],"hints":["`while [ $# -gt 0 ]; do case $1 in --env) ENV=$2; shift 2 ;; ... esac; done`","`IFS=, read -r -a STEPS <<< \"$LIST\"`","`bash \"steps/$s.sh\" || { rc=$?; echo \"::error::...\"; exit $rc; }`"],"solution":["cat > ci.sh <<'EOF'","#!/bin/bash","# Usage: ci.sh --env dev|staging|prod --steps lint,test,deploy [--dry-run]","set -euo pipefail","usage() { echo \"usage: ci.sh --env dev|staging|prod --steps a,b,c [--dry-run]\" >&2; exit 2; }","ENV=\"\"; LIST=\"\"; DRY=false","while [ $# -gt 0 ]; do","  case $1 in","    --env) ENV=${2:-}; shift 2 ;;","    --steps) LIST=${2:-}; shift 2 ;;","    --dry-run) DRY=true; shift ;;","    *) usage ;;","  esac","done","case $ENV in dev|staging|prod) ;; *) usage ;; esac","[ -n \"$LIST\" ] || usage","IFS=, read -r -a STEPS <<< \"$LIST\"","for s in \"${STEPS[@]}\"; do","  if $DRY; then echo \"[dry-run] would run steps/$s.sh for $ENV\"; continue; fi","  echo \"::group::$s\"","  bash \"steps/$s.sh\" || { rc=$?; echo \"::endgroup::\"; echo \"::error::step $s failed (exit $rc)\"; exit $rc; }","  echo \"::endgroup::\"","done","echo \"pipeline OK for $ENV\"","EOF","bash ci.sh --env staging --steps lint,test,deploy --dry-run; echo \"exit code: $?\"","echo \"---\"","bash ci.sh --env staging --steps lint,test,deploy; echo \"exit code: $?\"","echo \"---\"","bash ci.sh --env staging --steps lint,deploy; echo \"exit code: $?\"","bash ci.sh --env qa --steps lint; echo \"exit code: $?\""],"explanation":[{"part":"while/case/shift","meaning":"Parse long options (`--env value`); getopts only knows short ones (Day 9)."},{"part":"IFS=, read -r -a","meaning":"Split a comma list into an array."},{"part":"|| { rc=$?; ...; exit $rc; }","meaning":"Keep the original exit code of the failed step and stop."},{"part":"::group:: / ::error::","meaning":"GitHub Actions workflow commands: fold the log, and show a red annotation. Jenkins just shows the text."},{"part":"Jenkinsfile","meaning":"`sh './ci.sh --env staging --steps lint,test'` — a non-zero exit fails the stage."},{"part":"GitHub Actions","meaning":"`run: ./ci.sh --env staging --steps lint,test` — the runner uses `bash -e`, and non-zero fails the job."}],"expected_output":"[dry-run] would run steps/lint.sh for staging\n[dry-run] would run steps/test.sh for staging\n[dry-run] would run steps/deploy.sh for staging\npipeline OK for staging\nexit code: 0\n---\n::group::lint\nlint: 0 problems\n::endgroup::\n::group::test\ntest: 41 passed, 1 failed\n::endgroup::\n::error::step test failed (exit 1)\nexit code: 1\n---\n::group::lint\nlint: 0 problems\n::endgroup::\n::group::deploy\ndeploy: done\n::endgroup::\npipeline OK for staging\nexit code: 0\nusage: ci.sh --env dev|staging|prod --steps a,b,c [--dry-run]\nexit code: 2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`|| echo \"failed\"` without `exit`: the step prints an error but the pipeline continues and deploys untested code.","Different behavior on CI and laptops because of `sh` vs `bash`. Put `#!/bin/bash` and call scripts with `bash`, or set `shell: bash` in GitHub Actions."],"interview_say":"In Jenkins and GitHub Actions every shell step passes or fails by its exit code. My CI scripts use `set -euo pipefail`, take parameters as options, stop at the first failing step, and keep that step's exit code.","try_yourself":"Add `--retries N` and run each step with `retry N 1 bash steps/$s.sh` from P1."},{"id":"d27p06","title":"Compare versions with sort -V (no downgrades)","type":"command","topic":"CI/CD","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A deploy pipeline must refuse to deploy an older version by mistake (for example `v1.9.2` over `v1.10.0`). Text sorting puts `v1.10.0` before `v1.9.2`; version sorting with `sort -V` gets it right.","task":["Sort `v1.9.2 v1.10.0 v1.2.0` with `sort` and with `sort -V`. Compare.","Write `is_newer A B` that is true when A is newer than B.","Test: `v1.10.0` vs `v1.9.2`, and `v1.2.0` vs `v1.10.0`."],"hints":["`printf '%s\\n' \"$A\" \"$B\" | sort -V | tail -n 1` = the newer one.","A is newer if it is the last one and not equal to B.","`sort -V` = natural version sort (GNU)."],"solution":["printf '%s\\n' v1.9.2 v1.10.0 v1.2.0 | sort | xargs echo \"text sort:   \"","printf '%s\\n' v1.9.2 v1.10.0 v1.2.0 | sort -V | xargs echo \"version sort:\"","is_newer() { [ \"$1\" != \"$2\" ] && [ \"$(printf '%s\\n' \"$1\" \"$2\" | sort -V | tail -n 1)\" = \"$1\" ]; }","is_newer v1.10.0 v1.9.2 && echo \"v1.10.0 is newer than v1.9.2: deploy\"","is_newer v1.2.0 v1.10.0 || echo \"v1.2.0 is not newer than v1.10.0: refuse (downgrade)\""],"explanation":[{"part":"sort","meaning":"Text order compares character by character: `1` < `9`, so `v1.10` comes first."},{"part":"sort -V","meaning":"Version order: numbers inside the text are compared as numbers."},{"part":"is_newer","meaning":"Returns 0 (true) or 1 (false), so it works in `if` and with `&&`/`||` (Day 9)."}],"expected_output":"text sort:    v1.10.0 v1.2.0 v1.9.2\nversion sort: v1.2.0 v1.9.2 v1.10.0\nv1.10.0 is newer than v1.9.2: deploy\nv1.2.0 is not newer than v1.10.0: refuse (downgrade)","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Comparing versions as strings with `[[ $a > $b ]]`: `v1.10.0` is \"smaller\" than `v1.9.2` in text order."],"interview_say":"To compare versions in bash I use `sort -V`, which sorts numbers inside the version as numbers. That lets a pipeline refuse accidental downgrades.","try_yourself":"Where does `v1.10.0-rc1` go in `sort -V` compared to `v1.10.0`? Is that what you want for pre-releases?"}],"interview":[{"q":"How do Jenkins and GitHub Actions know if a shell step failed?","a":"Only by the exit code: 0 passes, anything else fails the step. That is why CI scripts need `set -euo pipefail` and must not hide errors.","topic":"CI/CD"},{"q":"How would you write a retry for a flaky command?","a":"A loop with a maximum number of tries and a growing sleep (exponential backoff), running `\"$@\"` and returning non-zero after the last failure.","topic":"CI/CD"},{"q":"How do you wait for a service in a pipeline?","a":"Wait for the real condition with a timeout: `wait_for_port` (`/dev/tcp` or `nc -z`) and then the health endpoint with `curl -f`. Not a fixed `sleep`.","topic":"CI/CD"},{"q":"How do you create a version for every build?","a":"`git describe --tags --always --dirty` gives the last tag, commits since it and the commit id, for example `v1.2.0-3-g1a2b3c4`.","topic":"CI/CD"},{"q":"How does a deploy script roll back?","a":"Keep the previous release, switch to the new one, check health; if it fails, switch back (for example `ln -sfn` to the old release or `kubectl rollout undo`) and exit non-zero.","topic":"CI/CD"}],"recap":[{"cmd":"retry N DELAY cmd...","meaning":"Retry with exponential backoff","example":"retry 5 2 docker push \"$IMAGE\"","topic":"CI/CD"},{"cmd":"until \"$@\"; do ...; done","meaning":"Repeat while a command fails","example":"until curl -fs \"$URL\"; do sleep 2; done","topic":"CI/CD"},{"cmd":"(echo > /dev/tcp/HOST/PORT)","meaning":"Test a TCP port with bash only","example":"(echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && echo open","topic":"CI/CD"},{"cmd":"git describe --tags --always --dirty","meaning":"Version from git","example":"VERSION=$(git describe --tags --always --dirty)","topic":"CI/CD"},{"cmd":"git describe --tags --abbrev=0","meaning":"Last tag only","example":"LAST=$(git describe --tags --abbrev=0)","topic":"CI/CD"},{"cmd":"IFS=. read -r A B C <<< \"$V\"","meaning":"Split a version into numbers","example":"IFS=. read -r MA MI PA <<< \"1.2.0\"","topic":"CI/CD"},{"cmd":"ln -sfn new current / old current","meaning":"Atomic switch and rollback","example":"ln -sfn releases/v2 current","topic":"CI/CD"},{"cmd":"while/case/shift","meaning":"Parse long options","example":"case $1 in --env) ENV=$2; shift 2 ;; esac","topic":"CI/CD"},{"cmd":"IFS=, read -r -a ARR","meaning":"Comma list to array","example":"IFS=, read -r -a STEPS <<< \"lint,test\"","topic":"CI/CD"},{"cmd":"::error:: / ::group::","meaning":"GitHub Actions log commands","example":"echo \"::error::tests failed\"","topic":"CI/CD"},{"cmd":"sort -V","meaning":"Version sort","example":"printf '%s\\n' v1.9 v1.10 | sort -V","topic":"CI/CD"}],"coverage":[{"item":"Deploy script with validation","problems":["d27p04"]},{"item":"Rollback","problems":["d27p04"]},{"item":"retry function with backoff","problems":["d27p01"]},{"item":"wait_for_port","problems":["d27p02"]},{"item":"Version tagging with git describe","problems":["d27p03","d27p06"]},{"item":"Exit codes in Jenkins/GitHub Actions steps","problems":["d27p05"]},{"item":"Parameterised scripts","problems":["d27p05"]}],"reset":"rm -rf ~/bash-practice/day27"},{"day":28,"week":4,"review_day":true,"title":"Final mock interview and capstone","goal":"Prove it under interview conditions: three whiteboard scripts, one final bug hunt, 30 rapid-fire questions, 6 troubleshooting scenarios, and the final checklist.","minutes":90,"interview_minutes":20,"setup":["mkdir -p ~/bash-practice/day28 && cd ~/bash-practice/day28","# W1: a small access log (combined format, one broken line)","for i in $(seq 1 40); do","  case $(( i % 5 )) in 0) ip=10.0.0.5 ;; 1) ip=10.0.0.7 ;; 2) ip=192.168.1.20 ;; 3) ip=10.0.0.5 ;; 4) ip=172.16.0.3 ;; esac","  case $(( i % 6 )) in 0) st=500 ;; 3) st=503 ;; *) st=200 ;; esac","  printf '%s - - [20/Oct/2026:11:%02d:00 +0530] \"GET /api/todos HTTP/1.1\" %s 512 \"-\" \"curl/8.5.0\"\\n' \"$ip\" \"$i\" \"$st\"","done > access.log","echo '203.0.113.99 - - [20/Oct/2026:11:59:00 +0530] \"-\" 400 0 \"-\" \"-\"' >> access.log","# W2: data to back up","mkdir -p app-data/uploads","echo 'todo list' > app-data/todos.csv","echo 'avatar' > app-data/uploads/u1.png","# W3: a list of URLs to check, and a tiny site","mkdir -p site","echo '{\"status\":\"UP\"}' > site/health.json","echo '<h1>Todo<\/h1>' > site/index.html","printf '%s\\n' '# service checks' 'http://127.0.0.1:8151/health.json' 'http://127.0.0.1:8151/index.html' '' 'http://127.0.0.1:8151/missing' 'http://127.0.0.1:8159/' > urls.txt","# P4: the take-home script with bugs from all four weeks","printf '%s\\n' 'C:\\temp\\export' '/var/log/todo' > paths.txt","printf '%s\\n' '#!/bin/bash' '# take-home.sh: for each path in paths.txt print \"path: <path>\" exactly as written,' '# count the lines of access.log that have status 500 or 503,' '# and append one summary line per run to summary.log. Exit 1 if access.log is missing.' 'LOG=access.log' 'if [-f $LOG]; then echo \"log found\"; else echo \"no log\"; exit 1; fi' 'while read p; do echo \"path: $p\"; done < paths.txt' 'count_errors() { return $(grep -cE \" 50[03] \" $LOG); }' 'count_errors' 'ERRORS=$?' 'echo \"$(date +%F) errors=$ERRORS\" > summary.log' 'echo \"errors: $ERRORS\"' > take-home.sh","cd ~/bash-practice/day28"],"warmup":[{"q":"How does a shell step tell Jenkins it failed?","a":"With a non-zero exit code. Nothing else counts.","from_day":27},{"q":"Which exit codes do Nagios-style checks use?","a":"0 OK, 1 WARNING, 2 CRITICAL, 3 UNKNOWN.","from_day":25},{"q":"What is the order of checks when you cannot SSH to a server?","a":"Name (DNS), then port/network (`nc -zv host 22`), then key, user and permissions, then `ssh -v` and the server's auth log.","from_day":21},{"q":"Give the classic top-IPs pipeline.","a":"`awk '{print $1}' access.log | sort | uniq -c | sort -rn | head`","from_day":14}],"problems":[{"id":"d28p01","title":"Whiteboard 1: top IPs that got server errors","type":"script","topic":"Scripting","minutes":14,"optional":false,"core":false,"workdir":".","situation":"Interviewer: \"Write a script that takes an Nginx access log and prints the N client IPs that received the most 5xx errors. Handle bad input.\" Write it on paper first (8 minutes), then type and test it.","task":["Usage: `top-errors.sh LOGFILE [N]`, N defaults to 3. Wrong usage → message to stderr, exit 2.","If the file cannot be read → error, exit 1.","Parse robustly (split at the quotes), keep only 5xx, count per IP, biggest first, top N.","Test: normal run, `N=1`, a missing file, and no arguments."],"hints":["Start with `set -euo pipefail` and `LOG=${1:-}`.","`awk -F'\"' '{split($1, f, \" \"); split($3, a, \" \"); if (a[1] >= 500) print f[1]}'`","`| sort | uniq -c | sort -rn | head -n \"$N\"`"],"solution":["cat > top-errors.sh <<'EOF'","#!/bin/bash","# Usage: top-errors.sh LOGFILE [N]   - top N client IPs by number of 5xx responses","set -euo pipefail","LOG=${1:-}; N=${2:-3}","[ -n \"$LOG\" ] || { echo \"usage: top-errors.sh LOGFILE [N]\" >&2; exit 2; }","[[ $N =~ ^[0-9]+$ ]] || { echo \"error: N must be a number\" >&2; exit 2; }","[ -r \"$LOG\" ] || { echo \"error: cannot read $LOG\" >&2; exit 1; }","awk -F'\"' '{ split($1, f, \" \"); split($3, a, \" \"); if (a[1] >= 500) print f[1] }' \"$LOG\" \\","  | sort | uniq -c | sort -rn | head -n \"$N\"","EOF","bash top-errors.sh access.log; echo \"exit code: $?\"","bash top-errors.sh access.log 1; echo \"exit code: $?\"","bash top-errors.sh nope.log; echo \"exit code: $?\"","bash top-errors.sh; echo \"exit code: $?\""],"explanation":[{"part":"set -euo pipefail","meaning":"Safe defaults: say this out loud in the interview (Day 22)."},{"part":"usage → exit 2, missing file → exit 1","meaning":"Different codes for wrong usage and runtime errors (Day 6)."},{"part":"awk -F'\"' + split","meaning":"Robust parsing of combined logs; field 1 starts with the IP (Day 23)."},{"part":"sort | uniq -c | sort -rn | head","meaning":"The counting pipeline (Day 12)."},{"part":"\"$LOG\" and \"$N\"","meaning":"Quote every variable (Day 5)."}],"expected_output":"      5 10.0.0.5\n      3 172.16.0.3\n      3 10.0.0.7\nexit code: 0\n      5 10.0.0.5\nexit code: 0\nerror: cannot read nope.log\nexit code: 1\nusage: top-errors.sh LOGFILE [N]\nexit code: 2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Writing the pipeline but no input checks: interviewers want to see usage messages and exit codes.","Using `$9` for the status: mention why splitting at quotes is safer."],"interview_say":"I start with set -euo pipefail, check the arguments and the file, parse the log by splitting at the quotes, filter 5xx, then count with sort, uniq -c, sort -rn and head. Bad usage exits 2, a missing file exits 1.","try_yourself":"Add a `-s CODE` option to count one exact status code instead of all 5xx."},{"id":"d28p02","title":"Whiteboard 2: back up a folder, keep the last 3","type":"script","topic":"Scripting","minutes":14,"optional":false,"core":false,"workdir":".","situation":"Interviewer: \"Write a backup script for a folder: a timestamped tar.gz, keep only the last 3 backups, and fail clearly if something goes wrong.\" The answer stays short and correct; extras (checksum, S3, lock) can be mentioned at the end.","task":["Usage: `backup-keep.sh SRC DEST [KEEP]`, KEEP defaults to 3.","Create `DEST/NAME-YYYYmmdd-HHMMSS.tar.gz` (allow `STAMP` from the environment for tests).","Delete all but the newest KEEP backups of that source.","Test with 5 runs (different STAMPs), then show what is left. Test a missing source."],"hints":["`STAMP=${STAMP:-$(date +%Y%m%d-%H%M%S)}`","`tar -czf \"$DEST/$NAME-$STAMP.tar.gz\" -C \"$SRC\" .`","`ls -1 \"$DEST\"/\"$NAME\"-*.tar.gz | sort | head -n -\"$KEEP\" | xargs -r rm --`"],"solution":["cat > backup-keep.sh <<'EOF'","#!/bin/bash","# Usage: backup-keep.sh SRC DEST [KEEP]","set -euo pipefail","SRC=${1:?usage: backup-keep.sh SRC DEST [KEEP]}; DEST=${2:?usage: backup-keep.sh SRC DEST [KEEP]}; KEEP=${3:-3}","[ -d \"$SRC\" ] || { echo \"error: $SRC is not a folder\" >&2; exit 1; }","mkdir -p \"$DEST\"","NAME=$(basename \"$SRC\")","STAMP=${STAMP:-$(date +%Y%m%d-%H%M%S)}","tar -czf \"$DEST/$NAME-$STAMP.tar.gz\" -C \"$SRC\" .","echo \"created $NAME-$STAMP.tar.gz\"","ls -1 \"$DEST\"/\"$NAME\"-*.tar.gz | sort | head -n -\"$KEEP\" | xargs -r rm -v --","EOF","for d in 16 17 18 19 20; do","  STAMP=202610$d-023000 bash backup-keep.sh app-data backups 3","done","ls backups","bash backup-keep.sh missing-dir backups; echo \"exit code: $?\""],"explanation":[{"part":"${1:?usage}","meaning":"Required arguments with a usage message (Day 13)."},{"part":"STAMP from env","meaning":"Real time normally, fixed time in tests (Day 24)."},{"part":"tar -czf ... -C SRC .","meaning":"Pack the folder contents (Day 20)."},{"part":"sort | head -n -KEEP | xargs -r rm","meaning":"Keep the newest by name; `-r` = nothing to do is not an error (Day 24)."},{"part":"say the extras","meaning":"Checksums, a restore test, a lock (flock), off-site copy to S3, cron with a log, alert on failure."}],"expected_output":"created app-data-20261016-023000.tar.gz\ncreated app-data-20261017-023000.tar.gz\ncreated app-data-20261018-023000.tar.gz\ncreated app-data-20261019-023000.tar.gz\nremoved 'backups/app-data-20261016-023000.tar.gz'\ncreated app-data-20261020-023000.tar.gz\nremoved 'backups/app-data-20261017-023000.tar.gz'\napp-data-20261018-023000.tar.gz  app-data-20261020-023000.tar.gz\napp-data-20261019-023000.tar.gz\nerror: missing-dir is not a folder\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Rotating with `ls -t`: file times change when backups are copied or restored (Day 24).","Forgetting to mention the restore test: a backup is only good if it can be restored."],"interview_say":"My backup script makes a timestamped tar.gz, keeps the newest N by sorting the names, and stops on errors with set -e and clear messages. In production I add a checksum, a lock, an S3 copy and a regular restore test.","try_yourself":"Add a checksum file for each backup and remove it together with the old archive."},{"id":"d28p03","title":"Whiteboard 3: check a list of URLs","type":"script","topic":"Scripting","minutes":14,"optional":false,"core":false,"workdir":".","situation":"Interviewer: \"We have a file with one URL per line. Write a script that checks each one and reports which are down. It runs in cron, so it must not hang, and the exit code must show if anything is down.\"","task":["Read `urls.txt` line by line, skipping empty lines and comments.","For each URL: `curl -fsS -o /dev/null --max-time 3`, with 2 tries. Print `UP` or `DOWN` and the URL.","At the end print the number of DOWN URLs. Exit 1 if any are down, else 0.","Test against the local test server on port 8151 (one URL points to a closed port)."],"hints":["`while IFS= read -r url; do [[ -z $url || $url == \\#* ]] && continue; ... done < \"$FILE\"`","Two tries: `curl ... || { sleep 1; curl ...; }`","Count with `DOWN=$((DOWN + 1))`; the loop reads from the file, so the counter survives (Day 8)."],"solution":["cat > check-urls.sh <<'EOF'","#!/bin/bash","# Usage: check-urls.sh URL_FILE   - exit 0 if all URLs are up, 1 if any is down","set -uo pipefail","FILE=${1:?usage: check-urls.sh URL_FILE}","[ -r \"$FILE\" ] || { echo \"error: cannot read $FILE\" >&2; exit 2; }","check() { curl -fsS -o /dev/null --max-time 3 \"$1\" 2>/dev/null; }","DOWN=0","while IFS= read -r url; do","  [[ -z $url || $url == \\#* ]] && continue","  if check \"$url\" || { sleep 1; check \"$url\"; }; then","    printf 'UP    %s\\n' \"$url\"","  else","    printf 'DOWN  %s\\n' \"$url\"; DOWN=$((DOWN + 1))","  fi","done < \"$FILE\"","echo \"down: $DOWN\"","[ \"$DOWN\" -eq 0 ]","EOF","python3 -m http.server 8151 --bind 127.0.0.1 --directory site > /dev/null 2>&1 &","SRV=$!","sleep 1","bash check-urls.sh urls.txt; echo \"exit code: $?\"","kill $SRV"],"explanation":[{"part":"set -uo pipefail (no -e)","meaning":"A down URL is expected; the script must check all of them (Day 25)."},{"part":"while IFS= read -r url; ... done < file","meaning":"Safe line reading; the counter is kept (Day 8)."},{"part":"skip empty and # lines","meaning":"Config files have comments and blank lines (Day 10)."},{"part":"curl -fsS --max-time 3","meaning":"Fail on HTTP errors, never hang (Day 18)."},{"part":"check || { sleep 1; check; }","meaning":"One retry against short glitches (Day 27)."},{"part":"[ \"$DOWN\" -eq 0 ]","meaning":"The last command sets the exit code: 0 if none are down, 1 otherwise."}],"expected_output":"UP    http://127.0.0.1:8151/health.json\nUP    http://127.0.0.1:8151/index.html\nDOWN  http://127.0.0.1:8151/missing\nDOWN  http://127.0.0.1:8159/\ndown: 2\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["No timeout: one hanging server blocks the whole cron run.","Reading the file with `for url in $(cat urls.txt)`: comments and spaces break it."],"interview_say":"I read the URL file with `while IFS= read -r`, skip comments, check each URL with `curl -fsS --max-time` and one retry, print UP or DOWN, and exit 1 if any URL is down so cron or CI can alert.","try_yourself":"Check the URLs in parallel with `xargs -P 4` (Day 12). How do you count the DOWN ones then?"},{"id":"d28p04","title":"Final bug hunt: the take-home script","type":"fix-bug","topic":"Scripting","minutes":13,"optional":false,"core":false,"workdir":".","situation":"The last task of a take-home test: `take-home.sh` has bugs from all four weeks. The goal is in the comments. Find them by running the script, reading the errors, and reading the code line by line.","task":["Run `bash take-home.sh` and compare the output with the comments.","Find 5 bugs: the test brackets, the read options, the function result, the log redirect, and the missing quotes.","Fix them. Run the script twice and show `summary.log`."],"hints":["`[-f $LOG]` needs spaces: `[ -f \"$LOG\" ]`.","The Windows path lost its backslashes: `while IFS= read -r p`.","`return $(grep -c ...)` is an exit code (0-255), and `>` replaces the log each run. Use `echo` + `$( )`, and `>>`."],"solution":["bash take-home.sh","cat > take-home.sh <<'EOF'","#!/bin/bash","# take-home.sh: for each path in paths.txt print \"path: <path>\" exactly as written,","# count the lines of access.log that have status 500 or 503,","# and append one summary line per run to summary.log. Exit 1 if access.log is missing.","set -euo pipefail","LOG=access.log","if [ -f \"$LOG\" ]; then echo \"log found\"; else echo \"no log\" >&2; exit 1; fi","while IFS= read -r p; do echo \"path: $p\"; done < paths.txt","count_errors() { grep -cE '\" 50[03] ' \"$LOG\"; }","ERRORS=$(count_errors)","echo \"$(date +%F) errors=$ERRORS\" >> summary.log","echo \"errors: $ERRORS\"","EOF","echo \"--- fixed, run 1 ---\"","bash take-home.sh","echo \"--- fixed, run 2 ---\"","bash take-home.sh > /dev/null","echo \"summary.log has $(wc -l < summary.log) lines:\"","cut -d' ' -f2 summary.log"],"explanation":[{"part":"[ -f \"$LOG\" ]","meaning":"Bug 1: `[-f` is not a command (Day 6)."},{"part":"IFS= read -r","meaning":"Bug 2: `read` without `-r` removed the backslashes of `C:\\temp\\export` (Day 8)."},{"part":"echo, not return","meaning":"Bug 3: the count came back as an exit code; with `set -e` that would even stop the script (Day 9)."},{"part":">> summary.log","meaning":"Bug 4: `>` kept only the last run (Day 4)."},{"part":"\"$LOG\" and the regex","meaning":"Bug 5: unquoted variables; also the pattern now matches the status right after the closing quote, not a size like ` 500 ` (Day 10, Day 23)."},{"part":"cut -d' ' -f2","meaning":"Here only to hide the date column, which changes every day."}],"expected_output":"take-home.sh: line 6: [-f: command not found\nno log\n--- fixed, run 1 ---\nlog found\npath: C:\\temp\\export\npath: /var/log/todo\nerrors: 13\n--- fixed, run 2 ---\nsummary.log has 2 lines:\nerrors=13\nerrors=13","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Fixing only the lines that print an error. Bugs 2 to 5 give wrong results without any error message.","Keeping `return` and adding `set -e`: the script then stops after `count_errors` when the count is not 0."],"checks":[{"run":"bash take-home.sh","expect":"[-f: command not found"}],"interview_say":"I run the script, read the errors, then read every line against the goal. The usual suspects are test syntax, `read -r`, `return` used for data, `>` versus `>>`, and missing quotes. ShellCheck finds several of them automatically.","try_yourself":"Run `shellcheck take-home.sh` on the original version (Reset and setup again). Which of the 5 bugs does it find?"}],"interview":[{"q":"Rapid 1: Difference between a hard link and a symlink?","a":"Hard link: another name for the same data, survives deleting the original, no folders. Symlink: a path to a target, breaks if the target is deleted, works for folders and across disks.","topic":"Files"},{"q":"Rapid 2: Where are configs, logs and user homes?","a":"`/etc`, `/var/log`, `/home`.","topic":"Files"},{"q":"Rapid 3: Show the last 100 lines of a log and follow it?","a":"`tail -n 100 -f app.log` (`-F` if the log rotates).","topic":"Text"},{"q":"Rapid 4: What does `chmod 640` mean?","a":"Owner read+write, group read, others nothing.","topic":"Permissions"},{"q":"Rapid 5: Add user `deploy` to group `docker`?","a":"`sudo usermod -aG docker deploy` (log in again to apply).","topic":"Permissions"},{"q":"Rapid 6: Send stdout and stderr to one file?","a":"`cmd > out.log 2>&1` (or `&> out.log`).","topic":"Redirection"},{"q":"Rapid 7: What is `/dev/null`?","a":"A special file that discards everything written to it.","topic":"Redirection"},{"q":"Rapid 8: Single vs double quotes?","a":"Single: nothing expands. Double: variables and `$( )` expand, spaces stay together.","topic":"Variables"},{"q":"Rapid 9: What does `export` do?","a":"Makes a variable visible to child processes.","topic":"Variables"},{"q":"Rapid 10: `[ ]` vs `[[ ]]`?","a":"`[ ]` is the POSIX test command (quote variables). `[[ ]]` is bash: safe with empty variables, supports patterns and regex.","topic":"Scripting"},{"q":"Rapid 11: What does exit code 127 mean?","a":"Command not found.","topic":"Scripting"},{"q":"Rapid 12: Read a file line by line safely?","a":"`while IFS= read -r line; do ...; done < file`.","topic":"Scripting"},{"q":"Rapid 13: `return` vs `echo` in a function?","a":"`return` sets the exit code (0-255); `echo` returns data, captured with `$(func)`.","topic":"Scripting"},{"q":"Rapid 14: `\"$@\"` vs `\"$*\"`?","a":"`\"$@\"`: each argument separate. `\"$*\"`: all arguments as one string.","topic":"Scripting"},{"q":"Rapid 15: grep options for: ignore case, count, invert, line numbers?","a":"`-i`, `-c`, `-v`, `-n`.","topic":"Text"},{"q":"Rapid 16: Replace text in a file in place with a backup?","a":"`sed -i.bak 's/old/new/g' file`.","topic":"Text"},{"q":"Rapid 17: Print the 2nd column of a CSV?","a":"`awk -F, '{print $2}' file.csv` (or `cut -d, -f2`).","topic":"Text"},{"q":"Rapid 18: Find files over 100 MB modified more than 30 days ago?","a":"`find /path -type f -size +100M -mtime +30`.","topic":"Files"},{"q":"Rapid 19: Get the file name from a path in bash?","a":"`${path##*/}` (folder: `${path%/*}`).","topic":"Variables"},{"q":"Rapid 20: `kill` vs `kill -9`?","a":"`kill` sends SIGTERM (clean stop). `kill -9` sends SIGKILL (immediate, no cleanup). TERM first.","topic":"Processes"},{"q":"Rapid 21: The letters in `ps aux`?","a":"a = all users, u = user-oriented format, x = also processes without a terminal.","topic":"Processes"},{"q":"Rapid 22: Write a crontab line for every day at 02:30.","a":"`30 2 * * * /opt/backup.sh >> /var/log/backup.log 2>&1`.","topic":"Services"},{"q":"Rapid 23: Logs of the systemd service nginx, live?","a":"`journalctl -u nginx -f`.","topic":"Services"},{"q":"Rapid 24: Disk space vs inodes?","a":"`df -h` for space, `df -i` for inodes. Either one full gives `No space left on device`.","topic":"Disk"},{"q":"Rapid 25: Which process listens on port 8080?","a":"`sudo ss -tulpn | grep :8080` (or `sudo lsof -i :8080`).","topic":"Networking"},{"q":"Rapid 26: curl options for a script-safe health check?","a":"`curl -fsS --max-time 5 URL`.","topic":"Networking"},{"q":"Rapid 27: SSH key permissions?","a":"`~/.ssh` 700, private key 600, `authorized_keys` 600.","topic":"SSH"},{"q":"Rapid 28: Create and extract a .tar.gz?","a":"`tar -czf app.tgz app/` and `tar -xzf app.tgz -C /target`.","topic":"Packages"},{"q":"Rapid 29: What does `set -euo pipefail` do?","a":"Exit on errors, error on unset variables, and fail a pipeline if any part fails.","topic":"Scripting"},{"q":"Rapid 30: How do you clean up temp files even when a script fails?","a":"`TMP=$(mktemp)` plus `trap 'rm -f \"$TMP\"' EXIT`.","topic":"Scripting"},{"q":"Scenario 1: A Kubernetes pod is in CrashLoopBackOff. What do you do?","a":"`kubectl describe pod NAME` (events, exit code, OOMKilled?), `kubectl logs NAME --previous` (log of the crashed container), check config/secrets/env and the image tag, then fix and roll out; `kubectl rollout undo` if a new release caused it.","topic":"Troubleshooting"},{"q":"Scenario 2: Nginx returns 502 Bad Gateway.","a":"Nginx is up but the upstream app is not answering. Check the app (`systemctl status` / pod status), the upstream port with `ss -ltn` and `curl localhost:PORT`, and the Nginx error log (`/var/log/nginx/error.log`: connection refused or timeout).","topic":"Troubleshooting"},{"q":"Scenario 3: The Jenkins job fails at `docker push` with \"denied\" or \"unauthorized\".","a":"Check the registry login (credentials in Jenkins, token expiry), the image name and repository permissions, and whether the repository exists (for example ECR). Run `docker login` in the job with the stored credential.","topic":"Troubleshooting"},{"q":"Scenario 4: A cron job did not run last night.","a":"Check that cron runs (`systemctl status cron` / `service cron status`), the crontab (`crontab -l`), the syslog (`grep CRON /var/log/syslog`), the job's own log, the PATH and absolute paths, and `%` signs in the crontab line.","topic":"Troubleshooting"},{"q":"Scenario 5: The app got slow right after a deploy.","a":"Compare before/after: error rate and latency in the logs or metrics, CPU and memory (`top`, `free -m`), database slow queries, and what changed (`git diff` of the release, config). If users suffer, roll back first, investigate second.","topic":"Troubleshooting"},{"q":"Scenario 6: Users see a TLS certificate error.","a":"Check the expiry date: `echo | openssl s_client -connect host:443 -servername host 2>/dev/null | openssl x509 -noout -dates`. Renew (for example certbot), check the full chain, reload Nginx, and add an expiry alert.","topic":"Troubleshooting"}],"recap":[{"cmd":"set -euo pipefail","meaning":"First line after the shebang in every script","example":"#!/bin/bash; set -euo pipefail","topic":"Scripting"},{"cmd":"${1:?usage} / ${2:-default}","meaning":"Required and optional arguments","example":"N=${2:-3}","topic":"Scripting"},{"cmd":"awk -F'\"' ... | sort | uniq -c | sort -rn | head","meaning":"Count anything in a log","example":"awk -F'\"' '{split($3,a,\" \"); print a[1]}' access.log | sort | uniq -c","topic":"Text"},{"cmd":"while IFS= read -r line; do ...; done < file","meaning":"Read a file safely","example":"while IFS= read -r url; do ...; done < urls.txt","topic":"Scripting"},{"cmd":"curl -fsS --max-time N","meaning":"HTTP check that fails correctly","example":"curl -fsS --max-time 3 \"$url\"","topic":"Networking"},{"cmd":"tar -czf; sort | head -n -N | xargs -r rm","meaning":"Backup and keep last N","example":"ls -1 b-*.tgz | sort | head -n -3 | xargs -r rm --","topic":"Scripting"},{"cmd":"openssl s_client | openssl x509 -noout -dates","meaning":"Check a TLS certificate's dates","example":"echo | openssl s_client -connect site:443 -servername site 2>/dev/null | openssl x509 -noout -dates","topic":"Troubleshooting"}],"coverage":[{"item":"Whiteboard script: log analysis","problems":["d28p01"]},{"item":"Whiteboard script: backup and rotation","problems":["d28p02"]},{"item":"Whiteboard script: URL health checks","problems":["d28p03"]},{"item":"Find the bug (all weeks)","problems":["d28p04"]},{"item":"30 rapid-fire questions + 6 troubleshooting scenarios","problems":[]},{"item":"Final checklist","problems":[]}],"checklist":["I can explain absolute vs relative paths, and the main folders (/etc, /var/log, /home, /tmp, /usr/bin, /proc).","I can create, copy, move and delete files and folders safely, and explain hard links vs symlinks.","I can read and search logs with head, tail -f, less, grep (with -i -v -c -n -A -B -E -o).","I can read and set permissions with numbers and letters, and explain root vs \"others\".","I can use >, >>, 2>, 2>&1, /dev/null, pipes, tee and xargs correctly.","I know single vs double quotes, export, PATH, $(...) and $(( )).","I can write if/elif/else, [ ] vs [[ ]], file tests, case, and use exit codes.","I can loop over files and lines safely and use indexed and associative arrays.","I can write functions with local variables, return data with echo, and parse options with getopts.","I can process text with sed, awk, cut, tr, sort and uniq, including the top-10 pipeline.","I can use find with -name, -type, -mtime, -size, -exec and -delete safely.","I can use parameter expansion for paths and defaults, and create dates and temp files.","I can find and stop processes correctly (ps, pgrep, kill vs kill -9, nohup, jobs, trap).","I can schedule jobs with cron and write, check and read a systemd service.","I can find what fills the disk, check inodes, memory and load, and find deleted-but-open files.","I can check ports and services with ss, curl and nc, and debug DNS problems.","I can create SSH keys, fix their permissions, use ~/.ssh/config, and copy files with rsync.","I can pack and verify releases with tar and sha256sum, and install packages with apt.","I can troubleshoot: disk full, high CPU, port in use, service will not start, cannot SSH, DNS.","I start scripts with set -euo pipefail, clean up with trap, use locks, and keep scripts idempotent.","I can build a log analyzer, a backup with rotation, and a health check with alerts.","I can use jq, handle secrets safely, and test before reloading (nginx -t).","I can write CI steps: retry with backoff, wait for a port, git describe versions, deploy with rollback.","I can say each answer in 1-2 simple sentences, out loud, without notes."],"reset":"rm -rf ~/bash-practice/day28"}]}</script>
<script>
(function () {
'use strict';

// ------------------------------------------------------------ data
var RAW = JSON.parse(document.getElementById('app-data').textContent);
var DAYS = RAW.days.slice().sort(function (a, b) { return a.day - b.day; });
var LIMIT = 90, WARM = 8, INTV = 7, RECAP = 5, BUDGET = LIMIT - WARM - INTV - RECAP;
var INTERVALS = [1, 3, 7, 14, 30];
var WEEKS = { 1: 'Linux and Bash core', 2: 'Loops, functions, text processing', 3: 'Linux administration for DevOps', 4: 'Scripts for real DevOps work' };
var TYPES = { 'command': 'Write a command', 'fix-bug': 'Find the bug', 'predict': 'Predict the output', 'explain-error': 'Explain the error',
  'convert': 'One-liner to script', 'incident': 'Real incident', 'script': 'Write a script', 'concept': 'Concept check' };
var TOPIC_ORDER = ['Files', 'Text', 'Permissions', 'Redirection', 'Variables', 'Scripting', 'Processes', 'Services', 'Disk',
  'Networking', 'SSH', 'Packages', 'DevOps tools', 'CI/CD', 'Troubleshooting'];
var PROBS = {};
DAYS.forEach(function (d) {
  d.problems.forEach(function (p) {
    p.solutionText = Array.isArray(p.solution) ? p.solution.join('\n') : (p.solution || '');
    (p.steps || []).forEach(function (s) { s.codeText = Array.isArray(s.code) ? s.code.join('\n') : (s.code || ''); });
    (p.files || []).forEach(function (f) { f.contentText = Array.isArray(f.content) ? f.content.join('\n') : (f.content || ''); });
    (p.learn || []).forEach(function (s) {
      if (Array.isArray(s.code)) s.code = s.code.join('\n');
      if (Array.isArray(s.art)) s.art = s.art.join('\n');
    });
    if (p.steps) p.solutionText = (p.files || []).map(function (f) { return f.contentText; }).concat(p.steps.map(function (s) { return s.codeText; })).join('\n');
    PROBS[p.id] = { p: p, day: d };
  });
  d.setupText = Array.isArray(d.setup) ? d.setup.join('\n') : d.setup;
  d.resetText = Array.isArray(d.reset) ? d.reset.join('\n') : d.reset;
});
var TOTAL_PROBLEMS = Object.keys(PROBS).length;
// Flashcards: written ones (day.cards), or made from the recap rows for days that have none yet.
var CARDS = {};
function lowerFirst(t) { return t ? t.charAt(0).toLowerCase() + t.slice(1) : t; }
DAYS.forEach(function (d) {
  var list = d.cards && d.cards.length ? d.cards : d.recap.map(function (r, i) {
    return { id: 'd' + pad(d.day) + 'r' + pad(i + 1), q: 'Which command: ' + lowerFirst(r.meaning) + '?', a: r.cmd, example: r.example, topic: r.topic, auto: true };
  });
  list.forEach(function (c) { c.day = d.day; if (Array.isArray(c.example)) c.example = c.example.join('\n'); CARDS[c.id] = c; });
  d.cardsList = list;
});
function cardsForProblem(pid) { return Object.keys(CARDS).map(function (k) { return CARDS[k]; }).filter(function (c) { return (c.links || []).indexOf(pid) >= 0; }); }

// ------------------------------------------------------------ storage (never trust it)
var KEY = 'bash-linux-drill-v1';
function freshState() {
  return { v: 1, plan: 'month', theme: 'system', done: {}, forgot: {}, notes: {}, complete: {}, review: {}, ratings: [],
    timers: {}, ptime: {}, activity: {}, check: {}, alerted: {}, sound: true, last: null,
    cards: {}, xp: 0, xpGiven: {}, warm: {}, typeMode: false };
}
var storageOK = true;
function loadState() {
  var s = freshState();
  try {
    var t = localStorage.getItem(KEY);
    if (t) { var o = JSON.parse(t); if (o && typeof o === 'object') s = Object.assign(s, o); }
  } catch (e) { storageOK = false; }
  // a timer that was running when the page closed stops at its last heartbeat
  Object.keys(s.timers).forEach(function (k) {
    var t = s.timers[k];
    if (t.since) { t.acc += Math.max(0, ((t.beat || t.since) - t.since) / 1000); t.since = null; t.paused = true; }
  });
  return s;
}
var S = loadState();
try { localStorage.setItem(KEY + '-test', '1'); localStorage.removeItem(KEY + '-test'); } catch (e) { storageOK = false; }
var saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  var write = function () { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOK = false; } };
  if (now) write(); else saveTimer = setTimeout(write, 200);
}

// ------------------------------------------------------------ helpers
function pad(n) { return (n < 10 ? '0' : '') + n; }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(str, n) { var p = str.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2] + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function mmss(sec) { sec = Math.max(0, Math.floor(sec)); var m = Math.floor(sec / 60), s = sec % 60; return pad(m) + ':' + pad(s); }
function markActivity() { S.activity[today()] = true; }
function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
  el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}
function svg(tag, attrs) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
  return el;
}
// `code` and **bold** inside plain text, always as text nodes (no HTML injection)
function inline(t) {
  t = String(t == null ? '' : t);
  var out = [], re = /`([^`]+)`|\*\*([^*]+)\*\*/g, i = 0, m;
  while ((m = re.exec(t))) {
    if (m.index > i) out.push(t.slice(i, m.index));
    out.push(m[1] != null ? h('code', null, m[1]) : h('strong', null, m[2]));
    i = re.lastIndex;
  }
  if (i < t.length) out.push(t.slice(i));
  return out;
}
function copyText(text, btn) {
  var ok = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); };
  var fallback = function () {
    var ta = h('textarea', { class: 'sr-copy', 'aria-hidden': 'true' });
    ta.value = text; document.body.appendChild(ta); ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    ta.remove();
    if (done) ok();
    else {
      var pre = btn.parentNode.querySelector('pre');
      if (pre) { var r = document.createRange(); r.selectNodeContents(pre); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      btn.textContent = 'Press Ctrl+C';
    }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  } catch (e) { fallback(); }
}
function codeBlock(text, opts) {
  opts = opts || {};
  var btn = h('button', { class: 'copy', type: 'button', 'aria-label': 'Copy ' + (opts.what || 'code') }, 'Copy');
  btn.addEventListener('click', function () { copyText(text, btn); });
  return h('div', { class: 'code' + (opts.kind ? ' ' + opts.kind : '') },
    opts.label ? h('div', { class: 'code-label' }, opts.label) : null, btn,
    h('pre', { tabindex: '0' }, h('code', null, text)));
}
function table(head, rows, cmdCols) {
  return h('div', { class: 'tbl-wrap' }, h('table', null,
    h('thead', null, h('tr', null, head.map(function (x) { return h('th', { scope: 'col' }, inline(x)); }))),
    h('tbody', null, rows.map(function (r) {
      return h('tr', null, r.map(function (c, i) {
        return (cmdCols || []).indexOf(i) >= 0 ? h('td', { class: 'cmd' }, c) : h('td', null, inline(c));
      }));
    }))));
}
function ring(done, total) {
  var r = 9, c = 2 * Math.PI * r, f = total ? Math.min(1, done / total) : 0;
  var s = svg('svg', { width: 24, height: 24, viewBox: '0 0 24 24', class: 'ring' + (f >= 1 ? ' full' : ''), 'aria-hidden': 'true' });
  s.appendChild(svg('circle', { cx: 12, cy: 12, r: r, fill: 'none', class: 'bg', 'stroke-width': 3 }));
  if (f > 0) s.appendChild(svg('circle', { cx: 12, cy: 12, r: r, fill: 'none', class: 'fg', 'stroke-width': 3, 'stroke-linecap': 'round',
    'stroke-dasharray': (c * f) + ' ' + c, transform: 'rotate(-90 12 12)' }));
  return s;
}
function revealer(label, build) {
  var box = h('div', { class: 'a', hidden: true });
  var btn = h('button', { class: 'reveal', type: 'button', 'aria-expanded': 'false' }, label);
  var built = false;
  btn.addEventListener('click', function () {
    if (!built) { append(box, build()); built = true; }
    box.hidden = !box.hidden;
    btn.setAttribute('aria-expanded', String(!box.hidden));
    btn.textContent = box.hidden ? label : 'Hide answer';
  });
  return [btn, box];
}
function inFrame() { try { return window.self !== window.top; } catch (e) { return true; } }

// ------------------------------------------------------------ plans
function planMinutes(v) { return WARM + v.interviewMinutes + RECAP + v.timed.reduce(function (a, p) { return a + p.minutes; }, 0); }
function monthViews() {
  return DAYS.map(function (d) {
    var timed = d.problems.filter(function (p) { return !p.optional; });
    return { key: 'm' + d.day, hash: 'day-' + pad(d.day), num: d.day, label: 'Day ' + d.day, title: d.title, goal: d.goal,
      week: d.week, weekLabel: 'Week ' + d.week + ' · ' + (WEEKS[d.week] || ''), days: [d], timed: timed,
      extras: d.problems.filter(function (p) { return p.optional; }), warmup: d.warmup, interview: d.interview,
      recap: d.recap, coverage: d.coverage, reviewDay: d.review_day, needs: d.needs || [],
      interviewMinutes: d.interview_minutes || INTV, checklist: d.checklist || null };
  });
}
function crashViews() {
  var plan = [], cur = [], mins = 0;
  DAYS.forEach(function (d) {
    d.problems.forEach(function (p) {
      if (!p.core) return;
      if (cur.length && (mins + p.minutes > BUDGET || cur.length >= 6)) { plan.push(cur); cur = []; mins = 0; }
      cur.push(p); mins += p.minutes;
    });
  });
  if (cur.length) plan.push(cur);
  return plan.map(function (ps, i) {
    var src = [];
    ps.forEach(function (p) { var d = PROBS[p.id].day; if (src.indexOf(d) < 0) src.push(d); });
    var warm = [], intv = [];
    src.forEach(function (d) { if (d.warmup[0]) warm.push(d.warmup[0]); });
    for (var k = 0; intv.length < 5 && k < 10; k++) src.forEach(function (d) { if (d.interview[k] && intv.length < 5) intv.push(d.interview[k]); });
    var text = ps.map(function (p) { return p.solutionText; }).join('\n');
    var recap = [];
    src.forEach(function (d) {
      d.recap.forEach(function (r) { var w = r.cmd.split(/\s+/)[0]; if (w.length > 1 && text.indexOf(w) >= 0) recap.push(r); });
    });
    var needs = [];
    src.forEach(function (d) { (d.needs || []).forEach(function (n) { if (needs.indexOf(n) < 0) needs.push(n); }); });
    return { key: 'c' + (i + 1), hash: 'crash-' + (i + 1), num: i + 1, label: 'Crash day ' + (i + 1),
      title: src.map(function (d) { return d.title; }).join(' + '),
      goal: 'The core interview problems from Day ' + src.map(function (d) { return d.day; }).join(', ') + '.',
      week: 0, weekLabel: 'Crash week', days: src, timed: ps, extras: [], warmup: warm.slice(0, 4), interview: intv,
      recap: recap.length ? recap : src[0].recap, coverage: null, crash: true, needs: needs, interviewMinutes: INTV, checklist: null };
  });
}
var VIEWS = { month: monthViews(), crash: crashViews() };
function views() { return VIEWS[S.plan] || VIEWS.month; }
function findView(hash) {
  var all = VIEWS.month.concat(VIEWS.crash);
  for (var i = 0; i < all.length; i++) if (all[i].hash === hash) return all[i];
  return null;
}
function viewDone(v) { return v.timed.filter(function (p) { return S.done[p.id]; }).length; }

// ------------------------------------------------------------ review engine
function schedule(id) { if (!S.review[id]) S.review[id] = { step: 0, due: addDays(today(), INTERVALS[0]) }; }
function rate(id, r) {
  var it = S.review[id] || { step: 0 };
  if (r === 'forgot') { it.step = 0; it.due = addDays(today(), 1); S.forgot[id] = { date: today(), why: 'review' }; }
  else if (r === 'hard') { it.due = addDays(today(), INTERVALS[Math.min(it.step, INTERVALS.length - 1)]); delete S.forgot[id]; }
  else { it.step = Math.min(it.step + 1, INTERVALS.length - 1); it.due = addDays(today(), INTERVALS[it.step]); delete S.forgot[id]; }
  it.last = today();
  S.review[id] = it;
  S.ratings.push({ id: id, r: r, d: today() });
  markActivity(); save();
}
function reviewQueue() {
  var t = today(), ids = {};
  Object.keys(S.forgot).forEach(function (id) { if (PROBS[id]) ids[id] = 'forgot'; });
  Object.keys(S.review).forEach(function (id) { if (PROBS[id] && S.review[id].due <= t && !ids[id]) ids[id] = 'due'; });
  return Object.keys(ids).map(function (id) { return { id: id, why: ids[id] }; }).sort(function (a, b) {
    if (a.why !== b.why) return a.why === 'forgot' ? -1 : 1;
    var da = (S.review[a.id] || {}).due || '', db = (S.review[b.id] || {}).due || '';
    return da < db ? -1 : da > db ? 1 : 0;
  });
}

// ------------------------------------------------------------ timers
function timer(key) { return S.timers[key] || (S.timers[key] = { acc: 0, since: null }); }
function elapsed(key) { var t = S.timers[key]; if (!t) return 0; return t.acc + (t.since ? (Date.now() - t.since) / 1000 : 0); }
function startTimer(key) { var t = timer(key); if (!t.since) { t.since = Date.now(); t.beat = t.since; t.paused = false; } markActivity(); save(); }
function pauseTimer(key) { var t = timer(key); if (t.since) { t.acc = elapsed(key); t.since = null; } save(); }

// ------------------------------------------------------------ state of the page
var route = null, current = null, openCards = {}, pendingOpen = null, searchQuery = '', session = null, qaState = { topic: 'All', q: '', random: null };

// ------------------------------------------------------------ chrome: theme, plan, tabs, sidebar
function applyTheme() {
  var root = document.documentElement;
  if (S.theme === 'light' || S.theme === 'dark') root.setAttribute('data-theme', S.theme); else root.removeAttribute('data-theme');
  var tb = document.getElementById('theme-btn'); tb.textContent = '';
  append(tb, [h('span', { class: 'theme-word' }, 'Theme: '), S.theme.charAt(0).toUpperCase() + S.theme.slice(1)]);
  tb.setAttribute('aria-label', 'Colour theme: ' + S.theme + '. Click to change.');
}
document.getElementById('theme-btn').addEventListener('click', function () {
  S.theme = S.theme === 'system' ? 'light' : S.theme === 'light' ? 'dark' : 'system'; applyTheme(); save();
});
function setPlan(plan) {
  if (S.plan === plan) return;
  S.plan = plan; save();
  var list = views(), target = list[0];
  for (var i = 0; i < list.length; i++) if (!S.complete[list[i].key]) { target = list[i]; break; }
  go(target.hash);
}
document.getElementById('plan-month').addEventListener('click', function () { setPlan('month'); });
