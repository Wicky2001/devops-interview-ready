 temp folder plus `diff -r`.","try_yourself":"Add a timestamp to the backup name: `backup-$(date +%Y%m%d-%H%M).tar.gz`. What else must change in the script?"},{"id":"d20p06","title":"Downloads: redirects, -O and resume","type":"command","topic":"Packages","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Release download links often redirect (for example GitHub release links). The user learns to see a redirect, follow it, keep the remote file name, and resume a broken download.","task":["Start the test server on port 8092 in this folder.","Request `/dist` (no slash) with `curl -sI`. Read the status and `Location` header.","Follow the redirect with `-L` and show the status code.","Download with `-O` (keep the remote name) into a new folder `dl`.","Read about resume: `curl -C - -O URL` and `wget -c URL` continue a broken download."],"hints":["301 / 302 = redirect; the new address is in `Location:`.","Without `-L`, curl saves the small redirect page, not the file.","`curl -O URL` saves as the last part of the URL."],"solution":["python3 -m http.server 8092 --bind 127.0.0.1 > /dev/null 2>&1 &","SRV=$!","sleep 1","curl -sI http://127.0.0.1:8092/dist | grep -iE '^(HTTP|location)'","curl -sL -o /dev/null -w 'after -L: %{http_code} at %{url_effective}\\n' http://127.0.0.1:8092/dist","mkdir -p dl && (cd dl && curl -fsSO http://127.0.0.1:8092/dist/todo-cli.sh)","ls dl","kill $SRV"],"explanation":[{"part":"301 + Location","meaning":"The server says: the real address is `/dist/`."},{"part":"-L","meaning":"Follow redirects. `%{url_effective}` shows the final URL."},{"part":"-O","meaning":"Save with the remote file name in the current folder."},{"part":"-C - / wget -c","meaning":"Continue a partial download from where it stopped."}],"expected_output":"HTTP/1.0 301 Moved Permanently\nLocation: /dist/\nafter -L: 200 at http://127.0.0.1:8092/dist/\ntodo-cli.sh","expect_exit":0,"output_check":true,"verified":true,"mistakes":["A tiny downloaded file that is really an HTML redirect or error page. Use `-fL` and check with `file` or a checksum."],"interview_say":"For downloads in scripts I use `curl -fsSL -o file URL`: it fails on errors and follows redirects. For big files `-C -` or `wget -c` can resume.","try_yourself":"Run `curl -sS -o page.html -w '%{http_code}\\n' http://127.0.0.1:8092/dist` (no -L) while the server runs. What is inside page.html?"},{"id":"d20p07","title":"update-alternatives: choose the default version (read only)","type":"concept","topic":"Packages","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The vehicle parts project needs Java 17, but the server also has Java 21. Ubuntu uses `update-alternatives` to choose which program `/usr/bin/java` points to. Changing it needs sudo and installed Java versions, so it is not run in the sandbox.","task":["Show the choices: `update-alternatives --display java` (or `--list java`).","Change the default interactively: `sudo update-alternatives --config java`.","Check with `java -version` and `readlink -f /usr/bin/java`."],"hints":["`/usr/bin/java` → `/etc/alternatives/java` → the real program. Two symlinks.","`--config` shows a numbered menu; type the number and press Enter.","For an editor: `sudo update-alternatives --config editor` (nano or vim for `git commit`)."],"solution":["update-alternatives --display java","sudo update-alternatives --config java","readlink -f /usr/bin/java","java -version"],"explanation":[{"part":"--display / --list","meaning":"Show the current link and all installed choices."},{"part":"--config NAME","meaning":"Menu to choose the default (needs sudo)."},{"part":"readlink -f","meaning":"Follow all symlinks to the real file."}],"expected_output":"","expect_exit":0,"output_check":false,"output_note":"Typical output on Ubuntu with two OpenJDK versions installed. Paths and versions depend on what is installed.","verified":false,"typical_output":"java - auto mode\n  link best version is /usr/lib/jvm/java-21-openjdk-amd64/bin/java\n  link currently points to /usr/lib/jvm/java-21-openjdk-amd64/bin/java\n  link java is /usr/bin/java\n/usr/lib/jvm/java-17-openjdk-amd64/bin/java - priority 1711\n/usr/lib/jvm/java-21-openjdk-amd64/bin/java - priority 2111\nThere are 2 choices for the alternative java (providing /usr/bin/java).\n\n  Selection    Path                                         Priority   Status\n------------------------------------------------------------\n* 0            /usr/lib/jvm/java-21-openjdk-amd64/bin/java   2111      auto mode\n  1            /usr/lib/jvm/java-17-openjdk-amd64/bin/java   1711      manual mode\n  2            /usr/lib/jvm/java-21-openjdk-amd64/bin/java   2111      manual mode\n\nPress <enter> to keep the current choice[*], or type selection number: 1\nupdate-alternatives: using /usr/lib/jvm/java-17-openjdk-amd64/bin/java to provide /usr/bin/java (java) in manual mode\n/usr/lib/jvm/java-17-openjdk-amd64/bin/java\nopenjdk version \"17.0.12\" 2024-07-16","mistakes":["`update-alternatives: error: no alternatives for java`: no Java is installed yet. Install `openjdk-17-jdk` first.","Changing the system default for one project. Often better: set `JAVA_HOME` for that project or use a Docker image with the right version."],"interview_say":"When several versions of a tool are installed, Ubuntu's `update-alternatives` manages the `/usr/bin` symlink. For one project I prefer `JAVA_HOME` or a container with the exact version.","try_yourself":"Run `update-alternatives --display editor` on your WSL (read only)."}],"interview":[{"q":"How do you create and extract a .tar.gz archive?","a":"Create: `tar -czf app.tar.gz app/`. List: `tar -tzf app.tar.gz`. Extract: `tar -xzf app.tar.gz -C /target`.","topic":"Packages"},{"q":"How do you verify that a downloaded file is not changed?","a":"Compare its hash with the published one: `sha256sum -c file.sha256` (or `sha256sum file` and compare). A mismatch exits with code 1.","topic":"Packages"},{"q":"Which package does a file belong to?","a":"On Ubuntu `dpkg -S /usr/bin/ls`; on RHEL `rpm -qf /usr/bin/ls`.","topic":"Packages"},{"q":"What is the difference between `apt update` and `apt upgrade`?","a":"`update` refreshes the list of available packages. `upgrade` installs newer versions of installed packages.","topic":"Packages"},{"q":"`which`, `type` or `command -v`: which one do you use in a script?","a":"`command -v tool` (POSIX, works for builtins too). `type` is good interactively; `which` only searches PATH files.","topic":"Packages"}],"recap":[{"cmd":"tar -czf / -tzf / -xzf","meaning":"Create / list / extract .tar.gz","example":"tar -xzf app.tar.gz -C /opt/app","topic":"Packages"},{"cmd":"tar --exclude","meaning":"Leave files out of an archive","example":"tar -czf app.tgz --exclude='.env' app","topic":"Packages"},{"cmd":"gzip -k / gunzip / zcat","meaning":"Compress one file / unpack / read packed","example":"zcat app.log.1.gz | grep ERROR","topic":"Packages"},{"cmd":"zip -r / unzip -l","meaning":"zip format","example":"zip -qr bundle.zip app","topic":"Packages"},{"cmd":"sha256sum / -c","meaning":"Make / check checksums","example":"sha256sum -c todo-cli.sha256","topic":"Packages"},{"cmd":"curl -fsSL -o / -O","meaning":"Download safely / keep remote name","example":"curl -fsSL -o tool.tgz https://example.com/tool.tgz","topic":"Packages"},{"cmd":"wget -q -O / -c","meaning":"Download / resume","example":"wget -c https://example.com/big.iso","topic":"Packages"},{"cmd":"apt update / install / remove","meaning":"Manage packages (Ubuntu)","example":"sudo apt update && sudo apt install -y jq","topic":"Packages"},{"cmd":"dpkg -S / -L / -l","meaning":"Owner of file / files of package / status","example":"dpkg -S /usr/bin/ls","topic":"Packages"},{"cmd":"apt-cache policy","meaning":"Installed and candidate version","example":"apt-cache policy nginx","topic":"Packages"},{"cmd":"dnf / yum / rpm -qf","meaning":"RHEL family equivalents","example":"sudo dnf install -y nginx","topic":"Packages"},{"cmd":"type / command -v / which","meaning":"What runs for a name","example":"command -v docker >/dev/null || echo missing","topic":"Packages"},{"cmd":"update-alternatives","meaning":"Choose the default version","example":"sudo update-alternatives --config java","topic":"Packages"}],"coverage":[{"item":"apt/dpkg (and dnf/yum table)","problems":["d20p03"]},{"item":"tar (create, list, extract)","problems":["d20p01","d20p05"]},{"item":"gzip","problems":["d20p04"]},{"item":"zip","problems":["d20p04"]},{"item":"sha256sum","problems":["d20p02","d20p05"]},{"item":"wget/curl download","problems":["d20p02","d20p06"]},{"item":"which/type/command -v","problems":["d20p04"]},{"item":"update-alternatives idea","problems":["d20p07"]}],"reset":"rm -rf ~/bash-practice/day20"},{"day":21,"week":3,"review_day":true,"title":"Week 3 review: server troubleshooting","goal":"Investigate six classic incidents step by step with real commands: disk full, high CPU, port in use, service will not start, cannot SSH, DNS not resolving.","minutes":90,"setup":["mkdir -p ~/bash-practice/day21 && cd ~/bash-practice/day21","# S1: a Jenkins home with old workspaces (about 24 MB of real data)","for ws in todo-frontend todo-backend parts-service old-job-2024 experiment-ml; do mkdir -p \"jenkins-home/workspace/$ws\"; done","head -c 2097152 /dev/zero > jenkins-home/workspace/todo-frontend/dist.tgz","head -c 3145728 /dev/zero > jenkins-home/workspace/todo-backend/app.jar","head -c 1048576 /dev/zero > jenkins-home/workspace/parts-service/app.jar","head -c 8388608 /dev/zero > jenkins-home/workspace/old-job-2024/build.tar","head -c 10485760 /dev/zero > jenkins-home/workspace/experiment-ml/model.pt","touch -d '120 days ago' jenkins-home/workspace/old-job-2024 jenkins-home/workspace/old-job-2024/build.tar","touch -d '45 days ago' jenkins-home/workspace/experiment-ml jenkins-home/workspace/experiment-ml/model.pt","# S2: a report job that got stuck in a busy loop","printf '%s\\n' '#!/bin/bash' '# nightly report (stuck in a loop by mistake)' 'while :; do :; done' > report-generator.sh","# S4: a service that checks its config before it starts","mkdir -p svc/www svc/logs","echo '{\"status\":\"UP\"}' > svc/www/health.json","printf '%s\\n' 'PORT=8097' 'DB_URL=postgres://db.todo.local:5432/todo' 'LOG_LEVEL=info' > svc/todo.conf.example","printf '%s\\n' 'PORT=eighty' 'LOG_LEVEL=info' > svc/todo.conf","printf '%s\\n' '#!/bin/bash' '# todo-svc: read todo.conf, check it, then serve www/ on PORT' 'cd \"$(dirname \"$0\")\"' 'source ./todo.conf' 'log() { echo \"$(date +%F) $*\" >> logs/todo-svc.log; }' 'if ! [[ $PORT =~ ^[0-9]+$ ]]; then log \"FATAL invalid PORT value: $PORT\"; exit 3; fi' 'if [ -z \"$DB_URL\" ]; then log \"FATAL DB_URL is not set\"; exit 3; fi' 'log \"INFO starting on port $PORT\"' 'exec python3 -m http.server \"$PORT\" --bind 127.0.0.1 --directory www' > svc/todo-svc.sh","# S5: a key copied from Windows with loose permissions","mkdir -p keys","ssh-keygen -q -t ed25519 -N '' -C 'wicky@laptop' -f keys/prod_key","chmod 644 keys/prod_key","cd ~/bash-practice/day21"],"warmup":[{"q":"How do you list the contents of `app.tar.gz` without extracting?","a":"`tar -tzf app.tar.gz`","from_day":20},{"q":"`df` shows a full disk, `du` shows little. What do you check?","a":"Deleted files that a process still holds open: `sudo lsof +L1`.","from_day":17},{"q":"How do you find the process that listens on port 8080?","a":"`sudo ss -ltnp | grep :8080` or `sudo lsof -i :8080`.","from_day":18},{"q":"What does `Permission denied (publickey)` usually mean?","a":"Wrong key, wrong user, or bad permissions on `~/.ssh` / the key / `authorized_keys`.","from_day":19}],"problems":[{"id":"d21p01","title":"Scenario 1: disk full on the Jenkins server","type":"incident","topic":"Troubleshooting","minutes":11,"optional":false,"core":true,"workdir":".","situation":"Jenkins builds fail with `No space left on device`. The `workspace` folder under `jenkins-home` is the usual suspect. Find what is big and old, and clean it safely with a dry run first.","task":["Show the total size of `jenkins-home/workspace` and each workspace, biggest last.","List workspaces not changed for more than 30 days.","Dry run: print the old workspaces that would be deleted.","Delete them, and show the new total."],"hints":["`du -sh jenkins-home/workspace/* | sort -h`","`find jenkins-home/workspace -mindepth 1 -maxdepth 1 -type d -mtime +30`","Same find with `-print` first, then `-exec rm -rf {} +`."],"solution":["du -sh jenkins-home/workspace","du -sh jenkins-home/workspace/* | sort -h","echo \"=== not changed for 30+ days (dry run) ===\"","find jenkins-home/workspace -mindepth 1 -maxdepth 1 -type d -mtime +30 -print | sort","find jenkins-home/workspace -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +","echo \"=== after cleanup ===\"","du -sh jenkins-home/workspace"],"explanation":[{"part":"Step 1: df -h","meaning":"On a real server, first find the full filesystem (`df -h`, `df -i`)."},{"part":"Step 2: du -sh ... | sort -h","meaning":"Walk down to the biggest folders (Day 17)."},{"part":"-mindepth 1 -maxdepth 1 -type d","meaning":"Only the workspace folders themselves, not files inside them."},{"part":"-mtime +30","meaning":"Not changed for more than 30 days (Day 12)."},{"part":"-print, then -exec rm -rf {} +","meaning":"Dry run, then the same test with the action."},{"part":"long-term fix","meaning":"Jenkins \"Discard old builds\" and workspace cleanup in the pipeline, plus a disk alert (Day 17 P5)."}],"expected_output":"25M\tjenkins-home/workspace\n1.1M\tjenkins-home/workspace/parts-service\n2.1M\tjenkins-home/workspace/todo-frontend\n3.1M\tjenkins-home/workspace/todo-backend\n8.1M\tjenkins-home/workspace/old-job-2024\n11M\tjenkins-home/workspace/experiment-ml\n=== not changed for 30+ days (dry run) ===\njenkins-home/workspace/experiment-ml\njenkins-home/workspace/old-job-2024\n=== after cleanup ===\n6.1M\tjenkins-home/workspace","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`rm -rf jenkins-home/workspace/*` deletes the workspaces of running builds too.","Cleaning without finding the cause: the disk fills again tomorrow. Add build retention and monitoring."],"interview_say":"I find the full filesystem with `df -h`, walk down with `du -sh | sort -h`, list old data with `find -mtime`, dry-run, then delete. Then I fix the cause: retention settings and a disk alert.","try_yourself":"Compress instead of delete: `tar -czf old-job.tgz -C jenkins-home/workspace old-job-2024` (run Reset and setup again first)."},{"id":"d21p02","title":"Scenario 2: high CPU on the training server","type":"incident","topic":"Troubleshooting","minutes":11,"optional":false,"core":false,"workdir":".","situation":"The model training server is slow and the fans are loud. Find which process uses the CPU, check what it is, try a lower priority, and stop it if it is a mistake.","task":["Start the problem: `bash report-generator.sh &` (it is a stuck loop).","Check the load and CPU count (`uptime`, `nproc`).","Show the top CPU processes with `ps -eo pid,pcpu,args --sort=-pcpu | head`.","Check what the top process is (`/proc/PID/cmdline`, `ps -o lstart=`). Lower its priority with `renice`.","It is a stuck job: stop it with SIGTERM and check it is gone."],"hints":["In `top`, press `P` to sort by CPU.","`renice -n 19 -p PID` = lowest priority (allowed for the user's own processes).","`kill PID`, then `kill -0 PID` to check."],"solution":["bash report-generator.sh &","JOB=$!","sleep 2","echo \"load: $(cut -d' ' -f1-3 /proc/loadavg), CPUs: $(nproc)\"","ps -eo pid,pcpu,args --sort=-pcpu | head -n 2","TOP=$(ps -eo pid=,pcpu= --sort=-pcpu | head -n 1 | awk '{print $1}')","echo \"top process: $(tr '\\0' ' ' < /proc/$TOP/cmdline)\"","renice -n 19 -p \"$TOP\" > /dev/null && echo \"niceness now: $(ps -o ni= -p \"$TOP\")\"","kill \"$TOP\"","sleep 0.5","kill -0 \"$TOP\" 2>/dev/null || echo \"stuck job stopped\""],"explanation":[{"part":"uptime / nproc","meaning":"Load compared with CPU count: is the machine really overloaded? (Day 17)"},{"part":"ps --sort=-pcpu","meaning":"Biggest CPU users first (Day 15)."},{"part":"/proc/PID/cmdline","meaning":"Exactly what was started (Day 15)."},{"part":"renice -n 19","meaning":"If the job is needed but not urgent, make it nice instead of killing it."},{"part":"kill (SIGTERM)","meaning":"If it is a mistake, stop it cleanly; `kill -9` only if needed."},{"part":"other causes","meaning":"High `wa` in `vmstat` = waiting for disk; high `si/so` = swapping (memory). Then CPU is not the real problem."}],"expected_output":"load: 0.14 0.07 0.01, CPUs: 4\n  PID %CPU COMMAND\n29093 99.0 bash report-generator.sh\ntop process: bash report-generator.sh\nniceness now:  19\nstuck job stopped","expect_exit":0,"output_check":false,"output_note":"PIDs, load and %CPU values are different on every run.","verified":true,"mistakes":["Killing the top CPU process without checking what it is. It can be the database doing important work.","Looking only at CPU. A slow server can also be swapping or waiting for disk: check `free -m` and `vmstat 1 5` too."],"interview_say":"For high CPU I check load against `nproc`, find the process with `top` or `ps --sort=-pcpu`, find out what it is, then renice, fix or stop it. I also check memory and I/O wait, because they can look like a CPU problem.","try_yourself":"Run `top -b -n 1 | head -n 15` while the loop runs (start it again). Find the line for `bash`."},{"id":"d21p03","title":"Scenario 3: port in use after a failed pipeline","type":"incident","topic":"Troubleshooting","minutes":11,"optional":false,"core":false,"workdir":".","situation":"On the CI machine, the integration test starts the app on port 8095 and fails with `Address already in use`. The last pipeline crashed and left its test server running. Find it with `ss`, confirm it, stop it, and rerun.","task":["Simulate the leftover: start a test server on 8095 in the background.","Start the \"new\" one on 8095 and save its error in `start.log`. Show the last line.","Find the owner with `ss -ltnp 'sport = :8095'`. Print only the program name and check the full command with `ps`.","Stop it with `fuser -k -TERM 8095/tcp`, start the new server, and test it with curl."],"hints":["`ss -p` shows `users:((\"python3\",pid=1234,fd=3))`.","`grep -o 'pid=[0-9]*'` and `cut -d= -f2` get the PID from that text.","`fuser -k -TERM 8095/tcp` sends SIGTERM to every process using that port."],"solution":["python3 -m http.server 8095 --bind 127.0.0.1 > /dev/null 2>&1 &    # leftover from the crashed pipeline","sleep 1","python3 -m http.server 8095 --bind 127.0.0.1 > start.log 2>&1","tail -n 1 start.log","INFO=$(ss -ltnp 'sport = :8095' | tail -n 1)","echo \"program: $(grep -o '\"[^\"]*\"' <<< \"$INFO\" | tr -d '\"')\"","PID=$(grep -o 'pid=[0-9]*' <<< \"$INFO\" | cut -d= -f2)","echo \"command: $(ps -o args= -p \"$PID\")\"","fuser -k -TERM 8095/tcp > /dev/null 2>&1","sleep 0.5","python3 -m http.server 8095 --bind 127.0.0.1 > /dev/null 2>&1 &","sleep 1","curl -s -o /dev/null -w 'new test server: %{http_code}\\n' http://127.0.0.1:8095/","kill $!"],"explanation":[{"part":"Step 1: read the error","meaning":"`Address already in use` names the problem exactly."},{"part":"Step 2: ss -ltnp","meaning":"Find the listener and its PID (Day 18). Use sudo for other users' processes."},{"part":"Step 3: ps -o args=","meaning":"Confirm it is really the old test server, not a real service."},{"part":"Step 4: fuser -k -TERM","meaning":"Send SIGTERM to the port owner. Another tool for the same job as `lsof -t` + `kill`."},{"part":"long-term fix","meaning":"Pipelines should stop test servers in a `post { always { ... } }` block or with `trap` (Day 22), or use random free ports."}],"expected_output":"OSError: [Errno 98] Address already in use\nprogram: python3\ncommand: python3 -m http.server 8095 --bind 127.0.0.1\nnew test server: 200","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`fuser -k 8095/tcp` without `-TERM` sends SIGKILL by default.","Using a fixed port for tests on a shared CI agent: two pipelines at the same time will clash."],"interview_say":"I read the error, find the listener with `ss -ltnp`, confirm the process with `ps`, stop it cleanly, and then fix the pipeline so it always cleans up its test servers.","try_yourself":"Find a free port with Python: `python3 -c 'import socket; s=socket.socket(); s.bind((\"\",0)); print(s.getsockname()[1])'`."},{"id":"d21p04","title":"Scenario 4: the service will not start (find the config bugs)","type":"fix-bug","topic":"Troubleshooting","minutes":11,"optional":false,"core":false,"workdir":"svc","situation":"After a config change, `todo-svc` exits right after start. With systemd the user would run `systemctl status` and `journalctl -u`. Here the service writes its own log. Read the exit code and the log, compare the config with the example, fix it, and start again.","task":["Start it: `bash todo-svc.sh`. Print the exit code.","Read the last line of `logs/todo-svc.log`.","Compare `todo.conf` with `todo.conf.example` using `diff`.","Fix the config (`sed -i` for PORT, add the missing DB_URL). Start the service in the background and test `/health.json`."],"hints":["The exit code (3) and the FATAL line say exactly what is wrong.","`sed -i 's/^PORT=.*/PORT=8097/' todo.conf`","`grep '^DB_URL=' todo.conf.example >> todo.conf`"],"solution":["bash todo-svc.sh; echo \"exit code: $?\"","tail -n 1 logs/todo-svc.log | cut -d' ' -f2-","diff todo.conf todo.conf.example","sed -i 's/^PORT=.*/PORT=8097/' todo.conf           # fix 1","bash todo-svc.sh; echo \"exit code: $?\"             # it fails again: a second problem","tail -n 1 logs/todo-svc.log | cut -d' ' -f2-","grep '^DB_URL=' todo.conf.example >> todo.conf     # fix 2","bash todo-svc.sh > /dev/null 2>&1 &                # now it starts and keeps running","sleep 1","curl -s http://127.0.0.1:8097/health.json","tail -n 1 logs/todo-svc.log | cut -d' ' -f2-","kill $!"],"explanation":[{"part":"exit code 3","meaning":"The service reports that it failed on purpose (config check)."},{"part":"tail logs ... | cut -d' ' -f2-","meaning":"Last log line without the date column. With systemd: `journalctl -u todo-svc -n 20`."},{"part":"diff conf example","meaning":"Compare with a known good config to see wrong and missing lines (Day 2)."},{"part":"sed -i / >>","meaning":"Fix the value, append the missing line (Day 11, Day 4)."},{"part":"systemd version of this","meaning":"`systemctl status todo-svc` → `journalctl -u todo-svc -n 50` → fix → `systemctl restart todo-svc`."}],"expected_output":"exit code: 3\nFATAL invalid PORT value: eighty\n1c1,2\n< PORT=eighty\n---\n> PORT=8097\n> DB_URL=postgres://db.todo.local:5432/todo\nexit code: 3\nFATAL DB_URL is not set\n{\"status\":\"UP\"}\nINFO starting on port 8097","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Restarting the service again and again without reading the log. The log says why.","Fixing only the first error. Run again after each fix: here a second problem (DB_URL) appears after PORT is fixed."],"interview_say":"When a service does not start, I check `systemctl status` and `journalctl -u name` for the real error, compare the config with a known good one, fix one thing at a time, and restart.","try_yourself":"Add `TIMEOUT=abc` to the config and a check for it in `todo-svc.sh` (number only). Test it."},{"id":"d21p05","title":"Scenario 5: cannot SSH to the server","type":"incident","topic":"Troubleshooting","minutes":11,"optional":false,"core":false,"workdir":".","situation":"A teammate says \"SSH to prod does not work\". Instead of guessing, the user writes a small check script that tests, in order: the name, the port, and the key file permissions. Here it runs against a local port where no SSH server listens.","task":["Write `ssh-check.sh HOST PORT KEY` with three checks: name resolves (`getent hosts`), port open (`nc -z -w 2`), key is 600 (`stat -c %a`).","Print OK or a clear FAIL message for each check, with a hint.","Run it for `localhost 2222 keys/prod_key`.","Fix the key permission and run it again. What is left?"],"hints":["`getent hosts \"$HOST\" > /dev/null`","`nc -z -w 2 \"$HOST\" \"$PORT\"` exits 0 when the port is open.","`[ \"$(stat -c %a \"$KEY\")\" = 600 ]`"],"solution":["cat > ssh-check.sh <<'EOF'","#!/bin/bash","# Usage: ssh-check.sh HOST PORT KEY","HOST=${1:?host}; PORT=${2:-22}; KEY=${3:?key file}","if getent hosts \"$HOST\" > /dev/null; then echo \"OK   name $HOST resolves\"","else echo \"FAIL name $HOST does not resolve -> check DNS, /etc/hosts, typo\"; fi","if nc -z -w 2 \"$HOST\" \"$PORT\" 2>/dev/null; then echo \"OK   port $PORT is open\"","else echo \"FAIL port $PORT is closed or filtered -> sshd running? security group? right port?\"; fi","PERM=$(stat -c %a \"$KEY\")","if [ \"$PERM\" = 600 ] || [ \"$PERM\" = 400 ]; then echo \"OK   key $KEY has permission $PERM\"","else echo \"FAIL key $KEY has permission $PERM -> chmod 600 $KEY\"; fi","EOF","bash ssh-check.sh localhost 2222 keys/prod_key","chmod 600 keys/prod_key","echo \"--- after chmod ---\"","bash ssh-check.sh localhost 2222 keys/prod_key"],"explanation":[{"part":"order of checks","meaning":"Name → network/port → authentication. Each layer needs the one before it."},{"part":"getent hosts","meaning":"Name resolution (Day 18)."},{"part":"nc -z -w 2","meaning":"TCP port test with a 2 second timeout. Refused = nothing listens; timeout = firewall."},{"part":"stat -c %a key","meaning":"Key permissions (Day 19): SSH ignores keys that others can read."},{"part":"still FAIL on the port","meaning":"Here no sshd runs on 2222. On a real server: `systemctl status ssh`, `ss -ltn | grep :22`, the security group, or the cloud console."},{"part":"next step","meaning":"If all three are OK and it still fails: `ssh -v` and the server log (`journalctl -u ssh`, `/var/log/auth.log`)."}],"expected_output":"OK   name localhost resolves\nFAIL port 2222 is closed or filtered -> sshd running? security group? right port?\nFAIL key keys/prod_key has permission 644 -> chmod 600 keys/prod_key\n--- after chmod ---\nOK   name localhost resolves\nFAIL port 2222 is closed or filtered -> sshd running? security group? right port?\nOK   key keys/prod_key has permission 600","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Jumping to `ssh -vvv` first. Simple checks (name, port, key) find most problems faster.","Opening port 22 to `0.0.0.0/0` in the security group to \"fix\" it. Allow only the team's IP addresses, or use a bastion or SSM."],"interview_say":"For SSH problems I check in layers: does the name resolve, is port 22 reachable, then the key, user and permissions. After that, `ssh -v` and the server's auth log show the exact reason.","try_yourself":"Add a fourth check: the user name, using `ssh -G \"$HOST\" | awk '/^user /{print $2}'`."},{"id":"d21p06","title":"Scenario 6: DNS not resolving — is it DNS or the app?","type":"incident","topic":"Troubleshooting","minutes":11,"optional":false,"core":false,"workdir":".","situation":"The frontend cannot reach `http://todo.internal:8096`. The app team says \"our app is up\". The user proves where the problem is: first the name, then the app itself, by pointing the name at the right IP for one curl request only (no system change).","task":["Start the \"app\" on 127.0.0.1:8096 (a test server).","Try `curl` with the name. Print the exit code.","Check the name with `getent hosts todo.internal`.","Test the app with the name, but give curl the IP yourself: `curl --resolve todo.internal:8096:127.0.0.1 ...`.","Write down the conclusion and the real fix."],"hints":["curl exit code 6 = could not resolve host.","`--resolve HOST:PORT:IP` makes curl use that IP for that name and port. Nothing on the system changes.","If it works with `--resolve`, the app is fine and DNS (or /etc/hosts) is the problem."],"solution":["python3 -m http.server 8096 --bind 127.0.0.1 --directory svc/www > /dev/null 2>&1 &","SRV=$!","sleep 1","curl -s --max-time 5 http://todo.internal:8096/health.json; echo \"curl by name: exit code $?\"","getent hosts todo.internal || echo \"getent: no answer for todo.internal (exit code $?)\"","curl -s --resolve todo.internal:8096:127.0.0.1 http://todo.internal:8096/health.json","echo \"conclusion: the app answers; the name does not resolve -> fix DNS\"","kill $SRV"],"explanation":[{"part":"exit code 6","meaning":"curl could not resolve the host name: no IP, so no connection was even tried."},{"part":"getent hosts","meaning":"Same resolver as programs: hosts file + DNS (Day 18)."},{"part":"--resolve name:port:ip","meaning":"Bypass DNS for one request. Proves the app works."},{"part":"real fixes","meaning":"Create or fix the DNS record (for example in Route 53 or CoreDNS), check the `search` domain in `/etc/resolv.conf`, or in Kubernetes use the service name `todo-backend.default.svc.cluster.local`."},{"part":"dig (with internet)","meaning":"`dig todo.internal` and `dig @10.0.0.2 todo.internal` show what each DNS server answers."}],"expected_output":"curl by name: exit code 6\ngetent: no answer for todo.internal (exit code 2)\n{\"status\":\"UP\"}\nconclusion: the app answers; the name does not resolve -> fix DNS","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Adding the name to `/etc/hosts` on every server as the \"fix\". It hides the DNS problem and breaks when the IP changes.","Testing with `ping`: if ICMP is blocked, DNS problems and network problems look the same."],"interview_say":"To separate DNS from app problems, I check `getent hosts name` or `dig`, then call the app by IP or with `curl --resolve`. If the app answers by IP, I fix DNS, not the app.","try_yourself":"Run `curl -sv --resolve todo.internal:8096:127.0.0.1 http://todo.internal:8096/ 2>&1 | grep -i 'added\\|connected'` while the server runs."}],"interview":[{"q":"Scenario: \"The server is slow.\" What do you check first?","a":"`uptime` (load vs `nproc`), `top` (CPU and memory per process), `free -m` (available, swap), `vmstat 1 5` (wa = disk wait, si/so = swap), `df -h` (full disk), then the app logs.","topic":"Troubleshooting"},{"q":"Scenario: \"No space left on device.\" What do you do?","a":"`df -h` and `df -i` to find the filesystem, `du -xh --max-depth=1 | sort -h` to find big folders, `lsof +L1` for deleted-open files, clean safely, then fix retention and add alerts.","topic":"Troubleshooting"},{"q":"Scenario: \"The app does not start: port already in use.\"","a":"`ss -ltnp | grep :PORT` or `lsof -i :PORT` to find the process, check it with `ps`, stop it cleanly, start the app, and fix whatever left the old process running.","topic":"Troubleshooting"},{"q":"Scenario: \"The service fails to start after a deploy.\"","a":"`systemctl status name`, `journalctl -u name -n 50`, check the config (compare with the last good one or `git diff`), `systemd-analyze verify` for unit changes, fix one thing, restart.","topic":"Troubleshooting"},{"q":"Scenario: \"I cannot SSH to the server.\"","a":"Check the name (`getent hosts`), the port (`nc -zv host 22`; refused vs timeout), the security group, then the key, user and permissions, and `ssh -v`. On the server: `journalctl -u ssh` or `/var/log/auth.log`.","topic":"Troubleshooting"},{"q":"Scenario: \"The app cannot reach api.internal.\"","a":"`getent hosts` / `dig` for DNS, then curl by IP or `curl --resolve` to test the app, `nc -zv` for the port. If only the name fails, fix DNS or the search domain.","topic":"Troubleshooting"}],"recap":[{"cmd":"df -h; df -i; du -sh * | sort -h","meaning":"Disk full checklist","example":"sudo du -xh --max-depth=1 /var | sort -h","topic":"Troubleshooting"},{"cmd":"uptime; nproc; ps --sort=-pcpu","meaning":"High CPU checklist","example":"ps -eo pid,pcpu,args --sort=-pcpu | head","topic":"Troubleshooting"},{"cmd":"ss -ltnp 'sport = :P'; fuser -k -TERM P/tcp","meaning":"Port in use checklist","example":"sudo ss -ltnp | grep :8080","topic":"Troubleshooting"},{"cmd":"systemctl status; journalctl -u","meaning":"Service will not start checklist","example":"journalctl -u todo-api -n 50","topic":"Troubleshooting"},{"cmd":"getent hosts; nc -zv host 22; ssh -v","meaning":"Cannot SSH checklist","example":"nc -zv -w 3 10.0.1.10 22","topic":"Troubleshooting"},{"cmd":"curl --resolve name:port:ip","meaning":"Test an app without DNS","example":"curl --resolve api.internal:443:10.0.1.5 https://api.internal/health","topic":"Troubleshooting"}],"coverage":[{"item":"Disk full","problems":["d21p01"]},{"item":"High CPU","problems":["d21p02"]},{"item":"Port in use","problems":["d21p03"]},{"item":"Service will not start","problems":["d21p04"]},{"item":"Cannot SSH","problems":["d21p05"]},{"item":"DNS not resolving","problems":["d21p06"]}],"reset":"rm -rf ~/bash-practice/day21"},{"day":22,"week":4,"title":"Safe and professional scripting","goal":"Write scripts that stop on errors, clean up after themselves, never run twice at once, can run again safely, and give CI the right exit code.","minutes":90,"needs":["shellcheck"],"setup":["mkdir -p ~/bash-practice/day22 && cd ~/bash-practice/day22","# P4: a server config the setup script must change only once","printf '%s\\n' '# todo-api settings' 'port=8080' > app.conf","# P5: a CI step with problems, and a failing test runner","mkdir -p build","printf '%s\\n' '#!/bin/bash' 'echo \"running 12 tests\"' 'echo \"FAIL: test_create_todo\"' 'exit 1' > build/run-tests.sh","chmod +x build/run-tests.sh","printf '%s\\n' '#!/bin/bash' '# CI step: go into build/, run the tests, save the output in test.log,' '# and FAIL the job (exit code not 0) if the tests fail.' 'BUILD_DIR=build' 'cd $BULD_DIR' 'echo \"building in $(pwd)\"' './run-tests.sh | tee test.log' 'echo \"tests finished\"' > ci-step.sh","# P7: a script to debug","printf '%s\\n' '#!/bin/bash' 'name=$1' 'greeting=\"Hello\"' 'if [ $name = \"admin\" ]; then greeting=\"Welcome back\"; fi' 'echo \"$greeting, $name\"' > greet.sh","cd ~/bash-practice/day22"],"warmup":[{"q":"Which scenario check comes first when SSH fails: the key or the port?","a":"The port (and the name before it). If `nc -zv host 22` fails, the key does not matter yet.","from_day":21},{"q":"How do you create a unique temp file in a script?","a":"`TMP=$(mktemp)` (or `mktemp -d` for a folder).","from_day":13},{"q":"What does `trap cleanup TERM INT` do?","a":"It runs the function `cleanup` when the script gets SIGTERM or SIGINT (Ctrl+C).","from_day":15},{"q":"What is wrong with `cmd && exit 1` as the last line of a script?","a":"When `cmd` is false, the line is false, so the script exits with 1 even though nothing failed. Use `if cmd; then exit 1; fi; exit 0`.","from_day":17}],"problems":[{"id":"d22p01","title":"set -euo pipefail: what each part catches","type":"predict","topic":"Scripting","minutes":13,"optional":false,"core":true,"workdir":".","situation":"Most production scripts start with `set -euo pipefail`. In an interview the user must explain each letter with an example. Each test runs in its own `bash -c`, so the main script keeps running.","task":["Without options: run `false; echo \"still running\"`. Then the same with `set -e`.","Without options: `echo \"Hello $NAEM\"` (typo). Then with `set -u`.","Without options: `grep ERROR missing.log | wc -l; echo $?`. Then with `set -o pipefail`.","Predict each result before you run it. Write down which mistake each option catches."],"hints":["`-e`: exit when a command fails (with some exceptions, like inside `if`).","`-u`: an unset variable is an error, not an empty string.","`pipefail`: a pipeline fails if any command in it fails, not only the last one."],"solution":["echo \"=== -e ===\"","bash -c 'false; echo \"without -e: still running\"'","bash -c 'set -e; false; echo \"never printed\"'; echo \"with -e: stopped, exit code $?\"","echo \"=== -u ===\"","bash -c 'echo \"without -u: Hello [$NAEM]\"'","bash -c 'set -u; echo \"Hello $NAEM\"'; echo \"with -u: exit code $?\"","echo \"=== pipefail ===\"","bash -c 'grep ERROR missing.log | wc -l; echo \"without pipefail: exit code $?\"'","bash -c 'set -o pipefail; grep ERROR missing.log | wc -l; echo \"with pipefail: exit code $?\"'"],"explanation":[{"part":"set -e","meaning":"Stop the script at the first failing command. Not inside `if`, `while` tests, or before `&&`/`||`."},{"part":"set -u","meaning":"Using an unset variable is an error: `NAEM: unbound variable`, and the script stops with a non-zero code (127 here). Catches typos."},{"part":"set -o pipefail","meaning":"The pipeline's exit code is the last non-zero one. Without it, `wc -l` (success) hides grep's error."},{"part":"set -euo pipefail","meaning":"All three in one line, near the top of the script."},{"part":"${VAR:-}","meaning":"With `-u`, use `${VAR:-}` for variables that may be unset on purpose."}],"expected_output":"=== -e ===\nwithout -e: still running\nwith -e: stopped, exit code 1\n=== -u ===\nwithout -u: Hello []\nbash: line 1: NAEM: unbound variable\nwith -u: exit code 127\n=== pipefail ===\ngrep: missing.log: No such file or directory\n0\nwithout pipefail: exit code 0\ngrep: missing.log: No such file or directory\n0\nwith pipefail: exit code 2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Thinking `set -e` catches everything: `if false; then ...`, `false || true`, and commands in `$( )` inside `local x=$(...)` do not stop the script.","Adding `set -u` to an old script and getting `$1: unbound variable` when no argument is given. Use `${1:-}` or check `$#` first."],"checks":[{"run":"bash -c 'set -u; echo \"Hello $NAEM\"'","expect":"NAEM: unbound variable"}],"interview_say":"`set -e` stops on errors, `set -u` makes unset variables an error, and `pipefail` makes a pipeline fail when any part fails. Together they turn silent bugs into clear failures.","try_yourself":"Run `bash -c 'set -e; if false; then echo yes; fi; echo \"still here\"'`. Why does `set -e` not stop here?"},{"id":"d22p02","title":"trap EXIT + mktemp: always clean up","type":"script","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A build script downloads files into a temp folder. When it fails in the middle, old temp folders stay in `/tmp` and fill the disk. With `trap cleanup EXIT`, the cleanup runs on success, on error and on Ctrl+C.","task":["Write `build-tmp.sh`: `set -euo pipefail`, create `WORK=$(mktemp -d)`, and `trap cleanup EXIT`.","In `cleanup`, remove `$WORK` and print the original exit code.","Make the script fail on purpose in the middle (`false`).","Run it, print the exit code, and check that the temp folder is gone."],"hints":["Save the exit code first in cleanup: `local rc=$?`.","Print the temp folder path to a file, so it can be checked after the script ended.","`[ -d \"$path\" ] || echo gone`"],"solution":["cat > build-tmp.sh <<'EOF'","#!/bin/bash","set -euo pipefail","WORK=$(mktemp -d)","cleanup() {","  local rc=$?","  rm -rf \"$WORK\"","  echo \"cleanup: removed the temp folder (exit code was $rc)\"","}","trap cleanup EXIT","echo \"$WORK\" > last-workdir.txt","echo \"downloading into the temp folder\"","touch \"$WORK/part1.tgz\"","false                                   # something fails here","echo \"never printed\"","EOF","bash build-tmp.sh; echo \"script exit code: $?\"","[ -d \"$(cat last-workdir.txt)\" ] && echo \"temp folder still there\" || echo \"temp folder is gone\""],"explanation":[{"part":"mktemp -d","meaning":"A new private temp folder (Day 13)."},{"part":"trap cleanup EXIT","meaning":"Run `cleanup` when the script exits for any reason: normal end, `set -e` stop, `exit N`, Ctrl+C."},{"part":"local rc=$?","meaning":"The first line of the trap still sees the exit code that caused the exit."},{"part":"rm -rf \"$WORK\"","meaning":"Safe because `$WORK` always comes from mktemp; never `rm -rf` an unchecked variable."}],"expected_output":"downloading into the temp folder\ncleanup: removed the temp folder (exit code was 1)\nscript exit code: 1\ntemp folder is gone","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Putting cleanup only at the end of the script: with `set -e`, the end is never reached after an error.","`trap \"rm -rf $WORK\" EXIT` with double quotes before WORK is set: the trap gets an empty path. Use a function or single quotes."],"interview_say":"I create temp files with `mktemp` and register `trap cleanup EXIT` right after, so cleanup runs whether the script succeeds, fails, or is interrupted.","try_yourself":"Add `trap 'echo \"interrupted\"; exit 130' INT` and press Ctrl+C during a `sleep 10` in the script."},{"id":"d22p03","title":"Lock file: never run twice at the same time","type":"script","topic":"Scripting","minutes":13,"optional":false,"core":false,"workdir":".","situation":"A backup runs from cron every 10 minutes. Sometimes one run takes 15 minutes, so two copies run at once and break each other's files. `flock` makes the second copy stop at once.","task":["Write `job.sh` that opens a lock file with `exec 9> job.lock` and takes the lock with `flock -n 9`.","If the lock is taken, print `another run is active, exiting` and exit 1.","The job itself: print a message, `sleep 2`, print done.","Start one copy in the background, then a second one at once. Print the exit codes."],"hints":["`exec 9> FILE` opens FILE on file descriptor 9 for the whole script.","`flock -n 9` = try to lock fd 9, do not wait (`-n` = non-blocking).","The lock is released automatically when the script ends, even after a crash."],"solution":["cat > job.sh <<'EOF'","#!/bin/bash","set -euo pipefail","exec 9> job.lock","if ! flock -n 9; then","  echo \"[$1] another run is active, exiting\" >&2","  exit 1","fi","echo \"[$1] got the lock, working\"","sleep 2","echo \"[$1] done\"","EOF","bash job.sh first &","sleep 0.5","bash job.sh second; echo \"second run exit code: $?\"","wait $!; echo \"first run exit code: $?\"","bash job.sh third; echo \"third run exit code: $?\""],"explanation":[{"part":"exec 9> job.lock","meaning":"Keep the lock file open as fd 9 until the script ends."},{"part":"flock -n 9","meaning":"Take an exclusive lock; fail at once if another process has it."},{"part":"automatic release","meaning":"The kernel releases the lock when the process ends. No stale lock files, unlike `touch lockfile`."},{"part":"cron one-liner","meaning":"`flock -n /tmp/backup.lock /opt/backup.sh` in the crontab does the same without changing the script."}],"expected_output":"[first] got the lock, working\n[second] another run is active, exiting\nsecond run exit code: 1\n[first] done\nfirst run exit code: 0\n[third] got the lock, working\n[third] done\nthird run exit code: 0","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `[ -f lock ] && exit; touch lock`: two runs can pass the test at the same moment, and a crash leaves the lock file forever.","Putting the lock file in a folder cleaned at reboot is fine; putting it in a shared NFS folder can be unreliable."],"interview_say":"To stop overlapping runs I use `flock`: `exec 9>/var/lock/job.lock; flock -n 9 || exit 1`. The lock is released automatically when the process ends, so there are no stale locks.","try_yourself":"Use `flock -w 5 9` instead of `-n`. Now the second run waits up to 5 seconds. What happens?"},{"id":"d22p04","title":"Idempotent setup: safe to run again","type":"script","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A server setup script is run again after every change. The first version added the same config line twice and failed on `mkdir` the second time. An idempotent script gives the same result no matter how many times it runs (like Ansible or Terraform).","task":["Write `setup.sh` that: creates `data/logs` and `data/cache`, adds `log_dir=data/logs` to `app.conf` only if it is missing, and points `current` to `data`.","Print `created` / `already ok` for each step.","Run it twice. Show `app.conf` and `readlink current` at the end."],"hints":["`mkdir -p` never fails if the folder exists.","`grep -qxF 'line' file || echo 'line' >> file` adds a line only once.","`ln -sfn data current` can run many times."],"solution":["cat > setup.sh <<'EOF'","#!/bin/bash","set -euo pipefail","step() { printf '%-28s %s\\n' \"$1\" \"$2\"; }","for d in data/logs data/cache; do","  if [ -d \"$d\" ]; then step \"$d\" \"already ok\"; else mkdir -p \"$d\"; step \"$d\" \"created\"; fi","done","LINE='log_dir=data/logs'","if grep -qxF \"$LINE\" app.conf; then step \"app.conf: $LINE\" \"already ok\"","else echo \"$LINE\" >> app.conf; step \"app.conf: $LINE\" \"added\"; fi","ln -sfn data current","step \"current -> $(readlink current)\" \"ok\"","EOF","echo \"=== first run ===\"; bash setup.sh","echo \"=== second run ===\"; bash setup.sh","cat app.conf"],"explanation":[{"part":"idempotent","meaning":"Running it 1 time or 10 times gives the same end state."},{"part":"check, then act","meaning":"Test the current state first; change only what is missing."},{"part":"grep -qxF","meaning":"Quiet, whole line (`-x`), fixed text (`-F`): exact line exists?"},{"part":"mkdir -p / ln -sfn","meaning":"Commands that are already idempotent."}],"expected_output":"=== first run ===\ndata/logs                    created\ndata/cache                   created\napp.conf: log_dir=data/logs  added\ncurrent -> data              ok\n=== second run ===\ndata/logs                    already ok\ndata/cache                   already ok\napp.conf: log_dir=data/logs  already ok\ncurrent -> data              ok\n# todo-api settings\nport=8080\nlog_dir=data/logs","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`echo 'line' >> file` without a check: every run adds another copy.","`useradd deploybot` in a setup script: the second run fails with `useradd: user 'deploybot' already exists`. Check with `id deploybot` first."],"interview_say":"My setup scripts are idempotent: they check the current state and change only what is missing, using `mkdir -p`, `grep -q || echo >>`, and `ln -sfn`. That is the same idea as Ansible or Terraform.","try_yourself":"Change the config value to `log_dir=/var/log/todo` in the script. Should the script replace the old line? Use `sed -i` for that case."},{"id":"d22p05","title":"Find the bug: the CI step that is always green","type":"fix-bug","topic":"Scripting","minutes":14,"optional":false,"core":false,"workdir":".","situation":"In Jenkins, the job `ci-step.sh` is green even when tests fail. Looking closer: it does not even run in the right folder. The goal is in the comments: the job must fail if the tests fail.","task":["Run `bash ci-step.sh; echo \"CI sees exit code $?\"`. Read the output.","Find 4 problems: a typo in a variable name, `cd` without a check, no `set -euo pipefail`, and `| tee` hiding the test result.","Fix them. Run again: the job must now fail with a clear exit code, and `build/test.log` must exist."],"hints":["`$BULD_DIR` is empty, so `cd` went to the home folder. `set -u` would catch it.","`cd \"$BUILD_DIR\" || exit 1` (or rely on `set -e`).","Without `pipefail`, the pipeline's exit code is the one of `tee`, which is 0."],"solution":["bash ci-step.sh; echo \"CI sees exit code $?\"","cat > ci-step.sh <<'EOF'","#!/bin/bash","# CI step: go into build/, run the tests, save the output in test.log,","# and FAIL the job (exit code not 0) if the tests fail.","set -euo pipefail","BUILD_DIR=build","cd \"$BUILD_DIR\" || exit 1","echo \"building in $(pwd)\"","./run-tests.sh | tee test.log","echo \"tests finished\"","EOF","echo \"--- fixed ---\"","bash ci-step.sh; echo \"CI sees exit code $?\"","ls build/test.log"],"explanation":[{"part":"BULD_DIR typo","meaning":"Bug 1: the variable was empty; `cd` with no argument goes to `$HOME`. `set -u` turns this into an error."},{"part":"cd ... || exit 1","meaning":"Bug 2: never continue in the wrong folder."},{"part":"set -euo pipefail","meaning":"Bug 3: without it the script went on after every error."},{"part":"| tee + pipefail","meaning":"Bug 4: `tee` succeeded, so the failing tests were hidden. With pipefail, exit code 1 reaches Jenkins."},{"part":"no \"tests finished\"","meaning":"With `set -e`, the script stops at the failed pipeline. Jenkins marks the build as failed."}],"expected_output":"building in /home/wicky\nci-step.sh: line 7: ./run-tests.sh: No such file or directory\ntests finished\nCI sees exit code 0\n--- fixed ---\nbuilding in /home/wicky/bash-practice/day22/build\nrunning 12 tests\nFAIL: test_create_todo\nCI sees exit code 1\nbuild/test.log","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Adding `|| true` to make a red build green. It hides real failures.","Checking only the console output in Jenkins. Jenkins decides red or green from the exit code alone."],"interview_say":"CI tools only see exit codes. I start every CI script with `set -euo pipefail`, check `cd`, and remember that a pipe into `tee` hides failures unless `pipefail` is on.","try_yourself":"Run `shellcheck ci-step.sh` on the broken version (run Reset and setup again). Which warnings match the bugs you found?"},{"id":"d22p06","title":"A logging function with timestamps and levels","type":"script","topic":"Scripting","minutes":10,"optional":true,"core":false,"workdir":".","situation":"When a nightly script fails, the team needs to know what happened and when. A small `log` function adds a timestamp and a level to every line, writes to a log file, and sends errors to stderr.","task":["Write `log LEVEL message...`: print `YYYY-MM-DD HH:MM:SS LEVEL message`.","Append every line to `job.log` with `tee -a`. For `ERROR`, send the screen copy to stderr.","Add `info`, `warn` and `error` shortcuts. Use them, then show `job.log`."],"hints":["`date '+%F %T'` gives `2026-10-20 14:30:00`.","`printf '%s %-5s %s\\n' \"$(date '+%F %T')\" \"$level\" \"$*\"`","For errors: `... | tee -a job.log >&2`."],"solution":["cat > logging.sh <<'EOF'","#!/bin/bash","LOG_FILE=${LOG_FILE:-job.log}","log() {","  local level=$1; shift","  local line","  line=$(printf '%s %-5s %s' \"$(date '+%F %T')\" \"$level\" \"$*\")","  if [ \"$level\" = ERROR ]; then echo \"$line\" | tee -a \"$LOG_FILE\" >&2","  else echo \"$line\" | tee -a \"$LOG_FILE\"; fi","}","info()  { log INFO \"$@\"; }","warn()  { log WARN \"$@\"; }","error() { log ERROR \"$@\"; }","info \"backup started\"","warn \"disk is 85% full\"","error \"upload to S3 failed\"","EOF","bash logging.sh 2>/dev/null","echo \"--- job.log ---\"","cut -d' ' -f3- job.log"],"explanation":[{"part":"date '+%F %T'","meaning":"Timestamp in ISO style; sortable and clear."},{"part":"%-5s","meaning":"Level padded to 5 characters, so messages line up."},{"part":"tee -a ... >&2","meaning":"Errors go to the log file AND to stderr (Day 4)."},{"part":"2>/dev/null when testing","meaning":"Shows that the ERROR line went to stderr: it is missing on screen but present in the file."},{"part":"cut -d' ' -f3-","meaning":"Here only to hide the changing date and time in the printed log."}],"expected_output":"2026-10-20 16:00:56 INFO  backup started\n2026-10-20 16:00:56 WARN  disk is 85% full\n--- job.log ---\nINFO  backup started\nWARN  disk is 85% full\nERROR upload to S3 failed","expect_exit":0,"output_check":false,"output_note":"The screen lines contain the current date and time, so they are different on every run.","verified":true,"mistakes":["Logging secrets (tokens, passwords) by mistake with `info \"using $TOKEN\"`. Never log secret values (Day 26).","Using `echo $line` without quotes: the double spaces from `%-5s` disappear."],"interview_say":"My scripts use a small `log` function with timestamp and level, write to a file with `tee -a`, and send errors to stderr, so both humans and log tools can read them.","try_yourself":"Add `logger -t todo-backup \"$line\"` to also send each line to the system log (journal or syslog)."},{"id":"d22p07","title":"Debug with bash -x and ShellCheck","type":"explain-error","topic":"Scripting","minutes":10,"optional":true,"core":false,"workdir":".","situation":"`greet.sh` prints `unary operator expected` when started without a name. The user traces it line by line with `bash -x`, then lets ShellCheck explain the bug and the fix.","task":["Run `bash greet.sh` with no argument. Read the error.","Run `bash -x greet.sh`. Each `+` line is a command just before it runs. Find the broken test.","Run `shellcheck greet.sh`. Read the codes (SC2086 ...).","Fix the script and run it with no argument and with `admin`."],"hints":["In the trace, `[ = admin ]` shows that `$name` was empty.","ShellCheck says: double quote to prevent splitting.","`if [ \"${name:-}\" = admin ]` works with an empty name."],"solution":["bash greet.sh","echo \"=== trace ===\"","bash -x greet.sh","echo \"=== shellcheck ===\"","shellcheck -f gcc greet.sh || true","sed -i 's/\\[ \\$name = \"admin\" \\]/[ \"$name\" = \"admin\" ]/' greet.sh","echo \"=== fixed ===\"","bash greet.sh; bash greet.sh admin"],"explanation":[{"part":"bash -x script","meaning":"Print each command (with variables already replaced) before running it."},{"part":"+ '[' = admin ']'","meaning":"The empty `$name` disappeared, so `[` got only 2 words."},{"part":"set -x / set +x","meaning":"Turn tracing on and off for one part of a script."},{"part":"shellcheck -f gcc","meaning":"One line per finding: file:line:column: level: message [code]."},{"part":"|| true","meaning":"ShellCheck exits 1 when it finds problems; here we only want to read them."}],"expected_output":"greet.sh: line 4: [: =: unary operator expected\nHello,\n=== trace ===\n+ name=\n+ greeting=Hello\n+ '[' = admin ']'\ngreet.sh: line 4: [: =: unary operator expected\n+ echo 'Hello, '\nHello,\n=== shellcheck ===\ngreet.sh:4:6: note: Double quote to prevent globbing and word splitting. [SC2086]\n=== fixed ===\nHello,\nWelcome back, admin","expect_exit":0,"output_check":false,"output_note":"Ubuntu 22.04 has ShellCheck 0.8; the warning wording can be a little different.","verified":true,"mistakes":["Leaving `set -x` on in a CI script: every command is printed, including secret values from variables.","Ignoring ShellCheck notes because the script works today. Most notes are bugs that wait for the right input (like a space in a name)."],"interview_say":"I debug scripts with `bash -x` to see each command with real values, and I run ShellCheck in CI to catch quoting bugs, unchecked `cd`, and unused variables before they reach production.","try_yourself":"Set `PS4='+ ${LINENO}: '` and run `bash -x greet.sh` again. What does the trace show now?"}],"interview":[{"q":"What does `set -euo pipefail` do?","a":"`-e` exits on the first failed command, `-u` treats unset variables as errors, and `-o pipefail` makes a pipeline fail when any command in it fails.","topic":"Scripting"},{"q":"How do you make sure temp files are deleted even if the script fails?","a":"Create them with `mktemp` and add `trap cleanup EXIT` (or `trap 'rm -rf \"$TMP\"' EXIT`). The trap runs on success, error and Ctrl+C.","topic":"Scripting"},{"q":"How do you stop a cron script from running twice at the same time?","a":"With `flock`: `exec 9>/var/lock/job.lock; flock -n 9 || exit 1`, or `flock -n /tmp/job.lock script.sh` in the crontab.","topic":"Scripting"},{"q":"What is an idempotent script?","a":"A script that can run many times with the same final result. It checks the current state before changing anything (`mkdir -p`, `grep -q || echo >>`, `ln -sfn`).","topic":"Scripting"},{"q":"How do you debug a bash script?","a":"Run it with `bash -x` (or `set -x` around a part) to trace commands, and run ShellCheck to find quoting and logic bugs.","topic":"Scripting"}],"recap":[{"cmd":"set -euo pipefail","meaning":"Stop on errors, unset vars, failed pipes","example":"#!/bin/bash\\nset -euo pipefail","topic":"Scripting"},{"cmd":"${VAR:-}","meaning":"Allowed-empty variable under set -u","example":"if [ -n \"${DEBUG:-}\" ]; then set -x; fi","topic":"Scripting"},{"cmd":"trap cleanup EXIT","meaning":"Always run cleanup at exit","example":"trap 'rm -rf \"$WORK\"' EXIT","topic":"Scripting"},{"cmd":"mktemp -d","meaning":"Private temp folder","example":"WORK=$(mktemp -d)","topic":"Scripting"},{"cmd":"exec 9>lock; flock -n 9","meaning":"Only one run at a time","example":"flock -n 9 || { echo busy; exit 1; }","topic":"Scripting"},{"cmd":"flock -n FILE cmd","meaning":"Lock around a command (crontab)","example":"*/10 * * * * flock -n /tmp/b.lock /opt/backup.sh","topic":"Scripting"},{"cmd":"grep -qxF line f || echo line >> f","meaning":"Add a line only once (idempotent)","example":"grep -qxF 'vm.swappiness=10' /etc/sysctl.conf || ...","topic":"Scripting"},{"cmd":"log() with date '+%F %T'","meaning":"Timestamped log lines","example":"log INFO \"backup started\"","topic":"Scripting"},{"cmd":"bash -x / set -x","meaning":"Trace commands","example":"bash -x deploy.sh","topic":"Scripting"},{"cmd":"shellcheck","meaning":"Static checker for shell scripts","example":"shellcheck -f gcc *.sh","topic":"Scripting"},{"cmd":"cd dir || exit 1","meaning":"Never continue in the wrong folder","example":"cd \"$BUILD_DIR\" || exit 1","topic":"Scripting"}],"coverage":[{"item":"set -euo pipefail","problems":["d22p01","d22p05"]},{"item":"trap ... EXIT, cleanup","problems":["d22p02"]},{"item":"mktemp","problems":["d22p02"]},{"item":"Lock files","problems":["d22p03"]},{"item":"Idempotent scripts","problems":["d22p04"]},{"item":"Logging function with timestamps","problems":["d22p06"]},{"item":"bash -x","problems":["d22p07"]},{"item":"ShellCheck rules","problems":["d22p05","d22p07"]},{"item":"Exit codes for CI","problems":["d22p01","d22p05"]}],"reset":"rm -rf ~/bash-practice/day22"},{"day":23,"week":4,"title":"Project: Nginx log analyzer","goal":"Build a real log analyzer step by step: status codes, error rate, top IPs and URLs, a time window, and a clean report with an exit code for alerting.","minutes":90,"setup":["mkdir -p ~/bash-practice/day23 && cd ~/bash-practice/day23","# an Nginx access log in the default \"combined\" format (122 lines)","ips=(10.0.0.5 10.0.0.7 192.168.1.20 172.16.0.3 10.0.0.9 203.0.113.50)","paths=(/api/todos /api/todos /api/todos /login /login /api/todos/1 /static/app.js /health /api/todos/2 /api/users/7)","uas=(\"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\" \"curl/8.5.0\" \"Mozilla/5.0 (X11; Linux x86_64)\" \"python-requests/2.31\")","for i in $(seq 1 120); do","  ip=${ips[$(( (i * 5 + i / 7) % 6 ))]}","  [ $(( i % 3 )) -eq 0 ] && ip=10.0.0.5","  p=${paths[$(( i % 10 ))]}","  case $(( i % 13 )) in 0) st=500 ;; 5) st=502 ;; 7) st=404 ;; 9) st=301 ;; *) st=200 ;; esac","  m=GET; [ \"$p\" = /login ] && m=POST","  ua=${uas[$(( i % 4 ))]}; [ \"$p\" = /health ] && ua=\"kube-probe/1.29\"","  printf '%s - - [20/Oct/2026:10:%02d:%02d +0530] \"%s %s HTTP/1.1\" %s %s \"-\" \"%s\"\\n' \"$ip\" $(( i / 8 )) $(( (i * 7) % 60 )) \"$m\" \"$p\" \"$st\" $(( (i * 37) % 900 + 100 )) \"$ua\"","done > access.log","# two broken requests, like the ones internet scanners send","printf '%s\\n' '203.0.113.99 - - [20/Oct/2026:10:07:01 +0530] \"-\" 400 0 \"-\" \"-\"' '203.0.113.99 - - [20/Oct/2026:10:07:02 +0530] \"\\x16\\x03\\x01\\x02\" 400 157 \"-\" \"-\"' >> access.log","# P3: the first version of the analyzer, with bugs","printf '%s\\n' '#!/bin/bash' '# Usage: analyze-v1.sh <access.log>' '# Prints the count of each status code (biggest first) and the 5xx error rate with 2 decimals.' 'LOG=$1' 'echo \"== status codes ==\"' \"awk '{print \\$9}' \\$LOG | sort | uniq -c | sort -r\" 'TOTAL=$(wc -l < $LOG)' \"ERRORS=\\$(awk '\\$9 >= 500' \\$LOG | wc -l)\" 'echo \"5xx rate: $((ERRORS * 100 / TOTAL))%\"' > analyze-v1.sh","# P7: yesterday's rotated and compressed log","head -n 30 access.log | sed 's#20/Oct/2026#19/Oct/2026#' | gzip -n > access.log.1.gz","cd ~/bash-practice/day23"],"warmup":[{"q":"What does `set -o pipefail` change?","a":"A pipeline fails if any command in it fails, not only the last one. Important with `| tee`.","from_day":22},{"q":"Which awk option sets the field separator? Give an example for a CSV.","a":"`-F`, for example `awk -F, '{print $2}' file.csv`.","from_day":11},{"q":"Which pipeline counts values and puts the most common first?","a":"`sort | uniq -c | sort -rn`","from_day":12},{"q":"How do you read a `.gz` log without unpacking it?","a":"`zcat file.gz` (or `zgrep pattern file.gz`).","from_day":20}],"problems":[{"id":"d23p01","title":"Status codes and the 5xx error rate","type":"command","topic":"Text","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The team lead asks: \"How many 2xx, 3xx, 4xx and 5xx did the to-do app return this morning, and what is the 5xx rate?\" The log is in Nginx combined format, and it has two broken lines from internet scanners. A robust parser splits the line at the double quotes.","task":["Look at one normal line and the two broken lines at the end (`tail -n 3 access.log`).","Split lines at `\"` with `awk -F'\"'`: the request is field 2, and field 3 starts with the status. Print the status counts, biggest first.","Compute the 5xx error rate with 2 decimals in awk.","Count by class (2xx, 3xx, 4xx, 5xx)."],"hints":["Combined format: `IP - user [time] \"request\" status bytes \"referer\" \"user agent\"`.","With `-F'\"'`, `$3` is ` 200 512 ` (status and bytes). `split($3, a, \" \")` puts the status in `a[1]`.","Error rate: `if (a[1] >= 500) e++` and in END `printf \"%.2f\", e * 100 / NR`."],"solution":["tail -n 3 access.log","echo \"=== status codes ===\"","awk -F'\"' '{ split($3, a, \" \"); print a[1] }' access.log | sort | uniq -c | sort -rn","echo \"=== 5xx error rate ===\"","awk -F'\"' '{ split($3, a, \" \"); if (a[1] >= 500) e++ }","           END { printf \"%d of %d requests (%.2f%%)\\n\", e, NR, e * 100 / NR }' access.log","echo \"=== by class ===\"","awk -F'\"' '{ split($3, a, \" \"); c[substr(a[1], 1, 1) \"xx\"]++ } END { for (k in c) print k, c[k] }' access.log | sort"],"explanation":[{"part":"-F'\"'","meaning":"Split at double quotes: 1 = IP, user and time; 2 = request; 3 = status and bytes; 4 = referer; 6 = user agent."},{"part":"split($3, a, \" \")","meaning":"Split field 3 at spaces into the array `a`; `a[1]` is the status."},{"part":"why not $9","meaning":"With spaces as separator, the status is `$9` only when the request has 3 parts. For `\"-\"` the fields shift."},{"part":"e * 100 / NR","meaning":"awk does decimal math, so `%.2f` shows 2 decimals."},{"part":"substr(a[1], 1, 1) \"xx\"","meaning":"First digit + `xx` = status class (Day 14)."}],"expected_output":"10.0.0.5 - - [20/Oct/2026:10:15:00 +0530] \"GET /api/todos HTTP/1.1\" 200 940 \"-\" \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\"\n203.0.113.99 - - [20/Oct/2026:10:07:01 +0530] \"-\" 400 0 \"-\" \"-\"\n203.0.113.99 - - [20/Oct/2026:10:07:02 +0530] \"\\x16\\x03\\x01\\x02\" 400 157 \"-\" \"-\"\n=== status codes ===\n     84 200\n      9 502\n      9 500\n      9 404\n      9 301\n      2 400\n=== 5xx error rate ===\n18 of 122 requests (14.75%)\n=== by class ===\n2xx 84\n3xx 9\n4xx 11\n5xx 18","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Parsing with `awk '{print $9}'`: broken requests and user agents with spaces in other fields can shift the columns (P3).","Counting 404 as \"errors\" in the same number as 500. 4xx are usually client mistakes; 5xx are server problems. Report them separately."],"interview_say":"To parse Nginx combined logs safely I split at the double quotes with `awk -F'\"'`. The status is the first word of field 3, which works even for broken requests. Then I count with `sort | uniq -c` and compute the 5xx rate in awk.","try_yourself":"Print the full request lines that had status 502: `awk -F'\"' '{split($3,a,\" \"); if (a[1] == 502) print $2}' access.log`."},{"id":"d23p02","title":"Top IPs and top URLs","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"Security asks which clients send the most requests, and the product team asks which pages are the most popular. The user also wants the top URLs that return 5xx, because those are the ones to fix first.","task":["Top 5 client IPs with counts.","Top 5 URLs (the path is the 2nd word of the request). Skip broken requests that have no path.","Top 3 URLs that returned 5xx.","Number of different client IPs."],"hints":["The IP is the first word of the line: `awk '{print $1}'` is safe here.","`split($2, r, \" \")`: `r[1]` method, `r[2]` path, `r[3]` protocol. Skip lines where `r[2] == \"\"`.","Unique count: `awk '{print $1}' access.log | sort -u | wc -l`."],"solution":["echo \"=== top 5 IPs ===\"","awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -n 5","echo \"=== top 5 URLs ===\"","awk -F'\"' '{ split($2, r, \" \"); if (r[2] != \"\") print r[2] }' access.log | sort | uniq -c | sort -rn | head -n 5","echo \"=== top URLs with 5xx ===\"","awk -F'\"' '{ split($2, r, \" \"); split($3, a, \" \"); if (a[1] >= 500) print r[2] }' access.log | sort | uniq -c | sort -rn | head -n 3","echo \"unique client IPs: $(awk '{print $1}' access.log | sort -u | wc -l)\""],"explanation":[{"part":"awk '{print $1}'","meaning":"The IP never has spaces, so space-splitting is fine for field 1."},{"part":"split($2, r, \" \")","meaning":"The request `GET /api/todos HTTP/1.1` → method, path, protocol."},{"part":"if (r[2] != \"\")","meaning":"Skip broken requests like `\"-\"` that have no path."},{"part":"two splits in one line","meaning":"Path from field 2 and status from field 3, then filter on the status."},{"part":"sort -u | wc -l","meaning":"Count distinct values."}],"expected_output":"=== top 5 IPs ===\n     63 10.0.0.5\n     12 203.0.113.50\n     12 192.168.1.20\n     11 172.16.0.3\n     11 10.0.0.9\n=== top 5 URLs ===\n     36 /api/todos\n     24 /login\n     12 /static/app.js\n     12 /health\n     12 /api/users/7\n=== top URLs with 5xx ===\n      4 /login\n      4 /api/todos\n      2 /static/app.js\nunique client IPs: 7","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `head` before the second sort: the result is the first IPs alphabetically, not the busiest.","Counting `/api/todos/1` and `/api/todos/2` as different endpoints when the question is about endpoints. Normalise ids with sed first (Day 14)."],"interview_say":"Top IPs: `awk '{print $1}' | sort | uniq -c | sort -rn | head`. For URLs I take the second word of the request field, and I filter by status to find the endpoints that fail most.","try_yourself":"Normalise ids before counting: add `| sed -E 's#/[0-9]+$#/:id#'` before `sort` in the URL pipeline."},{"id":"d23p03","title":"Find the bug: analyzer v1","type":"fix-bug","topic":"Text","minutes":14,"optional":false,"core":false,"workdir":".","situation":"The first version of the analyzer, `analyze-v1.sh`, shows a strange `\"-\"` status, the list is not in the right order, and the error rate is a whole number. It also breaks for a log path with spaces.","task":["Run `bash analyze-v1.sh access.log`. Compare with your results from P1.","Find 4 bugs: `$9` parsing, `sort -r`, the integer percent, and the missing quotes/usage check.","Write the fixed `analyze.sh` and run it.","Test the usage message: run it with no argument."],"hints":["`\"-\"` appears because the broken lines shift the fields. Use the `-F'\"'` parser from P1.","`sort -r` is text order. Counts need `sort -rn`.","Bash `$(( ))` has no decimals. Do the math in awk. Add `LOG=${1:?usage: analyze.sh <access.log>}`."],"solution":["bash analyze-v1.sh access.log","cat > analyze.sh <<'EOF'","#!/bin/bash","# Usage: analyze.sh <access.log>","# Prints the count of each status code (biggest first) and the 5xx error rate with 2 decimals.","set -euo pipefail","LOG=${1:?usage: analyze.sh <access.log>}","[ -r \"$LOG\" ] || { echo \"error: cannot read $LOG\" >&2; exit 2; }","status() { awk -F'\"' '{ split($3, a, \" \"); print a[1] }' \"$LOG\"; }","echo \"== status codes ==\"","status | sort | uniq -c | sort -rn","status | awk '{ if ($1 >= 500) e++ } END { printf \"5xx rate: %.2f%%\\n\", e * 100 / NR }'","EOF","echo \"--- fixed ---\"","bash analyze.sh access.log","bash analyze.sh; echo \"exit code: $?\""],"explanation":[{"part":"$9 → -F'\"' split","meaning":"Bug 1: the broken requests produced `\"-\"` as a status."},{"part":"sort -rn","meaning":"Bug 2: counts must be sorted as numbers."},{"part":"printf %.2f in awk","meaning":"Bug 3: `$(( ))` cut 8.20 down to 8."},{"part":"${1:?...} and \"$LOG\"","meaning":"Bug 4: no usage check and no quotes: a missing argument made `wc` wait for keyboard input."},{"part":"status() function","meaning":"Parse once in one place; both outputs use it."}],"expected_output":"== status codes ==\n     84 200\n      9 502\n      9 500\n      9 404\n      9 301\n      2 \"-\"\n5xx rate: 14%\n--- fixed ---\n== status codes ==\n     84 200\n      9 502\n      9 500\n      9 404\n      9 301\n      2 400\n5xx rate: 14.75%\nanalyze.sh: line 5: 1: usage: analyze.sh <access.log>\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Fixing the parser only in the count and not in the error rate. Put the parsing in one function.","Running the old script without an argument: awk waits for keyboard input (press Ctrl+C), and `wc -l < $LOG` gives `ambiguous redirect`. Always check arguments first."],"checks":[{"run":"LOG=; wc -l < $LOG","expect":"ambiguous redirect"}],"interview_say":"I make log parsing robust (split at quotes, not at spaces), sort counts numerically, do decimals in awk, and check the arguments, so one bad log line or a missing argument cannot break the report.","try_yourself":"Run the fixed script on yesterday's gzipped log: `bash analyze.sh <(zcat access.log.1.gz)`. Does it work with process substitution?"},{"id":"d23p04","title":"Only one time window: 10:05 to 10:09","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"An alert fired at 10:07. The on-call engineer wants only the requests between 10:05:00 and 10:09:59: how many, how many failed, and a small per-minute chart to see when the problem started.","task":["Get the time `HH:MM:SS` from field 4 with `substr($4, 14, 8)`.","Print only lines between `10:05:00` and `10:09:59` (text comparison works for this format). Count them.","Count the 5xx and 4xx in that window.","Print requests per minute for the whole log as a small bar chart with `#`."],"hints":["Field 4 looks like `[20/Oct/2026:10:07:01`: characters 14-21 are the time.","`t >= \"10:05:00\" && t <= \"10:09:59\"`","Per minute: `substr($4, 14, 5)` = `10:07`. Build the bar in END with a loop."],"solution":["awk '{ t = substr($4, 14, 8); if (t >= \"10:05:00\" && t <= \"10:09:59\") n++ } END { print \"requests 10:05-10:09:\", n }' access.log","awk -F'\"' '{ t = substr($1, index($1, \"[\") + 13, 8); split($3, a, \" \")","             if (t >= \"10:05:00\" && t <= \"10:09:59\") { if (a[1] >= 500) e5++; else if (a[1] >= 400) e4++ } }","           END { print \"5xx:\", e5 + 0, \" 4xx:\", e4 + 0 }' access.log","echo \"=== requests per minute ===\"","awk '{ m = substr($4, 14, 5); c[m]++ }","     END { for (k in c) { bar = \"\"; for (i = 0; i < c[k]; i++) bar = bar \"#\"; printf \"%s %2d %s\\n\", k, c[k], bar } }' access.log | sort"],"explanation":[{"part":"substr($4, 14, 8)","meaning":"From `[20/Oct/2026:10:07:01`, start at character 14, take 8: `10:07:01`."},{"part":"string comparison","meaning":"`HH:MM:SS` with leading zeros sorts like time, so `>=` and `<=` on text work."},{"part":"index($1, \"[\") + 13","meaning":"Same time, but found inside field 1 when the line is split at quotes."},{"part":"e5 + 0","meaning":"Print 0 instead of an empty value when nothing matched."},{"part":"bar loop","meaning":"Repeat `#` c[k] times: a quick chart in the terminal."}],"expected_output":"requests 10:05-10:09: 42\n5xx: 6  4xx: 5\n=== requests per minute ===\n10:00  7 #######\n10:01  8 ########\n10:02  8 ########\n10:03  8 ########\n10:04  8 ########\n10:05  8 ########\n10:06  8 ########\n10:07 10 ##########\n10:08  8 ########\n10:09  8 ########\n10:10  8 ########\n10:11  8 ########\n10:12  8 ########\n10:13  8 ########\n10:14  8 ########\n10:15  1 #","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Comparing times across midnight or across days with text: `23:59` > `00:01`. For long ranges, convert to epoch seconds (Day 13).","Forgetting that the log time zone (`+0530`) can be different from the alert's time zone (often UTC)."],"interview_say":"To focus on an incident I cut the log to the time window with awk, then count errors in that window and print requests per minute to see when it started.","try_yourself":"Show only the minute with the most 5xx errors."},{"id":"d23p05","title":"Final: log-report.sh, a clean report with an alert exit code","type":"script","topic":"Scripting","minutes":15,"optional":false,"core":false,"workdir":".","situation":"The final tool runs from cron every hour and posts its report to the team chat. Options: `-n N` (top N, default 5) and `-t PCT` (5xx alert threshold, default 5). It exits 1 when the 5xx rate is above the threshold, so the cron wrapper can page someone.","task":["Write `log-report.sh [-n N] [-t PCT] <access.log>` with `getopts`, `set -euo pipefail`, a usage function and input checks.","Sections: total requests, status classes, 5xx rate, top N IPs, top N URLs.","Use `printf` for aligned columns.","Exit 1 if the 5xx rate is above the threshold, else 0. Run it with defaults, then with `-n 3 -t 20`."],"hints":["Compare decimals with awk: `awk -v r=\"$RATE\" -v t=\"$THRESH\" 'BEGIN { exit !(r > t) }'`.","Reuse the parser from P1 in a function `parse` that prints `ip status path` per line.","`shift $((OPTIND - 1))` after getopts leaves the log file in `$1`."],"solution":["cat > log-report.sh <<'EOF'","#!/bin/bash","# Usage: log-report.sh [-n top] [-t threshold%] <access.log>","set -euo pipefail","usage() { echo \"usage: log-report.sh [-n top] [-t threshold%] <access.log>\" >&2; exit 2; }","TOP=5; THRESH=5","while getopts \"n:t:h\" opt; do","  case $opt in n) TOP=$OPTARG ;; t) THRESH=$OPTARG ;; *) usage ;; esac","done","shift $((OPTIND - 1))","LOG=${1:-}; [ -r \"$LOG\" ] || usage","[[ $TOP =~ ^[0-9]+$ ]] || usage","parse() { awk -F'\"' '{ split($1, f, \" \"); split($2, r, \" \"); split($3, a, \" \"); print f[1], a[1], (r[2] == \"\" ? \"-\" : r[2]) }' \"$LOG\"; }","TOTAL=$(parse | wc -l)","RATE=$(parse | awk '{ if ($2 >= 500) e++ } END { printf \"%.2f\", e * 100 / NR }')","echo \"Access log report: $(basename \"$LOG\")\"","printf '%-16s %s\\n' \"requests:\" \"$TOTAL\" \"5xx rate:\" \"$RATE% (alert above $THRESH%)\"","echo \"-- status classes --\"","parse | awk '{ c[substr($2, 1, 1) \"xx\"]++ } END { for (k in c) printf \"  %-5s %5d\\n\", k, c[k] }' | sort","echo \"-- top $TOP IPs --\"","parse | awk '{print $1}' | sort | uniq -c | sort -rn | head -n \"$TOP\" | awk '{ printf \"  %-15s %5d\\n\", $2, $1 }'","echo \"-- top $TOP URLs --\"","parse | awk '$3 != \"-\" {print $3}' | sort | uniq -c | sort -rn | head -n \"$TOP\" | awk '{ printf \"  %-15s %5d\\n\", $2, $1 }'","if awk -v r=\"$RATE\" -v t=\"$THRESH\" 'BEGIN { exit !(r > t) }'; then","  echo \"ALERT: 5xx rate $RATE% is above $THRESH%\" >&2","  exit 1","fi","EOF","bash log-report.sh access.log; echo \"exit code: $?\"","echo","bash log-report.sh -n 3 -t 20 access.log; echo \"exit code: $?\""],"explanation":[{"part":"getopts + shift $((OPTIND - 1))","meaning":"Read the options, then remove them so `$1` is the log file (Day 9)."},{"part":"parse()","meaning":"One robust parser that prints `ip status path`. All sections use it."},{"part":"printf '%-16s %s\\n' a b c d","meaning":"The format repeats for each pair: aligned labels."},{"part":"awk 'BEGIN { exit !(r > t) }'","meaning":"Compare decimal numbers (bash cannot). Exit 0 = true."},{"part":"ALERT to stderr + exit 1","meaning":"Cron or CI can react to the exit code; the report stays clean on stdout."}],"expected_output":"Access log report: access.log\nrequests:        122\n5xx rate:        14.75% (alert above 5%)\n-- status classes --\n  2xx      84\n  3xx       9\n  4xx      11\n  5xx      18\n-- top 5 IPs --\n  10.0.0.5           63\n  203.0.113.50       12\n  192.168.1.20       12\n  172.16.0.3         11\n  10.0.0.9           11\n-- top 5 URLs --\n  /api/todos         36\n  /login             24\n  /static/app.js     12\n  /health            12\n  /api/users/7       12\nALERT: 5xx rate 14.75% is above 5%\nexit code: 1\n\nAccess log report: access.log\nrequests:        122\n5xx rate:        14.75% (alert above 20%)\n-- status classes --\n  2xx      84\n  3xx       9\n  4xx      11\n  5xx      18\n-- top 3 IPs --\n  10.0.0.5           63\n  203.0.113.50       12\n  192.168.1.20       12\n-- top 3 URLs --\n  /api/todos         36\n  /login             24\n  /static/app.js     12\nexit code: 0","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Comparing `8.20 > 5` with `[ ]`: `integer expression expected`. Use awk or `bc` for decimals.","Parsing the log 5 times on a 10 GB file is slow. For big logs, do everything in one awk program, or parse once into a temp file."],"interview_say":"My log report script takes options with getopts, validates input, parses the log with one robust function, prints aligned sections with printf, and returns exit code 1 when the error rate passes a threshold, so cron or CI can alert.","try_yourself":"Add `-f` to choose a different field set, or add a section \"top user agents\" using field 6 of the quote split."},{"id":"d23p06","title":"User agents and bytes per endpoint","type":"command","topic":"Text","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The team wants to know which clients call the API (browsers, scripts, monitoring) and how much data each endpoint sends. User agents contain spaces, so space-based fields cannot work here.","task":["Print the top user agents (field 6 when splitting at `\"`).","Sum the response bytes per URL (bytes = second word of field 3) and print in KB, biggest first."],"hints":["`awk -F'\"' '{print $6}'`","`split($3, a, \" \"); sum[r[2]] += a[2]`","`printf \"%7.1f KB %s\\n\", sum[p] / 1024, p`"],"solution":["awk -F'\"' '{print $6}' access.log | sort | uniq -c | sort -rn","echo \"=== bytes per URL ===\"","awk -F'\"' '{ split($2, r, \" \"); split($3, a, \" \"); if (r[2] != \"\") sum[r[2]] += a[2] }","           END { for (p in sum) printf \"%7.1f KB  %s\\n\", sum[p] / 1024, p }' access.log | sort -rn"],"explanation":[{"part":"$6 with -F'\"'","meaning":"The user agent: the text inside the last pair of quotes."},{"part":"a[2]","meaning":"Bytes sent, the second word after the status."},{"part":"sum[path] += bytes","meaning":"Group and sum by path (Day 11)."}],"expected_output":"     30 Mozilla/5.0 (X11; Linux x86_64)\n     30 Mozilla/5.0 (Windows NT 10.0; Win64; x64)\n     24 python-requests/2.31\n     24 curl/8.5.0\n     12 kube-probe/1.29\n      2 -\n=== bytes per URL ===\n   19.2 KB  /api/todos\n   12.6 KB  /login\n    7.0 KB  /health\n    6.5 KB  /static/app.js\n    6.5 KB  /api/todos/2\n    6.1 KB  /api/users/7\n    6.1 KB  /api/todos/1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Trusting user agents: any client can send any text. Use them for statistics, not for security decisions."],"interview_say":"Because user agents contain spaces, I split combined logs at the quotes. Then the user agent is field 6 and I can group bytes or requests by any field with awk arrays.","try_yourself":"Count requests from `kube-probe` and from browsers (`Mozilla`) separately."},{"id":"d23p07","title":"Include rotated and gzipped logs","type":"command","topic":"Text","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Nginx logs are rotated every night: `access.log` (today), `access.log.1.gz` (yesterday, compressed). For a two-day report the user must read both without unpacking files on the server.","task":["Count the lines in each file (`wc -l` and `zcat ... | wc -l`).","Read both files in one stream with `zcat -f access.log access.log.1.gz` (`-f` passes plain fil
