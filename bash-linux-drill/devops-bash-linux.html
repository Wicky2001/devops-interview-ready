rep -v '^#' fstab.copy | awk '{print $2, \"->\", $3, \"(\" $4 \")\"}'","echo \"=== safe if missing ===\"","grep nofail fstab.copy | awk '{print $2}'"],"explanation":[{"part":"lsblk","meaning":"List block devices (disks, partitions) as a tree."},{"part":"findmnt","meaning":"Show what is mounted where, with type and options. `mount` shows the same in a long list."},{"part":"UUID=...","meaning":"Use the disk's UUID (from `blkid`), not `/dev/nvme1n1`: device names can change after reboot."},{"part":"nofail","meaning":"Do not stop the boot if this disk is missing. Important for cloud data disks."},{"part":"pass 1 / 2 / 0","meaning":"fsck order at boot: 1 for `/`, 2 for others, 0 = skip."}],"expected_output":"NAME    SIZE TYPE\nzram0     0B disk\nvda     256G disk\next4\n=== fstab.copy ===\n/ -> ext4 (defaults)\n/data -> ext4 (defaults,nofail)\nnone -> swap (sw)\n/tmp -> tmpfs (defaults,size=2G)\n=== safe if missing ===\n/data","expect_exit":0,"output_check":false,"output_note":"The `lsblk` and `findmnt` lines show the user's own machine. The fstab lines are from the practice copy.","verified":true,"mistakes":["Editing the real `/etc/fstab` and rebooting without `sudo mount -a`: a typo can drop the server into emergency mode.","Using `/dev/sdb` in fstab on a cloud VM: after a reboot the name can change and the wrong disk is mounted."],"interview_say":"To add a disk I find it with `lsblk`, format it, mount it, then add a UUID-based line with `nofail` to `/etc/fstab` and test with `mount -a` before any reboot.","try_yourself":"Run `cat /etc/fstab` on WSL (read only). What do you see there?"},{"id":"d17p07","title":"ulimit and \"Too many open files\"","type":"explain-error","topic":"Disk","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Under load, the Spring Boot backend logs `java.io.IOException: Too many open files`. Each process has a limit on open files (sockets count too). The user shows the limit and makes the error happen safely in a subshell.","task":["Print the open-files limit with `ulimit -n`, and a few other limits with `ulimit -a | head -n 5`.","In a subshell `( ... )`, set `ulimit -n 20` and open files until it fails.","Read the error. Then check the limit outside the subshell: it did not change."],"hints":["`exec {fd}>/dev/null` opens a new file descriptor and saves its number in `fd`.","The limit in a subshell does not change the main shell.","For services, set `LimitNOFILE=65536` in the systemd unit, or use `/etc/security/limits.conf` for users."],"solution":["echo \"open files limit: $(ulimit -n)\"","ulimit -a | head -n 5","(","  ulimit -n 20","  for i in $(seq 1 30); do","    exec {fd}>/dev/null || { echo \"could not open more files\"; break; }","  done",")","echo \"limit outside the subshell: $(ulimit -n)\""],"explanation":[{"part":"ulimit -n","meaning":"Maximum number of open file descriptors for this shell and its children."},{"part":"exec {fd}>/dev/null","meaning":"Open one more file descriptor (bash 4.1+)."},{"part":"Too many open files","meaning":"The process reached its limit. New files and network connections fail."},{"part":"LimitNOFILE=","meaning":"systemd setting for a service. Docker: `--ulimit nofile=65536:65536`."}],"expected_output":"open files limit: 20000\nreal-time non-blocking time  (microseconds, -R) unlimited\ncore file size              (blocks, -c) 0\ndata seg size               (kbytes, -d) unlimited\nscheduling priority                 (-e) 0\nfile size                   (blocks, -f) unlimited\nbash: redirection error: cannot duplicate fd: Too many open files\nbash: /dev/null: Too many open files\ncould not open more files\nlimit outside the subshell: 20000","expect_exit":0,"output_check":false,"output_note":"The limits on the user's machine can be different (WSL often shows 1024 for `ulimit -n`).","verified":true,"mistakes":["Raising the limit when the real problem is a leak (the app never closes connections). Check with `ls /proc/PID/fd | wc -l` over time.","Setting `ulimit -n` in `.bashrc` for a service: services do not read `.bashrc`. Use the unit file."],"checks":[{"run":"( ulimit -n 20; for i in $(seq 1 30); do exec {fd}>/dev/null || break; done )","expect":"Too many open files"}],"interview_say":"`Too many open files` means the process hit its file descriptor limit. I check `ulimit -n` and `/proc/PID/fd`, look for leaks, and raise `LimitNOFILE` in the systemd unit if the load is real.","try_yourself":"Run `ls /proc/$$/fd | wc -l` to count the open files of your own shell."}],"interview":[{"q":"The disk is full. What do you do first?","a":"`df -h` to find which filesystem, `df -i` for inodes, then `du -xh --max-depth=1 /path | sort -h` to walk down to the biggest folders. Delete or compress safely; check for deleted-but-open files with `lsof +L1`.","topic":"Disk"},{"q":"What is the difference between `du` and `df`?","a":"`du` adds up the sizes of files it can find by name. `df` shows the free and used space the filesystem reports. They differ when deleted files are still open.","topic":"Disk"},{"q":"What is an inode?","a":"A record for each file with its owner, permissions, size and data location. When all inodes are used, no new files can be created, even with free space.","topic":"Disk"},{"q":"In `free -m`, which column tells you if the server is short of memory?","a":"`available`. `free` is small on healthy servers because Linux uses spare RAM as cache.","topic":"Disk"},{"q":"What does load average mean?","a":"The average number of processes running or waiting for CPU (or disk) over 1, 5 and 15 minutes. Compare it with the number of CPUs from `nproc`.","topic":"Disk"}],"recap":[{"cmd":"df -h / df -i","meaning":"Space / inodes per filesystem","example":"df -h /var","topic":"Disk"},{"cmd":"du -sh DIR","meaning":"Total size of a folder","example":"du -sh /var/log","topic":"Disk"},{"cmd":"du -xh --max-depth=1 | sort -h","meaning":"Biggest sub-folders last","example":"sudo du -xh --max-depth=1 / | sort -h","topic":"Disk"},{"cmd":"find -size +1G","meaning":"Find big files","example":"sudo find / -xdev -size +1G","topic":"Disk"},{"cmd":"lsof +L1","meaning":"Deleted files still open","example":"sudo lsof +L1","topic":"Disk"},{"cmd":": > file","meaning":"Empty a live log safely","example":": > /var/log/app/app.log","topic":"Disk"},{"cmd":"free -m","meaning":"Memory in MB (look at available)","example":"free -m","topic":"Disk"},{"cmd":"uptime / nproc","meaning":"Load average / CPU count","example":"uptime; nproc","topic":"Disk"},{"cmd":"vmstat 1 5","meaning":"CPU, memory, swap, I/O every second","example":"vmstat 1 5","topic":"Disk"},{"cmd":"lsblk / findmnt / mount","meaning":"Disks / mounts","example":"lsblk -f","topic":"Disk"},{"cmd":"/etc/fstab","meaning":"Mounts at boot (test with mount -a)","example":"sudo mount -a","topic":"Disk"},{"cmd":"ulimit -n","meaning":"Open files limit","example":"ulimit -n","topic":"Disk"},{"cmd":"df -P","meaning":"Stable df format for scripts","example":"df -P | awk 'NR>1 {print $5, $6}'","topic":"Disk"}],"coverage":[{"item":"df -h","problems":["d17p02","d17p05"]},{"item":"du -sh, du | sort -h","problems":["d17p01","d17p03"]},{"item":"free -m","problems":["d17p04"]},{"item":"lsblk, mount","problems":["d17p06"]},{"item":"/etc/fstab (read-only)","problems":["d17p06"]},{"item":"Inodes (df -i)","problems":["d17p02"]},{"item":"lsof","problems":["d17p03"]},{"item":"vmstat","problems":["d17p04"]},{"item":"uptime / load average","problems":["d17p04"]},{"item":"ulimit","problems":["d17p07"]},{"item":"Finding what eats the disk","problems":["d17p01","d17p03"]}],"reset":"rm -rf ~/bash-practice/day17"},{"day":18,"week":3,"title":"Networking basics","goal":"Check if a service listens and answers, fix \"port already in use\", read curl results and exit codes, and understand name resolution.","minutes":90,"setup":["mkdir -p ~/bash-practice/day18/site && cd ~/bash-practice/day18","# a tiny website for the local test servers (python3 -m http.server)","echo '{\"status\":\"UP\"}' > site/health.json","echo '<h1>Todo<\/h1>' > site/index.html","# P4: practice copies of /etc/hosts and /etc/resolv.conf (NOT the real files)","printf '%s\\n' '127.0.0.1   localhost' '::1         localhost ip6-localhost' '# added for local testing' '10.0.1.25   todo.local api.todo.local' '10.0.1.30   db.todo.local' > hosts.copy","printf '%s\\n' '# Generated by NetworkManager' 'search corp.example.com' 'nameserver 10.0.0.2' 'nameserver 1.1.1.1' 'options timeout:2 attempts:2' > resolv.copy","# P5: a broken wait-for-health script","mkdir -p app5","printf '%s\\n' '#!/bin/bash' '# Wait until http://127.0.0.1:8086/health.json answers with a 2xx code.' '# Try 5 times, 1 second apart. Exit 0 when healthy, exit 1 if it never gets healthy.' 'URL=http://127.0.0.1:8086/health.json' 'for i in 1 2 3 4 5; do' '  if curl -s $URL > /dev/null; then' '    echo \"healthy after $i tries\"' '    exit 0' '  fi' 'done' 'echo \"not healthy\"' > wait-health.sh","cd ~/bash-practice/day18"],"warmup":[{"q":"`df` says the disk is full but `du` finds little. What is a common reason?","a":"A process still has a deleted file open. Find it with `lsof +L1` and restart the process (or truncate the file).","from_day":17},{"q":"Which `free -m` column shows if the server is short of memory?","a":"`available`.","from_day":17},{"q":"Which command checks a systemd unit file without installing it?","a":"`systemd-analyze verify ./app.service`","from_day":16},{"q":"How do you stop a process politely, then by force?","a":"`kill PID` (SIGTERM) first; `kill -9 PID` (SIGKILL) only if it is still running.","from_day":15}],"problems":[{"id":"d18p01","title":"Is the app listening and answering? ss + curl","type":"command","topic":"Networking","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The frontend pod says \"backend unavailable\". The first two questions are always: does something listen on the port, and does it answer correctly? The user starts a small test server on port 8081 and checks it with `ss` and `curl`.","task":["Start a test server in the background: `python3 -m http.server 8081 --bind 127.0.0.1 --directory site > server.log 2>&1 &`.","Show listening TCP sockets on port 8081 with `ss -ltn 'sport = :8081'`.","Get the body of `/health.json` with `curl -s`.","Show only the status line and the Content-Type header (`curl -sI`).","Print only the status code and the size with `curl -s -o /dev/null -w`. Stop the server at the end."],"hints":["`ss -l` listening, `-t` TCP, `-n` numbers (no names), `-p` process (needs sudo for other users' processes).","`curl -I` = HEAD request, only headers. `-s` = silent (no progress bar).","`-w '%{http_code}\\n'` prints the status code after the request."],"solution":["python3 -m http.server 8081 --bind 127.0.0.1 --directory site > server.log 2>&1 &","SRV=$!","sleep 1","ss -ltn 'sport = :8081'","curl -s http://127.0.0.1:8081/health.json","curl -sI http://127.0.0.1:8081/health.json | head -n 1","curl -sI http://127.0.0.1:8081/health.json | grep -i '^content-type'","curl -s -o /dev/null -w 'status=%{http_code} size=%{size_download} bytes\\n' http://127.0.0.1:8081/health.json","kill $SRV"],"explanation":[{"part":"python3 -m http.server 8081","meaning":"A tiny web server for tests. `--bind 127.0.0.1` = only this machine can reach it."},{"part":"ss -ltn 'sport = :8081'","meaning":"Show listening TCP sockets with source port 8081. `0.0.0.0` would mean all network interfaces."},{"part":"curl -s URL","meaning":"Get the body quietly."},{"part":"curl -sI","meaning":"Only the response headers: status line, Content-Type, Server ..."},{"part":"-o /dev/null -w '%{http_code}'","meaning":"Throw the body away and print chosen values. Good for scripts."}],"expected_output":"State    Recv-Q   Send-Q     Local Address:Port     Peer Address:Port  Process\nLISTEN   0        5              127.0.0.1:8081          0.0.0.0:*\n{\"status\":\"UP\"}\nHTTP/1.0 200 OK\nContent-type: application/json\nstatus=200 size=16 bytes","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `netstat`: it is old and often not installed. `ss` is the modern replacement (`netstat -tulpn` = `ss -tulpn`).","Server bound to `127.0.0.1` inside a container: other pods cannot reach it. Bind to `0.0.0.0` in containers.","Forgetting `-s`: curl prints a progress table into the script output."],"interview_say":"I check two things: is something listening, with `ss -tulpn | grep PORT`, and does it answer, with `curl -sI` or `curl -s -o /dev/null -w '%{http_code}'`.","try_yourself":"Run `ss -tulpn` (as your user, then with sudo). Which ports are open on your WSL?"},{"id":"d18p02","title":"Fix \"Address already in use\"","type":"incident","topic":"Networking","minutes":13,"optional":false,"core":true,"workdir":".","situation":"After a deploy, the Spring Boot backend does not start: `Port 8082 was already in use`. An old copy of the app was never stopped. The user reproduces the problem with two test servers, finds who holds the port, stops it, and starts again.","task":["Start the \"old\" server on port 8082 in the background.","Start a second one on the same port in the foreground. Read the last line of the error.","Find the PID that holds the port with `lsof -t -i :8082` (or `ss -ltnp`). Show its command with `ps`.","Stop it, start the new server, and check with `curl` that it answers."],"hints":["Only one process can listen on one IP and port at a time.","`lsof -t -i :PORT` prints only the PID(s).","`fuser 8082/tcp` is another way to find the PID."],"solution":["python3 -m http.server 8082 --bind 127.0.0.1 > old.log 2>&1 &      # an old copy that was never stopped","sleep 1","python3 -m http.server 8082 --bind 127.0.0.1 2>&1 | tail -n 1       # the new start fails","PID=$(lsof -t -i :8082)","echo \"port 8082 is held by: $(ps -o cmd= -p \"$PID\")\"","kill \"$PID\"","sleep 0.5","python3 -m http.server 8082 --bind 127.0.0.1 > new.log 2>&1 &","sleep 1","curl -s -o /dev/null -w 'new server answers: %{http_code}\\n' http://127.0.0.1:8082/","kill $!"],"explanation":[{"part":"Errno 98 Address already in use","meaning":"The operating system refuses a second listener on the same address and port."},{"part":"lsof -t -i :8082","meaning":"PIDs of processes using port 8082."},{"part":"ps -o cmd= -p PID","meaning":"What exactly is it? Check before killing it: it could be another team's service."},{"part":"kill, then start","meaning":"Stop the old copy cleanly (SIGTERM), then start the new one."}],"expected_output":"OSError: [Errno 98] Address already in use\nport 8082 is held by: python3 -m http.server 8082 --bind 127.0.0.1\nnew server answers: 200","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Changing the app to another port to \"fix\" it. The old process still runs and uses memory; find and stop it.","`kill -9` at once: the old app may not release resources cleanly. Use SIGTERM first.","`lsof -i :8082` shows nothing for processes of other users without `sudo`."],"interview_say":"For \"port already in use\" I find the process with `ss -ltnp | grep :PORT` or `lsof -i :PORT`, check what it is with `ps`, stop it cleanly, and then start the new service.","try_yourself":"Start the server on `0.0.0.0` and another one on `127.0.0.1`, both on port 8090. Does the second one start? (Try it and read the error.)","table":{"head":["Port","Usually used by"],"rows":[["22","SSH"],["53","DNS (UDP and TCP)"],["80 / 443","HTTP / HTTPS"],["3306 / 5432","MySQL / PostgreSQL"],["6379","Redis"],["8080","app servers (Spring Boot, Jenkins)"],["6443","Kubernetes API server"],["9090 / 3000","Prometheus / Grafana"]]}},{"id":"d18p03","title":"curl in scripts: -f, timeouts and exit codes","type":"command","topic":"Networking","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A health-check script must tell the difference between \"server answers with an error\", \"nothing listens on the port\" and \"server hangs\". curl's exit codes say exactly what went wrong, but only with the right options.","task":["Start a server on 8083. Request `/missing`: print the status code. What is curl's exit code?","Request `/missing` again with `-f`. What is the exit code now?","Request a closed port (8099). Print the exit code.","Start `nc -l 127.0.0.1 8084` (accepts but never answers). Request it with `--max-time 1`. Print the exit code.","Show the important lines of `curl -v` for `/health.json`."],"hints":["Without `-f`, an HTTP 404 or 500 is still a \"successful\" transfer: exit code 0.","Exit codes: 6 could not resolve host, 7 could not connect, 22 HTTP error (with -f), 28 timeout.","`curl -v` writes details to stderr: `2>&1 | grep -E '^(\\* Connected|> GET|< HTTP)'`."],"solution":["python3 -m http.server 8083 --bind 127.0.0.1 --directory site > /dev/null 2>&1 &","SRV=$!","sleep 1","curl -s -o /dev/null -w 'status %{http_code}, ' http://127.0.0.1:8083/missing; echo \"exit code: $?\"","curl -sf http://127.0.0.1:8083/missing > /dev/null; echo \"with -f, exit code: $?\"","curl -s http://127.0.0.1:8099/; echo \"closed port, exit code: $?\"","nc -l 127.0.0.1 8084 > /dev/null &","sleep 0.5","curl -s --max-time 1 http://127.0.0.1:8084/; echo \"server hangs, exit code: $?\"","curl -sv http://127.0.0.1:8083/health.json 2>&1 | grep -E '^(\\* Connected|> GET|< HTTP)'","kill $SRV"],"explanation":[{"part":"404 with exit code 0","meaning":"Without `-f`, curl only reports transfer problems, not HTTP errors."},{"part":"-f (--fail)","meaning":"HTTP status 400 or more gives exit code 22. Use it in scripts."},{"part":"exit code 7","meaning":"Could not connect: nothing listens, or a firewall rejects."},{"part":"--max-time 1 → 28","meaning":"Give up after 1 second. Without a timeout a script can wait for minutes."},{"part":"curl -v","meaning":"Verbose: `*` info, `>` request lines sent, `<` response lines received."},{"part":"nc -l 127.0.0.1 8084","meaning":"netcat listens and accepts, but never sends an HTTP answer: a hanging server."}],"expected_output":"status 404, exit code: 0\nwith -f, exit code: 22\nclosed port, exit code: 7\nserver hangs, exit code: 28\n* Connected to 127.0.0.1 (127.0.0.1) port 8083\n> GET /health.json HTTP/1.1\n< HTTP/1.0 200 OK","expect_exit":0,"output_check":true,"output_note":"On Ubuntu 22.04 (curl 7.81) the `Connected to` line ends with `(#0)`.","verified":true,"mistakes":["Health checks with `curl -s URL && echo ok`: a 500 error page still prints \"ok\". Add `-f`.","No timeout in cron or CI: the job hangs on a dead server. Always add `--max-time` (or `--connect-timeout`)."],"interview_say":"In scripts I use `curl -fsS --max-time 5 URL`. `-f` turns HTTP errors into a non-zero exit code, and the exit code tells me if it was DNS (6), connect (7), HTTP (22) or timeout (28).","try_yourself":"Run `curl -s -o /dev/null -w '%{time_total}\\n' URL` against the test server. How long did the request take?"},{"id":"d18p04","title":"Name resolution: /etc/hosts, resolv.conf, getent","type":"concept","topic":"Networking","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The backend cannot reach `db.todo.local`. Before blaming the network, the user checks how Linux turns names into IP addresses: first `/etc/hosts`, then the DNS servers in `/etc/resolv.conf`. Practice copies are used so nothing on the system changes.","task":["Resolve `localhost` the way programs do: `getent hosts localhost`.","In `hosts.copy`, find the IP for `db.todo.local` and the line for `api.todo.local`.","In `resolv.copy`, list the DNS servers and the search domain.","Try to resolve the unknown name `todo.internal` with `getent` and with `curl`. Print the exit codes."],"hints":["`getent hosts NAME` uses the same order as programs (see `/etc/nsswitch.conf`: files, then dns).","A hosts line: IP, then one or more names.","`awk '/^nameserver/ {print $2}' resolv.copy`"],"solution":["getent hosts localhost | head -n 1","awk '$2 == \"db.todo.local\" || $3 == \"db.todo.local\" {print \"db.todo.local ->\", $1}' hosts.copy","grep -w 'api.todo.local' hosts.copy","awk '/^nameserver/ {print \"DNS server:\", $2} /^search/ {print \"search domain:\", $2}' resolv.copy","getent hosts todo.internal || echo \"getent: todo.internal not found (exit code $?)\"","curl -s --max-time 5 http://todo.internal/; echo \"curl exit code: $? (6 = could not resolve host)\""],"explanation":[{"part":"getent hosts","meaning":"Ask the system resolver (hosts file + DNS). Exit code 2 = not found."},{"part":"/etc/hosts","meaning":"Static name list, checked first. Good for tests; dangerous if forgotten on servers."},{"part":"/etc/resolv.conf","meaning":"Which DNS servers to ask (`nameserver`) and which domain to try (`search`). On WSL it is generated."},{"part":"curl exit 6","meaning":"Could not resolve the host: a name problem, not a network or app problem."}],"expected_output":"127.0.0.1       localhost\ndb.todo.local -> 10.0.1.30\n10.0.1.25   todo.local api.todo.local\nsearch domain: corp.example.com\nDNS server: 10.0.0.2\nDNS server: 1.1.1.1\ngetent: todo.internal not found (exit code 2)\ncurl exit code: 6 (6 = could not resolve host)","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Testing with `ping name` only: ping uses the same resolver, but a blocked ICMP looks like a DNS problem.","An old line in `/etc/hosts` that points a name to a dead server. `dig` shows the right IP, but programs still use the hosts file."],"interview_say":"Linux resolves names first from `/etc/hosts`, then from the DNS servers in `/etc/resolv.conf`. I compare `getent hosts name` with `dig name` to see if the hosts file or DNS gives a wrong answer.","try_yourself":"Run `cat /etc/resolv.conf` on your WSL (read only). Which nameserver does WSL use?","table":{"head":["Tool","Use"],"rows":[["`getent hosts name`","what programs will get (hosts + DNS)"],["`dig name` / `dig +short name`","ask DNS directly, show records and TTL"],["`nslookup name`","older, simpler DNS lookup"],["`dig @8.8.8.8 name`","ask a specific DNS server"],["`resolvectl status`","DNS settings on systemd systems"]]}},{"id":"d18p05","title":"Find the bug: the wait-for-health script","type":"fix-bug","topic":"Networking","minutes":14,"optional":false,"core":false,"workdir":".","situation":"The deploy pipeline runs `wait-health.sh` after starting the backend. It said \"healthy\" even though the app returned 404, and when the app is down it finishes at once and still exits with 0, so the pipeline continues.","task":["Start a server on 8086 that serves the empty folder `app5` (so `/health.json` is 404). Run `bash wait-health.sh; echo $?`.","Find 4 bugs: no `-f`, no sleep between tries, no timeout, and the wrong final exit code.","Fix the script. Run it again: it must try 5 times and exit 1.","Create `app5/health.json` and run it again: it must say healthy and exit 0."],"hints":["`curl -s` returns 0 for a 404 page. Use `curl -fsS --max-time 2`.","Add `sleep 1` after a failed try.","End with `exit 1` after the loop."],"solution":["python3 -m http.server 8086 --bind 127.0.0.1 --directory app5 > /dev/null 2>&1 &","SRV=$!","sleep 1","bash wait-health.sh; echo \"exit code: $?\"","cat > wait-health.sh <<'EOF'","#!/bin/bash","# Wait until http://127.0.0.1:8086/health.json answers with a 2xx code.","# Try 5 times, 1 second apart. Exit 0 when healthy, exit 1 if it never gets healthy.","URL=http://127.0.0.1:8086/health.json","for i in 1 2 3 4 5; do","  if curl -fs --max-time 2 \"$URL\" > /dev/null; then","    echo \"healthy after $i tries\"","    exit 0","  fi","  echo \"try $i: not healthy yet\"","  sleep 1","done","echo \"not healthy after 5 tries\" >&2","exit 1","EOF","echo \"--- fixed, app returns 404 ---\"","bash wait-health.sh; echo \"exit code: $?\"","echo '{\"status\":\"UP\"}' > app5/health.json","echo \"--- fixed, app is healthy ---\"","bash wait-health.sh; echo \"exit code: $?\"","kill $SRV"],"explanation":[{"part":"-f","meaning":"Bug 1: without it, the 404 page counted as healthy."},{"part":"sleep 1","meaning":"Bug 2: 5 tries in a few milliseconds give a slow app no time to start."},{"part":"--max-time 2","meaning":"Bug 3: a hanging app would block the pipeline."},{"part":"exit 1 at the end","meaning":"Bug 4: the script ended with `echo`, so the exit code was 0 and the pipeline went on."},{"part":"\"$URL\"","meaning":"Quote variables, as always."}],"expected_output":"healthy after 1 tries\nexit code: 0\n--- fixed, app returns 404 ---\ntry 1: not healthy yet\ntry 2: not healthy yet\ntry 3: not healthy yet\ntry 4: not healthy yet\ntry 5: not healthy yet\nnot healthy after 5 tries\nexit code: 1\n--- fixed, app is healthy ---\nhealthy after 1 tries\nexit code: 0","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Checking only that the port is open (`nc -z`). The app can listen and still answer 500. Check the health endpoint.","Retrying forever. A deploy step needs a clear limit and a non-zero exit code."],"interview_say":"My wait-for-health loop uses `curl -fsS --max-time`, sleeps between tries, stops after a limit, and exits 1 so the pipeline stops and can roll back.","try_yourself":"Make the URL and the number of tries arguments with defaults: `URL=${1:-http://127.0.0.1:8086/health.json}` and `TRIES=${2:-5}`."},{"id":"d18p06","title":"Know your machine: ip a, ip r, ping","type":"command","topic":"Networking","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A new teammate asks: \"What is the IP of your WSL machine, and where does its traffic go?\" The user shows the network interfaces, the routing table and a ping test.","task":["Show the interfaces and IP addresses in short form: `ip -br a`.","Show the routing table: `ip r`. Find the `default via` line.","Ping the loopback address 2 times: `ping -c 2 127.0.0.1`."],"hints":["`lo` is the loopback interface (127.0.0.1). `eth0` is the main network card in WSL.","The default route is the gateway for all other networks.","`-c 2` = send only 2 packets. Without `-c`, ping runs until Ctrl+C."],"solution":["ip -br a","ip r","ping -c 2 127.0.0.1 | tail -n 2"],"explanation":[{"part":"ip -br a","meaning":"Brief list of interfaces: name, state (UP/DOWN), addresses with prefix (`/24`)."},{"part":"ip r","meaning":"Routes. `default via X` = gateway; other lines = directly connected networks."},{"part":"ping -c 2","meaning":"Send 2 ICMP echo requests; shows packet loss and round-trip time."},{"part":"ifconfig / route","meaning":"Old tools (package net-tools). `ip` replaces them."}],"expected_output":"lo               UNKNOWN        127.0.0.1/8\nifb0             DOWN\nifb1             DOWN\neth0             UP             192.0.2.2/24\ndefault via 192.0.2.1 dev eth0\n192.0.2.0/24 dev eth0 proto kernel scope link src 192.0.2.2\n2 packets transmitted, 2 received, 0% packet loss, time 1004ms\nrtt min/avg/max/mdev = 0.027/0.030/0.034/0.003 ms","expect_exit":0,"output_check":false,"output_note":"Interface names, IP addresses and times are different on every machine.","verified":true,"mistakes":["\"Ping fails, so the server is down.\" Many cloud servers block ICMP. Test the real port with `nc -zv host 443` or `curl`.","Reading `/24` as a host number. It is the prefix length: 24 bits for the network (255.255.255.0)."],"interview_say":"`ip a` shows my interfaces and addresses, `ip r` shows the routes and the default gateway. Ping only tests ICMP, so to test a service I use the real port with `nc -zv` or `curl`.","try_yourself":"Run `ip -4 -o a | awk '{print $2, $4}'` to print only interface names and IPv4 addresses."},{"id":"d18p07","title":"dig, nslookup, nc and traceroute (needs internet)","type":"command","topic":"Networking","minutes":10,"optional":true,"core":false,"workdir":".","situation":"These tools talk to the real internet, so they are not run in the sandbox. On WSL with internet, the user checks a DNS record, tests a remote port, and sees the path packets take.","task":["Install the tools if needed: `sudo apt install -y dnsutils traceroute netcat-openbsd`.","Ask DNS for github.com: `dig +short github.com` and `nslookup github.com`.","Test if port 443 is open: `nc -zv -w 3 github.com 443`.","Show the route: `traceroute -n -m 8 github.com`."],"hints":["`dig +short` prints only the answer (IP addresses).","`nc -z` = only test the connection, send nothing. `-w 3` = 3 second timeout.","Stars `* * *` in traceroute = a router that does not answer traceroute packets (often normal)."],"solution":["dig +short github.com","nslookup github.com","nc -zv -w 3 github.com 443","traceroute -n -m 8 github.com"],"explanation":[{"part":"dig +short","meaning":"DNS query, short answer. Without `+short`: question, answer, TTL and the server that answered."},{"part":"nslookup","meaning":"Simple DNS lookup; shows which server answered."},{"part":"nc -zv -w 3 host port","meaning":"Port test: `succeeded` = open; `refused` = closed; timeout = filtered by a firewall."},{"part":"traceroute -n -m 8","meaning":"Show up to 8 hops (routers) with numbers only."}],"expected_output":"","expect_exit":0,"output_check":false,"output_note":"IP addresses, DNS servers and times depend on the user's network and location.","verified":false,"typical_output":"20.205.243.166\nServer:\t\t10.255.255.254\nAddress:\t10.255.255.254#53\n\nNon-authoritative answer:\nName:\tgithub.com\nAddress: 20.205.243.166\n\nConnection to github.com (20.205.243.166) 443 port [tcp/https] succeeded!\ntraceroute to github.com (20.205.243.166), 8 hops max, 60 byte packets\n 1  172.24.208.1  0.412 ms  0.370 ms  0.361 ms\n 2  192.168.1.1  2.115 ms  2.087 ms  2.071 ms\n 3  * * *\n 4  10.130.40.1  9.876 ms  9.802 ms  9.990 ms","mistakes":["`nc: getaddrinfo for host \"github.co\" port 443: Name or service not known` means a DNS (name) problem, not a closed port."],"interview_say":"I use `dig` to check DNS answers, `nc -zv host port` to test if a TCP port is reachable, and `traceroute` to see where packets stop.","try_yourself":"Run `dig github.com MX` and `dig github.com TXT`. What other record types do you know?"}],"interview":[{"q":"How do you check which ports are open and which process uses them?","a":"`sudo ss -tulpn` (TCP and UDP, listening, numbers, process). The old command is `netstat -tulpn`.","topic":"Networking"},{"q":"How do you fix \"port already in use\"?","a":"Find the process with `ss -ltnp | grep :PORT` or `lsof -i :PORT`, check what it is with `ps`, stop it cleanly, then start the new service.","topic":"Networking"},{"q":"What curl options do you use in a health-check script?","a":"`curl -fsS --max-time 5 URL`: `-f` fails on HTTP errors, `-s` silent, `-S` still show errors, and a timeout so the script never hangs.","topic":"Networking"},{"q":"What is the difference between TCP and UDP?","a":"TCP is connection-based and reliable (HTTP, SSH, databases). UDP has no connection and no delivery guarantee, but is fast (DNS queries, video, metrics).","topic":"Networking"},{"q":"How does Linux resolve a host name?","a":"First `/etc/hosts`, then the DNS servers in `/etc/resolv.conf` (the order is set in `/etc/nsswitch.conf`). `getent hosts name` shows the result programs get.","topic":"Networking"}],"recap":[{"cmd":"ss -tulpn","meaning":"Listening TCP/UDP ports with process","example":"sudo ss -tulpn | grep :8080","topic":"Networking"},{"cmd":"ss -ltn 'sport = :PORT'","meaning":"Listeners on one port","example":"ss -ltn 'sport = :8081'","topic":"Networking"},{"cmd":"lsof -i :PORT / -t","meaning":"Who uses a port / only PIDs","example":"lsof -t -i :8082","topic":"Networking"},{"cmd":"curl -s / -I / -v","meaning":"Body / headers / verbose","example":"curl -sI https://example.com","topic":"Networking"},{"cmd":"curl -o /dev/null -w '%{http_code}'","meaning":"Only the status code","example":"curl -s -o /dev/null -w '%{http_code}\\n' URL","topic":"Networking"},{"cmd":"curl -fsS --max-time N","meaning":"Script-safe curl","example":"curl -fsS --max-time 5 http://localhost:8080/health","topic":"Networking"},{"cmd":"nc -zv host port","meaning":"Test a TCP port","example":"nc -zv -w 3 db 5432","topic":"Networking"},{"cmd":"getent hosts name","meaning":"Resolve like programs do","example":"getent hosts db.todo.local","topic":"Networking"},{"cmd":"dig +short / nslookup","meaning":"Ask DNS","example":"dig +short github.com","topic":"Networking"},{"cmd":"/etc/hosts, /etc/resolv.conf","meaning":"Static names / DNS servers","example":"cat /etc/resolv.conf","topic":"Networking"},{"cmd":"ip -br a / ip r","meaning":"Addresses / routes","example":"ip r | grep default","topic":"Networking"},{"cmd":"ping -c N / traceroute -n","meaning":"ICMP test / path to a host","example":"ping -c 3 10.0.1.25","topic":"Networking"},{"cmd":"python3 -m http.server PORT","meaning":"Quick test web server","example":"python3 -m http.server 8081 --bind 127.0.0.1","topic":"Networking"}],"coverage":[{"item":"ip a, ip r","problems":["d18p06"]},{"item":"ss -tulpn","problems":["d18p01","d18p02"]},{"item":"ping","problems":["d18p06"]},{"item":"curl -v -I -o -s -w","problems":["d18p01","d18p03","d18p05"]},{"item":"dig / nslookup","problems":["d18p07"]},{"item":"/etc/hosts, /etc/resolv.conf","problems":["d18p04"]},{"item":"nc (port test)","problems":["d18p03","d18p07"]},{"item":"traceroute","problems":["d18p07"]},{"item":"Ports and protocols","problems":["d18p02"]},{"item":"\"Port already in use\" fix","problems":["d18p02"]}],"reset":"rm -rf ~/bash-practice/day18"},{"day":19,"week":3,"title":"SSH and file transfer","goal":"Create SSH keys with the right permissions, use an SSH config file, copy files safely with rsync, and debug common SSH errors.","minutes":90,"setup":["mkdir -p ~/bash-practice/day19 && cd ~/bash-practice/day19","# all keys and configs go into practice folders, NOT your real ~/.ssh","mkdir -p dot-ssh server-home","# P2: an SSH config file for the team servers","printf '%s\\n' 'Host bastion' '    HostName 203.0.113.10' '    User ec2-user' '    IdentityFile ~/bash-practice/day19/dot-ssh/id_todo' '' 'Host todo-prod' '    HostName 10.0.1.10' '    User deploy' '    Port 2222' '    IdentityFile ~/bash-practice/day19/dot-ssh/id_todo' '    ServerAliveInterval 30' '' 'Host *.todo.internal' '    User deploy' '    ProxyJump bastion' > dot-ssh/config","# P4/P5: a build folder to copy","mkdir -p build/css build/js","echo '<h1>Todo v2<\/h1>' > build/index.html","echo 'body { margin: 0 }' > build/css/app.css","echo 'console.log(\"todo\")' > build/js/app.js","echo 'API_KEY=change-me' > build/.env","cp -r build site-build          # P5 has its own copy","printf '%s\\n' '#!/bin/bash' '# Copy the CONTENTS of site-build/ into release/ (not a site-build/ folder inside release/).' '# Never copy .env files. Show a dry run first, then copy for real.' 'rsync -av site-build release/' > deploy-copy.sh","cd ~/bash-practice/day19"],"warmup":[{"q":"Which command shows which process listens on port 8080?","a":"`sudo ss -ltnp | grep :8080` (or `sudo lsof -i :8080`).","from_day":18},{"q":"What does curl exit code 7 mean? And 28?","a":"7 = could not connect. 28 = timeout.","from_day":18},{"q":"What permission must a private key or `.env` file have?","a":"600 (only the owner can read and write).","from_day":3},{"q":"Why can root still read a 600 file of another user?","a":"Root ignores read and write permissions. 600 protects only from other normal users.","from_day":3}],"problems":[{"id":"d19p01","title":"Create a key pair with the right permissions","type":"command","topic":"SSH","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The user needs a new SSH key to log in to the to-do servers and for Jenkins to deploy. SSH refuses keys and folders with loose permissions, so the user creates an ed25519 key in the practice folder and sets 700 / 600 / 644.","task":["Create a key with no passphrase (for practice only): `ssh-keygen -q -t ed25519 -N '' -C 'wicky@laptop' -f dot-ssh/id_todo`.","List the two files and show their permissions with `stat -c '%a %n'`.","Set the folder to 700, the private key to 600, the public key to 644. Show them again.","Show the start of the public key and its fingerprint type with `ssh-keygen -l`."],"hints":["The private key has no extension; the public key ends in `.pub`. Only the `.pub` file is ever shared.","700 = only the owner can enter the folder. 600 = only the owner can read the key.","`ssh-keygen -l -f key.pub` prints bits, fingerprint, comment and type."],"solution":["ssh-keygen -q -t ed25519 -N '' -C 'wicky@laptop' -f dot-ssh/id_todo","ls dot-ssh","stat -c '%a %n' dot-ssh dot-ssh/id_todo dot-ssh/id_todo.pub","chmod 700 dot-ssh","chmod 600 dot-ssh/id_todo","chmod 644 dot-ssh/id_todo.pub","stat -c '%a %n' dot-ssh dot-ssh/id_todo dot-ssh/id_todo.pub","cut -c1-25 dot-ssh/id_todo.pub","ssh-keygen -l -f dot-ssh/id_todo.pub | awk '{print $1, $3, $4}'"],"explanation":[{"part":"-t ed25519","meaning":"Modern, short and fast key type. Use RSA 4096 only for very old servers."},{"part":"-N ''","meaning":"Empty passphrase. Fine for practice and some automation; for a personal key, use a passphrase plus ssh-agent."},{"part":"-C 'wicky@laptop'","meaning":"A comment, so people know whose key it is."},{"part":"700 / 600 / 644","meaning":"Folder only for the owner / private key only for the owner / public key readable."},{"part":"ssh-keygen -l","meaning":"Fingerprint: a short id of the key, to compare with what the server shows."},{"part":"ssh-copy-id user@server","meaning":"On a real server: adds the user's `.pub` key to the server's `~/.ssh/authorized_keys`."}],"expected_output":"config\tid_todo  id_todo.pub\n755 dot-ssh\n600 dot-ssh/id_todo\n644 dot-ssh/id_todo.pub\n700 dot-ssh\n600 dot-ssh/id_todo\n644 dot-ssh/id_todo.pub\nssh-ed25519 AAAAC3NzaC1lZ\n256 wicky@laptop (ED25519)","expect_exit":0,"output_check":true,"output_note":"The real key text and fingerprint are random, so only the fixed parts are printed. On a normal machine, the default key path is `~/.ssh/id_ed25519`.","verified":true,"mistakes":["Sending the private key (without `.pub`) to someone. Never share it; send only the `.pub` file.","Running `ssh-keygen` with the default path when `~/.ssh/id_ed25519` exists: it asks to overwrite. Answering `y` loses the old key.","Committing keys or `.env` files to git. Add them to `.gitignore`."],"interview_say":"I create keys with `ssh-keygen -t ed25519`, share only the `.pub` file, and keep `~/.ssh` at 700 and the private key at 600, otherwise SSH refuses to use it.","try_yourself":"Create a second key with a passphrase: `ssh-keygen -t ed25519 -f dot-ssh/id_pass`. Then load it with ssh-agent (Extra E1)."},{"id":"d19p02","title":"~/.ssh/config: short names for servers","type":"command","topic":"SSH","minutes":12,"optional":false,"core":true,"workdir":".","situation":"The user types `ssh -i ~/keys/id_todo -p 2222 deploy@10.0.1.10` many times a day. An SSH config file gives each server a short name. Private servers behind a bastion (jump host) can be reached in one step with `ProxyJump`.","task":["Read `dot-ssh/config`.","Show what `ssh todo-prod` would use, without connecting: `ssh -G -F dot-ssh/config todo-prod`, filtered to hostname, user, port and identityfile.","Do the same for `api.todo.internal`. Which jump host is used?","Write down the full command you no longer need to type."],"hints":["`-F FILE` = use this config file instead of `~/.ssh/config`. `-G` = print the final settings and exit.","`Host *.todo.internal` is a pattern: it matches every name ending in `.todo.internal`.","`grep -E '^(hostname|user|port|identityfile|proxyjump) '`"],"solution":["cat dot-ssh/config","echo \"=== ssh todo-prod would use ===\"","ssh -G -F dot-ssh/config todo-prod | grep -E '^(hostname|user|port|identityfile|serveraliveinterval) '","echo \"=== ssh api.todo.internal would use ===\"","ssh -G -F dot-ssh/config api.todo.internal | grep -E '^(hostname|user|port|proxyjump) '"],"explanation":[{"part":"Host todo-prod","meaning":"The short name the user types: `ssh todo-prod`."},{"part":"HostName / User / Port / IdentityFile","meaning":"Real address, login user, port and key for that name."},{"part":"ServerAliveInterval 30","meaning":"Send a keep-alive every 30 s so idle connections are not cut."},{"part":"Host *.todo.internal + ProxyJump bastion","meaning":"For every internal name, go through the bastion first (same as `ssh -J bastion host`)."},{"part":"ssh -G","meaning":"Print the settings ssh would use. Great for debugging configs; it does not connect."}],"expected_output":"Host bastion\n    HostName 203.0.113.10\n    User ec2-user\n    IdentityFile ~/bash-practice/day19/dot-ssh/id_todo\n\nHost todo-prod\n    HostName 10.0.1.10\n    User deploy\n    Port 2222\n    IdentityFile ~/bash-practice/day19/dot-ssh/id_todo\n    ServerAliveInterval 30\n\nHost *.todo.internal\n    User deploy\n    ProxyJump bastion\n=== ssh todo-prod would use ===\nuser deploy\nhostname 10.0.1.10\nport 2222\nserveraliveinterval 30\nidentityfile ~/bash-practice/day19/dot-ssh/id_todo\n=== ssh api.todo.internal would use ===\nuser deploy\nhostname api.todo.internal\nport 22\nproxyjump bastion","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Wrong permissions on `~/.ssh/config`: `Bad owner or permissions on /home/wicky/.ssh/config`. Use `chmod 600 ~/.ssh/config`.","Putting `Host *` with settings at the top: the first value found wins, so later host blocks cannot override it. Put `Host *` at the end."],"interview_say":"I keep servers in `~/.ssh/config` with HostName, User, Port and IdentityFile, and use `ProxyJump` for private servers behind a bastion. `ssh -G host` shows what will be used.","try_yourself":"Add a `Host todo-staging` block with `HostName 10.0.2.10` and `User deploy`, then check it with `ssh -G`."},{"id":"d19p03","title":"Explain the error: UNPROTECTED PRIVATE KEY FILE","type":"explain-error","topic":"SSH","minutes":13,"optional":false,"core":false,"workdir":".","situation":"A teammate copied the deploy key from Windows to WSL, and SSH says `WARNING: UNPROTECTED PRIVATE KEY FILE!` and `bad permissions`. The user reproduces the error, fixes it, and also prepares the server side: `authorized_keys` with the right permissions.","task":["Create a key in `dot-ssh/team_key` (like P1). Set it to 644 by mistake.","Try to read it: `ssh-keygen -y -f dot-ssh/team_key`. Read the whole error.","Fix the permission and try again (print only the key type).","Prepare the server side in `server-home`: create `.ssh/authorized_keys` with the public key, folder 700, file 600."],"hints":["SSH ignores private keys that other users can read: 644 is \"too open\".","`ssh-keygen -y -f KEY` prints the public key from a private key.","On the server: `~/.ssh` = 700, `~/.ssh/authorized_keys` = 600, and the home folder must not be writable by others."],"solution":["ssh-keygen -q -t ed25519 -N '' -C 'deploy@jenkins' -f dot-ssh/team_key","chmod 644 dot-ssh/team_key                       # the mistake","ssh-keygen -y -f dot-ssh/team_key || echo \"exit code: $?\"","chmod 600 dot-ssh/team_key                       # the fix","ssh-keygen -y -f dot-ssh/team_key | cut -d' ' -f1","mkdir -p server-home/.ssh","cat dot-ssh/team_key.pub >> server-home/.ssh/authorized_keys","chmod 700 server-home/.ssh","chmod 600 server-home/.ssh/authorized_keys","stat -c '%a %n' server-home/.ssh server-home/.ssh/authorized_keys","awk '{print $1, $3}' server-home/.ssh/authorized_keys"],"explanation":[{"part":"UNPROTECTED PRIVATE KEY FILE","meaning":"The key is readable by group or others (0644). SSH ignores it: `Load key ...: bad permissions`."},{"part":"exit code 255","meaning":"SSH tools use 255 for their own errors."},{"part":"authorized_keys","meaning":"On the server: one public key per line. A user can log in with any matching private key."},{"part":"700 / 600 on the server","meaning":"sshd (with StrictModes) refuses keys if `~/.ssh` or `authorized_keys` can be written by others."},{"part":"Windows copy","meaning":"Files under `/mnt/c/...` often show as 777. Copy keys into the Linux home (`~/.ssh`) and chmod there."}],"expected_output":"@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n@         WARNING: UNPROTECTED PRIVATE KEY FILE!          @\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\nPermissions 0644 for 'dot-ssh/team_key' are too open.\nIt is required that your private key files are NOT accessible by others.\nThis private key will be ignored.\nLoad key \"dot-ssh/team_key\": bad permissions\nexit code: 255\nssh-ed25519\n700 server-home/.ssh\n600 server-home/.ssh/authorized_keys\nssh-ed25519 deploy@jenkins","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Fixing it with `chmod 400` on the folder: then SSH cannot read anything inside. Folder 700, key 600 (or 400).","Pasting a public key into `authorized_keys` with a line break in the middle: the key does not match. One key = one line."],"interview_say":"SSH refuses a private key that others can read, so it must be 600. On the server, `~/.ssh` must be 700 and `authorized_keys` 600; otherwise key login fails and falls back to password or `Permission denied (publickey)`.","try_yourself":"Add the option `from=\"10.0.0.0/8\"` before the key in `authorized_keys`. What does it allow and block?"},{"id":"d19p04","title":"rsync -avz --dry-run (and scp)","type":"command","topic":"SSH","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The user copies the frontend build to the web server. `scp` copies everything every time; `rsync` copies only changes and can show what it would do first. Here the target is a local folder, so no server is needed; the commands are the same with `user@host:/path`.","task":["Dry run: `rsync -avz --dry-run build/ web-root/`. Read the file list.","Copy for real. Then run the same command again: what is copied the second time?","Delete `build/js/app.js`, then dry run with `--delete`. What would be removed on the target?","Copy one file with `scp build/index.html backup-index.html` (scp also works locally)."],"hints":["`-a` archive (keep times, permissions, folders), `-v` verbose, `-z` compress during transfer.","The trailing `/` on `build/` means \"the contents of build\". Without it, rsync creates `web-root/build/`.","`--delete` removes files on the target that are not in the source. Always dry-run it first."],"solution":["rsync -avz --dry-run build/ web-root/ | grep -Ev '^(sent|total size) '","rsync -az build/ web-root/","echo \"=== second run: only changes ===\"","rsync -avz build/ web-root/ | grep -Ev '^(sent|total size) '","sleep 1                                   # so the folder time really changes","rm build/js/app.js","echo \"=== --delete dry run ===\"","rsync -avz --delete --dry-run build/ web-root/ | grep -Ev '^(sent|total size) '","scp build/index.html backup-index.html && cat backup-index.html"],"explanation":[{"part":"-a","meaning":"Archive: recursive, keep permissions, times, symlinks."},{"part":"-v / -z","meaning":"List files / compress data on the network."},{"part":"--dry-run (-n)","meaning":"Show what would happen, change nothing."},{"part":"build/ (with slash)","meaning":"Copy the contents. `build` (no slash) copies the folder itself."},{"part":"second run","meaning":"Nothing listed: rsync compares size and time and skips files that did not change."},{"part":"--delete","meaning":"Make the target an exact mirror: `deleting js/app.js`. The `js/` line means: the folder's time changed, so rsync updates it."},{"part":"| grep -Ev '^(sent|total size) '","meaning":"Hide the two summary lines (bytes, speed, speedup). They change a little on every run."}],"expected_output":"sending incremental file list\ncreated directory web-root\n./\n.env\nindex.html\ncss/\ncss/app.css\njs/\njs/app.js\n\n=== second run: only changes ===\nsending incremental file list\n\n=== --delete dry run ===\nsending incremental file list\ndeleting js/app.js\njs/\n\n<h1>Todo v2<\/h1>","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`rsync --delete` with the wrong target folder (for example `/var/www` instead of `/var/www/todo`): it deletes everything else there. Dry run first, always.","Mixing up the order: `rsync dest/ src/` copies in the wrong direction. The source comes first, like `cp`."],"interview_say":"I use `rsync -avz --dry-run src/ user@host:/dest/` first, then without `--dry-run`. rsync copies only changes, and `--delete` mirrors the folder. The trailing slash on the source means \"copy the contents\".","try_yourself":"Run `rsync -avz --dry-run --exclude '*.css' build/ web-root/`. Which files are left out?"},{"id":"d19p05","title":"Find the bug: the deploy-copy script","type":"fix-bug","topic":"SSH","minutes":13,"optional":false,"core":false,"workdir":".","situation":"`deploy-copy.sh` copied the build to the server. Now the site is at `/release/site-build/index.html` instead of `/release/index.html`, and the secret `.env` file is public on the web server.","task":["Run `bash deploy-copy.sh`, then `find release | sort`. Compare with the comments in the script.","Find 3 problems: the trailing slash, the missing exclude, and no dry run.","Delete `release`, fix the script, and run it. Check with `find release | sort`."],"hints":["`rsync -av site-build release/` copies the folder `site-build` itself into release.","`--exclude '.env'` (or `--exclude '*.env'`) keeps secrets out.","First `rsync -av --dry-run ...`, then the real command."],"solution":["bash deploy-copy.sh | grep -Ev '^(sent|total size) '","find release | sort","rm -rf release","cat > deploy-copy.sh <<'EOF'","#!/bin/bash","# Copy the CONTENTS of site-build/ into release/ (not a site-build/ folder inside release/).","# Never copy .env files. Show a dry run first, then copy for real.","set -e","OPTS=(-av --exclude '.env')","echo \"=== dry run ===\"","rsync \"${OPTS[@]}\" --dry-run site-build/ release/ | grep -Ev '^(sent|total size) '","echo \"=== copy ===\"","rsync \"${OPTS[@]}\" site-build/ release/ | grep -Ev '^(sent|total size) '","EOF","bash deploy-copy.sh","find release | sort"],"explanation":[{"part":"site-build/ release/","meaning":"Bug 1: the slash after `site-build` copies the contents, not the folder."},{"part":"--exclude '.env'","meaning":"Bug 2: secrets must never reach a web root."},{"part":"--dry-run step","meaning":"Bug 3: the goal said \"dry run first\"."},{"part":"OPTS=(...)","meaning":"An array keeps the options the same for both runs (Day 8)."},{"part":"set -e","meaning":"Stop if a command fails (Day 22)."}],"expected_output":"sending incremental file list\ncreated directory release\nsite-build/\nsite-build/.env\nsite-build/index.html\nsite-build/css/\nsite-build/css/app.css\nsite-build/js/\nsite-build/js/app.js\n\nrelease\nrelease/site-build\nrelease/site-build/.env\nrelease/site-build/css\nrelease/site-build/css/app.css\nrelease/site-build/index.html\nrelease/site-build/js\nrelease/site-build/js/app.js\n=== dry run ===\nsending incremental file list\ncreated directory release\n./\nindex.html\ncss/\ncss/app.css\njs/\njs/app.js\n\n=== copy ===\nsending incremental file list\ncreated directory release\n./\nindex.html\ncss/\ncss/app.css\njs/\njs/app.js\n\nrelease\nrelease/css\nrelease/css/app.css\nrelease/index.html\nrelease/js\nrelease/js/app.js","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Excluding with a full path from the wrong level: `--exclude site-build/.env` does not match when the source is `site-build/`. Patterns are relative to the source.","Fixing the slash but leaving the old `release/site-build/` folder on the server. Clean up or use `--delete` (after a dry run)."],"interview_say":"When I deploy files with rsync I watch the trailing slash, exclude secrets like `.env`, and always look at a `--dry-run` first.","try_yourself":"Add `--delete` to `OPTS` and create an extra file `release/old.html`. Does the dry run show it as deleted?"},{"id":"d19p06","title":"ssh-agent: type the passphrase once","type":"command","topic":"SSH","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The user's real key has a passphrase (good security), but typing it for every `git pull` and `ssh` is slow. `ssh-agent` keeps the unlocked key in memory for this session.","task":["Create a practice key `dot-ssh/agent_key` (no passphrase here, for speed).","Start an agent: `eval \"$(ssh-agent -s)\"`. Check that `SSH_AUTH_SOCK` is set.","Add the key with `ssh-add` and list keys with `ssh-add -l`.","Stop the agent with `ssh-agent -k`."],"hints":["`ssh-agent -s` prints shell commands; `eval` runs them to set the variables.","`ssh-add -l` lists the loaded keys; `ssh-add -D` removes all.","`ssh -A` (agent forwarding) lets a server use the user's agent: only use it with trusted servers."],"solution":["ssh-keygen -q -t ed25519 -N '' -C 'wicky@laptop' -f dot-ssh/agent_key","eval \"$(ssh-agent -s)\" > /dev/null","[ -n \"$SSH_AUTH_SOCK\" ] && echo \"agent is running\"","ssh-add dot-ssh/agent_key","ssh-add -l | awk '{print $1, $3, $4}'","ssh-agent -k > /dev/null && echo \"agent stopped\""],"explanation":[{"part":"eval \"$(ssh-agent -s)\"","meaning":"Start the agent and set `SSH_AUTH_SOCK` and `SSH_AGENT_PID` in this shell."},{"part":"ssh-add KEY","meaning":"Unlock the key once (asks for the passphrase) and keep it in the agent."},{"part":"ssh-add -l","meaning":"List keys: bits, fingerprint, comment, type."},{"part":"ssh-agent -k","meaning":"Kill this agent."}],"expected_output":"agent is running\nIdentity added: dot-ssh/agent_key (wicky@laptop)\n256 wicky@laptop (ED25519)\nagent stopped","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`ssh-add` without a running agent: `Could not open a connection to your authentication agent.` Start it with `eval \"$(ssh-agent -s)\"`."],"checks":[{"run":"ssh-keygen -q -t ed25519 -N '' -f k; env -u SSH_AUTH_SOCK ssh-add k","expect":"Could not open a connection to your authentication agent."}],"interview_say":"I protect my key with a passphrase and load it once per session with `ssh-agent` and `ssh-add`. I avoid agent forwarding to servers I do not trust.","try_yourself":"Run `ssh-add -t 3600 dot-ssh/agent_key` to keep the key for one hour only."},{"id":"d19p07","title":"SSH tunnel: reach a private database (needs a server)","type":"concept","topic":"SSH","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The RDS database of the vehicle parts system is in a private subnet. Only the bastion can reach it. An SSH local tunnel (`-L`) opens a port on the laptop that forwards through the bastion to the database. This needs real servers, so it is not run in the sandbox.","task":["Read the command: `ssh -N -L 5433:parts-db.internal:5432 bastion`.","In a second terminal, connect to `localhost:5433` as if the database were local: `psql -h localhost -p 5433 -U app parts`.","Check the tunnel port on the laptop with `ss -ltn 'sport = :5433'`.","Stop the tunnel with Ctrl+C."],"hints":["`-L LOCALPORT:TARGETHOST:TARGETPORT` — the target host is resolved by the bastion, not by the laptop.","`-N` = do not run a remote command, only forward.","`-R` is the opposite (remote forward); `-D` makes a SOCKS proxy."],"solution":["ssh -N -L 5433:parts-db.internal:5432 bastion &","sleep 2","ss -ltn 'sport = :5433'","psql -h localhost -p 5433 -U app parts -c 'select count(*) from parts;'","kill %1"],"explanation":[{"part":"-L 5433:parts-db.internal:5432","meaning":"Listen on laptop port 5433; send traffic through SSH to parts-db.internal:5432."},{"part":"bastion","meaning":"Host name from `~/.ssh/config` (P2)."},{"part":"-N","meaning":"Only the tunnel, no shell."},{"part":"localhost:5433","meaning":"Programs on the laptop connect here."}],"expected_output":"","expect_exit":0,"output_check":false,"output_note":"Typical output; the row count is example data. The tunnel needs a reachable bastion and database.","verified":false,"typical_output":"State  Recv-Q Send-Q Local Address:Port Peer Address:Port Process\nLISTEN 0      128        127.0.0.1:5433      0.0.0.0:*\n count\n-------\n  1284\n(1 row)","mistakes":["`bind [127.0.0.1]:5433: Address already in use`: a tunnel or local Postgres already uses 5433. Pick another local port.","Leaving tunnels open in the background after work. Stop them, or use `ssh -O exit` with ControlMaster."],"interview_say":"To reach a private database I use an SSH local forward through a bastion: `ssh -N -L 5433:db:5432 bastion`, then connect to localhost:5433. In AWS, SSM Session Manager port forwarding is an option without open SSH ports.","try_yourself":"Write the `LocalForward 5433 parts-db.internal:5432` line into a `Host db-tunnel` block in `dot-ssh/config`."},{"id":"d19p08","title":"Debug SSH errors: refused, timeout, permission denied","type":"concept","topic":"SSH","minutes":10,"optional":true,"core":false,"workdir":".","situation":"\"I cannot SSH to the server\" can mean very different problems. The exact error shows where to look. The user creates one real error (connection refused to a closed local port) and learns the others with a table.","task":["Try `ssh -o BatchMode=yes -o ConnectTimeout=3 -p 2222 127.0.0.1` (nothing listens on 2222). Read the error and exit code.","Check the port with `nc -zv 127.0.0.1 2222`.","Read the table: which error points to the network, the server, or the key?"],"hints":["`BatchMode=yes` = never ask for a password, fail instead (good in scripts).","`Connection refused` = the host answered, but nothing listens on that port.","`ssh -v` (or `-vvv`) prints each step: which key is offered, what the server answers."],"solution":["ssh -o BatchMode=yes -o ConnectTimeout=3 -p 2222 127.0.0.1 true; echo \"ssh exit code: $?\"","nc -zv -w 2 127.0.0.1 2222; echo \"nc exit code: $?\""],"explanation":[{"part":"Connection refused","meaning":"The server is reachable, but sshd is not running or listens on another port."},{"part":"exit code 255","meaning":"ssh's own error (not the remote command's exit code)."},{"part":"nc -zv","meaning":"Confirms the port is closed, without SSH."}],"expected_output":"ssh: connect to host 127.0.0.1 port 2222: Connection refused\nssh exit code: 255\nnc: connect to 127.0.0.1 port 2222 (tcp) failed: Connection refused\nnc exit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Deleting `~/.ssh/known_hosts` completely after `Host key verification failed`. Remove only that host with `ssh-keygen -R host`, after confirming the change is expected."],"interview_say":"I read the exact SSH error: refused means nothing listens, timeout means network or firewall, `Permission denied (publickey)` means key, user or permissions. Then I use `ssh -v` to see each step.","try_yourself":"Run `ssh -v -o BatchMode=yes -p 2222 127.0.0.1 2>&1 | head -n 5` and read the first debug lines.","table":{"head":["Error","Usual cause","Check"],"rows":[["`Connection refused`","sshd down or wrong port","`systemctl status ssh`, `ss -ltn` on the server"],["`Connection timed out`","firewall / security group / wrong IP","security group rules, `nc -zv host 22`"],["`Permission denied (publickey)`","wrong key, wrong user, bad permissions","`ssh -v`, `-i key`, `ls -ld ~/.ssh`"],["`Host key verification failed`","server key changed (rebuilt, or attack)","confirm, then `ssh-keygen -R host`"],["`Could not resolve hostname`","DNS or typo","`getent hosts name`"]]}}],"interview":[{"q":"How do you set up key-based SSH login?","a":"Create a key with `ssh-keygen -t ed25519`, copy the public key to the server with `ssh-copy-id user@host` (it goes into `~/.ssh/authorized_keys`), then log in with the private key.","topic":"SSH"},{"q":"What permissions do `~/.ssh`, the private key and `authorized_keys` need?","a":"`~/.ssh` 700, the private key 600, `authorized_keys` 600 (public keys 644). SSH refuses looser permissions.","topic":"SSH"},{"q":"What is the difference between scp and rsync?","a":"scp always copies whole files. rsync copies only changes, can resume, can `--delete` to mirror, and has `--dry-run`.","topic":"SSH"},{"q":"What is a bastion (jump host), and how do you use it?","a":"A hardened server in a public subnet used to reach private servers. `ssh -J bastion private-host`, or `ProxyJump bastion` in `~/.ssh/config`.","topic":"SSH"},{"q":"What does `ssh -L 5433:db:5432 bastion` do?","a":"It opens port 5433 on my machine and forwards it through the bastion to db:5432, so I can reach a private database at localhost:5433.","topic":"SSH"}],"recap":[{"cmd":"ssh-keygen -t ed25519 -C","meaning":"Create a key pair","example":"ssh-keygen -t ed25519 -C 'wicky@laptop'","topic":"SSH"},{"cmd":"ssh-copy-id user@host","meaning":"Install your public key on a server","example":"ssh-copy-id deploy@10.0.1.10","topic":"SSH"},{"cmd":"chmod 700 ~/.ssh; chmod 600 key","meaning":"Permissions SSH requires","example":"chmod 600 ~/.ssh/id_ed25519","topic":"SSH"},{"cmd":"~/.ssh/config Host blocks","meaning":"Short names, user, port, key, ProxyJump","example":"ssh todo-prod","topic":"SSH"},{"cmd":"ssh -G host","meaning":"Show the settings ssh will use","example":"ssh -G todo-prod | grep hostname","topic":"SSH"},{"cmd":"ssh -J bastion host","meaning":"Jump through a bastion","example":"ssh -J bastion deploy@10.0.1.10","topic":"SSH"},{"cmd":"ssh -v","meaning":"Debug the connection steps","example":"ssh -v todo-prod","topic":"SSH"},{"cmd":"ssh-keygen -R host","meaning":"Remove one host from known_hosts","example":"ssh-keygen -R 10.0.1.10","topic":"SSH"},{"cmd":"rsync -avz --dry-run src/ dst/","meaning":"Preview a sync (slash = contents)","example":"rsync -avz --dry-run build/ deploy@web:/var/www/todo/","topic":"SSH"},{"cmd":"rsync --delete / --exclude","meaning":"Mirror / leave files out","example":"rsync -av --exclude '.env' build/ dst/","topic":"SSH"},{"cmd":"scp file user@host:/path","meaning":"Copy a file over SSH","example":"scp app.jar deploy@web:/opt/todo/","topic":"SSH"},{"cmd":"eval \"$(ssh-agent -s)\"; ssh-add","meaning":"Load a key into the agent","example":"ssh-add ~/.ssh/id_ed25519","topic":"SSH"},{"cmd":"ssh -N -L lport:host:port","meaning":"Local port forward (tunnel)","example":"ssh -N -L 5433:db:5432 bastion","topic":"SSH"}],"coverage":[{"item":"Key pairs, ssh-keygen","problems":["d19p01","d19p03"]},{"item":"~/.ssh/config","problems":["d19p02"]},{"item":"authorized_keys","problems":["d19p03"]},{"item":"Permissions 700/600","problems":["d19p01","d19p03"]},{"item":"scp","problems":["d19p04"]},{"item":"rsync -avz --dry-run","problems":["d19p04","d19p05"]},{"item":"SSH tunnel -L","problems":["d19p07"]},{"item":"ssh-agent","problems":["d19p06"]}],"reset":"rm -rf ~/bash-practice/day19"},{"day":20,"week":3,"title":"Packages and archives","goal":"Pack and unpack releases with tar, gzip and zip, verify downloads with checksums, and find out where a command or package comes from.","minutes":90,"needs":["zip","unzip"],"setup":["mkdir -p ~/bash-practice/day20 && cd ~/bash-practice/day20","# an app folder to pack","mkdir -p app/config app/lib","echo 'java -jar lib/todo-api.jar' > app/start.sh","echo 'port: 8080' > app/config/application.yml","echo 'DB_PASSWORD=change-me' > app/.env","head -c 2048 /dev/zero > app/lib/todo-api.jar","# P2/P6: files offered by a local \"download server\"","mkdir -p dist","printf '%s\\n' '#!/bin/bash' 'echo \"todo-cli 1.3.0\"' > dist/todo-cli.sh","(cd dist && sha256sum todo-cli.sh > todo-cli.sh.sha256)","# P4: a text report to compress","for i in $(seq 1 200); do echo \"2026-10-20 report line $i: all services OK\"; done > report.txt","# P5: a broken backup script","printf '%s\\n' '#!/bin/bash' '# Make a compressed backup of app/, save the checksum of the backup file,' '# then test a restore into restore-test/ and compare it with app/.' 'tar -cfz backup.tar.gz app' 'sha256sum app > backup.sha256' 'tar -xzf backup.tar.gz -C restore-test' 'echo \"backup OK\"' > backup.sh","cd ~/bash-practice/day20"],"warmup":[{"q":"Which rsync command shows what would be copied, without copying?","a":"`rsync -avz --dry-run src/ dest/`","from_day":19},{"q":"What permissions do `~/.ssh` and a private key need?","a":"`~/.ssh` 700, private key 600.","from_day":19},{"q":"How do you see the 3 biggest folders in `/var`?","a":"`sudo du -xh --max-depth=1 /var | sort -h | tail -n 3`","from_day":17},{"q":"Which curl options make a health check fail on HTTP errors and not hang?","a":"`curl -fsS --max-time 5 URL`","from_day":18}],"problems":[{"id":"d20p01","title":"tar: create, list and extract a release","type":"command","topic":"Packages","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The Jenkins pipeline must pack the to-do API into `todo-api-2.4.1.tar.gz`, check what is inside, and the server must unpack it into a release folder. The secret `.env` must not be in the archive.","task":["Create `todo-api-2.4.1.tar.gz` from the folder `app` (`-czf`).","List the contents without extracting (`-tzf`). Sort the list.","Create it again without `.env` (use `--exclude`). List again.","Extract it into a new folder `releases/2.4.1` (`-xzf ... -C`). Show the result with `find`."],"hints":["c = create, x = extract, t = list, z = gzip, f = file name (must come last, right before the name).","`--exclude='.env'` goes before the folder name.","`-C DIR` = change to DIR first. The folder must exist: `mkdir -p` it."],"solution":["tar -czf todo-api-2.4.1.tar.gz app","tar -tzf todo-api-2.4.1.tar.gz | sort","echo \"=== without .env ===\"","tar -czf todo-api-2.4.1.tar.gz --exclude='.env' app","tar -tzf todo-api-2.4.1.tar.gz | sort","mkdir -p releases/2.4.1","tar -xzf todo-api-2.4.1.tar.gz -C releases/2.4.1","echo \"=== extracted ===\"","find releases | sort"],"explanation":[{"part":"tar -czf NAME.tar.gz DIR","meaning":"Create a gzip-compressed archive of DIR."},{"part":"tar -tzf","meaning":"List the files inside. Check before extracting on a server."},{"part":"--exclude='.env'","meaning":"Leave matching files out."},{"part":"tar -xzf ... -C DIR","meaning":"Extract into DIR (it must exist)."},{"part":"-j / -J","meaning":"bzip2 / xz compression instead of gzip (`.tar.bz2`, `.tar.xz`). Modern tar also detects it when extracting."}],"expected_output":"app/\napp/.env\napp/config/\napp/config/application.yml\napp/lib/\napp/lib/todo-api.jar\napp/start.sh\n=== without .env ===\napp/\napp/config/\napp/config/application.yml\napp/lib/\napp/lib/todo-api.jar\napp/start.sh\n=== extracted ===\nreleases\nreleases/2.4.1\nreleases/2.4.1/app\nreleases/2.4.1/app/config\nreleases/2.4.1/app/config/application.yml\nreleases/2.4.1/app/lib\nreleases/2.4.1/app/lib/todo-api.jar\nreleases/2.4.1/app/start.sh","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`tar -cfz backup.tar.gz app`: `f` takes the next word as the file name, so the archive is called `z` (P5).","Extracting a tar from the internet into `/` or the home folder without listing it first: it can overwrite files.","`tar -xzf file.tar.gz -C dir` when `dir` is missing: `tar: dir: Cannot open: No such file or directory`."],"checks":[{"run":"tar -xzf todo.tgz -C missing-dir 2>&1; tar -czf t.tgz app; tar -xzf t.tgz -C missing-dir","expect":"tar: missing-dir: Cannot open: No such file or directory"}],"interview_say":"I create archives with `tar -czf name.tar.gz dir`, check them with `tar -tzf`, and extract with `tar -xzf name.tar.gz -C target`. `f` always comes last, directly before the file name.","try_yourself":"Run `tar -czvf test.tgz app` (with `v`). Then `tar -tvzf test.tgz`. What extra information does `v` show?","table":{"head":["Letter","Meaning"],"rows":[["c","create"],["x","extract"],["t","list (table of contents)"],["z","gzip"],["v","verbose (print each file)"],["f","archive file name follows: keep it last"],["-C dir","work in dir"]]}},{"id":"d20p02","title":"Download and verify with sha256sum","type":"command","topic":"Packages","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A Dockerfile downloads the `todo-cli` tool. If the file is changed on the way (broken mirror, attacker), the build must fail. The vendor publishes a SHA-256 checksum. Here a local test server plays the vendor's website.","task":["Start a download server: `python3 -m http.server 8091 --bind 127.0.0.1 --directory dist &`.","Download `todo-cli.sh` with `curl -fsSL -o`, and again with `wget -q -O`.","Download `todo-cli.sh.sha256` and check the file with `sha256sum -c`.","Change one byte of the downloaded file and check again. Print the exit code."],"hints":["`curl -fsSL -o FILE URL`: fail on errors, silent, follow redirects, save to FILE.","A `.sha256` file has lines `HASH  FILENAME`. `sha256sum -c` checks every line.","`sha256sum -c` exits 1 when a file does not match. Use that to stop a build."],"solution":["python3 -m http.server 8091 --bind 127.0.0.1 --directory dist > /dev/null 2>&1 &","SRV=$!","sleep 1","curl -fsSL -o todo-cli.sh http://127.0.0.1:8091/todo-cli.sh","wget -q -O todo-cli-wget.sh http://127.0.0.1:8091/todo-cli.sh","cmp todo-cli.sh todo-cli-wget.sh && echo \"curl and wget got the same file\"","curl -fsSL -o todo-cli.sh.sha256 http://127.0.0.1:8091/todo-cli.sh.sha256","sha256sum -c todo-cli.sh.sha256","echo \"# changed\" >> todo-cli.sh            # simulate a broken or changed download","sha256sum -c todo-cli.sh.sha256; echo \"exit code: $?\"","kill $SRV"],"explanation":[{"part":"curl -fsSL -o","meaning":"Download to a file, fail on HTTP errors, follow redirects (`-L`)."},{"part":"wget -q -O","meaning":"The same with wget: quiet, output file."},{"part":"cmp a b","meaning":"Compare two files byte by byte; no output if they are equal."},{"part":"sha256sum -c","meaning":"Recompute the hash and compare with the expected one: `OK` or `FAILED`."},{"part":"exit code 1","meaning":"A mismatch. In a Dockerfile `RUN` or a CI step, this stops the build."}],"expected_output":"curl and wget got the same file\ntodo-cli.sh: OK\ntodo-cli.sh: FAILED\nsha256sum: WARNING: 1 computed checksum did NOT match\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Downloading the checksum from the same untrusted place as the file. Get it from the vendor's official page or a signed release.","`curl URL | bash` installs without any check. Download, verify, then run."],"interview_say":"I download with `curl -fsSL -o file URL`, then verify with `sha256sum -c` against the published checksum, so a changed or broken file stops the build.","try_yourself":"Compute a checksum yourself: `sha256sum app/start.sh`. Change the file and compute it again."},{"id":"d20p03","title":"apt and dpkg: what is installed, and from which package?","type":"command","topic":"Packages","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A script on the server uses `tree` and `ls`. The user must know which package each command comes from (to add them to a Dockerfile), and check if a package is installed. Installing needs sudo; these checks do not.","task":["Find the package that owns `/usr/bin/ls` with `dpkg -S`.","Check if `coreutils` is installed with `dpkg -l` (first two columns).","List the files of the `tree` package that are in a `bin` folder (`dpkg -L`).","Show the installed and candidate version of `tree` with `apt-cache policy`.","Read the table: apt vs dnf/yum for the same tasks."],"hints":["`dpkg -S /path` = which package owns this file. `dpkg -L pkg` = files of a package.","In `dpkg -l`, `ii` = installed OK.","`apt-cache policy pkg` shows `Installed:` and `Candidate:`."],"solution":["dpkg -S /usr/bin/ls","dpkg -l coreutils | tail -n 1 | awk '{print $1, $2}'","dpkg -L tree | grep /bin/","apt-cache policy tree | head -n 3"],"explanation":[{"part":"dpkg -S FILE","meaning":"Search: which installed package owns this file."},{"part":"dpkg -l PKG","meaning":"Package status. `ii` = desired install, is installed."},{"part":"dpkg -L PKG","meaning":"All files that the package installed."},{"part":"apt-cache policy","meaning":"Installed version, candidate (newest available) version, and the repository."},{"part":"sudo apt update","meaning":"Refresh the package lists. Run it before `apt install`."}],"expected_output":"coreutils: /usr/bin/ls\nii coreutils\n/usr/bin/tree\ntree:\n  Installed: 2.1.1-2ubuntu3.24.04.2\n  Candidate: 2.1.1-2ubuntu3.24.04.2","expect_exit":0,"output_check":false,"output_note":"Version numbers depend on the Ubuntu version and the last `apt update`.","verified":true,"mistakes":["`apt install` without `sudo`: `E: Could not open lock file /var/lib/dpkg/lock-frontend - open (13: Permission denied)`.","`apt install` fails with `Unable to locate package`: run `sudo apt update` first, or check the package name with `apt search`.","In Dockerfiles, `apt-get install` without `apt-get update` in the same RUN line uses old cached lists."],"checks":[{"run":"apt install tree 2>&1 | grep -m1 lock","expect":"Could not open lock file"}],"interview_say":"On Ubuntu I use `apt` to install and `dpkg -S` or `dpkg -L` to see which package owns a file. On RHEL or Amazon Linux the same tasks use `dnf` or `yum` and `rpm -qf`.","try_yourself":"Run `apt show tree 2>/dev/null | head -n 8`. What is the package description?","table":{"head":["Task","Debian/Ubuntu (apt)","RHEL/Amazon Linux (dnf/yum)"],"rows":[["refresh lists","`sudo apt update`","`sudo dnf makecache`"],["install","`sudo apt install -y nginx`","`sudo dnf install -y nginx`"],["remove","`sudo apt remove nginx` (`purge` = also configs)","`sudo dnf remove nginx`"],["upgrade all","`sudo apt upgrade`","`sudo dnf upgrade`"],["search","`apt search nginx`","`dnf search nginx`"],["owner of a file","`dpkg -S /usr/bin/ls`","`rpm -qf /usr/bin/ls`"],["files of a package","`dpkg -L pkg`","`rpm -ql pkg`"],["package format","`.deb`","`.rpm`"]]}},{"id":"d20p04","title":"gzip, zip, and which/type/command -v","type":"command","topic":"Packages","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The user sends a big report to a colleague who uses Windows (zip), compresses an old log on the server (gzip), and checks which program will really run when typing `python3` or `cd`.","task":["Compress `report.txt` with `gzip -k` (keep the original). Compare sizes with `stat -c '%s %n'`.","Read the first line of the `.gz` file without unpacking (`zcat`).","Create `bundle.zip` from `app` with `zip -qr`. List the names with `unzip -Z1`.","Show what `cd`, `ls` and `python3` are with `type`. Show the path of `python3` with `command -v`."],"hints":["`gzip file` replaces the file with `file.gz`; `-k` keeps the original.","`unzip -l` lists with dates; `unzip -Z1` lists only names.","`type` knows builtins and aliases; `which` only knows files in PATH."],"solution":["gzip -k report.txt","stat -c '%s %n' report.txt report.txt.gz","zcat report.txt.gz | head -n 1","zip -qr bundle.zip app","unzip -Z1 bundle.zip | sort","type cd","type ls","type python3","command -v python3"],"explanation":[{"part":"gzip -k","meaning":"Compress one file into `.gz`, keep the original. `gunzip` or `gzip -d` unpacks."},{"part":"zcat / zgrep","meaning":"Read or search a `.gz` file without unpacking it."},{"part":"zip -qr / unzip","meaning":"zip format (common on Windows): `-r` folders, `-q` quiet."},{"part":"type","meaning":"Is the name a shell builtin, an alias, a function, or a file? (`cd` is a builtin.)"},{"part":"command -v","meaning":"Path of the program (or the name of a builtin). Best choice in scripts."},{"part":"which","meaning":"Older tool: searches only PATH files. `which -a` shows all matches."}],"expected_output":"8692 report.txt\n590 report.txt.gz\n2026-10-20 report line 1: all services OK\napp/\napp/.env\napp/config/\napp/config/application.yml\napp/lib/\napp/lib/todo-api.jar\napp/start.sh\ncd is a shell builtin\nls is /usr/bin/ls\npython3 is /usr/bin/python3\n/usr/bin/python3","expect_exit":0,"output_check":true,"output_note":"On WSL, `python3` is usually `/usr/bin/python3` too.","verified":true,"mistakes":["`gzip` on a folder: `gzip: app is a directory -- ignored`. Use `tar -czf` for folders.","Checking a tool in a script with `which tool`: on some systems `which` prints text even when nothing is found. Use `command -v tool >/dev/null`."],"checks":[{"run":"gzip app","expect":"gzip: app is a directory -- ignored"}],"interview_say":"gzip compresses single files and tar packs folders, so I combine them as `tar -czf`. To check which program runs, I use `type` or `command -v`; in scripts `command -v tool >/dev/null || exit 1`.","try_yourself":"Run `alias ll='ls -l'; type ll` in your terminal. What does `type` say now?"},{"id":"d20p05","title":"Find the bug: the backup and restore test","type":"fix-bug","topic":"Packages","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`backup.sh` should make a backup of `app`, save the checksum of the backup file, and test that the backup can be restored. It prints `backup OK`, but there is no `backup.tar.gz`, and a strange file `z` appeared.","task":["Run `bash backup.sh` and read every error. Run `ls`: is there a `backup.tar.gz`?","Find 4 bugs: the tar letters, the checksum target, the missing restore folder, and the false `backup OK`.","Fix the script: use `set -e`, check the checksum with `sha256sum -c`, and compare the restore with `diff -r`.","Delete the stray file `z`, run the fixed script, and print its exit code."],"hints":["`-cfz`: `f` takes `z` as the archive name. Write `-czf`.","`sha256sum app` fails: app is a folder. Hash the archive: `sha256sum backup.tar.gz > backup.sha256`.","`mkdir -p restore-test` before extracting. `set -e` stops the script at the first error, so `backup OK` only prints on success."],"solution":["bash backup.sh","[ -f backup.tar.gz ] || echo \"there is no backup.tar.gz\"","[ -f z ] && echo \"but there is a stray archive called z\"","rm -f z","cat > backup.sh <<'EOF'","#!/bin/bash","# Make a compressed backup of app/, save the checksum of the backup file,","# then test a restore into restore-test/ and compare it with app/.","set -e","tar -czf backup.tar.gz app","sha256sum backup.tar.gz > backup.sha256","sha256sum -c backup.sha256","rm -rf restore-test && mkdir -p restore-test","tar -xzf backup.tar.gz -C restore-test","diff -r app restore-test/app","echo \"backup OK: restore test passed\"","EOF","echo \"--- fixed ---\"","bash backup.sh; echo \"exit code: $?\""],"explanation":[{"part":"tar -czf","meaning":"Bug 1: with `-cfz`, the archive was named `z`, and tar tried to add a missing file `backup.tar.gz`."},{"part":"sha256sum backup.tar.gz","meaning":"Bug 2: the checksum must be of the backup file, not the folder."},{"part":"mkdir -p restore-test","meaning":"Bug 3: tar -C needs an existing folder. The user sees this error only after bug 1 is fixed: now the extract fails earlier, because the archive does not exist."},{"part":"set -e","meaning":"Bug 4: without it, `backup OK` printed even after three errors."},{"part":"diff -r","meaning":"A real restore test: compare every file. No output = identical."}],"expected_output":"tar: backup.tar.gz: Cannot stat: No such file or directory\ntar: Exiting with failure status due to previous errors\nsha256sum: app: Is a directory\ntar (child): backup.tar.gz: Cannot open: No such file or directory\ntar (child): Error is not recoverable: exiting now\ntar: Child returned status 2\ntar: Error is not recoverable: exiting now\nbackup OK\nthere is no backup.tar.gz\nbut there is a stray archive called z\n--- fixed ---\nbackup.tar.gz: OK\nbackup OK: restore test passed\nexit code: 0","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Never testing a restore. A backup that cannot be restored is not a backup.","Keeping the checksum only next to the backup: if the disk is lost, both are lost. Store copies in another place (for example S3)."],"checks":[{"run":"bash backup.sh","expect":"tar: backup.tar.gz: Cannot stat: No such file or directory"},{"run":"bash backup.sh","expect":"sha256sum: app: Is a directory"},{"run":"sed 's/-cfz/-czf/' backup.sh > b2.sh; bash b2.sh","expect":"tar: restore-test: Cannot open: No such file or directory"}],"interview_say":"A backup script must stop on errors (`set -e`), store a checksum of the archive, and test the restore with `tar -xzf` into a
