 backend","echo '2.4.1' > VERSION","printf '%s\\n' 'GET /api/todos 200' 'GET /api/todos 500' 'GET /health 200' 'GET /api/todos 200' > access.log","# P3: a child script that reads two variables","printf '%s\\n' '#!/bin/bash' 'echo \"child sees DB_HOST=[$DB_HOST] LOG_LEVEL=[$LOG_LEVEL]\"' > child.sh","chmod +x child.sh","# P4: a script that shows special variables","printf '%s\\n' '#!/bin/bash' 'echo \"script name (\\$0): $0\"' 'echo \"first arg  (\\$1): $1\"' 'echo \"arg count  (\\$#): $#\"' 'echo \"all args   (\\$@): $@\"' 'echo \"my PID     (\\$\\$): $$\"' 'false' 'echo \"last exit  (\\$?): $?\"' > args.sh","chmod +x args.sh","# P5: a project folder with a space in its name, and a broken backup script","mkdir -p \"my project\"","echo 'readme' > \"my project/README.md\"","printf '%s\\n' '#!/bin/bash' 'SRC = \"my project\"' \"DEST='backups/\\$USER'\" 'mkdir -p $DEST' 'cp -r $SRC \"$DEST\"/' 'echo \"Saved $SRC to $DEST\"' > backup.sh","# P6: a small tool for the PATH problem","printf '%s\\n' '#!/bin/bash' 'echo \"todo-api: running (version $(cat ~/bash-practice/day05/VERSION))\"' > bin/todo-status","chmod +x bin/todo-status","# P7: a demo settings file (NOT your real ~/.bashrc)","printf '%s\\n' 'export GREETING=\"hello from demo-bashrc\"' 'alias ll=\"ls -l\"' > demo-bashrc","cd ~/bash-practice/day05"],"warmup":[{"q":"Which redirect saves stdout and stderr of `job.sh` in `job.log`?","a":"`./job.sh > job.log 2>&1` (or `./job.sh &> job.log`).","from_day":4},{"q":"Why does `sudo echo x > /etc/file` fail?","a":"The redirect is done by the normal user's shell, not by sudo. Use `echo x | sudo tee -a /etc/file`.","from_day":4},{"q":"Which grep option shows lines that do NOT match?","a":"`-v`, for example `grep -v INFO app.log`.","from_day":2},{"q":"Does root care about a file permission of 600?","a":"No. Root ignores read and write permissions. 600 only blocks other normal users.","from_day":3}],"problems":[{"id":"d05p01","title":"Predict: single quotes, double quotes, no quotes","type":"predict","topic":"Variables","minutes":12,"optional":false,"core":true,"workdir":".","situation":"A deploy message printed `Deploying $APP` instead of the app name. Another script broke on a folder name with a space. Quotes decide what bash does with `$`, spaces and wildcards.","task":["Set `APP=todo-api` and `DIR=\"my project\"`. (No spaces around `=`!)","Predict, then run: `echo \"Deploying $APP\"` and `echo 'Deploying $APP'`.","Predict, then run: `echo \"Path: ~/$APP\"` and `echo Path: ~/$APP`.","Predict, then run: `ls $DIR` and `ls \"$DIR\"`.","Predict, then run: `echo \"Today is $(date +%A)\" | wc -w` (the day name changes, the count does not)."],"hints":["Double quotes: `$var` and `$(cmd)` are replaced, but spaces stay inside one word.","Single quotes: nothing is replaced. The text is printed exactly.","Without quotes, `$DIR` is split at the space into two words: `my` and `project`."],"solution":["APP=todo-api","DIR=\"my project\"","echo \"Deploying $APP\"        # double quotes: $APP is replaced","echo 'Deploying $APP'        # single quotes: printed as written","echo \"Path: ~/$APP\"          # ~ is NOT expanded inside quotes","echo Path: ~/$APP            # no quotes: ~ becomes /home/wicky","ls $DIR || echo \"exit code: $?\"   # split into 'my' and 'project'","ls \"$DIR\"                    # one word: works","echo \"Today is $(date +%A)\" | wc -w"],"explanation":[{"part":"\"...$APP...\"","meaning":"Double quotes: variables and `$( )` are replaced. Spaces stay in one argument."},{"part":"'...$APP...'","meaning":"Single quotes: no replacement at all. Good for literal `$` text, regex and awk code."},{"part":"~ in quotes","meaning":"The tilde `~` becomes the home folder only when it is not quoted. In scripts, use `$HOME`."},{"part":"ls $DIR","meaning":"No quotes: bash splits the value at spaces. `ls` gets two names that do not exist."},{"part":"$(date +%A)","meaning":"Command substitution: run the command and put its output here."}],"expected_output":"Deploying todo-api\nDeploying $APP\nPath: ~/todo-api\nPath: /home/wicky/todo-api\nls: cannot access 'my': No such file or directory\nls: cannot access 'project': No such file or directory\nexit code: 2\nREADME.md\n3","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Spaces around `=`: `APP = todo-api` gives `bash: APP: command not found`. Bash thinks `APP` is a command.","Single quotes around a variable in a message: `echo 'Hello $USER'` prints `Hello $USER`.","Not quoting a path with spaces: `ls: cannot access 'my': No such file or directory`."],"checks":[{"run":"APP = todo-api","expect":"bash: APP: command not found"},{"run":"echo 'Hello $USER'","expect":"Hello $USER"}],"interview_say":"Double quotes expand variables but keep spaces together; single quotes keep everything literal. I quote every variable, like `\"$DIR\"`, so spaces in names do not break my scripts.","try_yourself":"Run `echo \"$APP\"s` and `echo \"${APP}s\"` and `echo \"$APPs\"`. Why is the last one empty?","table":{"head":["Quote","$var replaced?","Spaces kept in one word?","Wildcards (*) expanded?"],"rows":[["none","yes","no","yes"],["\"double\"","yes","yes","no"],["'single'","no","yes","no"]]}},{"id":"d05p02","title":"Build a release tag with $( ) and $(( ))","type":"command","topic":"Variables","minutes":13,"optional":false,"core":false,"workdir":".","situation":"The CI pipeline needs a tag like `todo-api-2.4.1-build8` for the Docker image, plus an error rate for the release notes. The version is in a file, and the build number is the last build plus one.","task":["Read the version from the file `VERSION` into a variable with `$(cat VERSION)`.","Set `LAST_BUILD=7`, and compute `BUILD=$((LAST_BUILD + 1))`.","Print the tag `todo-api-<version>-build<number>`. Use `${VERSION}` in braces.","Count all lines and the `500` lines of `access.log` with `$( )`.","Print the error rate in percent with `$(( ))` (whole numbers only)."],"hints":["`VAR=$(command)` saves the output of a command.","Inside `$(( ))` variables need no `$`: `$((a + 1))` works.","Bash arithmetic is integer only: `$((ERRORS * 100 / TOTAL))` gives 25, not 25.0."],"solution":["VERSION=$(cat VERSION)","LAST_BUILD=7","BUILD=$((LAST_BUILD + 1))","TAG=\"todo-api-${VERSION}-build${BUILD}\"","echo \"Image tag: $TAG\"","TOTAL=$(wc -l < access.log)","ERRORS=$(grep -c ' 500$' access.log)","echo \"Requests: $TOTAL, errors: $ERRORS\"","echo \"Error rate: $((ERRORS * 100 / TOTAL))%\"","echo \"7 / 2 in bash is $((7 / 2)), remainder $((7 % 2))\""],"explanation":[{"part":"$(cat VERSION)","meaning":"Command substitution: the file content becomes the value."},{"part":"$((LAST_BUILD + 1))","meaning":"Arithmetic expansion: whole-number math. No `$` needed inside."},{"part":"${VERSION}","meaning":"Braces mark where the variable name ends, so text can follow directly."},{"part":"wc -l < file","meaning":"With `<` wc prints only the number (no file name), good for variables."},{"part":"' 500$'","meaning":"`$` at the end of a regex = end of the line. So only the status code at the end matches."},{"part":"/ and %","meaning":"Integer division and remainder. For decimals use `awk` or `bc` (Day 11)."}],"expected_output":"Image tag: todo-api-2.4.1-build8\nRequests: 4, errors: 1\nError rate: 25%\n7 / 2 in bash is 3, remainder 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Old backticks `` `cat VERSION` `` work but are hard to read and to nest. Use `$( )`.","Writing `$(LAST_BUILD + 1)` with one pair of brackets: bash tries to run a command called `LAST_BUILD`: `bash: LAST_BUILD: command not found`.","Expecting decimals: `$((1 / 4))` is `0`."],"checks":[{"run":"LAST_BUILD=7; echo $(LAST_BUILD + 1)","expect":"LAST_BUILD: command not found"}],"interview_say":"I use `$(command)` to save command output in a variable and `$(( ))` for integer math, for example to compute a build number or a percentage.","try_yourself":"Compute the percentage with one decimal using awk: `awk -v e=\"$ERRORS\" -v t=\"$TOTAL\" 'BEGIN { printf \"%.1f\\n\", e*100/t }'`."},{"id":"d05p03","title":"export: why the child script sees nothing","type":"command","topic":"Variables","minutes":12,"optional":false,"core":true,"workdir":".","situation":"The user sets `DB_HOST` in the terminal and starts the backend with a script, but the script says `DB_HOST` is empty. Only exported variables are passed to child processes (programs started from this shell).","task":["Set `DB_HOST=db.internal` (no export) and run `./child.sh`.","Now `export DB_HOST` and run `./child.sh` again.","Give `LOG_LEVEL=debug` only to one run: `LOG_LEVEL=debug ./child.sh`. Then run `./child.sh` once more.","Check the environment with `printenv DB_HOST` and `env | grep '^DB_'`.","Remove the variable with `unset DB_HOST` and run `./child.sh`."],"hints":["A normal variable lives only in the current shell. `export` puts it into the environment.","`NAME=value command` sets the variable only for that one command.","`printenv NAME` prints one environment variable; `env` prints all of them."],"solution":["DB_HOST=db.internal","./child.sh                       # not exported: the child sees nothing","export DB_HOST","./child.sh                       # exported: the child sees it","LOG_LEVEL=debug ./child.sh       # only for this one command","./child.sh","printenv DB_HOST","env | grep '^DB_'","unset DB_HOST","./child.sh"],"explanation":[{"part":"DB_HOST=db.internal","meaning":"A shell variable. Only this shell can see it."},{"part":"export DB_HOST","meaning":"Mark it as an environment variable. Every child process gets a copy."},{"part":"LOG_LEVEL=debug ./child.sh","meaning":"Set a variable for one command only. Common for one-time settings."},{"part":"printenv / env","meaning":"Show environment variables (only exported ones)."},{"part":"unset","meaning":"Delete a variable."}],"expected_output":"child sees DB_HOST=[] LOG_LEVEL=[]\nchild sees DB_HOST=[db.internal] LOG_LEVEL=[]\nchild sees DB_HOST=[db.internal] LOG_LEVEL=[debug]\nchild sees DB_HOST=[db.internal] LOG_LEVEL=[]\ndb.internal\nDB_HOST=db.internal\nchild sees DB_HOST=[] LOG_LEVEL=[]","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Expecting a child to change the parent: a script that runs `export X=1` does not change the terminal that started it. Use `source script.sh` for that.","Writing `export $DB_HOST`. That exports a variable with the name `db.internal`. Write `export DB_HOST` (no `$`)."],"interview_say":"Only exported variables go to child processes. In Docker and Kubernetes, settings reach the app the same way: as environment variables.","try_yourself":"Run `bash -c 'echo $DB_HOST'` before and after `export`. `bash -c` is also a child process."},{"id":"d05p04","title":"Special variables: $0 $1 $# $@ $? $$","type":"command","topic":"Variables","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A deploy script must check its arguments: how many were given, what the first one is, and whether the last command worked. Bash fills special variables for this.","task":["Read `args.sh` with `cat args.sh`.","Run `./args.sh staging \"todo api\" v2`. Look at each line.","Run it with no arguments: `./args.sh`.","Run `ls /nope; echo \"exit: $?\"` and `ls /tmp > /dev/null; echo \"exit: $?\"`."],"hints":["`$1` is the first argument, `$#` the number of arguments, `$@` all arguments.","`$?` is the exit code of the **last** command. Read it right away; the next command changes it.","`$$` is the process ID of the shell running the script. It changes every run."],"solution":["cat args.sh","./args.sh staging \"todo api\" v2","echo \"--- no arguments ---\"","./args.sh","ls /nope; echo \"exit: $?\"","ls /tmp > /dev/null; echo \"exit: $?\""],"explanation":[{"part":"$0","meaning":"The name the script was started with."},{"part":"$1, $2 ...","meaning":"Positional parameters: the arguments in order. `\"todo api\"` is one argument because of the quotes."},{"part":"$#","meaning":"How many arguments."},{"part":"$@","meaning":"All arguments. Write it as `\"$@\"` to keep each one separate (Day 9)."},{"part":"$$","meaning":"PID of the current shell. Useful for unique temp file names."},{"part":"$?","meaning":"Exit code of the last command: 0 = success, other = error."}],"expected_output":"#!/bin/bash\necho \"script name (\\$0): $0\"\necho \"first arg  (\\$1): $1\"\necho \"arg count  (\\$#): $#\"\necho \"all args   (\\$@): $@\"\necho \"my PID     (\\$\\$): $$\"\nfalse\necho \"last exit  (\\$?): $?\"\nscript name ($0): ./args.sh\nfirst arg  ($1): staging\narg count  ($#): 3\nall args   ($@): staging todo api v2\nmy PID     ($$): 25682\nlast exit  ($?): 1\n--- no arguments ---\nscript name ($0): ./args.sh\nfirst arg  ($1):\narg count  ($#): 0\nall args   ($@):\nmy PID     ($$): 25683\nlast exit  ($?): 1\nls: cannot access '/nope': No such file or directory\nexit: 2\nexit: 0","expect_exit":0,"output_check":false,"output_note":"The PID (`$$`) is different on every run. The `ls` error text is the same on the user's machine.","verified":true,"mistakes":["Running another command before reading `$?`: then `$?` belongs to that command (often `echo`, which is 0).","Using `$10` for the tenth argument. Bash reads it as `$1` followed by `0`. Write `${10}`."],"interview_say":"`$1` and so on are the arguments, `$#` their number, `$@` all of them, `$?` the last exit code and `$$` the PID. I check `$#` at the start of a script and print a usage message if it is wrong.","try_yourself":"Run `./args.sh a b c d e f g h i j` and add a line `echo \"${10}\"` to the script. What prints?"},{"id":"d05p05","title":"Find the bug: the backup script variables","type":"fix-bug","topic":"Variables","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`backup.sh` should copy the folder `my project` into `backups/<user name>/`. It prints strange errors, and a folder named `$USER` appears.","task":["Read and run `bash backup.sh`. Read every error.","Run `ls backups` (if it exists). Is the folder name correct?","Find 3 bugs about `=`, quotes and spaces. Fix them.","Delete the wrong folder: `rm -rf 'backups/$USER'` (single quotes, so the name is exact). Run the fixed script.","Check with `ls -R backups`."],"hints":["Line 2: look at the spaces.","Line 3: which quotes stop `$USER` from being replaced?","Line 5: the folder name has a space. Quote the variable."],"solution":["bash backup.sh","rm -rf 'backups/$USER'           # remove the folder with the literal name $USER","cat > backup.sh <<'EOF'","#!/bin/bash","SRC=\"my project\"                 # no spaces around =","DEST=\"backups/$USER\"             # double quotes: $USER is replaced","mkdir -p \"$DEST\"","cp -r \"$SRC\" \"$DEST\"/            # quotes keep \"my project\" as one name","echo \"Saved $SRC to $DEST\"","EOF","bash backup.sh","ls -R backups"],"explanation":[{"part":"SRC = \"my project\"","meaning":"Bug 1: spaces around `=`. Bash ran a command `SRC`: `SRC: command not found`."},{"part":"DEST='backups/$USER'","meaning":"Bug 2: single quotes. The folder was really named `$USER`."},{"part":"cp -r $SRC","meaning":"Bug 3: no quotes. With the right value, `my project` is split into `my` and `project`."},{"part":"rm -rf 'backups/$USER'","meaning":"Single quotes so `rm` gets the literal name, not `backups/wicky`."}],"expected_output":"backup.sh: line 2: SRC: command not found\ncp: missing destination file operand after 'backups/$USER/'\nTry 'cp --help' for more information.\nSaved  to backups/$USER\nSaved my project to backups/wicky\nbackups:\nwicky\n\nbackups/wicky:\n'my project'\n\n'backups/wicky/my project':\nREADME.md","expect_exit":0,"output_check":true,"output_note":"The folder name is the user name. On the learner's WSL it is `wicky`, like here.","verified":true,"mistakes":["Fixing bug 1 but not bug 3: then `cp: cannot stat 'my': No such file or directory`.","Deleting with `rm -rf backups/$USER` (no quotes): this deletes `backups/wicky`, not the wrong folder."],"checks":[{"run":"SRC=\"my project\"; mkdir -p out; cp -r $SRC out/","expect":"cp: cannot stat 'my': No such file or directory"}],"interview_say":"Most bash bugs I see are quoting bugs: spaces around `=`, single quotes that stop a variable, and unquoted paths with spaces. ShellCheck finds all three.","try_yourself":"If ShellCheck is installed (`sudo apt install -y shellcheck`), run `shellcheck backup.sh` on the broken version. Read the codes, like SC2086."},{"id":"d05p06","title":"PATH: run your own tool by name","type":"command","topic":"Variables","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The team has small helper scripts in `~/bash-practice/day05/bin`. The user wants to type `todo-status` from any folder, like a normal command. Bash finds commands by searching the folders in `PATH`.","task":["Try `todo-status`. Read the error.","Show the first 3 folders in PATH: `echo \"$PATH\" | tr ':' '\\n' | head -n 3`.","Add the folder at the front: `export PATH=\"$HOME/bash-practice/day05/bin:$PATH\"`.","Run `todo-status` again and check where it comes from with `command -v todo-status`."],"hints":["PATH is a list of folders separated by `:`.","Keep the old value: always include `:$PATH` when adding a folder.","To keep it after closing the terminal, add the export line to `~/.bashrc`."],"solution":["todo-status || echo \"exit code: $?\"","echo \"$PATH\" | tr ':' '\\n' | head -n 3","export PATH=\"$HOME/bash-practice/day05/bin:$PATH\"","todo-status","command -v todo-status"],"explanation":[{"part":"command not found (127)","meaning":"Bash searched every PATH folder and found nothing. Exit code 127."},{"part":"tr ':' '\\n'","meaning":"Replace each `:` with a new line, so each folder is on its own line."},{"part":"PATH=\"new:$PATH\"","meaning":"Put the new folder first, keep all old folders after it."},{"part":"command -v","meaning":"Show which file bash will run for a name."}],"expected_output":"bash: todo-status: command not found\nexit code: 127\n/usr/local/sbin\n/usr/local/bin\n/usr/sbin\ntodo-api: running (version 2.4.1)\n/home/wicky/bash-practice/day05/bin/todo-status","expect_exit":0,"output_check":false,"output_note":"The user's real PATH is longer. On WSL it also contains many Windows folders like `/mnt/c/Windows`.","verified":true,"mistakes":["`export PATH=\"$HOME/bin\"` without `:$PATH`. Now `ls` and `grep` are not found: `ls: command not found`. Open a new terminal to fix it.","Using `~` inside quotes: `\"~/bin:$PATH\"`. The `~` is not expanded. Use `$HOME`."],"checks":[{"run":"export PATH=\"$HOME/bin\"; ls","expect":"ls: command not found"}],"interview_say":"PATH is a colon-separated list of folders where bash looks for commands. I add a folder with `export PATH=\"/my/bin:$PATH\"` and make it permanent in `~/.bashrc`.","try_yourself":"Run `type ls cd todo-status`. `type` shows if a name is a program, an alias or a shell builtin."},{"id":"d05p07","title":"source vs run, and .bashrc vs .profile","type":"concept","topic":"Variables","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The user adds `export GREETING=...` to a settings file and runs it, but the variable is still empty. Running a file starts a child shell; `source` reads the file into the current shell. Here we use `demo-bashrc`, not the real `~/.bashrc`.","task":["Read `demo-bashrc`.","Run it as a script: `bash demo-bashrc`, then `echo \"[$GREETING]\"`.","Load it with `source demo-bashrc` (or `. demo-bashrc`), then `echo \"[$GREETING]\"`.","Read the table: which file runs when?"],"hints":["`bash file` = new child shell. Its variables are gone when it ends.","`source file` = run the lines in this shell.","After editing `~/.bashrc`, run `source ~/.bashrc` to load it without opening a new terminal."],"solution":["cat demo-bashrc","bash demo-bashrc","echo \"after bash:   [$GREETING]\"","source demo-bashrc","echo \"after source: [$GREETING]\""],"explanation":[{"part":"bash demo-bashrc","meaning":"Runs in a child shell. The export happens there and disappears."},{"part":"source demo-bashrc","meaning":"Runs the lines in the current shell, so the variable stays."},{"part":". demo-bashrc","meaning":"Same as `source` (POSIX short form)."}],"expected_output":"export GREETING=\"hello from demo-bashrc\"\nalias ll=\"ls -l\"\nafter bash:   []\nafter source: [hello from demo-bashrc]","expect_exit":0,"output_check":true,"output_note":"On Ubuntu, `~/.profile` also loads `~/.bashrc`, so on WSL both run when a terminal opens.","verified":true,"mistakes":["Editing `~/.bashrc` and expecting the open terminal to change. Run `source ~/.bashrc` or open a new terminal.","Putting `echo` lines in `~/.bashrc`: they can break `scp` and other tools that start bash without a terminal."],"interview_say":"`~/.bashrc` runs for every interactive shell, so I put aliases there. `~/.profile` runs at login, so I put PATH and environment variables there. To reload a file I use `source`.","try_yourself":"After `source demo-bashrc`, run `ll`. The alias works. Then run `bash -c 'll'`. Why does it fail?","table":{"head":["File","When it runs","Put here"],"rows":[["`~/.bashrc`","every new interactive bash (new terminal tab)","aliases, prompt, functions"],["`~/.profile`","login shells (log in, SSH, WSL start)","PATH and environment variables"],["`/etc/environment`","for all users at login (system file)","system-wide variables (needs sudo)"]]}}],"interview":[{"q":"What is the difference between single and double quotes in bash?","a":"Double quotes replace variables and `$( )`, but keep spaces in one word. Single quotes print everything exactly, with no replacement.","topic":"Variables"},{"q":"What does `export` do?","a":"It puts a variable into the environment, so child processes (scripts and programs started from this shell) can see it.","topic":"Variables"},{"q":"What is `$?`?","a":"The exit code of the last command. 0 means success; any other number means an error.","topic":"Variables"},{"q":"What is the PATH variable?","a":"A colon-separated list of folders. Bash searches these folders, in order, when the user types a command name.","topic":"Variables"},{"q":"What is the difference between `$(command)` and `$((1 + 2))`?","a":"`$(command)` runs a command and uses its output. `$(( ))` does integer arithmetic.","topic":"Variables"}],"recap":[{"cmd":"NAME=value","meaning":"Set a variable (no spaces around =)","example":"APP=todo-api","topic":"Variables"},{"cmd":"\"$VAR\"","meaning":"Use a variable, keep spaces safe","example":"cp -r \"$SRC\" \"$DEST\"","topic":"Variables"},{"cmd":"'text'","meaning":"Literal text, nothing replaced","example":"echo 'cost: $5'","topic":"Variables"},{"cmd":"${VAR}","meaning":"Variable with clear end","example":"echo \"${APP}-v2\"","topic":"Variables"},{"cmd":"$(cmd)","meaning":"Command substitution","example":"VERSION=$(cat VERSION)","topic":"Variables"},{"cmd":"$(( ))","meaning":"Integer arithmetic","example":"echo $((errors * 100 / total))","topic":"Variables"},{"cmd":"export","meaning":"Pass a variable to child processes","example":"export DB_HOST=db.internal","topic":"Variables"},{"cmd":"VAR=x cmd","meaning":"Set a variable for one command only","example":"LOG_LEVEL=debug ./run.sh","topic":"Variables"},{"cmd":"unset","meaning":"Delete a variable","example":"unset DB_HOST","topic":"Variables"},{"cmd":"env / printenv","meaning":"Show environment variables","example":"printenv PATH","topic":"Variables"},{"cmd":"$0 $1 $# $@","meaning":"Script name, first arg, arg count, all args","example":"echo \"$# args\"","topic":"Variables"},{"cmd":"$? / $$","meaning":"Last exit code / current PID","example":"echo \"exit: $?\"","topic":"Variables"},{"cmd":"PATH","meaning":"Folders searched for commands","example":"export PATH=\"$HOME/bin:$PATH\"","topic":"Variables"},{"cmd":"source file","meaning":"Run a file in the current shell","example":"source ~/.bashrc","topic":"Variables"}],"coverage":[{"item":"Variables, quotes","problems":["d05p01","d05p05"]},{"item":"export, environment","problems":["d05p03","d05p07"]},{"item":"PATH","problems":["d05p06"]},{"item":"$(...) command substitution","problems":["d05p01","d05p02"]},{"item":"$(( )) arithmetic","problems":["d05p02"]},{"item":"Special variables $? $@ $# $0 $$ $1","problems":["d05p04"]},{"item":"env, printenv","problems":["d05p03"]},{"item":".bashrc vs .profile","problems":["d05p07"]}],"reset":"rm -rf ~/bash-practice/day05"},{"day":6,"week":1,"title":"Conditions and exit codes","goal":"Make scripts decide: test files, strings and numbers, choose with case, and return exit codes that CI tools understand.","minutes":90,"setup":["mkdir -p ~/bash-practice/day06 && cd ~/bash-practice/day06","# P1: a release folder in different states","mkdir -p release/logs","printf 'port: 8080\\n' > release/app.yml",": > release/empty.lock","printf '#!/bin/bash\\necho start\\n' > release/deploy.sh","chmod 644 release/deploy.sh","# P3: disk usage numbers from 4 servers","printf '%s\\n' 'web-01 45' 'web-02 85' 'db-01 92' 'cache-01 9' > disk-usage.txt","# P5: a broken health check script","mkdir -p logs","echo 200 > last-code.txt","printf '%s\\n' '#!/bin/bash' '# Check that the log folder exists and that the last HTTP code is 200.' '# Optional argument: number of retries (warn if more than 3).' 'LOG_DIR=logs' 'CODE=$(cat last-code.txt)' 'RETRIES=$1' 'if [ -f \"$LOG_DIR\" ]; then echo \"log folder OK\"; else echo \"log folder MISSING\"; fi' 'if [\"$CODE\" = \"200\"]; then echo \"HTTP OK\"; else echo \"HTTP FAIL\"; fi' 'if [ $RETRIES -gt 3 ]; then echo \"warning: $RETRIES retries\"; fi' > health.sh","# P7: a small log","printf '%s\\n' 'INFO start' 'ERROR disk full' 'INFO stop' > app.log","cd ~/bash-practice/day06"],"warmup":[{"q":"What is the difference between `'$HOME'` and `\"$HOME\"`?","a":"Single quotes print `$HOME` literally. Double quotes replace it with `/home/wicky`.","from_day":5},{"q":"A child script cannot see `DB_HOST`. What is missing?","a":"`export DB_HOST`. Only exported variables are passed to child processes.","from_day":5},{"q":"What does `cmd 2>&1 > file` do wrong?","a":"stderr is sent to the screen (where stdout was at that moment), then stdout moves to the file. Correct: `cmd > file 2>&1`.","from_day":4},{"q":"Which `xargs` option runs one command per input line, putting the line at `{}`?","a":"`-I{}`, for example `xargs -I{} echo docker pull {} < images.txt`.","from_day":4}],"problems":[{"id":"d06p01","title":"Pre-deploy checks with file tests","type":"script","topic":"Scripting","minutes":13,"optional":false,"core":false,"workdir":"release","situation":"Before every deploy, a script must check the release folder: the config exists and is not empty, the logs folder exists, the deploy script can run, and the lock file is empty. If one check fails, the deploy must stop.","task":["In `release`, write a script `check.sh` (or type the lines directly) that tests each item below and prints `OK` or `FAIL`.","`app.yml` is a regular file (`-f`) and not empty (`-s`).","`logs` is a folder (`-d`), and it is writable (`-w`).","`deploy.sh` is executable (`-x`). `empty.lock` exists (`-e`) but is empty (`! -s`).","Count the failures and finish with `exit 1` if there is at least one."],"hints":["Pattern: `if [ -f app.yml ]; then echo \"OK ...\"; else echo \"FAIL ...\"; fi`.","`!` means not: `[ ! -s empty.lock ]` is true when the file is empty.","Use a counter: `FAILS=0`, and in the else part `FAILS=$((FAILS + 1))`. At the end: `[ \"$FAILS\" -eq 0 ] || exit 1`."],"solution":["cat > check.sh <<'EOF'","#!/bin/bash","FAILS=0","check() {               # usage: check \"description\" test-arguments...","  local msg=$1; shift","  if [ \"$@\" ]; then echo \"OK   $msg\"; else echo \"FAIL $msg\"; FAILS=$((FAILS + 1)); fi","}","check \"app.yml is a file\"        -f app.yml","check \"app.yml is not empty\"     -s app.yml","check \"logs is a folder\"         -d logs","check \"logs is writable\"         -w logs","check \"deploy.sh is executable\"  -x deploy.sh","check \"empty.lock exists\"        -e empty.lock","check \"empty.lock is empty\"      ! -s empty.lock","echo \"failures: $FAILS\"","[ \"$FAILS\" -eq 0 ] || exit 1","EOF","bash check.sh; echo \"exit code: $?\"","chmod +x deploy.sh               # fix the problem","bash check.sh; echo \"exit code: $?\""],"explanation":[{"part":"-f / -d / -e","meaning":"Regular file / folder (directory) / exists (any type)."},{"part":"-s","meaning":"File exists and its size is more than 0."},{"part":"-r / -w / -x","meaning":"The current user can read / write / execute it."},{"part":"! -s","meaning":"`!` negates the test: true when the file is empty."},{"part":"[ \"$@\" ]","meaning":"Runs the test with the remaining arguments. A small function keeps the script short (Day 9)."},{"part":"exit 1","meaning":"Tell the caller (Jenkins, cron, another script) that the checks failed."}],"expected_output":"OK   app.yml is a file\nOK   app.yml is not empty\nOK   logs is a folder\nOK   logs is writable\nFAIL deploy.sh is executable\nOK   empty.lock exists\nOK   empty.lock is empty\nfailures: 1\nexit code: 1\nOK   app.yml is a file\nOK   app.yml is not empty\nOK   logs is a folder\nOK   logs is writable\nOK   deploy.sh is executable\nOK   empty.lock exists\nOK   empty.lock is empty\nfailures: 0\nexit code: 0","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `-f` on a folder: `[ -f logs ]` is false, because `logs` is a directory. Use `-d`, or `-e` for \"any type\".","No spaces inside the brackets: `[-f app.yml]` gives `bash: [-f: command not found`.","Printing FAIL but ending with exit code 0. Jenkins then shows the step as green."],"checks":[{"run":"[-f release/app.yml]","expect":"bash: [-f: command not found"}],"interview_say":"I test files with `-f` for a file, `-d` for a folder, `-e` for exists, `-s` for not empty, and `-r -w -x` for permissions. If a check fails, the script ends with a non-zero exit code so the pipeline stops.","try_yourself":"Add a check that `app.yml` is newer than `deploy.sh`: `[ app.yml -nt deploy.sh ]`."},{"id":"d06p02","title":"[ ] vs [[ ]]: empty variables and patterns","type":"explain-error","topic":"Scripting","minutes":13,"optional":false,"core":true,"workdir":".","situation":"A Jenkins job prints `[: =: unary operator expected` when the `BRANCH` variable is empty. The team also wants to deploy only branches that start with `release/`. `[[ ]]` solves both problems.","task":["Set `BRANCH=` (empty). Run `[ $BRANCH = main ] && echo yes`. Read the error.","Run the same test with quotes: `[ \"$BRANCH\" = main ]`. Then with `[[ $BRANCH = main ]]`.","Set `BRANCH=release/2.4`. Test the pattern `[[ $BRANCH == release/* ]]`.","Check the version format with a regex: `[[ $VERSION =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]` for `2.4.1` and `2.4`.","Combine two tests inside `[[ ]]` with `&&`."],"hints":["With an empty unquoted variable, `[ $BRANCH = main ]` becomes `[ = main ]`. One word is missing.","`[[ ]]` is a bash keyword: it does not split variables, and it supports `==` patterns and `=~` regex.","In `[[ ]]`, do not quote the right side of a pattern, or it is compared as plain text."],"solution":["BRANCH=","[ $BRANCH = main ] && echo yes || echo \"test failed, exit code: $?\"","[ \"$BRANCH\" = main ] || echo \"quoted [ ]: no error, just false\"","[[ $BRANCH = main ]] || echo \"[[ ]]: no error, just false\"","BRANCH=release/2.4","if [[ $BRANCH == release/* ]]; then echo \"deploy $BRANCH to staging\"; fi","for VERSION in 2.4.1 2.4; do","  if [[ $VERSION =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then echo \"$VERSION: valid\"; else echo \"$VERSION: invalid\"; fi","done","[[ -n $BRANCH && $BRANCH != main ]] && echo \"feature or release branch\""],"explanation":[{"part":"unary operator expected","meaning":"`[` got `= main` with nothing on the left, because the empty variable vanished. Exit code 2 = error in the test."},{"part":"[ \"$BRANCH\" = main ]","meaning":"Quotes keep an empty value as one empty word. Always quote inside `[ ]`."},{"part":"[[ ... ]]","meaning":"Bash keyword. Variables are not split, so quotes are optional on the left side."},{"part":"== release/*","meaning":"Pattern match (like file wildcards) inside `[[ ]]` only."},{"part":"=~ regex","meaning":"Regular expression match. `^` start, `$` end, `[0-9]+` one or more digits, `\\.` a real dot."},{"part":"-n / -z","meaning":"String is not empty / is empty."}],"expected_output":"bash: [: =: unary operator expected\ntest failed, exit code: 2\nquoted [ ]: no error, just false\n[[ ]]: no error, just false\ndeploy release/2.4 to staging\n2.4.1: valid\n2.4: invalid\nfeature or release branch","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`[ $BRANCH = main ]` with empty BRANCH: `bash: [: =: unary operator expected`.","Quoting the pattern: `[[ $BRANCH == \"release/*\" ]]` compares with the text `release/*` and is false.","Using `[[ ]]` in a script run by `sh script.sh`: `sh` (dash) gives `[[: not found`. Run it with `bash`."],"checks":[{"run":"[[ release/2.4 == \"release/*\" ]] || echo false","expect":"false"},{"run":"printf '[[ a == a ]] && echo ok\\n' > t.sh; sh t.sh","expect":"[[: not found"}],"interview_say":"`[ ]` is the old test command, so I must quote variables. `[[ ]]` is a bash keyword: it handles empty variables safely and supports patterns and regex. In bash scripts I prefer `[[ ]]`.","try_yourself":"Run `[[ $BRANCH =~ ^release/([0-9.]+)$ ]] && echo \"${BASH_REMATCH[1]}\"`. What does `BASH_REMATCH` hold?","table":{"head":["","`[ ]` (test)","`[[ ]]` (bash)"],"rows":[["Empty variable without quotes","error","works"],["Pattern `== release/*`","no","yes"],["Regex `=~`","no","yes"],["Join tests","`[ a ] && [ b ]`","`[[ a && b ]]`"],["Works in `sh` (POSIX)","yes","no (bash only)"]]}},{"id":"d06p03","title":"Disk alert: number tests and elif","type":"script","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The monitoring team wants a simple rule for each server: 90% or more is CRITICAL, 80% or more is WARNING, else OK. The numbers are in `disk-usage.txt` (server name, then percent).","task":["Read the file line by line with `while read -r host pct`.","Use `if`, `elif`, `else` with number tests (`-ge`) to print the level for each server.","Count the CRITICAL servers and print the count at the end.","Read the Mistakes part: why `[ 9 > 10 ]` is dangerous."],"hints":["For numbers use `-eq -ne -lt -le -gt -ge`. `=` and `!=` are for strings.","Test the biggest limit first: `if [ \"$pct\" -ge 90 ]; then ... elif [ \"$pct\" -ge 80 ]; then ... else ... fi`.","Inside `(( ))` normal math works: `(( pct >= 90 ))`."],"solution":["CRIT=0","while read -r host pct; do","  if [ \"$pct\" -ge 90 ]; then","    level=CRITICAL; CRIT=$((CRIT + 1))","  elif [ \"$pct\" -ge 80 ]; then","    level=WARNING","  else","    level=OK","  fi","  printf '%-9s %3s%%  %s\\n' \"$host\" \"$pct\" \"$level\"","done < disk-usage.txt","echo \"critical servers: $CRIT\"","(( CRIT > 0 )) && echo \"page the on-call engineer\""],"explanation":[{"part":"while read -r host pct","meaning":"Read each line; the first word goes to `host`, the rest to `pct`."},{"part":"-ge 90","meaning":"Greater than or equal, for whole numbers."},{"part":"elif","meaning":"\"else if\": checked only when the first test was false."},{"part":"printf '%-9s %3s%%'","meaning":"Formatted print: `%-9s` text left-aligned in 9 characters, `%%` prints a real `%`."},{"part":"(( CRIT > 0 ))","meaning":"Arithmetic test. True (exit 0) when the math result is not zero."}],"expected_output":"web-01     45%  OK\nweb-02     85%  WARNING\ndb-01      92%  CRITICAL\ncache-01    9%  OK\ncritical servers: 1\npage the on-call engineer","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`[ 9 > 10 ]` is not a comparison. `>` is a redirect: it creates a file called `10`, and the test is true.","Using `-gt` with text: `[ OK -gt 5 ]` gives `bash: [: OK: integer expression expected`.","Testing 80 before 90: then 92 matches the WARNING branch first and never becomes CRITICAL."],"checks":[{"run":"[ 9 > 10 ] && echo true; ls 10","expect":"10"},{"run":"[ OK -gt 5 ]","expect":"bash: [: OK: integer expression expected"}],"interview_say":"For numbers I use `-gt`, `-ge`, `-lt` and so on, or `(( ))`. In single brackets `>` is a redirect, not a comparison. I check the highest threshold first in an if/elif chain.","try_yourself":"Run `[ 9 > 10 ] && echo true; ls`. Do you see a file named `10`? Remove it with `rm 10`.","table":{"head":["Numbers","Strings","Meaning"],"rows":[["`-eq`","`=` (or `==` in [[ ]])","equal"],["`-ne`","`!=`","not equal"],["`-lt` / `-gt`","`<` / `>` only in [[ ]]","less / greater"],["`-le` / `-ge`","-","less or equal / greater or equal"]]}},{"id":"d06p04","title":"case: one script for dev, staging and prod","type":"script","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The team has one deploy script for all environments. The first argument decides the server and the number of replicas. Many `if/elif` lines are hard to read; `case` is clearer.","task":["Write `deploy-env.sh` that uses `case \"$1\" in ... esac`.","`dev` or `development`: 1 replica on `dev.local`. `staging`: 2 replicas. `prod` or `production`: 4 replicas, and print a warning.","Any other value: print a usage message to stderr and `exit 2`.","Run it with `dev`, `prod`, `test`, and with no argument. Print the exit code each time."],"hints":["Each branch ends with `;;`. Use `|` for two names: `dev|development)`.","`*)` matches everything else. Put it last.","Usage to stderr: `echo \"usage: $0 dev|staging|prod\" >&2`."],"solution":["cat > deploy-env.sh <<'EOF'","#!/bin/bash","case \"$1\" in","  dev|development) HOST=dev.local;     REPLICAS=1 ;;","  staging)         HOST=staging.local; REPLICAS=2 ;;","  prod|production) HOST=prod.local;    REPLICAS=4","                   echo \"WARNING: deploying to production\" ;;","  *) echo \"usage: $0 dev|staging|prod\" >&2","     exit 2 ;;","esac","echo \"deploy to $HOST with $REPLICAS replicas\"","EOF","for env in dev prod test \"\"; do","  echo \"--- arg: '$env'\"","  bash deploy-env.sh $env; echo \"exit code: $?\"","done"],"explanation":[{"part":"case \"$1\" in","meaning":"Compare the value with each pattern from top to bottom."},{"part":"dev|development)","meaning":"`|` means or: either word matches."},{"part":";;","meaning":"End of a branch. Bash jumps to `esac`."},{"part":"*)","meaning":"Default branch: anything that did not match before."},{"part":">&2","meaning":"Send this message to stderr. Errors and usage messages belong there."},{"part":"exit 2","meaning":"By habit, 2 means \"wrong usage\"; 1 means a general error."}],"expected_output":"--- arg: 'dev'\ndeploy to dev.local with 1 replicas\nexit code: 0\n--- arg: 'prod'\nWARNING: deploying to production\ndeploy to prod.local with 4 replicas\nexit code: 0\n--- arg: 'test'\nusage: deploy-env.sh dev|staging|prod\nexit code: 2\n--- arg: ''\nusage: deploy-env.sh dev|staging|prod\nexit code: 2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Forgetting `;;`: bash stops with `syntax error near unexpected token` and points at the `)` of the next pattern.","Putting `*)` first: it matches everything, so the other branches never run.","Ending with `fi` instead of `esac`. A `case` block always closes with `esac` (case backwards)."],"checks":[{"run":"printf 'case x in\\n a) echo a\\n b) echo b ;;\\nesac\\n' > c.sh; bash c.sh","expect":"syntax error near unexpected token `)'"}],"interview_say":"I use `case` when one value decides between many options, like the environment name. Each pattern ends with `;;`, and `*)` handles wrong input with a usage message and exit code 2.","try_yourself":"Add a branch `[0-9]*)` that prints \"numbers are not environments\". Test with `bash deploy-env.sh 42`."},{"id":"d06p05","title":"Find the bug: the health check script","type":"fix-bug","topic":"Scripting","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`health.sh` should say `log folder OK` and `HTTP OK`, and warn when the retries argument is more than 3. It prints `MISSING`, shows strange errors, and fails when no argument is given.","task":["Run `bash health.sh` (no argument). Read the output and the errors.","Find 3 bugs: a wrong file test, a missing space, and an empty variable.","Fix them. Use `${RETRIES:-0}` to give a default value of 0.","Run `bash health.sh` and `bash health.sh 5`."],"hints":["`logs` is a folder, not a file.","`[` is a command. It needs a space after it, like any command.","With no argument, `$RETRIES` is empty: `[ -gt 3 ]`. A default and quotes fix it."],"solution":["bash health.sh","cat > health.sh <<'EOF'","#!/bin/bash","# Check that the log folder exists and that the last HTTP code is 200.","# Optional argument: number of retries (warn if more than 3).","LOG_DIR=logs","CODE=$(cat last-code.txt)","RETRIES=${1:-0}                     # default 0 when no argument","if [ -d \"$LOG_DIR\" ]; then echo \"log folder OK\"; else echo \"log folder MISSING\"; fi","if [ \"$CODE\" = \"200\" ]; then echo \"HTTP OK\"; else echo \"HTTP FAIL\"; fi","if [ \"$RETRIES\" -gt 3 ]; then echo \"warning: $RETRIES retries\"; fi","EOF","echo \"--- fixed, no argument ---\"","bash health.sh","echo \"--- fixed, 5 retries ---\"","bash health.sh 5"],"explanation":[{"part":"-f → -d","meaning":"Bug 1: `logs` is a folder, so `-f` was false and printed MISSING."},{"part":"[\"$CODE\" → [ \"$CODE\"","meaning":"Bug 2: no space after `[`. Bash looked for a command named `[200`."},{"part":"${1:-0}","meaning":"Bug 3: use `0` when `$1` is empty or missing. Plus quotes around `$RETRIES`."}],"expected_output":"log folder MISSING\nhealth.sh: line 8: [200: command not found\nHTTP FAIL\nhealth.sh: line 9: [: -gt: unary operator expected\n--- fixed, no argument ---\nlog folder OK\nHTTP OK\n--- fixed, 5 retries ---\nlog folder OK\nHTTP OK\nwarning: 5 retries","expect_exit":0,"output_check":true,"verified":true,"mistakes":["The error `health.sh: line 8: [200: command not found` looks like a problem with the number 200. It is really the missing space.","`[ -gt 3 ]` with an empty variable: `health.sh: line 9: [: -gt: unary operator expected`."],"checks":[{"run":"bash health.sh","expect":"health.sh: line 8: [200: command not found"},{"run":"bash health.sh","expect":"health.sh: line 9: [: -gt: unary operator expected"}],"interview_say":"`[` is a command, so it needs spaces around it. I give arguments default values with `${1:-0}` and always quote variables in tests.","try_yourself":"Put `abc` in `last-code.txt`, and change the test to `-eq 200`. Run it. Read the new error."},{"id":"d06p06","title":"Exit codes that CI understands","type":"concept","topic":"Scripting","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Jenkins and GitHub Actions decide green or red only from the exit code of each step. The user learns the common codes and how to return them.","task":["Run `true; echo $?` and `false; echo $?`.","Run a missing command `nosuchcmd; echo $?` and a non-executable file `./app.log; echo $?`.","Run `bash -c 'exit 3'; echo $?` and `bash -c 'exit 300'; echo $?`.","Use `grep -q` (quiet) as a test: `grep -q ERROR app.log && echo \"errors found\"`."],"hints":["0 = success. 1 = general error. 2 = wrong usage.","126 = found but not executable. 127 = command not found. 130 = stopped with Ctrl+C.","Exit codes are 0-255. 300 becomes 300 - 256 = 44."],"solution":["true;  echo \"true:  $?\"","false; echo \"false: $?\"","nosuchcmd; echo \"missing command: $?\"","./app.log; echo \"not executable: $?\"","bash -c 'exit 3';   echo \"exit 3:   $?\"","bash -c 'exit 300'; echo \"exit 300: $?\"","grep -q ERROR app.log && echo \"errors found (grep -q prints nothing, only sets the code)\""],"explanation":[{"part":"0","meaning":"Success."},{"part":"1","meaning":"General failure (for example `false`, or `grep` found nothing)."},{"part":"126 / 127","meaning":"Cannot execute (permission) / command not found."},{"part":"exit 300 → 44","meaning":"Only 8 bits: the code is taken modulo 256."},{"part":"grep -q","meaning":"Quiet: no output, only the exit code (0 = found)."}],"expected_output":"true:  0\nfalse: 1\nbash: nosuchcmd: command not found\nmissing command: 127\nbash: ./app.log: Permission denied\nnot executable: 126\nexit 3:   3\nexit 300: 44\nerrors found (grep -q prints nothing, only sets the code)","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Ending a failing script with `echo \"failed\"` only. `echo` succeeds, so the exit code is 0 and CI shows green. Add `exit 1`.","Using `exit -1`. It becomes 255 and confuses people. Use small positive numbers."],"interview_say":"CI tools look only at the exit code: 0 is success, anything else fails the step. My scripts use `exit 1` for errors, 2 for wrong usage, and `grep -q` or `test` for checks.","try_yourself":"Run `sleep 30`, press `Ctrl+C`, then `echo $?`. You should see 130."},{"id":"d06p07","title":"One-line checks with && and ||","type":"command","topic":"Scripting","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Short guard lines are common at the top of scripts: create a folder only if missing, stop if a tool is not installed, print a message only if errors exist.","task":["Create `backup` only if it does not exist: `[ -d backup ] || mkdir backup`.","Check a tool: `command -v kubectl >/dev/null 2>&1 || echo \"kubectl is not installed\"`.","Print a message only if the log has errors: `grep -q ERROR app.log && echo \"alert: errors in app.log\"`.","Use a guard with exit: `[ -f app.yml ] || { echo \"no app.yml\" >&2; exit 1; }` inside `bash -c`."],"hints":["`A || B`: B runs only when A fails. `A && B`: B runs only when A works.","`command -v name` returns 0 when the command exists.","Group several commands after `||` with `{ ...; }`."],"solution":["[ -d backup ] || mkdir backup","ls -d backup","command -v kubectl >/dev/null 2>&1 || echo \"kubectl is not installed\"","grep -q ERROR app.log && echo \"alert: errors in app.log\"","bash -c '[ -f app.yml ] || { echo \"no app.yml, stopping\" >&2; exit 1; }; echo \"never printed\"'","echo \"guard exit code: $?\""],"explanation":[{"part":"[ -d backup ] || mkdir backup","meaning":"Make the folder only if the test fails. (`mkdir -p` does the same in one step.)"},{"part":"command -v ... >/dev/null 2>&1","meaning":"Check if a tool exists, hide all output."},{"part":"grep -q ... && echo","meaning":"Print only when grep finds something."},{"part":"|| { ...; exit 1; }","meaning":"Guard clause: stop the script early with an error."}],"expected_output":"backup\nkubectl is not installed\nalert: errors in app.log\nno app.yml, stopping\nguard exit code: 1","expect_exit":0,"output_check":true,"output_note":"If `kubectl` is installed on the user's machine, that line prints nothing.","verified":true,"mistakes":["Writing `|| echo \"error\"; exit 1` without braces: `exit 1` runs always, also on success.","Forgetting `>/dev/null 2>&1` with `command -v`: the path is printed when the tool exists."],"interview_say":"I start scripts with guard lines like `command -v docker >/dev/null || { echo \"docker missing\" >&2; exit 1; }`, so the script fails early with a clear message.","try_yourself":"Rewrite the `kubectl` line as an `if ! command -v kubectl ...; then ... fi` block. Which one is easier to read for you?"}],"interview":[{"q":"What is the difference between `[ ]` and `[[ ]]`?","a":"`[ ]` is the test command (POSIX), so variables must be quoted. `[[ ]]` is a bash keyword: it is safe with empty variables and supports patterns `==` and regex `=~`.","topic":"Scripting"},{"q":"How do you check if a file exists and is not empty?","a":"`[ -s file ]`. Use `-f` for a regular file, `-d` for a folder, and `-e` for any type.","topic":"Scripting"},{"q":"How do you compare numbers in bash?","a":"With `-eq -ne -lt -le -gt -ge` inside `[ ]`, or with normal operators inside `(( ))`, for example `(( count > 5 ))`.","topic":"Scripting"},{"q":"What does exit code 127 mean? And 126?","a":"127: command not found. 126: the file was found but cannot be executed (for example no `x` permission).","topic":"Scripting"},{"q":"When do you use `case` instead of `if`?","a":"When one value is compared with many options, like an environment name or a command argument. It is shorter and easier to read.","topic":"Scripting"}],"recap":[{"cmd":"if / elif / else / fi","meaning":"Run code depending on a test","example":"if [ -f app.yml ]; then ...; fi","topic":"Scripting"},{"cmd":"[ -f / -d / -e ]","meaning":"File / folder / exists","example":"[ -d logs ] || mkdir logs","topic":"Scripting"},{"cmd":"[ -s / -r / -w / -x ]","meaning":"Not empty / readable / writable / executable","example":"[ -x deploy.sh ]","topic":"Scripting"},{"cmd":"[ -z / -n ]","meaning":"String is empty / not empty","example":"[ -z \"$1\" ] && echo usage","topic":"Scripting"},{"cmd":"-eq -ne -lt -le -gt -ge","meaning":"Compare whole numbers","example":"[ \"$pct\" -ge 90 ]","topic":"Scripting"},{"cmd":"[[ ]]","meaning":"Bash test: safe, patterns, regex","example":"[[ $BRANCH == release/* ]]","topic":"Scripting"},{"cmd":"=~","meaning":"Regex match inside [[ ]]","example":"[[ $v =~ ^[0-9]+$ ]]","topic":"Scripting"},{"cmd":"(( ))","meaning":"Arithmetic test","example":"(( errors > 0 ))","topic":"Scripting"},{"cmd":"case ... esac","meaning":"Choose by pattern","example":"case \"$1\" in dev) ...;; esac","topic":"Scripting"},{"cmd":"${1:-default}","meaning":"Use a default if empty","example":"RETRIES=${1:-0}","topic":"Scripting"},{"cmd":"exit N","meaning":"End the script with an exit code","example":"exit 1","topic":"Scripting"},{"cmd":"grep -q","meaning":"Quiet grep: only the exit code","example":"grep -q ERROR app.log && alert","topic":"Scripting"},{"cmd":"command -v","meaning":"Check that a tool is installed","example":"command -v docker >/dev/null || exit 1","topic":"Scripting"}],"coverage":[{"item":"if / elif / else","problems":["d06p01","d06p03","d06p05"]},{"item":"[ ] vs [[ ]]","problems":["d06p02","d06p05"]},{"item":"File tests -f -d -e -r -w -x -s","problems":["d06p01","d06p05"]},{"item":"String tests","problems":["d06p02","d06p05"]},{"item":"Number tests","problems":["d06p03","d06p05"]},{"item":"case","problems":["d06p04"]},{"item":"&& and ||","problems":["d06p07","d06p03"]},{"item":"Exit codes","problems":["d06p01","d06p04","d06p06"]}],"reset":"rm -rf ~/bash-practice/day06"},{"day":7,"week":1,"review_day":true,"title":"Week 1 review and mini mock test","goal":"Use Days 1-6 together in new situations: a real incident, a bug hunt, a one-liner to script, and one small script that combines everything.","minutes":90,"setup":["mkdir -p ~/bash-practice/day07 && cd ~/bash-practice/day07","# P1: an incident: the to-do backend does not start","mkdir -p incident/releases/v2 incident/logs","printf '#!/bin/bash\\necho \"todo-backend v2 started\" >> logs/app.log && echo \"started OK\"\\n' > incident/releases/v2/start.sh","chmod 755 incident/releases/v2/start.sh","ln -s releases/v3 incident/current","printf 'DB_PASSWORD=change-me\\n' > incident/.env","chmod 644 incident/.env","chmod 555 incident/logs","# P3: log folder with a space in the name, and a broken rotate script","mkdir -p \"app logs\"","touch \"app logs/api.log\" \"app logs/web.log\" \"app logs/worker 2.log\"","printf '%s\\n' '#!/bin/bash' '# Usage: rotate-logs.sh <log-folder>' '# Move every .log file into <log-folder>/old/ and write a summary to rotate.log' 'DIR=$1' 'if [ -z \"$DIR\" ]; then echo \"usage: rotate-logs.sh <log-folder>\"; exit 0; fi' 'mkdir $DIR/old' 'for f in $DIR/*.log; do' '  mv $f $DIR/old/' 'done' 'echo \"moved $(ls \"$DIR/old\" | wc -l) files\" > rotate.log' > rotate-logs.sh","# P4: two nginx configs","printf '%s\\n' 'server {' '    listen 443 ssl;' '    server_name todo.example.com;' '}' > nginx-tls.conf","printf '%s\\n' 'server {' '    listen 80;' '    server_name todo.example.com;' '}' > nginx-plain.conf","# P5: one good and one bad release folder","for r in rel-good rel-bad; do","  mkdir -p \"$r\"","  printf '#!/bin/bash\\necho start\\n' > \"$r/start.sh\"","  printf 'DB_PASSWORD=change-me\\n' > \"$r/.env\"","done","echo '3.0.0' > rel-good/VERSION","chmod 755 rel-good/start.sh; chmod 600 rel-good/.env",": > rel-bad/VERSION","chmod 644 rel-bad/start.sh; chmod 664 rel-bad/.env","# P6: a small access log","printf '%s\\n' '10.0.0.1 GET /api/todos 200' '10.0.0.2 GET /api/todos 500' '10.0.0.1 POST /api/todos 201' '10.0.0.3 GET /health 200' '10.0.0.2 GET /api/todos 500' '10.0.0.1 GET /api/todos 200' > access.log","cd ~/bash-practice/day07"],"warmup":[{"q":"Why does `[ $BRANCH = main ]` fail when BRANCH is empty?","a":"The empty variable disappears, so `[` gets `= main`: `unary operator expected`. Quote it or use `[[ ]]`.","from_day":6},{"q":"What does `> file 2>&1` do?","a":"Sends stdout to the file, then stderr to the same place. Both end up in the file.","from_day":4},{"q":"What does `chmod 640` give to owner, group and others?","a":"Owner rw- (6), group r-- (4), others --- (0).","from_day":3},{"q":"How do you replace an existing symlink `current` in one command?","a":"`ln -sfn releases/v2 current`","from_day":1}],"problems":[{"id":"d07p01","title":"Incident: the backend does not start","type":"incident","topic":"Troubleshooting","minutes":13,"optional":false,"core":true,"workdir":"incident","situation":"Monday morning. The to-do backend does not start after the weekend deploy. Running `./current/start.sh` says `No such file or directory`. The security team also says the password file is too open. Find and fix three problems.","task":["In `incident`, run `./current/start.sh`. Read the error. Check the link with `ls -l current` and `ls releases`.","Point `current` to the release that exists. Run the start script again.","The script now fails to write its log. Check `ls -ld logs` and fix the folder so the owner can write.","Run the start script again until it prints `started OK`. Show `logs/app.log`.","Fix the permission of `.env` so only the owner can read it. Show it with `stat`."],"hints":["`current` points to `releases/v3`, but only `v2` exists.","`ln -sfn releases/v2 current` replaces the link. `logs` is 555: no `w` for anyone.","`chmod 755 logs` (or `chmod u+w logs`) and `chmod 600 .env`."],"solution":["./current/start.sh || echo \"exit code: $?\"","ls releases","readlink current                  # points to releases/v3, which does not exist","ln -sfn releases/v2 current       # problem 1: broken symlink","./current/start.sh || echo \"exit code: $?\"","stat -c '%a %n' logs              # 555: nobody can write","chmod 755 logs                    # problem 2: folder not writable","./current/start.sh","cat logs/app.log","chmod 600 .env                    # problem 3: secret readable by others","stat -c '%a %n' .env"],"explanation":[{"part":"No such file or directory","meaning":"The symlink `current` points to `releases/v3`, which does not exist (a broken link)."},{"part":"ln -sfn releases/v2 current","meaning":"Replace the link in one step (Day 1)."},{"part":"logs/app.log: Permission denied","meaning":"The folder `logs` is 555. To create a file inside a folder, the user needs `w` on the folder (Day 3)."},{"part":">> logs/app.log && echo","meaning":"The script appends to the log, then prints OK only if that worked (Day 4)."},{"part":"chmod 600 .env","meaning":"Secrets: only the owner can read and write."}],"expected_output":"bash: ./current/start.sh: No such file or directory\nexit code: 127\nv2\nreleases/v3\n./current/start.sh: line 2: logs/app.log: Permission denied\nexit code: 1\n555 logs\nstarted OK\ntodo-backend v2 started\n600 .env","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Running `ln -s releases/v2 current` without `-fn`: the old link is not replaced (`ln: failed to create symbolic link 'current': File exists`).","Fixing with `chmod 777 logs`. It works, but every user can now delete the logs. Use 755.","Stopping after the first fix. In incidents there is often more than one problem. Run the command again after each fix."],"checks":[{"run":"ln -s releases/v2 current","expect":"ln: failed to create symbolic link 'current': File exists"}],"interview_say":"I read the error, fix one thing, and run again. Here the `current` symlink was broken, the logs folder was not writable, and the `.env` file was too open.","try_yourself":"Write the three checks as one script that prints OK or FAIL for each (Day 6 file tests: `-e current`, `-w logs`, and the `stat` number for `.env`)."},{"id":"d07p02","title":"Predict the output: a mixed quiz","type":"predict","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"This is like a written interview test. Each line mixes quotes, variables, redirects and exit codes. The user writes the answers on paper first, then runs the lines one by one.","task":["`N=5; echo \"$N\" '$N' $((N * 2))`","`echo hello > a.txt; echo world > a.txt; cat a.txt`","`ls /nope 2> /dev/null; echo \"exit=$?\"`","`X=1; ( X=2; echo \"in=$X\" ); echo \"out=$X\"`","`[ -d /tmp ] && echo dir || echo nodir` and `[[ abc == a* ]] && echo match`","`echo {a,b}-{1,2}`"],"hints":["Single quotes stop replacement. `$(( ))` does math.","`>` overwrites. `2>` sends only errors. `ls` gives exit code 2 for a missing file.","A subshell `( )` has its own copy of variables. Braces make all combinations."],"solution":["N=5; echo \"$N\" '$N' $((N * 2))","echo hello > a.txt; echo world > a.txt; cat a.txt","ls /nope 2> /dev/null; echo \"exit=$?\"","X=1; ( X=2; echo \"in=$X\" ); echo \"out=$X\"","[ -d /tmp ] && echo dir || echo nodir","[[ abc == a* ]] && echo match","echo {a,b}-{1,2}"],"explanation":[{"part":"\"$N\" '$N' $((N * 2))","meaning":"5, then the literal text $N, then 10."},{"part":"> twice","meaning":"The second `>` replaces the first line: only `world` stays."},{"part":"exit=2","meaning":"The error is hidden, but the exit code is still 2."},{"part":"in=2 / out=1","meaning":"The subshell change does not come back."},{"part":"{a,b}-{1,2}","meaning":"Brace expansion makes every combination: a-1 a-2 b-1 b-2."}],"expected_output":"5 $N 10\nworld\nexit=2\nin=2\nout=1\ndir\nmatch\na-1 a-2 b-1 b-2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Thinking `2> /dev/null` changes the exit code. It only hides the message.","Expecting `out=2`. Changes inside `( )` are lost when the subshell ends."],"interview_say":"I can predict this because I know the rules: single quotes are literal, `>` overwrites, `2>` only moves errors, and a subshell has its own copy of variables.","try_yourself":"Write 3 new quiz lines for a friend, using `>>`, `tee` and `case`. Run them to check your own answers."},{"id":"d07p03","title":"Find the bug: the log rotate script","type":"fix-bug","topic":"Scripting","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`rotate-logs.sh` moves all `.log` files of a folder into `old/`. It works on the test server, but fails on the real one, where the folder is called `app logs`. It also returns 0 when the user forgets the argument, so Jenkins shows green.","task":["Run `bash rotate-logs.sh \"app logs\"`. Read the errors.","Run `bash rotate-logs.sh; echo $?` with no argument. Is the exit code correct?","Find 4 bugs: the usage exit code and stream, `mkdir`, and two quoting problems.","Fix them. Run the fixed script **twice** on `\"app logs\"` (the second run must not fail). Check with `ls -R \"app logs\"` and `cat rotate.log`."],"hints":["Usage errors: message to stderr (`>&2`) and `exit 2`.","`mkdir` without `-p` fails when `old` already exists (second run).","Quote `\"$DIR\"/old` and `\"$f\"`. Keep the `*.log` outside the quotes so the wildcard still works: `\"$DIR\"/*.log`."],"solution":["bash rotate-logs.sh \"app logs\"","bash rotate-logs.sh; echo \"exit code: $?\"","rmdir app                          # the broken run made a stray folder \"app\"","cat > rotate-logs.sh <<'EOF'","#!/bin/bash","# Usage: rotate-logs.sh <log-folder>","# Move every .log file into <log-folder>/old/ and write a summary to rotate.log","DIR=$1","if [ -z \"$DIR\" ]; then echo \"usage: rotate-logs.sh <log-folder>\" >&2; exit 2; fi","mkdir -p \"$DIR/old\"","for f in \"$DIR\"/*.log; do","  [ -e \"$f\" ] || continue          # no .log files: the pattern stays as text","  mv \"$f\" \"$DIR/old/\"","done","echo \"moved $(ls \"$DIR/old\" | wc -l) files\" > rotate.log","EOF","bash rotate-logs.sh; echo \"exit code: $?\"","bash rotate-logs.sh \"app logs\" && bash rotate-logs.sh \"app logs\"; echo \"exit code: $?\"","ls -R \"app logs\"","cat rotate.log"],"explanation":[{"part":">&2; exit 2","meaning":"Bug 1: usage went to stdout with exit 0. Now it goes to stderr and returns 2 (wrong usage)."},{"part":"mkdir -p \"$DIR/old\"","meaning":"Bug 2+3: without quotes, `mkdir $DIR/old` became `mkdir app logs/old`. It made a stray folder `app` and failed on `logs/old`. Without `-p` it also fails on the second run."},{"part":"\"$DIR\"/*.log","meaning":"Quote the variable part only. The `*` must be outside quotes to match files."},{"part":"mv \"$f\"","meaning":"Bug 4: `worker 2.log` has a space; without quotes `mv` got two names."},{"part":"[ -e \"$f\" ] || continue","meaning":"If no file matches, the loop gets the text `app logs/*.log`. Skip it."}],"expected_output":"mkdir: cannot create directory ‘logs/old’: No such file or directory\nmv: target 'logs/old/': No such file or directory\nmv: target 'logs/old/': No such file or directory\nls: cannot access 'app logs/old': No such file or directory\nusage: rotate-logs.sh <log-folder>\nexit code: 0\nusage: rotate-logs.sh <log-folder>\nexit code: 2\nexit code: 0\n'app logs':\nold\n\n'app logs/old':\n api.log   web.log  'worker 2.log'\nmoved 3 files","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Quoting the wildcard too: `\"$DIR/*.log\"` looks for a file really named `*.log`.","Testing only once. Many scripts break on the second run (not idempotent). Day 22 covers this."],"interview_say":"I quote every variable, use `mkdir -p` so a script can run twice, and send usage errors to stderr with a non-zero exit code so CI fails correctly.","try_yourself":"Run `shellcheck rotate-logs.sh` on the old version (copy it from the setup line). How many warnings does it show?"},{"id":"d07p04","title":"Convert a one-liner into a safe script","type":"convert","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A teammate checks TLS with this one-liner: `grep -q \"listen 443\" nginx.conf && echo \"TLS on\" || echo \"TLS off\"`. The team wants a script for CI: it takes the file as an argument, checks the file exists, and returns exit code 0 (TLS on), 1 (TLS off) or 2 (bad usage).","task":["Create `check-tls.sh`. If no argument is given, print usage to stderr and exit 2.","If the file does not exist (`-f`), print an error to stderr and exit 2.","Use `grep -q` in an `if`. Print `TLS on: <file>` and exit 0, or `TLS off: <file>` and exit 1.","Test with `nginx-tls.conf`, `nginx-plain.conf`, `missing.conf`, and no argument. Print the exit code after each run."],"hints":["Start with `CONF=$1` and `[ -n \"$CONF\" ] || { echo \"usage: ...\" >&2; exit 2; }`.","Use a regex that allows more spaces: `grep -Eq 'listen[[:space:]]+443' \"$CONF\"`.","Loop for the test: `for f in nginx-tls.conf nginx-plain.conf missing.conf \"\"; do bash check-tls.sh $f; echo \"exit: $?\"; done`."],"solution":["cat > check-tls.sh <<'EOF'","#!/bin/bash","# Usage: check-tls.sh <nginx.conf>   exit 0 = TLS on, 1 = TLS off, 2 = usage error","CONF=$1","[ -n \"$CONF\" ] || { echo \"usage: check-tls.sh <nginx.conf>\" >&2; exit 2; }","[ -f \"$CONF\" ]  || { echo \"error: $CONF not found\" >&2; exit 2; }","if grep -Eq 'listen[[:space:]]+443' \"$CONF\"; then","  echo \"TLS on: $CONF\"","  exit 0","else","  echo \"TLS off: $CONF\"","  exit 1","fi","EOF","for f in nginx-tls.conf nginx-plain.conf missing.conf \"\"; do","  bash check-tls.sh $f; echo \"exit: $?\"","done"],"explanation":[{"part":"[ -n \"$CONF\" ] || { ...; exit 2; }","meaning":"Guard: stop early with usage when the argument is missing."},{"part":"[ -f \"$CONF\" ]","meaning":"Check the file exists before reading it."},{"part":"grep -Eq","meaning":"`-E` extended regex, `-q` quiet (only the exit code)."},{"part":"[[:space:]]+","meaning":"One or more spaces or tabs. More robust than one exact space."},{"part":"exit 0 / 1 / 2","meaning":"Different codes so CI can tell \"off\" from \"broken input\"."}],"expected_output":"TLS on: nginx-tls.conf\nexit: 0\nTLS off: nginx-plain.conf\nexit: 1\nerror: missing.conf not found\nexit: 2\nusage: check-tls.sh <nginx.conf>\nexit: 2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Keeping `A && B || C` in the script: if `B` fails, `C` also runs. An `if` block is clearer.","Printing errors to stdout. Other tools that read stdout get confused. Errors go to `>&2`."],"interview_say":"When I turn a one-liner into a script, I add argument checks, file checks, clear messages on stderr, and meaningful exit codes, so it works well in CI.","try_yourself":"Make the script accept many files: loop over `\"$@\"` and exit 1 if any file has TLS off."},{"id":"d07p05","title":"Mini project: release-check.sh","type":"script","topic":"Scripting","minutes":15,"optional":false,"core":false,"workdir":".","situation":"Before a release goes live, a script must check the release folder and write a short report file for the team chat. This combines Week 1: arguments, file tests, permissions, variables, a here-doc, redirects and exit codes.","task":["Write `release-check.sh <folder>`. Check the argument and that the folder exists (`-d`).","Check: `VERSION` is not empty (`-s`), `start.sh` is executable (`-x`), `.env` has permission 600 (`stat -c %a`).","Count problems. Write `report.txt` with a here-doc: folder, version, number of problems, and the result PASS or FAIL.","Print the report. Exit 0 if no problems, else exit 1.","Run it on `rel-good` and `rel-bad` and print the exit code each time."],"hints":["Keep a variable `PROBLEMS=0` and a list `NOTES=\"\"`. Add to both when a check fails.","Version: `VERSION=$(cat \"$DIR/VERSION\" 2>/dev/null)` and use `${VERSION:-unknown}` in the report.","Permission: `[ \"$(stat -c %a \"$DIR/.env\")\" = 600 ]`."],"solution":["cat > release-check.sh <<'EOF'","#!/bin/bash","# Usage: release-check.sh <release-folder>","DIR=$1","[ -n \"$DIR\" ] || { echo \"usage: release-check.sh <release-folder>\" >&2; exit 2; }","[ -d \"$DIR\" ] || { echo \"error: $DIR is not a folder\" >&2; exit 2; }","PROBLEMS=0","NOTES=\"\"","fail() { PROBLEMS=$((PROBLEMS + 1)); NOTES=\"$NOTES- $1\"$'\\n'; }","[ -s \"$DIR/VERSION\" ] || fail \"VERSION is missing or empty\"","[ -x \"$DIR/start.sh\" ] || fail \"start.sh is not executable\"","[ \"$(stat -c %a \"$DIR/.env\")\" = 600 ] || fail \".env permission is $(stat -c %a \"$DIR/.env\"), must be 600\"","VERSION=$(cat \"$DIR/VERSION\" 2>/dev/null)","if [ \"$PROBLEMS\" -eq 0 ]; then RESULT=PASS; else RESULT=FAIL; fi","cat > report.txt <<REPORT","Release check: $DIR","Version:  ${VERSION:-unknown}","Problems: $PROBLEMS","${NOTES}Result:   $RESULT","REPORT","cat report.txt","[ \"$RESULT\" = PASS ]","EOF","bash release-check.sh rel-good; echo \"exit code: $?\"","echo","bash release-check.sh rel-bad; echo \"exit code: $?\""],"explanation":[{"part":"guards with exit 2","meaning":"Wrong usage stops the script before any check."},{"part":"fail() { ... }","meaning":"A tiny function: count the problem and remember the message (functions are Day 9)."},{"part":"$'\\n'","meaning":"A real new line character, so each note is on its own line."},{"part":"cat > report.txt <<REPORT","meaning":"Here-doc with variables (unquoted delimiter), Day 4."},{"part":"${VERSION:-unknown}","meaning":"Default text when the version is empty."},{"part":"[ \"$RESULT\" = PASS ]","meaning":"The last command decides the exit code of the script: 0 for PASS, 1 for FAIL."}],"expected_output":"Release check: rel-good\nVersion:  3.0.0\nProblems: 0\nResult:   PASS\nexit code: 0\n\nRelease check: rel-bad\nVersion:  unknown\nProblems: 3\n- VERSION is missing or empty\n- start.sh is not executable\n- .env permission is 664, must be 600\nResult:   FAIL\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Indenting the here-doc lines in the real file: the spaces go into the report. Keep report lines at the start of the line (or use `<<-` with tabs).","Calling `stat` on a missing `.env`: `stat: cannot statx 'rel-x/.env': No such file or directory` (Ubuntu 22.04 says `cannot stat`). Check `-e` first in a real script."],"checks":[{"run":"stat -c %a rel-x/.env","expect":"stat: cannot statx 'rel-x/.env': No such file or directory"}],"interview_say":"My release check validates input, runs each check, collects problems, writes a report with a here-doc, and returns 0 or 1 so the pipeline can stop a bad release.","try_yourself":"Add a fourth check: the folder must have a `README.md`. Then add `--quiet` as a second argument that hides the report but keeps the exit code."},{"id":"d07p06","title":"Status code summary from an access log","type":"command","topic":"Text","minutes":10,"optional":true,"core":false,"workdir":".","situation":"The team lead asks for a quick summary in the chat: how many requests had each status code, and which IP made the most 500 errors. The log is `access.log` (IP, method, URL, status).","task":["Print the count of each status code with `awk '{print $4}'`, `sort` and `uniq -c`.","Save that summary to `status.txt` and show it on the screen at the same time (`tee`).","Find the IPs with 500 errors and count them per IP."],"hints":["`awk '{print $4}' access.log` prints the 4th word of each line (awk is Day 11, here only this one form).","`... | sort | uniq -c | tee status.txt`","`grep ' 500$' access.log | awk '{print $1}' | sort | uniq -c`"],"solution":["awk '{print $4}' access.log | sort | uniq -c | tee status.txt","echo \"--- 500 errors per IP ---\"","grep ' 500$' access.log | awk '{print $1}' | sort | uniq -c"],"explanation":[{"part":"awk '{print $4}'","meaning":"Print field 4 (the status code). Fields are split by spaces."},{"part":"sort | uniq -c","meaning":"Group equal lines and count them (Day 2)."},{"part":"tee status.txt","meaning":"Show and save at the same time (Day 4)."},{"part":"' 500$'","meaning":"Only lines that end with ` 500`."}],"expected_output":"      3 200\n      1 201\n      2 500\n--- 500 errors per IP ---\n      2 10.0.0.2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using double quotes around the awk code: `awk \"{print $4}\"`. Bash replaces `$4` (empty) first, so awk prints whole lines.","`grep 500` without anchors also matches `/api/500-items` or a size of 1500 bytes."],"checks":[{"run":"awk \"{print $4}\" access.log | head -n 1","expect":"10.0.0.1 GET /api/todos 200"}],"interview_say":"To summarise a log I cut the field I need, then `sort | uniq -c`. I anchor grep patterns to avoid false matches.","try_yourself":"Add `| sort -rn | head -n 1` to get only the most common status code."}],"interview":[{"q":"Rapid 1: Absolute vs relative path?","a":"Absolute starts at `/` and works from anywhere. Relative starts from the current folder.","topic":"Files"},{"q":"Rapid 2: Hard link vs symlink?","a":"Hard link = second name for the same data (survives delete). Symlink = path to a target (breaks if the target is deleted, can point to folders).","topic":"Files"},{"q":"Rapid 3: How do you show the last 50 lines of a log and keep watching?","a":"`tail -n 50 -f app.log`","topic":"Text"},{"q":"Rapid 4: What is 644? What is 755?","a":"644 = rw-r--r-- (files, configs). 755 = rwxr-xr-x (scripts, folders).","topic":"Permissions"},{"q":"Rapid 5: Does root obey file permissions?","a":"Mostly no. Root ignores read and write permissions. 'Others' means other normal users, not root.","topic":"Permissions"},{"q":"Rapid 6: `>` vs `>>`?","a":"`>` overwrites, `>>` appends.","topic":"Redirection"},{"q":"Rapid 7: How do you hide all output of a command?","a":"`cmd > /dev/null 2>&1`","topic":"Redirection"},{"q":"Rapid 8: Single vs double quotes?","a":"Single: literal, nothing replaced. Double: variables and `$( )` replaced, spaces kept together.","topic":"Variables"},{"q":"Rapid 9: What does `export` do?","a":"It makes a variable visible to child processes (scripts and programs started from this shell).","topic":"Variables"},{"q":"Rapid 10: What exit code means success, and how do you see it?","a":"0 means success. `echo $?` right after the command shows it.","topic":"Scripting"}],"recap":[{"cmd":"readlink","meaning":"Show where a symlink points (find broken links)","example":"readlink current","topic":"Troubleshooting"},{"cmd":"ls -ld folder","meaning":"Permissions of the folder itself, not its content","example":"ls -ld logs","topic":"Troubleshooting"},{"cmd":"stat -c %a","meaning":"Permission as a number (for script checks)","example":"[ \"$(stat -c %a .env)\" = 600 ]","topic":"Troubleshooting"},{"cmd":"\"$DIR\"/*.log","meaning":"Quote the variable, keep the wildcard outside","example":"for f in \"$DIR\"/*.log; do ...","topic":"Scripting"},{"cmd":">&2; exit 2","meaning":"Usage error to stderr with exit code 2","example":"echo \"usage: ...\" >&2; exit 2","topic":"Scripting"},{"cmd":"grep -Eq","meaning":"Quiet extended-regex test","example":"grep -Eq 'listen[[:space:]]+443' nginx.conf","topic":"Text"},{"cmd":"awk '{print $N}'","meaning":"Print field number N","example":"awk '{print $4}' access.log","topic":"Text"}],"coverage":[{"item":"Files and links (Day 1)","problems":["d07p01","d07p02"]},{"item":"Reading and searching (Day 2)","problems":["d07p04","d07p06"]},{"item":"Permissions (Day 3)","problems":["d07p01","d07p05"]},{"item":"Redirection and pipes (Day 4)","problems":["d07p02","d07p03","d07p06"]},{"item":"Variables and quoting (Day 5)","problems":["d07p02","d07p03"]},{"item":"Conditions and exit codes (Day 6)","problems":["d07p03","d07p04","d07p05"]},{"item":"One small script that combines everything","problems":["d07p05"]},{"item":"10 rapid interview questions","problems":[]}],"reset":"rm -rf ~/bash-practice/day07"},{"day":8,"week":2,"title":"Loops and arrays","goal":"Repeat work over servers, files and lines safely with for, while and until, and keep lists in arrays.","minutes":90,"setup":["mkdir -p ~/bash-practice/day08 && cd ~/bash-practice/day08","# P1: inventory file with comments, an empty line, and an END marker","printf '%s\\n' '# host,port,env' 'web-01,80,prod' 'web-02,80,prod' '' '# staging below' 'api-stg,8080,staging' 'END' 'old-01,22,retired' > inventory.csv","# P2: logs to loop over","mkdir -p logs","printf 'a\\nb\\n' > logs/api.log","printf 'a\\nb\\nc\\n' > logs/web.log","printf 'a\\n' > \"logs/worker 2.log\"","# P5: broken loop script, with a Windows path in the input","printf '%s\\n' 'C:\\Users\\wicky\\todo-app' '/var/log/todo' '  /opt/todo/config' > paths.txt","printf '%s\\n' '#!/bin/bash' '# Print the line count of every .log file in logs/,' '# then print each path in paths.txt exactly as written, and count them.' 'COUNT=0' 'for f in $(ls logs/*.log); do' '  echo \"$f: $(wc -l < \"$f\") lines\"' 'done' 'cat paths.txt | while read p; do' '  echo \"path: [$p]\"' '  COUNT=$((COUNT + 1))' 'done' 'echo \"paths read: $COUNT\"' > count-loop.sh","# P6: health check results","printf '%s\\n' 'web-01 OK' 'web-02 SKIP' 'web-03 OK' 'db-01 FAIL' 'db-02 OK' > results.txt","cd ~/bash-practice/day08"],"warmup":[{"q":"What is the difference between `[ ]` and `[[ ]]` with an empty variable?","a":"`[ $x = a ]` fails with `unary operator expected`. `[[ $x = a ]]` works, because `[[ ]]` does not split variables.","from_day":6},{"q":"Which test checks that a file exists and is not empty?","a":"`[ -s file ]`","from_day":6},{"q":"What is wrong with `APP = todo`?","a":"Spaces around `=`. Bash runs `APP` as a command: `APP: command not found`. Write `APP=todo`.","from_day":5},{"q":"Which exit code means \"command not found\"?","a":"127. (126 = found but not executable.)","from_day":6}],"problems":[{"id":"d08p01","title":"Read an inventory file line by line","type":"script","topic":"Scripting","minutes":13,"optional":false,"core":true,"workdir":".","situation":"An Ansible-style inventory `inventory.csv` lists servers as `host,port,env`. It has comment lines (`#`), an empty line, and an `END` marker; lines after `END` are retired servers. The user must print one line per real server.","task":["Read the file with `while IFS=, read -r host port env; do ... done < inventory.csv`.","Skip empty lines and lines that start with `#` (use `continue`).","Stop the loop at the line `END` (use `break`).","Print `HOST:PORT (ENV)` for each server, and a count at the end."],"hints":["`IFS=,` splits each line at commas. `-r` keeps backslashes as they are.","Skip test: `[[ -z $host || $host == \\#* ]] && continue`.","Stop test: `[[ $host == END ]] && break`. Use `< inventory.csv` after `done`, not `cat |`."],"solution":["COUNT=0","while IFS=, read -r host port env; do","  [[ -z $host || $host == \\#* ]] && continue   # empty line or comment","  [[ $host == END ]] && break                   # stop reading here","  echo \"$host:$port ($env)\"","  COUNT=$((COUNT + 1))","done < inventory.csv","echo \"servers: $COUNT\""],"explanation":[{"part":"while IFS=, read -r a b c","meaning":"Read one line each time. `IFS=,` = split at commas, only for this `read`."},{"part":"-r","meaning":"Raw: a backslash `\\` stays a backslash. Always use `-r`."},{"part":"continue","meaning":"Skip the rest of this loop round and read the next line."},{"part":"break","meaning":"Leave the loop completely."},{"part":"\\#*","meaning":"A pattern for \"starts with #\". The `\\` stops `#` from starting a comment."},{"part":"done < inventory.csv","meaning":"The loop reads from the file. The loop stays in the main shell, so `COUNT` keeps its value."}],"expected_output":"web-01:80 (prod)\nweb-02:80 (prod)\napi-stg:8080 (staging)\nservers: 3","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `for line in $(cat inventory.csv)`: it splits at every space and new line, not per line.","`cat inventory.csv | while read ...`: the loop runs in a subshell, so `COUNT` is 0 after the loop (see P5).","Forgetting the last line: if the file has no new line at the end, `read` fails on it. Use `while IFS=, read -r a b c || [[ -n $a ]]`."],"interview_say":"To read a file line by line I use `while IFS= read -r line; do ...; done < file`. `-r` keeps backslashes, `IFS` controls splitting, and redirecting the file keeps variables in the main shell.","try_yourself":"Change the loop to collect only `prod` servers into one line: `web-01 web-02`."},{"id":"d08p02","title":"Four kinds of for loops","type":"command","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The user needs loops for daily tasks: run a command on three web servers, retry a step 3 times, and count lines in every log file, even when a file name has a space.","task":["List loop: `for host in web-01 web-02 db-01; do echo \"ssh $host uptime\"; done` (dry run).","Brace range: loop over `web-{01..03}`.","C-style loop: `for ((i = 1; i <= 3; i++))` and print `attempt $i of 3`.","File loop: `for f in logs/*.log` and print the name and line count. Quote `\"$f\"`."],"hints":["`{01..03}` keeps the leading zero: 01 02 03.","In `(( ))` no `$` is needed: `((i++))`.","Let bash expand the wildcard: `for f in logs/*.log`, never `$(ls logs/*.log)`."],"solution":["for host in web-01 web-02 db-01; do","  echo \"ssh $host uptime\"            # dry run: print the command","done","for host in web-{01..03}; do echo \"check $host\"; done","for ((i = 1; i <= 3; i++)); do echo \"attempt $i of 3\"; done","for f in logs/*.log; do","  echo \"$f: $(wc -l < \"$f\") lines\"","done"],"explanation":[{"part":"for x in a b c","meaning":"Run once for each word in the list."},{"part":"web-{01..03}","meaning":"Br
