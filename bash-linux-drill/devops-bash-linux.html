:"Loop over all keys in END."},{"part":"| sort","meaning":"awk gives keys in random order. Sort for a stable report."}],"expected_output":"EC2 12.50\nS3 1.20\nEC2 12.50\nRDS 8.00\nS3 1.30\nEC2 13.00\n=== total per service ===\nEC2   38.00\nRDS    8.00\nS3     2.50\n=== grand total ===\n48.50 USD","expect_exit":0,"output_check":true,"verified":true,"mistakes":["No `-F,`: the whole line is `$1`, so `$2` and `$3` are empty and all sums are 0.","Not skipping the header: `cost` is added as 0, and `service` appears as a key in the report.","CSV with quoted commas (`\"Smith, John\"`) breaks `-F,`. For real CSV files, use a proper tool (Python, `csvkit`)."],"interview_say":"For a quick CSV report I use `awk -F,` with `NR > 1` to skip the header and an array like `sum[$2] += $3` to group values, then sort the output.","try_yourself":"Add the number of rows per service: `cnt[$2]++`, and print `service total count`."},{"id":"d11p05","title":"Find the bug: the sed and awk report","type":"fix-bug","topic":"Text","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`report.sh` should print `app.conf` with a new log path, and the name and role of every user. sed fails with a strange error, and awk stops with a syntax error.","task":["Run `bash report.sh` and read the errors and the output.","Find 4 bugs: the sed delimiter, the awk quotes, the field separator, and the header.","Fix them. The sed output must show `log.path=/data/logs/todo/app.log`, and awk must print 3 lines: `pasindu associate`, `nimal senior`, `kavya lead`."],"hints":["The variables contain `/`, which ends the `s/.../.../` early. Use `|`.","awk code in double quotes: bash replaces `$1` and `$3` (empty) before awk starts.","Add `-F,` and the condition `NR > 1`. Pass shell values to awk with `-v` if needed."],"solution":["bash report.sh","echo \"--- fixed ---\"","cat > report.sh <<'EOF'","#!/bin/bash","# 1) Print app.conf with the log path /var/log/todo changed to /data/logs/todo (no edit)","# 2) Print name and role (columns 1 and 3) of each user in users.csv (comma separated), no header","OLD=/var/log/todo","NEW=/data/logs/todo","sed \"s|$OLD|$NEW|\" app.conf | grep log.path","awk -F, 'NR > 1 {print $1, $3}' users.csv","EOF","bash report.sh"],"explanation":[{"part":"sed \"s|$OLD|$NEW|\"","meaning":"Bug 1: with `/` as delimiter, the `/` inside `/var/log/todo` ended the pattern. Double quotes are right here, so bash puts the variables in."},{"part":"awk '...'","meaning":"Bug 2: in double quotes, bash replaced `$1` and `$3` with empty text, so awk got `{print , }`: `syntax error at or near ,`. Single quotes keep `$1` for awk."},{"part":"-F,","meaning":"Bug 3: the file is comma separated."},{"part":"NR > 1","meaning":"Bug 4: skip the header line."}],"expected_output":"sed: -e expression #1, char 8: unknown option to `s'\nawk: line 1: syntax error at or near ,\n--- fixed ---\nlog.path=/data/logs/todo/app.log\npasindu associate\nnimal senior\nkavya lead","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Changing sed to single quotes too: then `$OLD` is not replaced and nothing matches. sed needs double quotes here; awk needs single quotes.","To use a shell variable in awk, write `awk -v role=\"$ROLE\" '$3 == role'`, not `$ROLE` inside the awk code."],"checks":[{"run":"awk \"{print $1, $3}\" users.csv","expect":"syntax error at or near ,"}],"interview_say":"Two classic traps: slashes in sed patterns (use another delimiter) and double quotes around awk code (use single quotes and pass shell values with `-v`).","try_yourself":"Print only users with the role `lead` using `-v`: `awk -F, -v r=lead '$3 == r {print $1}' users.csv`."},{"id":"d11p06","title":"awk tricks: $NF, line counts, column checks","type":"command","topic":"Text","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Small awk one-liners save time in daily work: the last field of each line, counting lines, finding broken lines with the wrong number of columns, and unique values.","task":["Print the last field of each line in `access.log` with `$NF`.","Count the lines: `awk 'END {print NR}'`.","Find lines in `billing.csv` that do not have exactly 3 fields.","Print each IP only once, in the order seen: `awk '!seen[$1]++'`."],"hints":["`$NF` = the field number NF = the last field.","With `-F,` the separator is a comma: `NF != 3`.","`!seen[$1]++` is true only the first time a key appears."],"solution":["awk '{print $NF}' access.log | head -n 3","awk 'END {print NR \" lines\"}' access.log","awk -F, 'NF != 3 {print \"bad line \" NR \": \" $0}' billing.csv; echo \"(no output = all lines have 3 fields)\"","awk '!seen[$1]++ {print $1}' access.log"],"explanation":[{"part":"$NF","meaning":"Last field. `$(NF-1)` is the one before it."},{"part":"END {print NR}","meaning":"After the last line, NR is the line count (like `wc -l`)."},{"part":"NF != 3","meaning":"Lines with a different number of columns, often broken data."},{"part":"!seen[$1]++","meaning":"Print the first time each value appears. Like `sort -u`, but keeps the order."}],"expected_output":"35\n120\n2300\n6 lines\n(no output = all lines have 3 fields)\n10.0.0.5\n10.0.0.7\n192.168.1.20","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Writing `$NF-1` for the second to last field: awk computes (last field) minus 1. Write `$(NF-1)`."],"interview_say":"`$NF` gives the last field, `NR` the line number, and `!seen[$1]++` removes duplicates but keeps the original order.","try_yourself":"Print the number of fields of every line in `deploy.log`. Which lines have the most words?"},{"id":"d11p07","title":"sed with groups: mask secrets, reformat dates","type":"command","topic":"Text","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Before sending a config to a vendor, the user must hide the password. A report also needs dates as `DD/MM/YYYY` instead of `YYYY-MM-DD`. sed capture groups `( )` with `\\1` keep parts of the match.","task":["Print `app.conf` with the value after `db.password=` replaced by `*****`.","Convert `2026-10-01` to `01/10/2026` in the dates of `billing.csv` (print only the first 3 lines)."],"hints":["`sed -E 's/(db.password=).*/\\1*****/'`: `\\1` is the text of the first group.","Dates: `([0-9]{4})-([0-9]{2})-([0-9]{2})` and `\\3/\\2/\\1`. Use `|` as delimiter because the new text has `/`.","`-E` allows `( )` and `{4}` without backslashes."],"solution":["sed -E 's/^(db\\.password=).*/\\1*****/' app.conf | grep password","sed -E 's|([0-9]{4})-([0-9]{2})-([0-9]{2})|\\3/\\2/\\1|' billing.csv | head -n 3"],"explanation":[{"part":"( )","meaning":"A group: remember this part of the match."},{"part":"\\1 \\2 \\3","meaning":"Put the remembered groups back, in any order."},{"part":".*","meaning":"Any text until the end of the line (the secret)."},{"part":"-E","meaning":"Extended regex for sed (like `grep -E`)."}],"expected_output":"db.password=*****\ndate,service,cost\n01/10/2026,EC2,12.50\n01/10/2026,S3,1.20","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Masking with `grep -v password` removes the line. The vendor then does not know the setting exists. Masking keeps the key.","Never paste real secrets in tickets or chat, even masked. Rotate a secret if it was shown by mistake."],"interview_say":"I use sed groups to keep part of a match, for example `s/(password=).*/\\1*****/` to mask secrets before I share a config or a log.","try_yourself":"Mask every number in the `db.url` port: `sed -E 's/:[0-9]+\\//:****\\//' app.conf | grep db.url`."}],"interview":[{"q":"How do you replace a word in a file without opening an editor?","a":"`sed -i.bak 's/old/new/g' file`. `-i` edits in place, `.bak` keeps a backup, `g` changes every match on a line.","topic":"Text"},{"q":"How do you print only lines 10 to 20 of a file?","a":"`sed -n '10,20p' file` (or `awk 'NR>=10 && NR<=20' file`).","topic":"Text"},{"q":"How do you print the first column of a file with awk? And for a CSV?","a":"`awk '{print $1}' file`. For a CSV: `awk -F, '{print $1}' file.csv`.","topic":"Text"},{"q":"How do you compute the average of a column with awk?","a":"`awk '{s += $3; n++} END {if (n) print s/n}' file`.","topic":"Text"},{"q":"Why do we use single quotes around awk programs?","a":"So bash does not replace `$1`, `$2` and so on. Those are awk fields, not shell variables.","topic":"Text"}],"recap":[{"cmd":"sed 's/a/b/g'","meaning":"Replace text (g = all matches on a line)","example":"sed 's/db01/db02/g' app.conf","topic":"Text"},{"cmd":"sed 's|a|b|'","meaning":"Other delimiter for paths","example":"sed 's|/var/log|/data/log|' app.conf","topic":"Text"},{"cmd":"sed -i.bak","meaning":"Edit in place with a backup","example":"sed -i.bak 's/8080/9090/' app.conf","topic":"Text"},{"cmd":"sed -n 'X,Yp'","meaning":"Print lines X to Y","example":"sed -n '10,20p' app.log","topic":"Text"},{"cmd":"sed '/re/d'","meaning":"Delete matching lines","example":"sed '/^#/d' app.conf","topic":"Text"},{"cmd":"sed -n '/a/,/b/p'","meaning":"Print a block between two patterns","example":"sed -n '/start/,/end/p' deploy.log","topic":"Text"},{"cmd":"sed -E 's/(x).*/\\1/'","meaning":"Groups and back references","example":"sed -E 's/(password=).*/\\1***/'","topic":"Text"},{"cmd":"awk '{print $1}'","meaning":"Print a field","example":"awk '{print $1, $4}' access.log","topic":"Text"},{"cmd":"awk -F,","meaning":"Set the field separator","example":"awk -F, 'NR>1 {print $2}' billing.csv","topic":"Text"},{"cmd":"NR / NF / $NF","meaning":"Line number / field count / last field","example":"awk '{print NR, $NF}' file","topic":"Text"},{"cmd":"awk 'cond {action}'","meaning":"Act only on matching lines","example":"awk '$4 >= 500' access.log","topic":"Text"},{"cmd":"BEGIN / END","meaning":"Run before / after all lines","example":"awk '{s+=$6} END {print s/NR}' access.log","topic":"Text"},{"cmd":"awk arrays","meaning":"Group and sum by key","example":"awk -F, '{s[$2]+=$3} END {for(k in s) print k, s[k]}'","topic":"Text"},{"cmd":"awk -v","meaning":"Pass a shell value into awk","example":"awk -v r=\"$ROLE\" '$3 == r' users.csv","topic":"Text"}],"coverage":[{"item":"sed s///","problems":["d11p01","d11p05","d11p07"]},{"item":"sed -i","problems":["d11p01"]},{"item":"sed -n p","problems":["d11p02"]},{"item":"Delete lines, ranges","problems":["d11p02"]},{"item":"awk '{print $1}'","problems":["d11p03","d11p05"]},{"item":"awk -F","problems":["d11p04","d11p05"]},{"item":"NR, NF","problems":["d11p03","d11p06"]},{"item":"Conditions","problems":["d11p03","d11p06"]},{"item":"Sum, average, count","problems":["d11p03","d11p04"]},{"item":"BEGIN / END","problems":["d11p03","d11p04"]}],"reset":"rm -rf ~/bash-practice/day11"},{"day":12,"week":2,"title":"find, cut, tr, sort, uniq and xargs pipelines","goal":"Find files by name, age and size, act on them safely, and build classic one-line pipelines like \"top 10 IPs\".","minutes":90,"setup":["mkdir -p ~/bash-practice/day12/night && cd ~/bash-practice/day12","# P1/P2 use srv/, P5 uses night/srv/ (the same files, so the problems do not change each other)","for s in srv night/srv; do","  mkdir -p \"$s/app/old-builds\" \"$s/nginx\" \"$s/tmp\"","  for i in 1 2 3; do echo \"log line $i\" > \"$s/app/app-$i.log\"; done","  touch -d '2 days ago' \"$s/app/app-1.log\"","  touch -d '10 days ago' \"$s/app/app-2.log\"","  touch -d '40 days ago' \"$s/app/app-3.log\"","  truncate -s 120M \"$s/app/heap-dump.hprof\"","  touch -d '3 days ago' \"$s/app/heap-dump.hprof\"","  echo 'today' > \"$s/nginx/access.log\"","  truncate -s 15M \"$s/nginx/access.log.1\"","  touch -d '8 days ago' \"$s/nginx/access.log.1\"","  touch \"$s/tmp/a.tmp\" \"$s/tmp/b.tmp\" \"$s/tmp/my file.tmp\" \"$s/tmp/keep.conf\"","  touch -d '5 days ago' \"$s/tmp/a.tmp\" \"$s/tmp/b.tmp\" \"$s/tmp/my file.tmp\"","  touch -d '30 days ago' \"$s/app/old-builds\"","done","# P3: an access log with 12 client IPs (fixed counts)","n=0","for spec in 10.0.0.5:31 10.0.0.7:24 192.168.1.20:19 10.0.0.9:15 172.16.0.3:12 10.0.0.11:10 10.0.0.12:8 10.0.0.13:6 10.0.0.14:5 10.0.0.15:4 10.0.0.16:3 10.0.0.17:1; do","  ip=${spec%:*}; count=${spec#*:}","  for ((i = 0; i < count; i++)); do n=$((n + 1)); echo \"$ip - - [20/Oct/2026:10:00:$((n % 60))] \\\"GET /api/todos HTTP/1.1\\\" 200 512\"; done","done > access.log","# P4: data to reshape","printf '%s\\n' 'root:x:0:0:root:/root:/bin/bash' 'wicky:x:1000:1000:Pasindu:/home/wicky:/bin/bash' 'jenkins:x:998:998:Jenkins:/var/lib/jenkins:/bin/bash' 'nginx:x:997:997:web:/var/www:/usr/sbin/nologin' > users.db","printf '%s\\n' 'a3f9c1e7d2b4 fix login bug' '9b1d77e0aa31 add health endpoint' > commits.txt","printf 'web-01\\r\\nweb-02\\r\\n' > hosts-windows.txt","printf '%s\\n' web-01 web-02 db-01 > hosts.txt","printf '%s\\n' 10.0.1.10 10.0.1.11 10.0.2.20 > ips.txt","# P5: two .log files in night/ (they make an unquoted *.log expand) and a broken cleanup script","echo x > night/cleanup.log; echo y > night/run.log","printf '%s\\n' '#!/bin/bash' '# 1) list .log files under srv/ that are older than 7 days' '# 2) show the 3 biggest files under srv/ (size in bytes, biggest first)' '# 3) delete the .tmp files in srv/tmp (names may contain spaces)' 'find srv -name *.log -mtime 7' \"find srv -type f -printf '%s %p\\\\n' | sort | head -n 3\" \"find srv/tmp -name '*.tmp' | xargs rm\" > night/cleanup.sh","# P7: a fake 1-second health check","printf '%s\\n' '#!/bin/bash' 'sleep 1' 'echo \"$1 ok\"' > check.sh","chmod +x check.sh","# P6: a disk report with human sizes","printf '%s\\n' 'logs 1.5G' 'docker 12G' 'home 800M' 'tmp 40K' 'jenkins 3.2G' > disk.txt","cd ~/bash-practice/day12"],"warmup":[{"q":"Which sed command prints only lines 5 to 8?","a":"`sed -n '5,8p' file`","from_day":11},{"q":"How do you print the first column of a CSV with awk?","a":"`awk -F, '{print $1}' file.csv`","from_day":11},{"q":"What does `grep -rl db01 configs/` print?","a":"Only the names of the files under `configs/` that contain `db01`.","from_day":10},{"q":"Which loop is safe for file names with spaces: `for f in $(ls)` or `for f in *`?","a":"`for f in *` (and quote `\"$f\"` inside).","from_day":8}],"problems":[{"id":"d12p01","title":"find files by name, type, age and size","type":"command","topic":"Files","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The research server's disk is almost full. Before deleting anything, the user must list: all log files, logs older than 7 days, big files over 10 MB, and old folders. The files are under `srv/`.","task":["List all regular files ending in `.log` under `srv` (`-type f -name`).","List files modified more than 7 days ago (`-mtime +7`).","List files bigger than 10 MB (`-size +10M`).","Combine: `.log` files that are older than 7 days.","List folders (`-type d`) that were not changed for more than 20 days. Add `| sort` to every command so the order is stable."],"hints":["Always quote the pattern: `-name '*.log'`, or bash expands it first.","`-mtime +7` = more than 7 full days ago. `-mtime -2` = less than 2 days ago.","Size units: `k`, `M`, `G`. `+10M` = more than 10 MB."],"solution":["find srv -type f -name '*.log' | sort","echo \"=== older than 7 days ===\"","find srv -type f -mtime +7 | sort","echo \"=== bigger than 10 MB ===\"","find srv -type f -size +10M | sort","echo \"=== .log and older than 7 days ===\"","find srv -type f -name '*.log' -mtime +7 | sort","echo \"=== old folders ===\"","find srv -type d -mtime +20 | sort"],"explanation":[{"part":"find srv","meaning":"Start searching in `srv` and go into every sub-folder."},{"part":"-type f / -type d","meaning":"Only regular files / only folders (directories)."},{"part":"-name '*.log'","meaning":"Name pattern. Quote it so find gets the `*`, not bash."},{"part":"-mtime +7","meaning":"Modified more than 7 days ago (in whole days)."},{"part":"-size +10M","meaning":"Bigger than 10 MB. `-size -1k` would be smaller than 1 KB."},{"part":"tests side by side","meaning":"Several tests mean AND: every test must be true. Use `-o` for OR."}],"expected_output":"srv/app/app-1.log\nsrv/app/app-2.log\nsrv/app/app-3.log\nsrv/nginx/access.log\n=== older than 7 days ===\nsrv/app/app-2.log\nsrv/app/app-3.log\nsrv/nginx/access.log.1\n=== bigger than 10 MB ===\nsrv/app/heap-dump.hprof\nsrv/nginx/access.log.1\n=== .log and older than 7 days ===\nsrv/app/app-2.log\nsrv/app/app-3.log\n=== old folders ===\nsrv/app/old-builds","expect_exit":0,"output_check":true,"output_note":"`access.log.1` and `heap-dump.hprof` are sparse files: they report a big size but use almost no disk space. They are safe practice files.","verified":true,"mistakes":["`find srv -name *.log` without quotes: if the current folder has .log files, bash expands the pattern and find gets the wrong arguments (see P5).","`-mtime 7` (no plus) means exactly 7 days old, which is usually not what the user wants.","Putting the path last: `find -name '*.log' srv` gives the error `find: paths must precede expression`, and it names `srv`."],"checks":[{"run":"find -name '*.log' srv","expect":"find: paths must precede expression: `srv'"}],"interview_say":"I use `find PATH -type f -name '*.log' -mtime +7 -size +10M` to list files by name, age and size. I always quote the name pattern, and I list before I delete.","try_yourself":"Find files changed in the last 60 minutes: `find srv -mmin -60`. Then `touch srv/app/app-1.log` and run it again."},{"id":"d12p02","title":"find -exec and -delete, safely","type":"command","topic":"Files","minutes":12,"optional":false,"core":false,"workdir":".","situation":"Now the user acts on the files: delete old temp files, and compress logs older than 7 days. A wrong `find -delete` can remove the wrong files, so the user always runs the same command with `-print` first.","task":["Dry run: list `.tmp` files in `srv/tmp` older than 3 days with `-print`.","Run the same command with `-delete` instead. List `srv/tmp` after.","Compress `.log` files older than 7 days with `-exec gzip -v {} \\;`.","List the `.gz` files that now exist."],"hints":["Same command, two steps: first `-print`, then `-delete`. Change nothing else.","`{}` is replaced by each file name. `\\;` ends the `-exec` command (one run per file).","`-exec cmd {} +` runs `cmd` once with many files: faster."],"solution":["find srv/tmp -type f -name '*.tmp' -mtime +3 -print | sort      # 1. dry run","find srv/tmp -type f -name '*.tmp' -mtime +3 -delete            # 2. same test, delete","ls srv/tmp","find srv -type f -name '*.log' -mtime +7 -exec gzip -v {} \\;","find srv -name '*.gz' | sort"],"explanation":[{"part":"-print first","meaning":"See exactly which files match. Only then use `-delete`."},{"part":"-delete","meaning":"Delete every match. Put it last, after all tests."},{"part":"-exec gzip -v {} \\;","meaning":"Run `gzip -v FILE` for each match. `\\;` = end of the command."},{"part":"gzip -v","meaning":"Compress and replace the file with `.gz`; `-v` prints the result."},{"part":"{} +","meaning":"Pass many files at once: `gzip a b c` instead of 3 runs."}],"expected_output":"srv/tmp/a.tmp\nsrv/tmp/b.tmp\nsrv/tmp/my file.tmp\nkeep.conf\nsrv/app/app-3.log:\t-18.2% -- replaced with srv/app/app-3.log.gz\nsrv/app/app-2.log:\t-18.2% -- replaced with srv/app/app-2.log.gz\nsrv/app/app-2.log.gz\nsrv/app/app-3.log.gz","expect_exit":0,"output_check":false,"output_note":"`find` lists files in the order of the folder on disk, so the two gzip lines can be in a different order on the user's machine.","verified":true,"mistakes":["Putting `-delete` first: `find srv -delete -name '*.tmp'` deletes **everything** under srv before testing the name.","Forgetting `\\;` or `+`: find stops with `find: missing argument to` and names `-exec`.","Deleting logs that a program still writes to. Compress old rotated logs only; for live logs use logrotate (Day 16)."],"checks":[{"run":"find srv -name '*.log' -exec ls {}","expect":"find: missing argument to `-exec'"}],"interview_say":"Before `find -delete` I run the same command with `-print`. I put `-delete` at the end. For other actions I use `-exec cmd {} +` to run the command on many files at once.","try_yourself":"Compress with the `+` form and see the difference: `find srv -name '*.log' -exec ls -l {} +`."},{"id":"d12p03","title":"The classic: top 10 client IPs","type":"command","topic":"Text","minutes":13,"optional":false,"core":true,"workdir":".","situation":"The API gets many requests and the team suspects one client is flooding it. The interviewer's favourite one-liner: show the 10 IP addresses with the most requests in the access log, with counts.","task":["Print the first field (IP) of each line.","Sort the IPs so equal ones are together, and count them with `uniq -c`.","Sort the counts as numbers, biggest first (`sort -rn`).","Keep the first 10 lines.","Do the same with `cut -d' ' -f1` instead of awk. Then show only the top 1 IP."],"hints":["`awk '{print $1}' access.log`","`... | sort | uniq -c | sort -rn | head -n 10`","`-n` = numeric sort, `-r` = reverse (biggest first)."],"solution":["awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -n 10","echo \"=== with cut, top 1 ===\"","cut -d' ' -f1 access.log | sort | uniq -c | sort -rn | head -n 1","echo \"=== total requests and unique IPs ===\"","wc -l < access.log","cut -d' ' -f1 access.log | sort -u | wc -l"],"explanation":[{"part":"awk '{print $1}'","meaning":"Take the IP (first field)."},{"part":"sort","meaning":"Put equal IPs next to each other, so uniq can count them."},{"part":"uniq -c","meaning":"Count each group: `31 10.0.0.5`."},{"part":"sort -rn","meaning":"Sort by the number, biggest first. Without `-n`, `9` comes after `31` (text order)."},{"part":"head -n 10","meaning":"Keep the top 10."},{"part":"cut -d' ' -f1","meaning":"Same as awk here: field 1, with space as delimiter."}],"expected_output":"     31 10.0.0.5\n     24 10.0.0.7\n     19 192.168.1.20\n     15 10.0.0.9\n     12 172.16.0.3\n     10 10.0.0.11\n      8 10.0.0.12\n      6 10.0.0.13\n      5 10.0.0.14\n      4 10.0.0.15\n=== with cut, top 1 ===\n     31 10.0.0.5\n=== total requests and unique IPs ===\n138\n12","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Forgetting the first `sort`: `uniq -c` counts only neighbours, so one IP appears many times.","`sort -r` without `-n`: text order puts `9` before `31`, because `9` > `3`."],"interview_say":"`awk '{print $1}' access.log | sort | uniq -c | sort -rn | head` gives the top IPs. The first sort groups equal lines, uniq counts them, and `sort -rn` puts the biggest count first.","try_yourself":"Show the top status codes instead: which field number is the status code in this log format?"},{"id":"d12p04","title":"Reshape text: cut, tr and paste","type":"command","topic":"Text","minutes":12,"optional":false,"core":false,"workdir":".","situation":"Small reshaping jobs: take user names and home folders from a passwd-style file, short git commit ids, fix a host list that came from Windows (with hidden `\\r` characters), and join two lists side by side.","task":["From `users.db` (separated by `:`), print fields 1 and 6.","From `commits.txt`, print the first 7 characters of each line (short SHA).","Show the hidden characters of `hosts-windows.txt` with `cat -A`. Remove the `\\r` with `tr -d '\\r'`.","Change `hosts.txt` to upper case with `tr`, and squeeze repeated spaces with `tr -s ' '`.","Join `hosts.txt` and `ips.txt` side by side with `paste`, and join all hosts into one line with commas (`paste -sd,`)."],"hints":["`cut -d: -f1,6` = delimiter `:`, fields 1 and 6. `cut -c1-7` = characters 1 to 7.","`cat -A` shows `^M` for `\\r` and `$` at each line end.","`tr 'a-z' 'A-Z'` maps lower to upper. `paste -sd, file` = serial, delimiter comma."],"solution":["cut -d: -f1,6 users.db","cut -c1-7 commits.txt","cat -A hosts-windows.txt","tr -d '\\r' < hosts-windows.txt | cat -A","tr 'a-z' 'A-Z' < hosts.txt","echo \"too    many     spaces\" | tr -s ' '","paste hosts.txt ips.txt","paste -sd, hosts.txt"],"explanation":[{"part":"cut -d: -f1,6","meaning":"Split at `:` and keep fields 1 and 6 (user and home)."},{"part":"cut -c1-7","meaning":"Keep characters 1 to 7."},{"part":"cat -A","meaning":"Show hidden characters: `^M` = Windows `\\r`, `$` = end of line."},{"part":"tr -d '\\r'","meaning":"Delete every `\\r`. Fixes files edited on Windows (`$'\\r': command not found` in scripts)."},{"part":"tr 'a-z' 'A-Z' / tr -s ' '","meaning":"Map characters / squeeze repeats into one."},{"part":"paste a b / paste -sd,","meaning":"Join lines side by side (TAB between) / join all lines of one file with commas."}],"expected_output":"root:/root\nwicky:/home/wicky\njenkins:/var/lib/jenkins\nnginx:/var/www\na3f9c1e\n9b1d77e\nweb-01^M$\nweb-02^M$\nweb-01$\nweb-02$\nWEB-01\nWEB-02\nDB-01\ntoo many spaces\nweb-01\t10.0.1.10\nweb-02\t10.0.1.11\ndb-01\t10.0.2.20\nweb-01,web-02,db-01","expect_exit":0,"output_check":true,"verified":true,"mistakes":["`tr` does not take a file name: `tr 'a-z' 'A-Z' hosts.txt` gives `tr: extra operand ‘hosts.txt’`. Use `< hosts.txt`.","A script written in Windows Notepad fails with `$'\\r': command not found`. Fix it with `tr -d '\\r'` or `dos2unix`.","`cut` with spaces: many spaces in a row create empty fields. Use `tr -s ' '` first, or `awk`."],"checks":[{"run":"tr 'a-z' 'A-Z' hosts.txt","expect":"tr: extra operand ‘hosts.txt’"},{"run":"printf 'echo hi\\r\\n\\r\\n' > w.sh; bash w.sh","expect":"$'\\r': command not found"}],"interview_say":"`cut` takes fields or characters, `tr` translates or deletes characters, and `paste` joins lines. `tr -d '\\r'` is my fix for files that came from Windows.","try_yourself":"Run `cut -d: -f7 users.db | sort | uniq -c`. How many users have each shell?"},{"id":"d12p05","title":"Find the bug: the cleanup script","type":"fix-bug","topic":"Files","minutes":14,"optional":false,"core":false,"workdir":"night","situation":"`cleanup.sh` runs every night. It prints a strange find error, shows the wrong \"biggest\" files, and fails to delete one temp file. The goals are in the comments.","task":["Run `bash cleanup.sh` and read every error line.","Find 4 bugs: an unquoted pattern, a wrong `-mtime`, a wrong sort, and xargs with spaces.","Fix them and run again. The biggest file must be `heap-dump.hprof`, and `srv/tmp` must keep only `keep.conf`."],"hints":["There are two `.log` files in `night/`, so `*.log` becomes `cleanup.log run.log`.","`-mtime 7` = exactly 7 days. Use `+7`. Sizes are numbers: `sort -rn`.","Use `find ... -delete`, or `-print0 | xargs -0 rm`, for names with spaces."],"solution":["bash cleanup.sh","echo \"--- fixed ---\"","cat > cleanup.sh <<'EOF'","#!/bin/bash","# 1) list .log files under srv/ that are older than 7 days","# 2) show the 3 biggest files under srv/ (size in bytes, biggest first)","# 3) delete the .tmp files in srv/tmp (names may contain spaces)","find srv -name '*.log' -mtime +7 | sort","find srv -type f -printf '%s %p\\n' | sort -rn | head -n 3","find srv/tmp -name '*.tmp' -print0 | xargs -0 rm -v","EOF","bash cleanup.sh","ls srv/tmp"],"explanation":[{"part":"-name '*.log'","meaning":"Bug 1: unquoted, bash expanded it to `cleanup.log run.log`: `paths must precede expression`."},{"part":"-mtime +7","meaning":"Bug 2: `7` = exactly 7 days; `+7` = more than 7 days."},{"part":"sort -rn","meaning":"Bug 3: plain `sort` is text order and smallest first. Sizes need numeric, reverse."},{"part":"-print0 | xargs -0","meaning":"Bug 4: `my file.tmp` was split into `my` and `file.tmp`. Null-separated names are safe."},{"part":"-printf '%s %p\\n'","meaning":"GNU find: print size in bytes and path."}],"expected_output":"find: paths must precede expression: `run.log'\nfind: possible unquoted pattern after predicate `-name'?\n0 srv/tmp/a.tmp\n0 srv/tmp/b.tmp\n0 srv/tmp/keep.conf\nrm: cannot remove 'srv/tmp/my': No such file or directory\nrm: cannot remove 'file.tmp': No such file or directory\n--- fixed ---\nsrv/app/app-2.log\nsrv/app/app-3.log\n125829120 srv/app/heap-dump.hprof\n15728640 srv/nginx/access.log.1\n11 srv/app/app-3.log\nremoved 'srv/tmp/my file.tmp'\nkeep.conf","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Running the broken script in a folder without `.log` files: bug 1 hides, because the pattern is not expanded there. It breaks only in some folders.","Using `ls -S` for the biggest files: it does not search sub-folders. `find -printf` or `du` (Day 17) does."],"checks":[{"run":"bash cleanup.sh","expect":"find: paths must precede expression: `run.log'"},{"run":"bash cleanup.sh","expect":"rm: cannot remove 'srv/tmp/my': No such file or directory"}],"interview_say":"In cleanup scripts I quote find patterns, use `-mtime +N`, sort sizes with `sort -rn`, and use `-delete` or `-print0 | xargs -0` so names with spaces are safe.","try_yourself":"Run `cd srv && find . -name *.log` (no quotes) inside `srv`, where no .log file is in the top folder. Why does it work there?"},{"id":"d12p06","title":"sort by a column: -k -t -h -u","type":"command","topic":"Text","minutes":10,"optional":true,"core":false,"workdir":".","situation":"`du -h` style reports show sizes like `800M`, `1.5G`, `12G`. Sorting them as text or as plain numbers gives the wrong order. `sort -h` understands human sizes, and `-k` picks the column.","task":["Sort `disk.txt` by the second column as text: `sort -k2`.","Sort it with `-n`. Is it right?","Sort it with `-h` (human numbers), biggest first.","Sort `users.db` by the user id (field 3, separator `:`) as numbers."],"hints":["`-k2` = sort by column 2 (to the end of the line). `-k2,2` = only column 2.","`-h` knows that `1.5G` > `800M`.","`-t:` sets the separator: `sort -t: -k3,3 -n users.db`."],"solution":["sort -k2 disk.txt","echo \"=== -n (wrong for units) ===\"","sort -k2 -n disk.txt","echo \"=== -h, biggest first ===\"","sort -k2 -h -r disk.txt","echo \"=== users by id ===\"","sort -t: -k3,3 -n users.db | cut -d: -f1,3"],"explanation":[{"part":"-k2","meaning":"Use column 2 as the sort key."},{"part":"-n","meaning":"Numeric, but it ignores units: `12G` is smaller than `40K` because 12 < 40."},{"part":"-h","meaning":"Human-readable numbers: K < M < G."},{"part":"-t: -k3,3","meaning":"Separator `:`, key is field 3 only."}],"expected_output":"logs 1.5G\ndocker 12G\njenkins 3.2G\ntmp 40K\nhome 800M\n=== -n (wrong for units) ===\nlogs 1.5G\njenkins 3.2G\ndocker 12G\ntmp 40K\nhome 800M\n=== -h, biggest first ===\ndocker 12G\njenkins 3.2G\nlogs 1.5G\nhome 800M\ntmp 40K\n=== users by id ===\nroot:0\nnginx:997\njenkins:998\nwicky:1000","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `-k3` instead of `-k3,3`: the key runs to the end of the line, which can change ties."],"interview_say":"`sort -k` picks a column, `-t` sets the separator, `-n` sorts numbers, and `-h` sorts human sizes like `du -h` output. `du -sh * | sort -h` shows the biggest folders last.","try_yourself":"Run `sort -u -t: -k7,7 users.db | cut -d: -f7`. What does `-u` with a key do?"},{"id":"d12p07","title":"xargs -n and -P: checks in parallel","type":"command","topic":"Text","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A health check takes 1 second per server. For 4 servers that is 4 seconds one by one. `xargs -P` runs several at the same time. Here a `sleep 1` is the fake check, so it is safe to run.","task":["Run the fake check `./check.sh HOST` for 4 hosts one by one with `xargs -n 1`, and measure the time with `SECONDS`.","Run them with `-P 4` (4 at the same time) and measure again.","Sort the parallel output: the order of finished jobs can change every run."],"hints":["`SECONDS` is a bash variable: seconds since the shell started. Set it to 0 first.","`printf '%s\\n' web-01 web-02 web-03 web-04 | xargs -n 1 -P 4 ./check.sh`","Parallel output order is not fixed, so add `| sort`."],"solution":["SECONDS=0","printf '%s\\n' web-01 web-02 web-03 web-04 | xargs -n 1 ./check.sh","SEQ=$SECONDS","SECONDS=0","printf '%s\\n' web-01 web-02 web-03 web-04 | xargs -n 1 -P 4 ./check.sh | sort","PAR=$SECONDS","echo \"one by one: ${SEQ}s, parallel: ${PAR}s\"","[ \"$PAR\" -lt \"$SEQ\" ] && echo \"parallel is faster\""],"explanation":[{"part":"-n 1","meaning":"One argument per command run."},{"part":"-P 4","meaning":"Up to 4 commands at the same time."},{"part":"./check.sh HOST","meaning":"The fake check: it sleeps 1 second and prints `HOST ok`."},{"part":"SECONDS","meaning":"Bash counts seconds; set it to 0 to start a stopwatch."}],"expected_output":"web-01 ok\nweb-02 ok\nweb-03 ok\nweb-04 ok\nweb-01 ok\nweb-02 ok\nweb-03 ok\nweb-04 ok\none by one: 5s, parallel: 1s\nparallel is faster","expect_exit":0,"output_check":false,"output_note":"The seconds can be a little different. The parallel run should take about 1 second instead of about 4.","verified":true,"mistakes":["Using `-P` with commands that write to the same file: the lines can mix. Write to separate files or use `| sort`.","Using a very big `-P` against a production API: it looks like an attack. Keep it small."],"interview_say":"`xargs -P N` runs up to N commands in parallel, which is useful for checks on many servers. I sort the output because the order of finished jobs is not fixed.","try_yourself":"Try `-P 2`. How many seconds does it take now?"}],"interview":[{"q":"How do you find log files bigger than 100 MB and older than 30 days?","a":"`find /var/log -type f -name '*.log' -size +100M -mtime +30`.","topic":"Files"},{"q":"How do you safely delete files found by find?","a":"Run the command with `-print` first to check the list, then the same command with `-delete` at the end. For names with spaces use `-print0 | xargs -0`.","topic":"Files"},{"q":"How do you get the top 10 IP addresses from an access log?","a":"`awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -n 10`.","topic":"Text"},{"q":"What does `tr -d '\\r'` fix?","a":"Files with Windows line endings. The `\\r` makes scripts fail with `$'\\r': command not found`.","topic":"Text"},{"q":"What is the difference between `-exec cmd {} \\;` and `-exec cmd {} +`?","a":"`\\;` runs the command once per file. `+` runs it once with many files, which is faster.","topic":"Files"}],"recap":[{"cmd":"find -type f -name '*.log'","meaning":"Find files by name","example":"find /var/log -type f -name '*.log'","topic":"Files"},{"cmd":"find -mtime +N / -mmin -N","meaning":"Older than N days / newer than N minutes","example":"find srv -mtime +7","topic":"Files"},{"cmd":"find -size +10M","meaning":"Bigger than 10 MB","example":"find / -xdev -size +500M","topic":"Files"},{"cmd":"find ... -print / -delete","meaning":"Dry run, then delete","example":"find tmp -name '*.tmp' -mtime +3 -delete","topic":"Files"},{"cmd":"find -exec cmd {} \\; / {} +","meaning":"Run a command per file / for many files","example":"find . -name '*.log' -exec gzip {} +","topic":"Files"},{"cmd":"find -print0 | xargs -0","meaning":"Safe for names with spaces","example":"find tmp -name '*.tmp' -print0 | xargs -0 rm","topic":"Files"},{"cmd":"cut -d: -f1,6 / -c1-7","meaning":"Fields / characters","example":"cut -d: -f1 /etc/passwd","topic":"Text"},{"cmd":"tr 'a-z' 'A-Z' / tr -d / tr -s","meaning":"Map / delete / squeeze characters","example":"tr -d '\\r' < win.txt > unix.txt","topic":"Text"},{"cmd":"paste a b / paste -sd,","meaning":"Join files side by side / lines into one","example":"paste -sd, hosts.txt","topic":"Text"},{"cmd":"sort -rn | head","meaning":"Biggest numbers first","example":"sort | uniq -c | sort -rn | head","topic":"Text"},{"cmd":"sort -k2 -h -t:","meaning":"By column, human sizes, separator","example":"du -sh * | sort -h","topic":"Text"},{"cmd":"xargs -n 1 -P 4","meaning":"One item per run, 4 in parallel","example":"xargs -P 4 -I{} curl -s {} < urls","topic":"Text"}],"coverage":[{"item":"find -name, -type","problems":["d12p01","d12p05"]},{"item":"find -mtime, -size","problems":["d12p01","d12p05"]},{"item":"find -exec, -delete","problems":["d12p02","d12p05"]},{"item":"cut","problems":["d12p03","d12p04"]},{"item":"tr","problems":["d12p04"]},{"item":"sort -k -n -r -u","problems":["d12p03","d12p05","d12p06"]},{"item":"uniq -c","problems":["d12p03"]},{"item":"paste","problems":["d12p04"]},{"item":"The \"top 10 IPs\" pipeline","problems":["d12p03"]},{"item":"xargs -n -P","problems":["d12p05","d12p07"]}],"reset":"rm -rf ~/bash-practice/day12"},{"day":13,"week":2,"title":"Strings, parameter expansion and dates","goal":"Cut and change text inside variables without extra tools, and make correct dates and file names for backups and releases.","minutes":90,"setup":["mkdir -p ~/bash-practice/day13 && cd ~/bash-practice/day13","# P5: a broken release-name script","printf '%s\\n' '#!/bin/bash' '# Usage: release-name.sh <archive-path> <build-date>' '# Prints:' '#   name:    todo-api-2.4.1   (file name without .tar.gz)' '#   tag:     2-4-1            (version, every dot changed to a dash)' '#   date:    2026-10-20       (build date as YYYY-MM-DD)' '#   workdir: a NEW empty folder, also when the script runs twice' 'FILE=${1##*/}' 'NAME=${FILE%.*}' 'VERSION=${NAME#todo-api-}' 'TAG=${VERSION/./-}' 'BUILD_DATE=$(date -d \"$2\" +%d-%m-%Y)' 'WORKDIR=release-work' 'mkdir $WORKDIR' 'echo \"name:    $NAME\"' 'echo \"tag:     $TAG\"' 'echo \"date:    $BUILD_DATE\"' 'echo \"workdir: $WORKDIR\"' > release-name.sh","cd ~/bash-practice/day13"],"warmup":[{"q":"Which pipeline gives the top 10 IPs of an access log?","a":"`awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -n 10`","from_day":12},{"q":"How do you find `.log` files older than 7 days under `/var/log`?","a":"`find /var/log -type f -name '*.log' -mtime +7`","from_day":12},{"q":"How do you replace `8080` with `9090` in a file and keep a backup?","a":"`sed -i.bak 's/8080/9090/' app.conf`","from_day":11},{"q":"Why must find patterns like `*.log` be quoted?","a":"Without quotes, bash may expand `*.log` to file names in the current folder before find runs.","from_day":12}],"problems":[{"id":"d13p01","title":"Path surgery: ##*/ %/* %.ext, basename, dirname","type":"command","topic":"Variables","minutes":13,"optional":false,"core":true,"workdir":".","situation":"A CI job gets the artifact path `/opt/releases/todo-api-2.4.1.tar.gz`. The deploy step needs the file name, the folder, the name without `.tar.gz`, and the version `2.4.1`. Parameter expansion does this inside bash, with no extra programs.","task":["Set `ARTIFACT=/opt/releases/todo-api-2.4.1.tar.gz`.","Print the file name with `${ARTIFACT##*/}` and the folder with `${ARTIFACT%/*}`.","Print the name without `.tar.gz` with `%.tar.gz`. Then try `%.*` and `%%.*` and compare.","Get only the version `2.4.1`: remove the prefix `todo-api-` with `#`, then the suffix.","Do the same file name and folder with `basename` and `dirname`."],"hints":["`#` removes from the start, `%` removes from the end. One sign = shortest match, two signs = longest match.","`##*/` = remove everything up to the last `/`. `%/*` = remove the last `/` and what follows.","`%.*` removes only `.gz`; `%%.*` removes from the FIRST dot, so it cuts the version too."],"solution":["ARTIFACT=/opt/releases/todo-api-2.4.1.tar.gz","FILE=${ARTIFACT##*/}               # remove the longest match of */ from the start","echo \"file:     $FILE\"","echo \"folder:   ${ARTIFACT%/*}\"     # remove the shortest match of /* from the end","echo \"no ext:   ${FILE%.tar.gz}\"","echo \"%.*:      ${FILE%.*}\"         # shortest: only .gz removed","echo \"%%.*:     ${FILE%%.*}\"        # longest: everything from the first dot","V=${FILE#todo-api-}                 # remove the prefix","echo \"version:  ${V%.tar.gz}\"       # remove the suffix","echo \"basename: $(basename \"$ARTIFACT\" .tar.gz)\"","echo \"dirname:  $(dirname \"$ARTIFACT\")\""],"explanation":[{"part":"${var#pattern} / ${var##pattern}","meaning":"Remove the shortest / longest match from the START."},{"part":"${var%pattern} / ${var%%pattern}","meaning":"Remove the shortest / longest match from the END."},{"part":"${ARTIFACT##*/}","meaning":"Everything up to the last slash is removed: the file name."},{"part":"${ARTIFACT%/*}","meaning":"The last slash and the name are removed: the folder."},{"part":"${FILE%%.*}","meaning":"Longest match of `.*` from the end starts at the first dot: `todo-api-2`. A common bug with versions."},{"part":"basename FILE .tar.gz / dirname","meaning":"External commands that do the same; `basename` can also remove a suffix."}],"expected_output":"file:     todo-api-2.4.1.tar.gz\nfolder:   /opt/releases\nno ext:   todo-api-2.4.1\n%.*:      todo-api-2.4.1.tar\n%%.*:     todo-api-2\nversion:  2.4.1\nbasename: todo-api-2.4.1\ndirname:  /opt/releases","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `${FILE%%.*}` to remove the extension of a versioned file: the result is `todo-api-2`, not `todo-api-2.4.1`.","Putting a space: `${ARTIFACT ##*/}` gives `bad substitution`."],"checks":[{"run":"ARTIFACT=/a/b; echo ${ARTIFACT ##*/}","expect":"bad substitution"}],"interview_say":"I use `${path##*/}` for the file name and `${path%/*}` for the folder. `#` cuts from the start and `%` from the end; doubling the sign makes the match as long as possible.","try_yourself":"Set `URL=https://github.com/wicky/todo.git` and print only `todo` using two expansions.","table":{"head":["Form","Removes","Memory trick"],"rows":[["`#`","from the start, shortest","`#` is left of `$` on the keyboard"],["`##`","from the start, longest",""],["`%`","from the end, shortest","`%` is right of `$`"],["`%%`","from the end, longest",""]]}},{"id":"d13p02","title":"Defaults and checks: :- := :? :+ and ${#var}","type":"predict","topic":"Variables","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A container entrypoint reads its settings from environment variables. Some are optional (use a default), one is required (stop if missing), and the database password must be at least 12 characters long.","task":["With `PORT` unset, predict and print `${PORT:-8080}`. Is `PORT` set afterwards?","Now print `${PORT:=8080}`. Is `PORT` set afterwards?","Set `DEBUG=1` and print `${DEBUG:+--verbose}`. Then unset it and print again.","Set `DB_PASSWORD=short` and check its length with `${#DB_PASSWORD}`.","In a subshell, run `echo \"${DB_HOST:?DB_HOST must be set}\"` and read the error."],"hints":["`:-` uses a default but does not change the variable. `:=` uses it AND saves it.","`:+` gives the alternative text only when the variable IS set and not empty.","`:?` stops with the message when the variable is empty or unset."],"solution":["unset PORT","echo \"port: ${PORT:-8080}, PORT is now: [${PORT}]\"","echo \"port: ${PORT:=8080}, PORT is now: [${PORT}]\"","DEBUG=1;  echo \"flags: [${DEBUG:+--verbose}]\"","unset DEBUG; echo \"flags: [${DEBUG:+--verbose}]\"","DB_PASSWORD=short","echo \"password length: ${#DB_PASSWORD}\"","(( ${#DB_PASSWORD} >= 12 )) || echo \"password too short (need 12+)\"","( echo \"${DB_HOST:?DB_HOST must be set}\" ) || echo \"exit code: $?\""],"explanation":[{"part":"${VAR:-default}","meaning":"Use the default when VAR is unset or empty. VAR does not change."},{"part":"${VAR:=default}","meaning":"Same, but also assign the default to VAR."},{"part":"${VAR:+text}","meaning":"Give `text` only if VAR has a value. Good for optional flags."},{"part":"${VAR:?message}","meaning":"Stop with the message if VAR is unset or empty."},{"part":"${#VAR}","meaning":"Length of the value in characters."}],"expected_output":"port: 8080, PORT is now: []\nport: 8080, PORT is now: [8080]\nflags: [--verbose]\nflags: []\npassword length: 5\npassword too short (need 12+)\nbash: DB_HOST: DB_HOST must be set\nexit code: 1","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Writing `${PORT-8080}` (no colon): it uses the default only when PORT is unset, not when it is empty (`PORT=`).","Using `:=` on a positional parameter: `${1:=x}` gives `$1: cannot assign in this way`."],"checks":[{"run":"bash -c 'echo ${1:=x}'","expect":"$1: cannot assign in this way"}],"interview_say":"In entrypoint scripts I use `${VAR:-default}` for optional settings, `${VAR:?message}` for required ones, and `${#VAR}` to check lengths.","try_yourself":"Run `bash -c 'echo ${1:=x}'` and read the error. Why can't you assign to `$1`?"},{"id":"d13p03","title":"Dates for backups and releases","type":"command","topic":"Variables","minutes":13,"optional":false,"core":false,"workdir":".","situation":"Backup files need sortable names like `db-20261020-1430.sql.gz`, a cleanup job needs the date 7 days ago, and a report needs the number of days between two dates. Here the dates are fixed with `date -d`, so the output is the same on every machine.","task":["Print `2026-10-20 14:30` as `%F` (YYYY-MM-DD) and as `%Y%m%d-%H%M`.","Build the backup name `db-<stamp>.sql.gz` from that time.","Print the date 7 days before and 30 days after `2026-10-20`.","Convert the date to seconds since 1970 (`+%s`) in UTC, and back with `@seconds`.","Compute the days between `2026-10-01` and `2026-10-20`."],"hints":["`date -d 'TEXT' +FORMAT` reads a date from text. Without `-d`, it uses now.","`%F` = `%Y-%m-%d`. `%H%M` = hours and minutes. `%s` = epoch seconds.","Days between: `(( (end - start) / 86400 ))`, where 86400 = seconds per day."],"solution":["T='2026-10-20 14:30'","date -d \"$T\" +%F","STAMP=$(date -d \"$T\" +%Y%m%d-%H%M)","echo \"backup file: db-$STAMP.sql.gz\"","date -d '2026-10-20 -7 days' +%F","date -d '2026-10-20 +30 days' +%F","EPOCH=$(TZ=UTC date -d '2026-10-20 00:00' +%s)","echo \"epoch: $EPOCH\"","TZ=UTC date -d \"@$EPOCH\" '+%F %T %Z'","START=$(TZ=UTC date -d 2026-10-01 +%s)","END=$(TZ=UTC date -d 2026-10-20 +%s)","echo \"days between: $(( (END - START) / 86400 ))\""],"explanation":[{"part":"date -d \"$T\" +%F","meaning":"Format a given date. `%F` = 2026-10-20 (ISO, sorts correctly)."},{"part":"+%Y%m%d-%H%M","meaning":"20261020-1430: good for file names (no spaces, no colons)."},{"part":"-d '2026-10-20 -7 days'","meaning":"Date math with words: `-7 days`, `+30 days`, `yesterday`, `next monday`."},{"part":"+%s / @seconds","meaning":"Seconds since 1970-01-01 UTC (epoch), and back."},{"part":"TZ=UTC","meaning":"Use UTC for this command only, so the result does not depend on the machine's time zone."},{"part":"/ 86400","meaning":"Seconds in a day: 24 × 60 × 60."}],"expected_output":"2026-10-20\nbackup file: db-20261020-1430.sql.gz\n2026-10-13\n2026-11-19\nepoch: 1792454400\n2026-10-20 00:00:00 UTC\ndays between: 19","expect_exit":0,"output_check":true,"output_note":"`date` without `-d` prints the current time, which is different every run. Here every date is fixed.","verified":true,"mistakes":["Using `%d-%m-%Y` in file names: `20-10-2026` does not sort by date. Use `%F` or `%Y%m%d`.","Using `:` in file names (`%T`): Windows tools and some copies fail on colons.","`date -d` is GNU (Linux). On macOS it is `date -v-7d`. Scripts for both need care."],"interview_say":"For backup names I use `date +%Y%m%d-%H%M` so files sort by time, `date -d '-7 days' +%F` for cleanup dates, and epoch seconds `+%s` to compute differences.","try_yourself":"Print today's date in Sri Lanka and in UTC: `TZ=Asia/Colombo date` and `TZ=UTC date`. How many hours apart are they?"},{"id":"d13p04","title":"Clean reports with printf, and read -p","type":"command","topic":"Variables","minutes":12,"optional":false,"core":false,"workdir":".","situation":"A status script prints a table of services for the on-call engineer, and an install script asks the user which environment to use. `echo` is fine for simple text; `printf` gives exact columns, padding and numbers.","task":["Print a header and 3 rows with `printf '%-14s %6s %8s\\n'` (service, port, status).","Print a number with leading zeros (`%05d`) and a percent with one decimal (`%.1f%%`).","Print every item of an array on its own line with `printf '%s\\n' \"${ARR[@]}\"`.","Ask for the environment with `read -r -p \"Environment: \" ENV`. Here the answer comes from `<<< staging`, so no prompt is shown."],"hints":["`%-14s` = text, left aligned, 14 wide. `%6s` = right aligned, 6 wide.","printf does not add a new line: always end the format with `\\n`.","`read -p` shows the prompt only when input comes from a keyboard (a terminal)."],"solution":["printf '%-14s %6s %8s\\n' SERVICE PORT STATUS","printf '%-14s %6d %8s\\n' todo-frontend 80 up todo-backend 8080 up postgres 5432 down","printf 'build: %05d\\n' 42","printf 'cpu: %.1f%%\\n' 87.456","ARR=(web-01 web-02 \"db 01\")","printf '%s\\n' \"${ARR[@]}\"","read -r -p \"Environment: \" ENV <<< \"staging\"","echo \"you chose: $ENV\""],"explanation":[{"part":"printf FORMAT args","meaning":"The format is reused for extra arguments: 3 rows from one format."},{"part":"%-14s / %6d","meaning":"Left-aligned text in 14 columns / number right-aligned in 6."},{"part":"%05d","meaning":"Pad with zeros to 5 digits: 00042."},{"part":"%.1f%%","meaning":"One decimal, then a real `%` (written `%%`)."},{"part":"read -r -p \"text\" VAR","meaning":"Show a prompt, read a line into VAR. Add `-s` to hide typing (passwords)."}],"expected_output":"SERVICE          PORT   STATUS\ntodo-frontend      80       up\ntodo-backend     8080       up\npostgres         5432     down\nbuild: 00042\ncpu: 87.5%\nweb-01\nweb-02\ndb 01\nyou chose: staging","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Forgetting `\\n`: all output is on one line, and the prompt appears at the end.","Using `printf \"$TEXT\"` with user text: a `%` in the text breaks the output. Use `printf '%s\\n' \"$TEXT\"`.","Asking for input in a CI job: there is no keyboard, so `read` gets nothing. Use arguments or environment variables there."],"interview_say":"I use `printf` for aligned tables and exact number formats, and always `printf '%s\\n' \"$var\"` for user text. In CI there is no keyboard, so scripts take options, not `read`.","try_yourself":"Run `read -r -s -p \"Password: \" PW; echo; echo \"length: ${#PW}\"` in your terminal. The typing is hidden."},{"id":"d13p05","title":"Find the bug: the release name script","type":"fix-bug","topic":"Variables","minutes":14,"optional":false,"core":false,"workdir":".","situation":"`release-name.sh` prints the release name, tag, date and a work folder for the CI job. The output is wrong in three places, and the second run of the job fails. The goal is in the comments.","task":["Run `bash release-name.sh /opt/releases/todo-api-2.4.1.tar.gz 2026-10-20` twice. Compare with the comments.","Find 4 bugs: the extension removal, the dot replacement, the date format, and the work folder.","Fix them. The work folder must be new and unique each run: use `mktemp -d`.","Run the fixed script twice."],"hints":["`%.*` removes only `.gz`. Remove `.tar.gz` exactly.","`${VERSION/./-}` replaces only the first dot. `//` replaces all.","`%F` gives YYYY-MM-DD. `mktemp -d` makes a new folder with a random name and prints its path."],"solution":["bash release-name.sh /opt/releases/todo-api-2.4.1.tar.gz 2026-10-20","bash release-name.sh /opt/releases/todo-api-2.4.1.tar.gz 2026-10-20","echo \"--- fixed ---\"","cat > release-name.sh <<'EOF'","#!/bin/bash","# Usage: release-name.sh <archive-path> <build-date>","FILE=${1##*/}","NAME=${FILE%.tar.gz}                 # remove the exact extension","VERSION=${NAME#todo-api-}","TAG=${VERSION//./-}                  # // = replace every dot","BUILD_DATE=$(date -d \"$2\" +%F)       # YYYY-MM-DD","WORKDIR=$(mktemp -d)                 # new, unique folder every run","echo \"name:    $NAME\"","echo \"tag:     $TAG\"","echo \"date:    $BUILD_DATE\"","[ -d \"$WORKDIR\" ] && echo \"workdir: created (a new folder under /tmp)\"","rmdir \"$WORKDIR\"                     # clean up our empty folder","EOF","bash release-name.sh /opt/releases/todo-api-2.4.1.tar.gz 2026-10-20","bash release-name.sh /opt/releases/todo-api-2.4.1.tar.gz 2026-10-20"],"explanation":[{"part":"${FILE%.tar.gz}","meaning":"Bug 1: `%.*` removed only `.gz` and left `todo-api-2.4.1.tar`."},{"part":"${VERSION//./-}","meaning":"Bug 2: one `/` replaces the first match; `//` replaces all."},{"part":"+%F","meaning":"Bug 3: `%d-%m-%Y` gave `20-10-2026`."},{"part":"mktemp -d","meaning":"Bug 4: a fixed folder name made the second run fail with `File exists`. mktemp makes a new unique folder."}],"expected_output":"name:    todo-api-2.4.1.tar\ntag:     2-4.1.tar\ndate:    20-10-2026\nworkdir: release-work\nmkdir: cannot create directory ‘release-work’: File exists\nname:    todo-api-2.4.1.tar\ntag:     2-4.1.tar\ndate:    20-10-2026\nworkdir: release-work\n--- fixed ---\nname:    todo-api-2.4.1\ntag:     2-4-1\ndate:    2026-10-20\nworkdir: created (a new folder under /tmp)\nname:    todo-api-2.4.1\ntag:     2-4-1\ndate:    2026-10-20\nworkdir: created (a new folder under /tmp)","expect_exit":0,"output_check":true,"output_note":"The broken script creates a folder `release-work` in day13. The user can delete it with `rmdir release-work`.","verified":true,"mistakes":["Fixing bug 4 with `mkdir -p`: the second run then reuses the old folder with old files inside. CI jobs need a clean folder.","Printing the mktemp path in a test that compares output: the random name changes every run."],"checks":[{"run":"bash release-name.sh /opt/releases/todo-api-2.4.1.tar.gz 2026-10-20; bash release-name.sh /opt/releases/todo-api-2.4.1.tar.gz 2026-10-20","expect":"File exists"}],"interview_say":"I remove known extensions exactly with `%`, replace all matches with `//`, use ISO dates with `%F`, and create work folders with `mktemp -d` so every run starts clean.","try_yourself":"Add a line that prints the tag in upper case with `${TAG^^}` and the first 3 letters of the name with `${NAME:0:3}`."},{"id":"d13p06","title":"Safe temp files: mktemp and cleanup","type":"command","topic":"Variables","minutes":10,"optional":true,"core":false,"workdir":".","situation":"A script downloads a file, edits it, and moves it into place. Using a fixed name like `/tmp/data.json` is dangerous: two runs clash, and other users may read or replace it. `mktemp` makes a unique, private file.","task":["Create a temp file with `TMP=$(mktemp)` and check its permissions with `stat -c '%a'`.","Create a temp file with a name pattern: `mktemp /tmp/todo-backup.XXXXXX`.","Write to the file, read it, and remove it at the end.","Use `trap 'rm -f \"$TMP\"' EXIT` in a small `bash -c` script, and show that the file is gone after the script ends."],"hints":["`mktemp` creates the file with permission 600 (only the owner).","`XXXXXX` in the pattern is replaced by random characters.","`trap ... EXIT` runs when the script ends, even after an error (Day 22)."],"solution":["TMP=$(mktemp)","echo \"permission: $(stat -c %a \"$TMP\")\"","NAMED=$(mktemp /tmp/todo-backup.XXXXXX)","[[ $NAMED == /tmp/todo-backup.?????? ]] && echo \"named temp file created\"","echo '{\"ok\": true}' > \"$TMP\"","cat \"$TMP\"","rm -f \"$TMP\" \"$NAMED\"","LEFT=$(bash -c 'T=$(mktemp); trap \"rm -f \\\"$T\\\"\" EXIT; echo data > \"$T\"; echo \"$T\"')","[ -e \"$LEFT\" ] && echo \"file still there\" || echo \"trap removed the temp file\""],"explanation":[{"part":"mktemp","meaning":"Make a new empty file with a unique name under /tmp, permission 600. Prints the path."},{"part":"XXXXXX","meaning":"Replaced by random letters and digits."},{"part":"trap '...' EXIT","meaning":"Run cleanup when the script exits, success or error."},{"part":"?????? (in [[ ]])","meaning":"A pattern: exactly 6 characters. The real name is random, so the test checks only the shape."}],"expected_output":"permission: 600\nnamed temp file created\n{\"ok\": true}\ntrap removed the temp file","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Writing `TMP=/tmp/data.$$`: the name is guessable, so another user could create it first.","Forgetting cleanup: `/tmp` fills with old files from every run."],"interview_say":"I create temp files with `mktemp`, which gives a unique private file, and remove them with `trap 'rm -f \"$TMP\"' EXIT` so they are cleaned even when the script fails.","try_yourself":"Run `mktemp -d` twice and compare the two names."},{"id":"d13p07","title":"More string tricks: case, substrings, replace","type":"command","topic":"Variables","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Small string jobs come up all the time in pipelines: a short git SHA for an image tag, an environment name in upper or lower case, removing spaces from a branch name, and replacing a word.","task":["From `SHA=a3f9c1e7d2b4c5f6`, print the first 7 characters with `${SHA:0:7}`.","Print `ENV=Staging` in upper case `${ENV^^}` and lower case `${ENV,,}`.","Turn `feature/Add login page` into a Docker-safe tag: lower case, `/` and spaces replaced by `-`.","Replace `http://` with `https://` in a URL using `${URL/http:/https:}`."],"hints":["`${var:offset:length}` = substring.","`^^` = all upper case, `,,` = all lower case (bash 4+).","`${B//[\\/ ]/-}` replaces every `/` or space with `-`."],"solution":["SHA=a3f9c1e7d2b4c5f6","echo \"short sha: ${SHA:0:7}\"","ENV=Staging","echo \"${ENV^^} ${ENV,,}\"","BRANCH=\"feature/Add login page\"","TAG=${BRANCH,,}","TAG=${TAG//[\\/ ]/-}","echo \"image tag: todo-api:$TAG\"","URL=http://todo.example.com/api","echo \"${URL/http:/https:}\""],"explanation":[{"part":"${SHA:0:7}","meaning":"7 characters starting at position 0."},{"part":"${ENV^^} / ${ENV,,}","meaning":"Upper / lower case."},{"part":"${TAG//[\\/ ]/-}","meaning":"Replace every character that is `/` or a space with `-`."},{"part":"${URL/a/b}","meaning":"Replace the first match of `a` with `b`."}],"expected_output":"short sha: a3f9c1e\nSTAGING staging\nimage tag: todo-api:feature-add-login-page\nhttps://todo.example.com/api","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `^^` in `sh` or very old bash (macOS bash 3.2): `bad substitution`. Use `tr 'a-z' 'A-Z'` there.","Docker tags cannot contain `/` or spaces or upper case letters: `invalid reference format`."],"interview_say":"For image tags I use `${SHA:0:7}` for a short commit id and clean branch names with `${b,,}` and `${b//\\//-}`, all inside bash without extra tools.","try_yourself":"Remove all digits from `todo-api-2.4.1` with `${NAME//[0-9]/}`. What is left?"}],"interview":[{"q":"How do you get the file name from a full path in bash, without basename?","a":"`${path##*/}`. And the folder: `${path%/*}`.","topic":"Variables"},{"q":"What is the difference between `${VAR:-x}` and `${VAR:=x}`?","a":"Both give `x` when VAR is empty or unset. `:=` also saves `x` into VAR; `:-` does not change VAR.","topic":"Variables"},{"q":"How do you create a timestamped backup file name?","a":"`backup-$(date +%Y%m%d-%H%M%S).tar.gz`. This format sorts by time.","topic":"Variables"},{"q":"How do you get the date 7 days ago in a script?","a":"`date -d '7 days ago' +%F` (GNU date on Linux).","topic":"Variables"},{"q":"Why use `mktemp` instead of a fixed temp file name?","a":"mktemp makes a unique file with permission 600. Fixed names clash between runs and can be attacked by other users.","topic":"Variables"}],"recap":[{"cmd":"${p##*/}","meaning":"File name from a path","example":"echo \"${ARTIFACT##*/}\"","topic":"Variables"},{"cmd":"${p%/*}","meaning":"Folder from a path","example":"echo \"${ARTIFACT%/*}\"","topic":"Variables"},{"cmd":"${v#pre} / ${v%suf}","meaning":"Remove a prefix / suffix","example":"${FILE%.tar.gz}","topic":"Variables"},{"cmd":"${v/a/b} / ${v//a/b}","meaning":"Replace first / all matches","example":"${VERSION//./-}","topic":"Variables"},{"cmd":"${v:-x} / ${v:=x}","meaning":"Default / default and assign","example":"PORT=${PORT:-8080}","topic":"Variables"},{"cmd":"${v:?msg} / ${v:+x}","meaning":"Required / text only if set","example":"${DB_HOST:?DB_HOST missing}","topic":"Variables"},{"cmd":"${#v}","meaning":"Length of a string","example":"(( ${#PW} >= 12 ))","topic":"Variables"},{"cmd":"${v:0:7} / ${v^^} / ${v,,}","meaning":"Substring / upper / lower case","example":"${SHA:0:7}","topic":"Variables"},{"cmd":"basename / dirname","meaning":"File name / folder of a path","example":"basename \"$f\" .tar.gz","topic":"Variables"},{"cmd":"date +%F","meaning":"Today as YYYY-MM-DD","example":"date +%F","topic":"Variables"},{"cmd":"date +%Y%m%d-%H%M%S","meaning":"Sortable timestamp for file names","example":"tar czf bk-$(date +%Y%m%d-%H%M).tgz app","topic":"Variables"},{"cmd":"date -d '7 days ago'","meaning":"Date math (GNU)","example":"date -d '2026-10-20 -7 days' +%F","topic":"Variables"},{"cmd":"printf '%-10s %5d\\n'","meaning":"Aligned columns","example":"printf '%-12s %6s\\n' SERVICE PORT","topic":"Variables"},{"cmd":"read -r -p","meaning":"Ask the user for a value","example":"read -r -p \"Env: \" ENV","topic":"Variables"},{"cmd":"mktemp / mktemp -d","meaning":"Unique private temp file / folder","example":"TMP=$(mktemp)","topic":"Variables"}],"coverage":[{"item":"${var:-x}, ${var:=x}","problems":["d13p02"]},{"item":"${#var}","problems":["d13p02"]},{"item":"${var%pattern}","problems":["d13p01","d13p05"]},{"item":"${var##*/}","problems":["d13p01","d13p05"]},{"item":"${var/a/b}","problems":["d13p05","d13p07"]},{"item":"basename, dirname","problems":["d13p01"]},{"item":"date +%F, date -d","problems":["d13p03","d13p05"]},{"item":"printf","problems":["d13p04"]},{"item":"read -p","problems":["d13p04"]},{"item":"mktemp","problems":["d13p05","d13p06"]}],"reset":"rm -rf ~/bash-practice/day13"},{"day":14,"week":2,"review_day":true,"title":"Week 2 review: log-processing challenge","goal":"Answer real questions about a production access log with grep, sed, awk, sort and uniq, then wrap the pipeline in a reusable function.","minutes":90,"setup":["mkdir -p ~/bash-practice/day14 && cd ~/bash-practice/day14","# access log of the to-do app: ip - - [time] \"METHOD PATH HTTP/1.1\" status bytes ms \"user-agent\"","n=0","for spec in /api/todos:20 /api/todos/1:4 /api/todos/2:3 /api/todos/15:5 /health:12 /login:9 /api/users/7:6; do","  p=${spec%:*}; c=${spec#*:}","  for ((k = 0; k < c; k++)); do","    n=$((n + 1))","    case $((n % 4)) in 0) ip=10.0.0.5 ;; 1) ip=10.0.0.7 ;; 2) ip=192.168.1.20 ;; 3) ip=172.16.0.3 ;; esac","    case $((n % 9)) in 0) st=500 ;; 4) st=404 ;; *) st=200 ;; esac","    m=GET; [ \"$p\" = /login ] && m=POST","    ua=Mozilla/5.0; [ \"$p\" = /health ] && { ua=kube-probe/1.29; st=200; }","    ms=$(( (n * 53) % 700 + 20 )); [ \"$st\" = 500 ] && ms=$((ms + 1500))","    printf '%s - - [20/Oct/2026:10:%02d:%02d +0530] \"%s %s HTTP/1.1\" %s 512 %s \"%s\"\\n' \"$ip\" $((n / 60)) $((n % 60)) \"$m\" \"$p\" \"$st\" \"$ms\" \"$ua\"","  done","done > access.log","# P4: the same log under a name with a space, and a broken report script","cp access.log \"web 1.log\"","printf '%s\\n' '#!/bin/bash' '# Usage: report.sh <logfile> [top-n]   (top-n is optional, default 3)' '# Prints the top N paths, then the average response time in ms (field 11).' 'top_paths() {' '  awk '\"'\"'{print $7}'\"'\"' $1 | sort | uniq -c | sort -rn | head -n \"$2\"' '}' 'avg_ms() {' '  return $(awk '\"'\"'{s += $11} END {print int(s / NR)}'\"'\"' \"$1\")' '}' 'LOG=$1' 'N=$2' 'top_paths \"$LOG\" \"$N\"' 'avg_ms \"$LOG\"' 'echo \"average: $? ms\"' > report.sh","cd ~/bash-practice/day14"],"warmup":[{"q":"How do you get the file name from `$path` with parameter expansion?","a":"`${path##*/}`","from_day":13},{"q":"Which grep options print only the matching part with extended regex?","a":"`grep -oE`","from_day":10},{"q":"How does a function return a string?","a":"It prints it with `echo`; the caller uses `VAR=$(func)`.","from_day":9},{"q":"What is the safe way to read a file line by line?","a":"`while IFS= read -r line; do ...; done < file`","from_day":8}],"problems":[{"id":"d14p01","title":"Challenge 1: clean the log (grep + sed)","type":"command","topic":"Text","minutes":14,"optional":false,"core":false,"workdir":".","situation":"The to-do app's `access.log` is full of Kubernetes health checks (user agent `kube-probe`). They hide the real traffic. Also, paths like `/api/todos/15` should count as one endpoint `/api/todos/:id`. Build a clean file for the next challenges.","task":["Count the lines of `access.log`, and count the `kube-probe` lines.","Remove the probe lines with `grep -v`.","In the same pipeline, replace a number at the end of an API path with `:id` using `sed -E`.","Save the result as `clean.log`, count its lines, and show its first 3 lines."],"hints":["`grep -c kube-probe access.log` counts the probes.","`sed -E 's#(/api/[a-z]+)/[0-9]+ #\\1/:id #'` (with `#` as delimiter, because the text has `/`).","`grep -v kube-probe access.log | sed -E '...' > clean.log`"],"solution":["echo \"all lines:   $(wc -l < access.log)\"","echo \"probe lines: $(grep -c kube-probe access.log)\"","grep -v 'kube-probe' access.log \\","  | sed -E 's#(/api/[a-z]+)/[0-9]+ #\\1/:id #' > clean.log","echo \"clean lines: $(wc -l < clean.log)\"","head -n 3 clean.log","grep -m 1 ':id' clean.log"],"explanation":[{"part":"grep -v 'kube-probe'","meaning":"Remove health-check noise (Day 2 and 10)."},{"part":"sed -E 's#...#...#'","meaning":"Extended regex substitute with `#` as delimiter (Day 11)."},{"part":"(/api/[a-z]+)/[0-9]+ ","meaning":"Group 1 is `/api/todos`; then a slash, digits and a space."},{"part":"\\1/:id","meaning":"Keep group 1, add `/:id`."},{"part":"\\ at line end","meaning":"Continue the pipeline on the next line, for readability."},{"part":"grep -m 1","meaning":"Stop after the first match."}],"expected_output":"all lines:   59\nprobe lines: 12\nclean lines: 47\n10.0.0.7 - - [20/Oct/2026:10:00:01 +0530] \"GET /api/todos HTTP/1.1\" 200 512 73 \"Mozilla/5.0\"\n192.168.1.20 - - [20/Oct/2026:10:00:02 +0530] \"GET /api/todos HTTP/1.1\" 200 512 126 \"Mozilla/5.0\"\n172.16.0.3 - - [20/Oct/2026:10:00:03 +0530] \"GET /api/todos HTTP/1.1\" 200 512 179 \"Mozilla/5.0\"\n10.0.0.7 - - [20/Oct/2026:10:00:21 +0530] \"GET /api/todos/:id HTTP/1.1\" 200 512 433 \"Mozilla/5.0\"","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Forgetting the space after `[0-9]+` in the pattern: it also changes `/api/todos/15/items` paths in bigger logs.","Writing the result to `access.log` itself (`> access.log`): the file is emptied before grep reads it."],"interview_say":"First I remove noise like health checks with `grep -v`, then I normalise ids in paths with `sed -E`, so the next counts group the same endpoint together.","try_yourself":"Also normalise user ids and count how many different endpoints are left: `awk '{print $7}' clean.log | sort -u | wc -l`."},{"id":"d14p02","title":"Challenge 2: status classes and error rate (awk)","type":"command","topic":"Text","minutes":13,"optional":false,"core":false,"workdir":".","situation":"The team lead asks for the health of the API in numbers: how many 2xx, 4xx and 5xx responses, and the 5xx error rate in percent. Use `clean.log` (run Challenge 1 first, or copy its command).","task":["Find the field number of the status code (count the fields of one line, or use `awk '{print $9}'`).","Count the responses per class (`2xx`, `4xx`, `5xx`) with an awk array and `substr($9, 1, 1)`.","Print the 5xx error rate with one decimal in `END`.","Print the 5xx lines: time, path and response time only."],"hints":["Fields: 1 ip, 4 time, 6 method, 7 path, 9 status, 11 ms.","`substr($9, 1, 1)` = the first character of the status: 2, 4 or 5.","`$9 >= 500 { e++ } END { printf \"%.1f%%\\n\", e * 100 / NR }`"],"solution":["[ -f clean.log ] || grep -v kube-probe access.log | sed -E 's#(/api/[a-z]+)/[0-9]+ #\\1/:id #' > clean.log","awk '{ c[substr($9, 1, 1) \"xx\"]++ } END { for (k in c) print k, c[k] }' clean.log | sort","awk '$9 >= 500 { e++ } END { printf \"5xx rate: %.1f%% of %d requests\\n\", e * 100 / NR, NR }' clean.log","echo \"=== 5xx details ===\"","awk '$9 >= 500 { print $4, $7, $11 \" ms\" }' clean.log | tr -d '['"],"explanation":[{"part":"substr($9, 1, 1) \"xx\"","meaning":"First digit plus `xx`: the key becomes `2xx`, `4xx` or `5xx`."},{"part":"c[key]++","meaning":"Count per key in an awk array (Day 11)."},{"part":"e * 100 / NR","meaning":"awk does decimal math; NR in END is the number of lines."},{"part":"tr -d '['","meaning":"Remove the `[` before the time (Day 12)."},{"part":"[ -f clean.log ] ||","meaning":"Create `clean.log` only if Challenge 1 was not done (Day 6)."}],"expected_output":"2xx 36\n4xx 6\n5xx 5\n5xx rate: 10.6% of 47 requests\n=== 5xx details ===\n20/Oct/2026:10:00:09 /api/todos 1997 ms\n20/Oct/2026:10:00:18 /api/todos 1774 ms\n20/Oct/2026:10:00:27 /api/todos/:id 1551 ms\n20/Oct/2026:10:00:45 /login 1805 ms\n20/Oct/2026:10:00:54 /api/users/:id 1582 ms","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Using `$8` for the status: the method field `\"GET` makes the count shift. Always check the field numbers on one line first.","Dividing with bash `$(( ))`: it gives a whole number (0 or 7), not 7.6."],"interview_say":"I group status codes by class with an awk array and compute the error rate in END. If the 5xx rate is high, I look at the 5xx lines and their paths and times.","try_yourself":"Compute the error rate for the original `access.log` too. Why is it lower there? (Hint: probes are always 200.)"},{"id":"d14p03","title":"Challenge 3: top endpoints and the IPs behind errors","type":"command","topic":"Text","minutes":13,"optional":false,"core":false,"workdir":".","situation":"Product wants the most used endpoints. Security wants to know which clients get the most 5xx errors and which IP sends the most POST /login requests (a possible password-guessing attack).","task":["Top 3 endpoints in `clean.log` with counts (`sort | uniq -c | sort -rn | head`).","IPs that received 5xx errors, with counts.","IPs that sent `POST /login`, with counts, biggest first."],"hints":["Endpoint = field 7.","Filter in awk first: `awk '$9 >= 500 {print $1}'`.","For login: `awk '$6 == \"\\\"POST\" && $7 == \"/login\" {print $1}'` or `grep '\"POST /login'` then `awk '{print $1}'`."],"solution":["[ -f clean.log ] || grep -v kube-probe access.log | sed -E 's#(/api/[a-z]+)/[0-9]+ #\\1/:id #' > clean.log","echo \"=== top 3 endpoints ===\"","awk '{print $7}' clean.log | sort | uniq -c | sort -rn | head -n 3","echo \"=== IPs with 5xx ===\"","awk '$9 >= 500 {print $1}' clean.log | sort | uniq -c | sort -rn","echo \"=== POST /login per IP ===\"","grep '\"POST /login ' clean.log | awk '{print $1}' | sort | uniq -c | sort -rn"],"explanation":[{"part":"awk '{print $7}' | sort | uniq -c | sort -rn","meaning":"The classic counting pipeline (Day 12), now on endpoints."},{"part":"awk '$9 >= 500 {print $1}'","meaning":"Filter and pick a field in one step."},{"part":"grep '\"POST /login '","meaning":"Fixed text with the quote, method, path and a space: no false matches."}],"expected_output":"=== top 3 endpoints ===\n     20 /api/todos\n     12 /api/todos/:id\n      9 /login\n=== IPs with 5xx ===\n      2 192.168.1.20\n      2 10.0.0.7\n      1 172.16.0.3\n=== POST /login per IP ===\n      3 10.0.0.7\n      2 192.168.1.20\n      2 172.16.0.3\n      2 10.0.0.5","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Counting before normalising ids: `/api/todos/1`, `/2` and `/15` are counted as three different endpoints.","Using `head` before `sort -rn`: the result is the first lines of the file, not the top values."],"interview_say":"To find top endpoints or suspicious clients, I filter with awk or grep, then use `sort | uniq -c | sort -rn | head`.","try_yourself":"Find the endpoint with the most 404 responses."},{"id":"d14p04","title":"Find the bug: report.sh","type":"fix-bug","topic":"Scripting","minutes":13,"optional":false,"core":false,"workdir":".","situation":"A teammate turned the pipelines into `report.sh`. It works for `access.log` with a number, but `bash report.sh \"web 1.log\"` fails, and the average time it prints is far too small.","task":["Run `bash report.sh \"web 1.log\"` (no second argument). Read the errors.","Run `bash report.sh access.log 3`. Compare the average with `awk '{s+=$11} END {print int(s/NR)}' access.log`.","Find 3 bugs: an unquoted variable, a missing default, and `return` used for data.","Fix them and run `bash report.sh \"web 1.log\"` again."],"hints":["Inside `top_paths`, `$1` is not quoted.","The comment says top-n is optional with default 3: `N=${2:-3}`.","`return` keeps only 0-255. Print the average with `echo` and catch it with `$( )`."],"solution":["bash report.sh \"web 1.log\"","echo \"--- correct average for comparison ---\"","awk '{s += $11} END {print int(s / NR)}' access.log","cat > report.sh <<'EOF'","#!/bin/bash","# Usage: report.sh <logfile> [top-n]   (top-n is optional, default 3)","# Prints the top N paths, then the average response time in ms (field 11).","top_paths() {","  awk '{print $7}' \"$1\" | sort | uniq -c | sort -rn | head -n \"$2\"","}","avg_ms() {","  awk '{s += $11} END {print int(s / NR)}' \"$1\"","}","LOG=${1:?usage: report.sh <logfile> [top-n]}","N=${2:-3}","top_paths \"$LOG\" \"$N\"","echo \"average: $(avg_ms \"$LOG\") ms\"","EOF","echo \"--- fixed ---\"","bash report.sh \"web 1.log\""],"explanation":[{"part":"\"$1\" in top_paths","meaning":"Bug 1: without quotes, awk got `web` and `1.log` as two files."},{"part":"N=${2:-3}","meaning":"Bug 2: with no second argument, `head -n \"\"` failed."},{"part":"echo + $(avg_ms ...)","meaning":"Bug 3: `return 559` became 559 % 256 = 47. Data must be printed, not returned."},{"part":"${1:?usage...}","meaning":"Bonus: stop with a usage message when no log file is given."}],"expected_output":"awk: cannot open \"web\" (No such file or directory)\nhead: invalid number of lines: ‘’\naverage: 223 ms\n--- correct average for comparison ---\n479\n--- fixed ---\n     20 /api/todos\n     12 /health\n      9 /login\naverage: 479 ms","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Quoting only `$LOG` in the main part and forgetting `$1` inside the function. Every use needs quotes.","Thinking the small average is a data problem. A value that is always below 256 is a hint that `return` was used."],"checks":[{"run":"bash report.sh \"web 1.log\"","expect":"awk: cannot open \"web\""},{"run":"bash report.sh \"web 1.log\"","expect":"head: invalid number of lines: ‘’"}],"interview_say":"The three bugs I see most in bash reports are unquoted variables, missing defaults for optional arguments, and functions that use `return` for data. ShellCheck finds the first one.","try_yourself":"Add a third optional argument: the field number to report (default 7), and use `awk -v f=\"$3\" '{print $f}'`."},{"id":"d14p05","title":"Convert the pipeline into a reusable function","type":"convert","topic":"Scripting","minutes":12,"optional":false,"core":false,"workdir":".","situation":"The user typed `awk '{print $N}' file | sort | uniq -c | sort -rn | head -n K` many times today with different N and K. Make one function `top_n FIELD COUNT FILE` and use it three times.","task":["Write `top_n()` with three arguments: field number, how many lines, and the file. Use `local` variables.","Check that the field and count are numbers; if not, print a usage message to stderr and `return 2`.","Use it for: top 2 IPs, top 3 paths, and top status codes, on `access.log`.","Call it with a wrong field (`x`) and print the exit code."],"hints":["Pass the field to awk with `-v f=\"$field\"` and print `$f`.","`[[ $field =~ ^[0-9]+$ ]] || { echo \"usage: ...\" >&2; return 2; }`","`top_n 1 2 access.log`, `top_n 7 3 access.log`, `top_n 9 5 access.log`."],"solution":["top_n() {","  local field=$1 count=$2 file=$3","  if ! [[ $field =~ ^[0-9]+$ && $count =~ ^[0-9]+$ ]]; then","    echo \"usage: top_n FIELD COUNT FILE\" >&2","    return 2","  fi","  awk -v f=\"$field\" '{print $f}' \"$file\" | sort | uniq -c | sort -rn | head -n \"$count\"","}","echo \"=== top 2 IPs ===\";      top_n 1 2 access.log","echo \"=== top 3 paths ===\";    top_n 7 3 access.log","echo \"=== status codes ===\";   top_n 9 5 access.log","top_n x 3 access.log; echo \"exit code: $?\""],"explanation":[{"part":"local field=$1 count=$2 file=$3","meaning":"Name the arguments; keep them inside the function (Day 9)."},{"part":"=~ ^[0-9]+$","meaning":"Validate input with a regex (Day 6)."},{"part":"awk -v f=\"$field\" '{print $f}'","meaning":"Pass a shell value into awk; `$f` is the field with that number."},{"part":"return 2","meaning":"Here `return` is right: it reports failure, not data."}],"expected_output":"=== top 2 IPs ===\n     15 192.168.1.20\n     15 172.16.0.3\n=== top 3 paths ===\n     20 /api/todos\n     12 /health\n      9 /login\n=== status codes ===\n     48 200\n      6 404\n      5 500\nusage: top_n FIELD COUNT FILE\nexit code: 2","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Writing `awk '{print $'$field'}'`: it works, but quoting is hard to read and easy to break. `-v` is clearer.","Leaving the function's variables global: they can overwrite `count` or `file` in the caller."],"interview_say":"When I repeat a pipeline, I turn it into a function with named local arguments, validate them, and pass values to awk with `-v`.","try_yourself":"Put `top_n` into a file `logtools.sh` and load it in a new terminal with `source logtools.sh`."},{"id":"d14p06","title":"Slowest endpoints: average time per path","type":"command","topic":"Text","minutes":10,"optional":true,"core":false,"workdir":".","situation":"Users say the app feels slow. The user computes the average response time per endpoint from `clean.log` and lists the slowest first, so the backend team knows where to look.","task":["In awk, sum field 11 per path (field 7) and count requests per path.","In `END`, print `average path count` for each path.","Sort by the average, biggest first."],"hints":["Two arrays: `sum[$7] += $11; n[$7]++`.","`END { for (p in sum) printf \"%6.0f %-16s %d\\n\", sum[p] / n[p], p, n[p] }`","`| sort -rn`"],"solution":["[ -f clean.log ] || grep -v kube-probe access.log | sed -E 's#(/api/[a-z]+)/[0-9]+ #\\1/:id #' > clean.log","awk '{ sum[$7] += $11; n[$7]++ }","     END { for (p in sum) printf \"%6.0f ms  %-16s %d requests\\n\", sum[p] / n[p], p, n[p] }' clean.log | sort -rn"],"explanation":[{"part":"sum[$7] += $11; n[$7]++","meaning":"Total time and number of requests per path."},{"part":"sum[p] / n[p]","meaning":"Average per path."},{"part":"%6.0f","meaning":"Number with no decimals, 6 wide, so `sort -rn` reads it as a number."}],"expected_output":"   606 ms  /login           9 requests\n   500 ms  /api/todos/:id   12 requests\n   482 ms  /api/todos       20 requests\n   464 ms  /api/users/:id   6 requests","expect_exit":0,"output_check":true,"verified":true,"mistakes":["Averages hide spikes. One 2000 ms request among fast ones looks fine on average. Also check the maximum or the 95th percentile."],"interview_say":"I group by endpoint in awk with two arrays, sum and count, then print the average per endpoint and sort it. For real monitoring I would use percentiles in Prometheus or CloudWatch.","try_yourself":"Add the maximum time per path: `if ($11 > max[$7]) max[$7] = $11`."}],"interview":[{"q":"Rapid 1: How do you read a file line by line without losing backslashes?","a":"`while IFS= read -r line; do ...; done < file`. `-r` keeps backslashes.","topic":"Scripting"},{"q":"Rapid 2: How do you create an associative array?","a":"`declare -A ports=([web]=80)`; read with `${ports[web]}`; keys with `${!ports[@]}`.","topic":"Scripting"},{"q":"Rapid 3: `return` vs `echo` in a function?","a":"`return` sets an exit code (0-255). `echo` prints data, caught with `$(func)`.","topic":"Scripting"},{"q":"Rapid 4: `\"$@\"` vs `\"$*\"`?","a":"`\"$@\"` keeps each argument separate. `\"$*\"` joins them into one string.","topic":"Scripting"},{"q":"Rapid 5: grep for ERROR or FATAL, with 2 lines of context after?","a":"`grep -E -A 2 'ERROR|FATAL' app.log`","topic":"Text"},{"q":"Rapid 6: Replace every `http:` with `https:` in a file, in place, with a backup?","a":"`sed -i.bak 's/http:/https:/g' file`","topic":"Text"},{"q":"Rapid 7: Sum the 3rd column of a CSV?","a":"`awk -F, '{s += $3} END {print s}' file.csv`","topic":"Text"},{"q":"Rapid 8: Find and delete
